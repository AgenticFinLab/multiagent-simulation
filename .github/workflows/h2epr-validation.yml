name: H2EPR validation

"on":
  pull_request:
    paths:
      - ".github/workflows/h2epr-validation.yml"
      - "data/h2epr/**"
      - "masim/__init__.py"
      - "masim/communication/**"
      - "masim/integrations/**"
      - "masim/persona/**"
      - "masim/player/**"
      - "masim/proxy/**"
      - "masim/simulator/**"
      - "masim/utils/**"
      - "projects/h2epr/**"
      - "requirements.txt"
      - "setup.py"
  push:
    paths:
      - ".github/workflows/h2epr-validation.yml"
      - "data/h2epr/**"
      - "masim/__init__.py"
      - "masim/communication/**"
      - "masim/integrations/**"
      - "masim/persona/**"
      - "masim/player/**"
      - "masim/proxy/**"
      - "masim/simulator/**"
      - "masim/utils/**"
      - "projects/h2epr/**"
      - "requirements.txt"
      - "setup.py"

permissions:
  contents: read

jobs:
  contracts-and-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out MASim
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install H2EPR validation package
        run: python -m pip install -e "projects/h2epr[test]"
      - name: Build the H2EPR wheel
        run: python -m pip wheel --no-deps --wheel-dir .ci/wheels projects/h2epr
      - name: Validate contracts, construction, artifacts, configuration, and execution profiles
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python -B -m pytest -p no:cacheprovider
          projects/h2epr/tests/contracts
          projects/h2epr/tests/construction
          projects/h2epr/tests/g2
          projects/h2epr/tests/configuration
          projects/h2epr/tests/execution

  runtime-and-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out MASim
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check out pinned lmbase source
        uses: actions/checkout@v6
        with:
          repository: AgenticFinLab/lmbase
          ref: 5137b8c84b70b1c46b025247233777d1764783ad
          path: .ci/lmbase
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install runtime validation dependencies
        run: >-
          python -m pip install
          pytest==9.0.3
          iniconfig==2.3.0
          pluggy==1.6.0
          jsonschema==4.26.0
          numpy==2.4.4
          matplotlib==3.10.9
          networkx==3.6.1
          PyYAML==6.0.3
          psutil==7.2.2
          ray==2.55.1
      - name: Install the CPU tensor dependency
        run: >-
          python -m pip install
          --extra-index-url https://download.pytorch.org/whl/cpu
          torch==2.12.0+cpu
      - name: Install source packages without resolving their full dependency sets
        run: >-
          python -m pip install --no-deps
          -e .ci/lmbase
          -e .
          -e projects/h2epr
      - name: Verify the pinned lmbase import
        env:
          EXPECTED_LMBASE_COMMIT: 5137b8c84b70b1c46b025247233777d1764783ad
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          test "$(git -C .ci/lmbase rev-parse HEAD)" = "$EXPECTED_LMBASE_COMMIT" &&
          python -c
          'from pathlib import Path; import lmbase;
          from lmbase.utils.tools import BlockBasedStoreManager;
          root=(Path.cwd()/".ci/lmbase/lmbase").resolve();
          source=Path(lmbase.__file__).resolve();
          assert source == root/"__init__.py", (source, root);
          assert BlockBasedStoreManager.__module__ == "lmbase.utils.tools"'
      - name: Validate Agent bindings and lineage conformance
        env:
          MPLBACKEND: Agg
          PYTHONDONTWRITEBYTECODE: "1"
          RAY_USAGE_STATS_ENABLED: "0"
        run: >-
          python -B -m pytest -p no:cacheprovider
          projects/h2epr/tests/agents
      - name: Validate deterministic runtime and compilation
        env:
          MPLBACKEND: Agg
          PYTHONDONTWRITEBYTECODE: "1"
          RAY_USAGE_STATS_ENABLED: "0"
        run: >-
          python -B -m pytest -p no:cacheprovider
          projects/h2epr/tests/g3
          projects/h2epr/tests/g4
