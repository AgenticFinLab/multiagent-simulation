name: H2EPR G1 construction

"on":
  pull_request:
    paths:
      - "projects/h2epr/src/**"
      - "projects/h2epr/tests/construction/**"
      - "projects/h2epr/tests/fixtures/construction_ir/**"
      - "projects/h2epr/contracts/v1/**"
      - "data/h2epr/development_samples_v1/**"
      - ".github/workflows/h2epr-g1-construction.yml"
  push:
    paths:
      - "projects/h2epr/src/**"
      - "projects/h2epr/tests/construction/**"
      - "projects/h2epr/tests/fixtures/construction_ir/**"
      - "projects/h2epr/contracts/v1/**"
      - "data/h2epr/development_samples_v1/**"
      - ".github/workflows/h2epr-g1-construction.yml"

permissions:
  contents: read

jobs:
  construction:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install validation tools
        run: >-
          python -m pip install
          pytest==9.0.3
          iniconfig==2.3.0
          pluggy==1.6.0
          jsonschema==4.26.0
      - name: Validate G1 construction and retained contracts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: projects/h2epr/src
        run: >-
          python -m pytest -p no:cacheprovider
          projects/h2epr/tests/construction
          projects/h2epr/tests/contracts
