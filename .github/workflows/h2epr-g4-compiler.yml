name: H2EPR deterministic event-graph compiler

"on":
  pull_request:
    paths:
      - ".github/workflows/h2epr-g4-compiler.yml"
      - "masim/__init__.py"
      - "masim/communication/**"
      - "masim/integrations/__init__.py"
      - "masim/integrations/event_process/**"
      - "masim/persona/**"
      - "masim/player/**"
      - "masim/proxy/**"
      - "masim/simulator/__init__.py"
      - "masim/simulator/base.py"
      - "masim/simulator/general.py"
      - "masim/simulator/phased.py"
      - "masim/utils/**"
      - "projects/h2epr/configs/panic_1907/compiler_canary_v1.json"
      - "projects/h2epr/contracts/v1/**"
      - "projects/h2epr/src/**"
      - "projects/h2epr/tests/case_specs/**"
      - "projects/h2epr/tests/conftest.py"
      - "projects/h2epr/tests/contracts/**"
      - "projects/h2epr/tests/fixtures/g4/**"
      - "projects/h2epr/tests/fixtures/v1/**"
      - "projects/h2epr/tests/g4/**"
      - "projects/h2epr/tests/support/**"
      - "requirements.txt"
      - "setup.py"
  push:
    paths:
      - ".github/workflows/h2epr-g4-compiler.yml"
      - "masim/__init__.py"
      - "masim/communication/**"
      - "masim/integrations/__init__.py"
      - "masim/integrations/event_process/**"
      - "masim/persona/**"
      - "masim/player/**"
      - "masim/proxy/**"
      - "masim/simulator/__init__.py"
      - "masim/simulator/base.py"
      - "masim/simulator/general.py"
      - "masim/simulator/phased.py"
      - "masim/utils/**"
      - "projects/h2epr/configs/panic_1907/compiler_canary_v1.json"
      - "projects/h2epr/contracts/v1/**"
      - "projects/h2epr/src/**"
      - "projects/h2epr/tests/case_specs/**"
      - "projects/h2epr/tests/conftest.py"
      - "projects/h2epr/tests/contracts/**"
      - "projects/h2epr/tests/fixtures/g4/**"
      - "projects/h2epr/tests/fixtures/v1/**"
      - "projects/h2epr/tests/g4/**"
      - "projects/h2epr/tests/support/**"
      - "requirements.txt"
      - "setup.py"

permissions:
  contents: read

jobs:
  deterministic-event-graph-compiler:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out MASim
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check out pinned lmbase source
        uses: actions/checkout@v6
        with:
          repository: AgenticFinLab/lmbase
          ref: 5137b8c84b70b1c46b025247233777d1764783ad
          path: .ci/lmbase
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install bounded H2EPR validation dependencies
        run: >-
          python -m pip install
          pytest==9.0.3
          iniconfig==2.3.0
          pluggy==1.6.0
          jsonschema==4.26.0
          numpy==2.4.4
          matplotlib==3.10.9
          networkx==3.6.1
          PyYAML==6.0.3
          psutil==7.2.2
          ray==2.55.1
      - name: Install the CPU tensor dependency required by lmbase storage
        run: >-
          python -m pip install
          --extra-index-url https://download.pytorch.org/whl/cpu
          torch==2.12.0+cpu
      - name: Verify pinned lmbase source and import boundary
        env:
          EXPECTED_LMBASE_COMMIT: 5137b8c84b70b1c46b025247233777d1764783ad
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: .ci/lmbase
        run: >-
          test "$(git -C .ci/lmbase rev-parse HEAD)" = "$EXPECTED_LMBASE_COMMIT" &&
          python -c
          'from pathlib import Path; import lmbase;
          from lmbase.utils.tools import BlockBasedStoreManager;
          root=(Path.cwd()/".ci/lmbase/lmbase").resolve();
          source=Path(lmbase.__file__).resolve();
          assert source == root/"__init__.py", (source, root);
          assert BlockBasedStoreManager.__module__ == "lmbase.utils.tools"'
      - name: Validate deterministic Generated EPG compilation
        env:
          MPLBACKEND: Agg
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: projects/h2epr/src:.ci/lmbase
          RAY_USAGE_STATS_ENABLED: "0"
        run: >-
          python -B -m pytest -p no:cacheprovider
          projects/h2epr/tests/g4
          projects/h2epr/tests/contracts/test_schema_contracts.py
          projects/h2epr/tests/contracts/test_trace_and_identity_contracts.py
