name: H2EPR G2 artifacts

"on":
  pull_request:
    paths:
      - "projects/h2epr/src/**"
      - "projects/h2epr/tests/g2/**"
      - "projects/h2epr/tests/fixtures/g2/**"
      - "projects/h2epr/contracts/v1/**"
      - "data/h2epr/development_samples_v1/**"
      - ".github/workflows/h2epr-g2-artifacts.yml"
  push:
    paths:
      - "projects/h2epr/src/**"
      - "projects/h2epr/tests/g2/**"
      - "projects/h2epr/tests/fixtures/g2/**"
      - "projects/h2epr/contracts/v1/**"
      - "data/h2epr/development_samples_v1/**"
      - ".github/workflows/h2epr-g2-artifacts.yml"

permissions:
  contents: read

jobs:
  artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install validation tools
        run: >-
          python -m pip install
          pytest==9.0.3
          iniconfig==2.3.0
          pluggy==1.6.0
          jsonschema==4.26.0
      - name: Validate G2, G1, and retained contracts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: projects/h2epr/src
        run: >-
          python -B -m pytest -p no:cacheprovider
          projects/h2epr/tests/g2
          projects/h2epr/tests/construction
          projects/h2epr/tests/contracts
