<text x="670.0" y="238.0" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#92400e" font-weight="bold" text-anchor="start">AG-UI</text>
<text x="670.0" y="262.0" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#0f172a" font-weight="bold" text-anchor="start">agent ↔ 前端/人</text>
<text x="670.0" y="286.0" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="start">HTTP + SSE</text>
<text x="670.0" y="302.0" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="start">CopilotKit，事件流</text>
<rect x="670.0" y="360.0" width="260.0" height="40.0" rx="20" fill="#ffffff" stroke="#d97706" stroke-width="1.0"/>
<text x="800.0" y="384.3" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#92400e" font-weight="bold" text-anchor="middle">采用</text>
<rect x="961.0" y="210.0" width="292.0" height="220.0" rx="14" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
<text x="977.0" y="238.0" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#9f1239" font-weight="bold" text-anchor="start">ANP</text>
<text x="977.0" y="262.0" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#0f172a" font-weight="bold" text-anchor="start">去中心化 agent 网络</text>
<text x="977.0" y="286.0" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="start">Web 原生</text>
<text x="977.0" y="302.0" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="start">社区，DID 身份 + 鉴权</text>
<rect x="977.0" y="360.0" width="260.0" height="40.0" rx="20" fill="#ffffff" stroke="#e11d48" stroke-width="1.0"/>
<text x="1107.0" y="384.3" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#9f1239" font-weight="bold" text-anchor="middle">暂不引入</text>
<rect x="1268.0" y="210.0" width="292.0" height="220.0" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="1284.0" y="238.0" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#5b21b6" font-weight="bold" text-anchor="start">ACP</text>
<text x="1284.0" y="262.0" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#0f172a" font-weight="bold" text-anchor="start">agent 云平台互操作</text>
<text x="1284.0" y="286.0" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="start">—</text>
<text x="1284.0" y="302.0" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="start">IBM BeeAI</text>
<rect x="1284.0" y="360.0" width="260.0" height="40.0" rx="20" fill="#ffffff" stroke="#7c3aed" stroke-width="1.0"/>
<text x="1414.0" y="384.3" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#5b21b6" font-weight="bold" text-anchor="middle">暂不引入</text>
<text x="40.0" y="480.0" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start">分工一句话：MCP 让 agent 有「执行能力」（连工具/数据）；A2A 让 agent 有「协作能力」（发现并委托其他 agent）；AG-UI 让 agent 有「可交互性」（给人看/介入）。</text>
<text x="40.0" y="508.0" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#9f1239" font-weight="normal" text-anchor="start">安全提醒：A2A 的 AgentCard 只做能力发现、不做授权；多用户宿主必须绑定鉴权，客户端 id 仅作连续性标识（MAF 安全指导）。</text>
<rect x="40.0" y="540.0" width="1520.0" height="150.0" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
<text x="56.0" y="566.0" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#1e40af" font-weight="bold" text-anchor="start">本项目的协议桥（Protocol Bridge）</text>
<text x="56.0" y="590.0" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="start">内部 agent 暴露为 A2A 服务（带 AgentCard）· 外部 A2A agent 包成内部 AgentRuntime</text>
<text x="56.0" y="609.0" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="start">工具/知识/数据以 MCP server 暴露，agent 声明并调用多个 MCP server</text>
<text x="56.0" y="628.0" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="start">人机调试 / HITL / 面板走 AG-UI</text>
