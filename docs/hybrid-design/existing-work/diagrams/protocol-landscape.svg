<text x="820.0" y="146.0" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#0f172a" font-weight="normal" text-anchor="start">A2A / MCP / AG-UI 标准协议</text>
