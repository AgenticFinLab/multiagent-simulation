<text x="363.0" y="262.0" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#0f172a" font-weight="bold" text-anchor="start">agent ↔ agent 任务协作</text>
<text x="363.0" y="286.0" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="start">JSON-RPC over HTTP</text>
<text x="363.0" y="302.0" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="start">Google→Linux 基金会，跨语言</text>
