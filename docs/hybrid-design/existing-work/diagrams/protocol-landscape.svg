<text x="40.0" y="70.0" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#475569" font-weight="normal" text-anchor="start">内部高频通信走消息总线；外部跨系统/工具/人走标准协议（与 D1 决策一致）</text>
