<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="812" viewBox="0 0 1520 812" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">
