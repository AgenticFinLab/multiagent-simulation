<text x="434" y="172" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9.2" fill="#475569" font-weight="normal" text-anchor="start">LLM 决策型 investor</text>
<text x="434" y="190" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="8.6" fill="#64748b" font-weight="normal" text-anchor="start">masim/agents/_base.py:621</text>
