<text x="794" y="172" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9.2" fill="#475569" font-weight="normal" text-anchor="start">LLM + 检索上下文</text>
<text x="794" y="190" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="8.6" fill="#64748b" font-weight="normal" text-anchor="start">masim/agents/_rag_base.py:64</text>
