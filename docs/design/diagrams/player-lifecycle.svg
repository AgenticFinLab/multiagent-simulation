<text x="202" y="258" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9.6" fill="#475569" font-weight="normal" text-anchor="start">写入 custom_state['round'] = observation.round</text>
<text x="202" y="274" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9.6" fill="#475569" font-weight="normal" text-anchor="start">惰性初始化 cash / position / rng / price_history</text>
<text x="202" y="290" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9.6" fill="#475569" font-weight="normal" text-anchor="start">把带 price 的广播写入 custom_state['market_data']</text>
<text x="202" y="306" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9.6" fill="#475569" font-weight="normal" text-anchor="start">向 price_history 追加价格，然后回调 on_market_data</text>
<rect x="842" y="216" width="670" height="118" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.1"/>
<text x="856" y="238" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.8" fill="#1e40af" font-weight="bold" text-anchor="start">子类可覆盖（唯一合法扩展点）</text>
<text x="856" y="258" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9.6" fill="#1e40af" font-weight="normal" text-anchor="start">on_market_data(market_data)</text>
<text x="856" y="274" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9.6" fill="#1e40af" font-weight="normal" text-anchor="start">每次广播到达时维护滚动窗口 / 锚定价</text>
<text x="856" y="290" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9.6" fill="#1e40af" font-weight="normal" text-anchor="start">（archetype 参数在首轮由 validate_archetype_extras 预检）</text>
<line x1="715" y1="334" x2="715" y2="342" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
