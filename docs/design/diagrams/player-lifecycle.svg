<text x="74" y="190" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="8.6" fill="#64748b" font-weight="normal" text-anchor="start">masim/agents/_base.py:430</text>
