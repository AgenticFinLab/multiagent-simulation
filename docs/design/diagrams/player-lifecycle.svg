<text x="1154" y="172" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9.2" fill="#475569" font-weight="normal" text-anchor="start">市场 / 价格形成（始终规则执行）</text>
<text x="1154" y="190" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="8.6" fill="#64748b" font-weight="normal" text-anchor="start">masim/agents/_coordinator_base.py:57</text>
<rect x="64" y="216" width="110" height="118" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.2"/>
