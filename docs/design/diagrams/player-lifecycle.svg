<rect x="188" y="344" width="640" height="118" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1"/>
<text x="202" y="366" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.8" fill="#334155" font-weight="bold" text-anchor="start">框架负责（不可绕过）</text>
<text x="202" y="386" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9.6" fill="#475569" font-weight="normal" text-anchor="start">Rule：StandardMarketState → decide_order → _finalize_order → _emit</text>
<text x="202" y="402" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9.6" fill="#475569" font-weight="normal" text-anchor="start">LLM：prompt → 模型 → 场景 schema 校验 → _finalize_llm_order → _emit</text>
<text x="202" y="418" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9.6" fill="#475569" font-weight="normal" text-anchor="start">LLM 失败向上抛出：不伪造 hold、不静默降级</text>
<text x="202" y="434" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9.6" fill="#475569" font-weight="normal" text-anchor="start">_noop_order() 仅在无市场数据时用于引导轮</text>
<rect x="842" y="344" width="670" height="118" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.1"/>
<text x="856" y="366" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.8" fill="#1e40af" font-weight="bold" text-anchor="start">子类可覆盖（唯一合法扩展点）</text>
<text x="856" y="386" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9.6" fill="#1e40af" font-weight="normal" text-anchor="start">decide_order(state)   必需：策略本体</text>
<text x="856" y="402" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9.6" fill="#1e40af" font-weight="normal" text-anchor="start">prompt 类常量 / _format_user_prompt()</text>
<text x="856" y="418" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9.6" fill="#1e40af" font-weight="normal" text-anchor="start">_build_rag_query()（RAG）· advance_market()（coordinator）</text>
<line x1="715" y1="462" x2="715" y2="470" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="64" y="472" width="110" height="118" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
<text x="119.0" y="535.68" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#065f46" font-weight="bold" text-anchor="middle">act</text>
<rect x="188" y="472" width="640" height="118" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1"/>
<text x="202" y="494" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.8" fill="#334155" font-weight="bold" text-anchor="start">框架负责（不可绕过）</text>
<text x="202" y="514" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9.6" fill="#475569" font-weight="normal" text-anchor="start">_apply_fill_and_emit_action()：Rule / LLM / RAG 共用的唯一实现</text>
<text x="202" y="530" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9.6" fill="#475569" font-weight="normal" text-anchor="start">① 键校验 action / quantity / bid_price 必须存在</text>
<text x="202" y="546" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9.6" fill="#475569" font-weight="normal" text-anchor="start">② require_positive_bid_price()：非 HOLD 必须 &gt; 0</text>
<text x="202" y="562" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9.6" fill="#475569" font-weight="normal" text-anchor="start">③ 更新 cash / position 恰好一次　④ 调用 on_fill　⑤ 构造 Action</text>
<rect x="842" y="472" width="670" height="118" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.1"/>
<text x="856" y="494" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.8" fill="#1e40af" font-weight="bold" text-anchor="start">子类可覆盖（唯一合法扩展点）</text>
<text x="856" y="514" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9.6" fill="#1e40af" font-weight="normal" text-anchor="start">on_fill(action, quantity, bid_price)</text>
<text x="856" y="530" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9.6" fill="#1e40af" font-weight="normal" text-anchor="start">只用于逐笔状态：VWAP 锚 / 成本基础 / 成交计数</text>
<text x="856" y="546" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9.6" fill="#1e40af" font-weight="normal" text-anchor="start">入参已校验 —— 按 0 价静默成交在构造上不可能发生</text>
<rect x="40" y="600" width="1472" height="92" rx="14" fill="#fff1f2" stroke="#e11d48" stroke-width="1.4"/>
<text x="56" y="626" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#9f1239" font-weight="bold" text-anchor="start">禁止覆盖（覆盖即违约：审计报 STRUCT-ACT / STRUCT-DECIDE / STRUCT-PERCEIVE，严重度 CRITICAL）</text>
<text x="56" y="652" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#9f1239" font-weight="bold" text-anchor="start">perceive()  ·  decide()  ·  act()</text>
<text x="56" y="674" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#334155" font-weight="normal" text-anchor="start">理由：这三者持有线格式校验、现金/仓位记账与入向消息 ingest；覆盖它们等于让该 agent 脱离全库不变量（「全库统一」的前提是所有人都不覆盖）。</text>
<text x="1050" y="652" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9.6" fill="#9f1239" font-weight="normal" text-anchor="start">被允许的钩子见上方右列；审计脚本：scripts/audit_scenario_contract.py</text>
<text x="1050" y="674" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9.6" fill="#334155" font-weight="normal" text-anchor="start">当前采用率：archetype 库 209/209 合规；场景层 1/180 声明 canonical，175 个仍为 legacy。</text>
</svg>
