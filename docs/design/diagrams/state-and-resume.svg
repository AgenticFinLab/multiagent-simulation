<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1400" viewBox="0 0 1560 1400" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif"><rect width="100%" height="100%" fill="#fff"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" fill="#64748b"/></marker><marker id="arrow-rose" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" fill="#e11d48"/></marker><marker id="arrow-emerald" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" fill="#059669"/></marker></defs><text x="40.0" y="44.0" font-size="25" fill="#0f172a" font-weight="bold" text-anchor="start">状态分层、记录键与断点续跑裁决</text><text x="40.0" y="70.0" font-size="13" fill="#475569" font-weight="normal" text-anchor="start">热 = actor 内存 · 温 = 逐轮 block JSON · 冷 = 对象存储 / 向量库（规划）；记录键必须由轮次 + 轮内序号构成，续跑必须显式裁决</text><rect x="40.0" y="96.0" width="1480.0" height="300.0" rx="14" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.4"/><text x="56.0" y="122.0" font-size="14" fill="#0f766e" font-weight="bold" text-anchor="start">① 状态分层：越热的越贵越少，越冷的越便宜越多</text><rect x="56.0" y="130.0" width="470.0" height="250.0" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><text x="72.0" y="156.0" font-size="12.5" fill="#1e40af" font-weight="bold" text-anchor="start">热 · 存在今天</text><text x="72.0" y="178.0" font-size="11" fill="#334155" font-weight="bold" text-anchor="start">actor 内存（custom_state）</text><text x="72.0" y="202.0" font-size="9.5" fill="#334155" font-weight="normal" text-anchor="start">· cash / position / rng（每 actor 独立流）</text><text x="72.0" y="221.0" font-size="9.5" fill="#334155" font-weight="normal" text-anchor="start">· custom_state['round']、当前 market_data 快照</text><text x="72.0" y="240.0" font-size="9.5" fill="#334155" font-weight="normal" text-anchor="start">· HistoryBuffer 热区（环形 deque，entry_limit </text><text x="72.0" y="253.0" font-size="9.5" fill="#334155" font-weight="normal" text-anchor="start">默认 1000）</text><text x="72.0" y="272.0" font-size="9.5" fill="#334155" font-weight="normal" text-anchor="start">· 逐笔状态：VWAP 锚 / 成本基础 / 成交计数（on_fill 维护）</text><text x="72.0" y="344.0" font-size="9.3" fill="#1e40af" font-weight="normal" text-anchor="start">生命周期：一轮内 / 单次实验；进程被杀即丢失，需由温层重建。</text><rect x="546.0" y="130.0" width="470.0" height="250.0" rx="14" fill="#ecfeff" stroke="#0891b2" stroke-width="1.4"/><text x="562.0" y="156.0" font-size="12.5" fill="#155e75" font-weight="bold" text-anchor="start">温 · 存在今天</text><text x="562.0" y="178.0" font-size="11" fill="#334155" font-weight="bold" text-anchor="start">逐轮 block JSON（本地文件）</text><text x="562.0" y="202.0" font-size="9.5" fill="#334155" font-weight="normal" text-anchor="start">· records/&lt;player&gt;/turns/…（turn_block_*.json）</text><text x="562.0" y="221.0" font-size="9.5" fill="#334155" font-weight="normal" text-anchor="start">· records/&lt;player&gt;/messages/…（msg_block_*.json）</text><text x="562.0" y="240.0" font-size="9.5" fill="#334155" font-weight="normal" text-anchor="start">· communication/（wire 级记录）</text><text x="562.0" y="259.0" font-size="9.5" fill="#334155" font-weight="normal" text-anchor="start">· records/&lt;player&gt;/price/…（HistoryBuffer </text><text x="562.0" y="272.0" font-size="9.5" fill="#334155" font-weight="normal" text-anchor="start">冷区）</text><text x="562.0" y="291.0" font-size="9.5" fill="#334155" font-weight="normal" text-anchor="start">· records/.masim-progress.json（原子进度标记）</text><text x="562.0" y="344.0" font-size="9.3" fill="#155e75" font-weight="normal" text-anchor="start">单次实验内可重放；BlockBasedStoreManager 的重复键语义是 update。</text><rect x="1036.0" y="130.0" width="470.0" height="250.0" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/><text x="1052.0" y="156.0" font-size="12.5" fill="#5b21b6" font-weight="bold" text-anchor="start">冷 · 规划中（部分已用）</text><text x="1052.0" y="178.0" font-size="11" fill="#334155" font-weight="bold" text-anchor="start">对象存储 / 向量库 / 自定义后端</text><text x="1052.0" y="202.0" font-size="9.5" fill="#334155" font-weight="normal" text-anchor="start">· 长期记忆、知识库检索（masim/knowledge 已落地为本地索引）</text><text x="1052.0" y="221.0" font-size="9.5" fill="#334155" font-weight="normal" text-anchor="start">· 跨实验快照与发布包 simulation-results/（目标，未落地）</text><text x="1052.0" y="240.0" font-size="9.5" fill="#334155" font-weight="normal" text-anchor="start">· StateStore.scope(isolation_key) 多租户视图（契约已定义）</text><text x="1052.0" y="259.0" font-size="9.5" fill="#334155" font-weight="normal" text-anchor="start">· S3 / Redis / 列式 parquet 化（仅设计）</text><text x="1052.0" y="344.0" font-size="9.3" fill="#5b21b6" font-weight="normal" text-anchor="start">现状：checkpoints/ 与 logs/ 被文档记录，但代码从未创建。</text><rect x="40.0" y="412.0" width="1480.0" height="236.0" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/><text x="56.0" y="438.0" font-size="14" fill="#92400e" font-weight="bold" text-anchor="start">② 记录键：为什么键格式决定数据是否存在</text><rect x="56.0" y="452.0" width="700.0" height="84.0" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="1.2" stroke-dasharray="5 3"/><text x="70.0" y="476.0" font-size="11.5" fill="#9f1239" font-weight="bold" text-anchor="start">旧键（墙钟，已废弃）：msg_r000001_0221143052</text><text x="70.0" y="498.0" font-size="9.6" fill="#334155" font-weight="normal" text-anchor="start">秒级时间戳充当序号 ⇒ 同一 agent 同一秒内的多条记录键完全相同。</text><text x="70.0" y="516.0" font-size="9.6" fill="#334155" font-weight="normal" text-anchor="start">BlockBasedStoreManager 对重复 savename 的语义是 update，不是 add。</text><rect x="772.0" y="452.0" width="732.0" height="84.0" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.2" stroke-dasharray="5 3"/><text x="786.0" y="476.0" font-size="11.5" fill="#065f46" font-weight="bold" text-anchor="start">新键（轮次 + 轮内序号）：msg_r{round:06d}_{seq:06d}</text><text x="786.0" y="498.0" font-size="9.6" fill="#334155" font-weight="normal" text-anchor="start">turn_r{round:06d}_{seq:06d} —— 轮内单调递增，跨轮、跨进程（--resume）都不冲突。</text><text x="786.0" y="516.0" font-size="9.6" fill="#334155" font-weight="normal" text-anchor="start">墙钟信息仍然保留，但只存在记录的 timestamp 字段里，不再参与键。</text><line x1="756.0" y1="494.0" x2="768.0" y2="494.0" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="56.0" y="548.0" width="1448.0" height="88.0" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.1"/><text x="70.0" y="572.0" font-size="11" fill="#92400e" font-weight="bold" text-anchor="start">同秒覆盖的后果（真实故障形态）</text><text x="70.0" y="594.0" font-size="9.8" fill="#334155" font-weight="normal" text-anchor="start">旧键 msg_r000001_0221143052 在同一秒内被写入两次（例如某轮同层两个 actor 的消息、或入向与出向各一条）时，</text><text x="70.0" y="612.0" font-size="9.8" fill="#334155" font-weight="normal" text-anchor="start">后写覆盖先写 —— 文件仍在、schema 仍然合法、轮次计数也仍然对，但记录条数静默变少：数据丢失不报错，只在指标层表现为样本量异常偏小。</text><text x="70.0" y="630.0" font-size="9.8" fill="#9f1239" font-weight="bold" text-anchor="start">因此键必须由逻辑时间（round）与轮内序号（seq）构成，墙钟不得进入键 —— 这是 AGENTS.md 的强制约定。</text><rect x="40.0" y="666.0" width="1480.0" height="640.0" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><text x="56.0" y="692.0" font-size="14" fill="#1e40af" font-weight="bold" text-anchor="start">③ 续跑裁决：detect_resume_round(record_path) → 显式二选一</text><rect x="56.0" y="704.0" width="540.0" height="74.0" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.1"/><text x="70.0" y="726.0" font-size="12.5" fill="#334155" font-weight="bold" text-anchor="start">detect_resume_round(record_path)</text><text x="70.0" y="745.0" font-size="9.6" fill="#1e40af" font-weight="bold" text-anchor="start">masim/simulator/resume_scanner.py:50</text><text x="70.0" y="762.0" font-size="9.4" fill="#475569" font-weight="normal" text-anchor="start">查 .masim-progress.json → environment/messages → market/</text><text x="70.0" y="775.5" font-size="9.4" fill="#475569" font-weight="normal" text-anchor="start">turns → market/*/batch_block_* 回退扫描</text><line x1="296.0" y1="778.0" x2="296.0" y2="808.0" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="56.0" y="808.0" width="540.0" height="60.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><text x="320.0" y="834.0" font-size="10.8" fill="#1e40af" font-weight="bold" text-anchor="middle">completed_rounds = detect_resume_round(record_path)</text><text x="326.0" y="854.0" font-size="9.6" fill="#475569" font-weight="normal" text-anchor="middle">已完成轮次 &gt; 0 ？（= 0 则直接 start_round = 1）</text><line x1="296.0" y1="868.0" x2="296.0" y2="906.0" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="56.0" y="906.0" width="540.0" height="58.0" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="1.2"/><text x="70.0" y="930.0" font-size="11.5" fill="#9f1239" font-weight="bold" text-anchor="start">默认（没有 --resume / --fresh）→ 抛错</text><text x="70.0" y="940.0" font-size="9.4" fill="#9f1239" font-weight="normal" text-anchor="start">RuntimeError：拒绝把两次运行混进同一目录，并提示三选一（续跑 / 重跑 / 换 record_path）</text><line x1="596.0" y1="935.0" x2="626.0" y2="935.0" stroke="#e11d48" stroke-width="1.4" marker-end="url(#arrow-rose)"/><path d="M296 964 L296 1010 L626 1010" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/><text x="304.0" y="1004.0" font-size="10" fill="#334155" font-weight="bold" text-anchor="start">显式 --resume</text><rect x="626.0" y="970.0" width="540.0" height="84.0" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/><text x="640.0" y="994.0" font-size="12" fill="#92400e" font-weight="bold" text-anchor="start">--resume：从 N+1 继续</text><text x="640.0" y="1014.0" font-size="9.4" fill="#475569" font-weight="normal" text-anchor="start">start_round = completed_rounds + 1；agent 状态按配置重置（cash / position </text><text x="640.0" y="1027.5" font-size="9.4" fill="#475569" font-weight="normal" text-anchor="start">回到初值，不从磁盘恢复）</text><text x="640.0" y="1044.0" font-size="9.4" fill="#92400e" font-weight="normal" text-anchor="start">因此续跑只保证「记录不重不漏」，不保证「组合连续」</text><path d="M296 1120 L296 1166 L626 1166" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/><text x="304.0" y="1160.0" font-size="10" fill="#334155" font-weight="bold" text-anchor="start">显式 --fresh</text><rect x="626.0" y="1126.0" width="540.0" height="92.0" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/><text x="640.0" y="1150.0" font-size="12" fill="#065f46" font-weight="bold" text-anchor="start">--fresh：从第 1 轮重跑</text><text x="640.0" y="1170.0" font-size="9.4" fill="#475569" font-weight="normal" text-anchor="start">先 _clear_run_outputs()：删除 records/ communication/ monitoring/</text><text x="640.0" y="1183.5" font-size="9.4" fill="#475569" font-weight="normal" text-anchor="start"> checkpoints/（record_path 本身）</text><text x="640.0" y="1198.0" font-size="9.4" fill="#475569" font-weight="normal" text-anchor="start">每个删除目标都解析为绝对路径并校验是 run root 的直接子目录；缺失目录跳过</text><text x="640.0" y="1226.0" font-size="9.4" fill="#065f46" font-weight="normal" text-anchor="start">之后 completed_rounds = 0，start_round = 1</text><rect x="1120.0" y="704.0" width="400.0" height="298.0" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/><text x="1136.0" y="730.0" font-size="12.5" fill="#065f46" font-weight="bold" text-anchor="start">为什么 resume 是安全的</text><text x="1136.0" y="756.0" font-size="9.6" fill="#475569" font-weight="normal" text-anchor="start">bootstrap 轮被定义为「本次进程执行的第一轮」，而不是硬编码的 </text><text x="1136.0" y="769.5" font-size="9.6" fill="#475569" font-weight="normal" text-anchor="start">round_num == 1。</text><text x="1136.0" y="816.0" font-size="9.6" fill="#475569" font-weight="normal" text-anchor="start">resume 从第 N+1 轮启动时，第一轮是 N+1：level 0 </text><text x="1136.0" y="829.5" font-size="9.6" fill="#475569" font-weight="normal" text-anchor="start">的发起者本轮开始前收不到任何入向广播，必须被豁免 is_received_ready() </text><text x="1136.0" y="843.0" font-size="9.6" fill="#475569" font-weight="normal" text-anchor="start">的就绪等待，否则会因等待尚不存在的消息而硬失败。</text><text x="1136.0" y="900.0" font-size="9.6" fill="#065f46" font-weight="normal" text-anchor="start">Simulator 通过 operate(round, level, bootstrap=True) </text><text x="1136.0" y="913.5" font-size="9.6" fill="#065f46" font-weight="normal" text-anchor="start">下发该标记，之后各轮均为 False。</text><line x1="1112.0" y1="830.0" x2="1044.0" y2="1010.0" stroke="#059669" stroke-width="1.3" stroke-dasharray="4 3"/><rect x="1120.0" y="1022.0" width="400.0" height="250.0" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/><text x="1136.0" y="1048.0" font-size="12.5" fill="#92400e" font-weight="bold" text-anchor="start">两个易混淆的事实</text><text x="1136.0" y="1074.0" font-size="9.5" fill="#475569" font-weight="normal" text-anchor="start">① 进度标记是「模拟器自持」的，不从 records/market 这类场景目录推断 </text><text x="1136.0" y="1087.5" font-size="9.5" fill="#475569" font-weight="normal" text-anchor="start">—— 场景可以删改自己的目录，续跑裁决不受影响。</text><text x="1136.0" y="1146.0" font-size="9.5" fill="#475569" font-weight="normal" text-anchor="start">② 入向记录使用消息自身的轮次（Message.extras['round_num']），</text><text x="1136.0" y="1159.5" font-size="9.5" fill="#475569" font-weight="normal" text-anchor="start">而不是接收者的 current_round；否则 level&gt;0 </text><text x="1136.0" y="1173.0" font-size="9.5" fill="#475569" font-weight="normal" text-anchor="start">的入向会被标成上一轮（首轮标成 0）。</text><text x="1136.0" y="1232.0" font-size="9.5" fill="#92400e" font-weight="normal" text-anchor="start">文件扫描失败一律吞掉：损坏的 block 绝不能中断续跑，最差回落到更早的检查点。</text></svg>
