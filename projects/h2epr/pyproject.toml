[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "h2epr"
version = "0.1.0"
description = "Auditable event-process research components for MASim"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "AgenticFinLab"}]
dependencies = ["jsonschema>=4.18"]

[project.optional-dependencies]
runtime = ["multiagent-simulation"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["h2epr*"]
namespaces = false
