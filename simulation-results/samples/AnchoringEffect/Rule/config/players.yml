# =============================================================================
# AnchoringEffect Players Configuration
# =============================================================================
# Heterogeneous agents for anchoring bias simulation
#
# Agent Types (with market impact):
#   - Market: Rule-based coordinator (price-impact dynamics)
#   - AnchoredTrader: Anchors to initial price, adjusts insufficiently (DESTABILIZING)
#   - HistoricalAnchor: Anchors to historical average price (DESTABILIZING)
#   - RationalUpdater: Bayesian updating without bias (STABILIZING)
#   - MomentumTrader: Follows price trends (NEUTRAL)
#   - NoiseTrader: Random uninformed trader (NEUTRAL)
# =============================================================================

# -----------------------------------------------------------------------------
# Market (Coordinator)
# -----------------------------------------------------------------------------
market:
  name: "Market"
  class: "examples.AnchoringEffect.Rule.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "artifacts/records"
      # Market dynamics parameters
      fundamental_value: 100.0
      initial_price: 105.0
      price_impact: 0.01        # Low: anchoring effect slows price discovery
      mean_reversion: 0.01      # Low: sustains anchoring persistence
      noise_std: 0.5            # Moderate price noise
      custom_state_hot_limit: 3
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Anchored Traders (Primary Anchoring Bias Agents)
# Theory: Tversky & Kahneman (1974) — Anchoring and Insufficient Adjustment
# -----------------------------------------------------------------------------
anchored_trader:
  name: "Anchored Trader"
  class: "examples.AnchoringEffect.Rule.players:AnchoredTrader"
  # Expander → anchored_trader_1, anchored_trader_2
  num_instances: 2
  config:
    identity: "anchored_trader"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "artifacts/records"
      # Investor base parameters
      initial_cash: 10000.0
      initial_position: 100.0
      custom_state_hot_limit: 3
      # AnchoredTrader specific parameters (Tversky & Kahneman, 1974)
      anchor_weight: 0.7        # High: strong anchor influence
      adjustment_factor: 0.3    # Low: insufficient adjustment from anchor
      base_position_size: 20.0
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Historical Anchors (Historical Price Fixation)
# Theory: Northcraft & Neale (1987) — Experts anchor to past prices
# -----------------------------------------------------------------------------
historical_anchor:
  name: "Historical Anchor"
  class: "examples.AnchoringEffect.Rule.players:HistoricalAnchor"
  # Expander → historical_anchor_1, historical_anchor_2
  num_instances: 2
  config:
    identity: "historical_anchor"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "artifacts/records"
      # Investor base parameters
      initial_cash: 10000.0
      initial_position: 100.0
      custom_state_hot_limit: 3
      # HistoricalAnchor specific parameters (Northcraft & Neale, 1987)
      anchor_weight: 0.5        # Moderate: some weight on historical average
      lookback: 60              # Lookback window for historical average
      base_position_size: 20.0
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Rational Updater (Benchmark — Correct Bayesian Updating)
# -----------------------------------------------------------------------------
rational_updater:
  name: "Rational Updater"
  class: "examples.AnchoringEffect.Rule.players:RationalUpdater"
  num_instances: 1
  config:
    identity: "rational_updater"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "artifacts/records"
      # Investor base parameters
      initial_cash: 10000.0
      initial_position: 100.0
      custom_state_hot_limit: 3
      # RationalUpdater specific parameters
      base_position_size: 25.0
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Momentum Traders (Trend Amplifiers)
# Theory: Jegadeesh & Titman (1993) — Momentum effect
# -----------------------------------------------------------------------------
momentum_trader:
  name: "Momentum Trader"
  class: "examples.AnchoringEffect.Rule.players:MomentumTrader"
  # Expander → momentum_trader_1, momentum_trader_2
  num_instances: 2
  config:
    identity: "momentum_trader"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "artifacts/records"
      # Investor base parameters
      initial_cash: 10000.0
      initial_position: 100.0
      custom_state_hot_limit: 3
      # MomentumTrader specific parameters
      entry_threshold: 0.02     # Minimum return to trigger trade
      base_position_size: 20.0
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Noise Traders (Background Liquidity)
# Theory: Black (1986) — Noise
# -----------------------------------------------------------------------------
noise_trader:
  name: "Noise Trader"
  class: "examples.AnchoringEffect.Rule.players:NoiseTrader"
  # Expander → noise_trader_1, noise_trader_2
  num_instances: 2
  config:
    identity: "noise_trader"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "artifacts/records"
      # Investor base parameters
      initial_cash: 10000.0
      initial_position: 100.0
      custom_state_hot_limit: 3
      # NoiseTrader specific parameters (Black, 1986)
      trade_probability: 0.05   # Low: rarely trades
      min_order: 100.0
      max_order: 500.0
  persona: !include persona.yml
