# =============================================================================
# AnchoringEffectRuleLLM Simulation Configuration
# =============================================================================
# Hybrid: LLM agents guided by explicit rule-based social-psychological principles.
# Each agent's system prompt encodes both persona profile AND quantitative rules
# derived from the rule-based AnchoringEffect counterpart.
#
# Usage:
#   python examples/AnchoringEffect/RuleLLM/run_anchoringeffect_rulellm.py \
#       -c configs/AnchoringEffect/RuleLLM/simulation.yml
# =============================================================================

setting:
  name: "anchoring_effect_rulellm_simulation"
  description: "Hybrid rule+LLM anchoring bias: agents follow explicit anchoring formulas encoded in prompts"
  total_rounds: 200
  round_history_limit: 3
  record_path: "artifacts/records"
  save_diagram_interval: 50

environment:
  dotenv_path: .env
  workspace: "."

ray:
  address: null
  namespace: "anchoring_effect_rulellm"
  actor_prefix: null
  # LLM simulations need more memory for prompt/response strings
  # Derived: 10 players, star topology -> 18 msgs/round
  #   10 TurnResult + 10 pending_info + 18 Message = 38 Ray objects
  #   LLM TurnResult also carries prompt+response strings (~4-8 KB each)
  #   Minimum 512 MB floor for LLM simulations -> 536870912 bytes
  num_cpus: null
  num_gpus: null
  object_store_memory: 536870912
  include_dashboard: false
  logging_level: "warning"
  log_to_driver: false
  actor_options:
    max_restarts: 3
    max_task_retries: 1
    max_concurrency: 10
  runtime_env:
    working_dir: null
    pip: []
    env_vars: {}
  serialization:
    use_arrow: true
    register_custom_serializers: true

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "artifacts/communication"
  record_messages: true
  message_block_size: 500
