# =============================================================================
# AnchoringEffectRag Players Configuration
# =============================================================================
# 1 Market (rule-based) + 5 RAG-augmented LLM Investor types
#
# Knowledge Architecture:
#   The shared knowledge: block is defined at the TOP of this file, before the
#   market definition. The config loader (expand_player_instances in
#   masim/utils/config.py) automatically detects "knowledge" inside the players
#   dict and promotes it to config top-level, making it accessible as
#   config["knowledge"] / SimulationConfig.knowledge.
#
#   This co-location keeps all player-related config discoverable in one file
#   while maintaining clean code access patterns.
#
#   Each agent has private_knowledge for agent-specific resources:
#     - from_global_resources: List of global resource sub-dirs to inherit
#     - local_resources:
#         local_uri:       Per-agent local directory
#                          Auto-generated if empty: artifacts/agents/<agent_id>
#         local_resources: Agent-specific local resource paths
#     - rag: Per-agent RAG configuration (MUST be nested inside private_knowledge)
#         from_global_index_dir: Shared index directories to reference/copy from
#                                 Paths relative to global_uri/
#         local_index_dir: Per-agent local index directory
#                          Auto-generated if empty: <local_uri>/rag_index/
#         Inherits knowledge.rag defaults; overrides specified here take precedence
# =============================================================================

# =============================================================================
# Shared Knowledge Configuration (processed once, accessible by all agents)
# =============================================================================
# This block is co-located with players for discoverability. The config loader
# automatically promotes it to config top-level. It is NOT a player definition.
# =============================================================================
knowledge:
  # Backend type: "local" = local filesystem, "shared" = network mount, "remote" = cloud
  backend: "local"
  # Base directory for all shared documents (PDFs, MinerU output, RAG index, etc.)
  global_uri: "examples/document-sources"
  # List of resource descriptors shared globally across all agents
  resource_csv:
    # CSV file listing books/URLs per agent_type
    - "examples/document-sources/books.csv"
    # Directory containing raw PDF files to be processed by MinerU
    - "examples/document-sources/source"
  preprocessing:
    # Document parser: "mineru" = MinerU OCR/layout parser
    parser: "mineru"
    # Output sub-directory for parsed Markdown (relative to global_uri)
    output_position: "MinerU_processed"
  rag:
    # Shared RAG index sub-directory (relative to global_uri)
    output_position: "rag_index"
    # Embedding provider: "litellm" for LiteLLM-based embedding
    embed_type: "litellm"
    # Embedding model (Hunyuan via OpenAI-compatible API)
    embed_model: "openai/hunyuan-embedding"
    # API key for embedding service; resolved from environment variable
    embed_api_key: "{{ HUNYUAN_API_KEY }}"
    # API base URL for Hunyuan embedding
    embed_api_base: "https://api.hunyuan.cloud.tencent.com/v1"
    # Chunk size in tokens for document splitting
    chunk_size: 512
    # Overlap in tokens between consecutive chunks
    chunk_overlap: 64
    # Number of top-k chunks to retrieve per query
    top_k: 5

# -----------------------------------------------------------------------------
# Market (Coordinator) — rule-based, identical to Rule variant
# -----------------------------------------------------------------------------
market:
  name: "Market"
  class: "examples.AnchoringEffect.Rag.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "artifacts/records"
      # Market dynamics parameters (identical to Rule variant)
      fundamental_value: 100.0
      initial_price: 105.0
      price_impact: 0.01        # Low: anchoring effect slows price discovery
      mean_reversion: 0.01      # Low: sustains anchoring persistence
      noise_std: 0.5            # Moderate price noise
      custom_state_hot_limit: 3
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# RAG Anchored Traders — rules + persona + RAG knowledge retrieval
# Theory: Tversky & Kahneman (1974) — Anchoring and Insufficient Adjustment
# -----------------------------------------------------------------------------
ragllm_anchored:
  name: "RAG Anchored Trader"
  class: "examples.AnchoringEffect.Rag.players:RagLLMAnchoredTrader"
  # Expander → ragllm_anchored_1, ragllm_anchored_2
  num_instances: 2
  config:
    identity: "ragllm_anchored"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "artifacts/records"
      initial_cash: 10000.0
      initial_position: 100.0
      custom_state_hot_limit: 3
      # ------------------------------------------------------------------
      # Rule parameters (from AnchoringEffect AnchoredTrader)
      # ------------------------------------------------------------------
      adjustment_factor: 0.3            # 30% adjustment from anchor to fundamental
      anchor_weight: 0.7                # Same anchor influence label as Rule/RuleLLM
      trade_threshold: 0.03             # |deviation| > 3% triggers trade
      base_position_size: 20.0          # Base shares per trade
      # ------------------------------------------------------------------
      # Private Knowledge: agent-specific resources and RAG configuration
      # ------------------------------------------------------------------
      private_knowledge:
        from_global_resources:
          - "MinerU_processed"
        local_resources:
          local_uri: ""
          local_resources: []
        rag:
          from_global_index_dir:
            - "rag_index"
          local_index_dir: ""
          embed_type: "litellm"
          embed_model: "openai/hunyuan-embedding"
          embed_api_key: "{{ HUNYUAN_API_KEY }}"
          embed_api_base: "https://api.hunyuan.cloud.tencent.com/v1"
          chunk_size: 512
          chunk_overlap: 64
          top_k: 5
      # ------------------------------------------------------------------
      # LLM Configuration
      # ------------------------------------------------------------------
      llm:
        sys_message: "examples.AnchoringEffect.Rag.prompts:RAG_ANCHORED_TRADER_SYS"
        user_message: "examples.AnchoringEffect.Rag.prompts:RAG_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.3
          max_new_tokens: 600
  persona: !include persona.yml

