# =============================================================================
# BlackMonday1987 RuleLLM Players Configuration
# =============================================================================
# 1 Market (rule-based) + 5 RuleLLM Investor types with explicit quantitative
# rules embedded in system prompts.
# =============================================================================

# -----------------------------------------------------------------------------
# Market (Coordinator) — rule-based, identical to Rule variant
# -----------------------------------------------------------------------------
market:
  name: "Market"
  class: "examples.BlackMonday1987.RuleLLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "artifacts/records"
      fundamental_value: 250.0
      initial_price: 250.0
      price_impact: 0.05
      mean_reversion: 0.01
      noise_std: 0.02
      custom_state_hot_limit: 3
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Portfolio Insurers — RuleLLM with explicit hedge rules
# Theory: Leland & Rubinstein (1976), Brady Commission (1988)
# -----------------------------------------------------------------------------
portfolio_insurer:
  name: "Portfolio Insurer"
  class: "examples.BlackMonday1987.RuleLLM.players:RuleLLMPortfolioInsurer"
  # Expander → portfolio_insurer_1, portfolio_insurer_2
  num_instances: 2
  config:
    identity: "portfolio_insurer"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "artifacts/records"
      initial_cash: 500000.0
      initial_position: 1000.0
      custom_state_hot_limit: 3
      # Rule parameters for RuleLLM
      rebalance_threshold: 0.02
      hedge_ratio: 0.5
      base_size: 100.0
      llm:
        sys_message: "examples.BlackMonday1987.RuleLLM.prompts:RULELLM_PORTFOLIO_INSURER_SYS"
        user_message: "examples.BlackMonday1987.RuleLLM.prompts:RULELLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.3
          max_tokens: 512
  persona: !include persona.yml

