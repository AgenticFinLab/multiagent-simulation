# DotComBubble Rule Agent Configuration

market:
  name: "Market"
  class: "examples.DotComBubble.Rule.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "artifacts/records"
      initial_price: 50.0
      fundamental_value: 50.0
      price_impact: 0.03
      mean_reversion: 0.01
      noise_std: 0.02
      custom_state_hot_limit: 3
  persona: !include persona.yml

neweconomyevangelist:
  name: "NewEconomyEvangelist"
  class: "examples.DotComBubble.Rule.players:NewEconomyEvangelist"
  num_instances: 2
  config:
    identity: "neweconomyevangelist"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "artifacts/records"
      initial_cash: 1000000.0
      initial_position: 0
      max_pf_ratio: 10.0
      base_buy_size: 400
      narrative_strength: 0.8
      custom_state_hot_limit: 3
      order_size: 600
  persona: !include persona.yml

ipoflipper:
  name: "IPOFlipper"
  class: "examples.DotComBubble.Rule.players:IPOFlipper"
  num_instances: 2
  config:
    identity: "ipoflipper"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "artifacts/records"
      initial_cash: 800000.0
      initial_position: 0
      entry_threshold: 0.05
      flip_return: 0.15
      base_size: 300
      custom_state_hot_limit: 3
      flip_threshold: 0.05
      order_size: 700
  persona: !include persona.yml

momentumfollower:
  name: "MomentumFollower"
  class: "examples.DotComBubble.Rule.players:MomentumFollower"
  num_instances: 2
  config:
    identity: "momentumfollower"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "artifacts/records"
      initial_cash: 800000.0
      initial_position: 0
      entry_threshold: 0.03
      base_size: 350
      custom_state_hot_limit: 3
      momentum_threshold: 0.02
      order_size: 500
  persona: !include persona.yml

skepticalvalueinvestor:
  name: "SkepticalValueInvestor"
  class: "examples.DotComBubble.Rule.players:SkepticalValueInvestor"
  num_instances: 1
  config:
    identity: "skepticalvalueinvestor"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "artifacts/records"
      initial_cash: 1000000.0
      initial_position: 0
      buy_pf: 1.2
      max_pf: 3.0
      base_size: 300
      custom_state_hot_limit: 3
      order_size: 400
      value_buy_threshold: -0.10
      value_sell_threshold: 0.20
  persona: !include persona.yml

shortseller:
  name: "ShortSeller"
  class: "examples.DotComBubble.Rule.players:ShortSeller"
  num_instances: 1
  config:
    identity: "shortseller"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "artifacts/records"
      initial_cash: 1000000.0
      initial_position: 0
      short_threshold: 5.0
      cover_threshold: 2.5
      base_size: 300
      custom_state_hot_limit: 3
      order_size: 400
  persona: !include persona.yml
