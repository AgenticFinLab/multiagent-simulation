# =============================================================================
# EchoChamberLLM Simulation Configuration
# =============================================================================
# LLM-based Echo Chamber polarization simulation
# Tests: Sunstein echo chamber amplification, Asch conformity, Isenberg
#        critical thinking, Pariser bridge-building
#
# Usage:
#   python examples/EchoChamber/LLM/run_echo_chamber_llm.py -c configs/EchoChamber/LLM/simulation.yml
# =============================================================================

setting:
  name: "echo_chamber_llm_simulation"
  description: "LLM-based echo chamber polarization with heterogeneous opinion agents"
  total_rounds: 200
  round_history_limit: 3
  record_path: "artifacts/records"
  save_diagram_interval: 50

environment:
  dotenv_path: .env
  workspace: "."

ray:
  address: null
  namespace: "echo_chamber_llm"
  actor_prefix: null
  num_cpus: null
  num_gpus: null
  # LLM simulations need more memory for prompt+response strings
  object_store_memory: 536870912
  include_dashboard: false
  logging_level: "warning"
  log_to_driver: false
  actor_options:
    max_restarts: 3
    max_task_retries: 1
    max_concurrency: 10
  runtime_env:
    working_dir: null
    pip: []
    env_vars: {}
  serialization:
    use_arrow: true
    register_custom_serializers: true

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "artifacts/communication"
  record_messages: true
  message_block_size: 500
