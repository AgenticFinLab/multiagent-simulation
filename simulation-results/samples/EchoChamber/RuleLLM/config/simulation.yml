# =============================================================================
# EchoChamberRuleLLM Simulation Configuration
# =============================================================================
# Hybrid: LLM agents guided by explicit rule-based social-psychological principles
# Each agent's system prompt encodes both persona profile AND quantitative rules
# derived from the rule-based EchoChamber.Rule counterpart.
#
# Usage:
#   python examples/EchoChamber/RuleLLM/run_echo_chamber_rulellm.py -c configs/EchoChamber/RuleLLM/simulation.yml
# =============================================================================

setting:
  name: "echo_chamber_rulellm_simulation"
  description: "Hybrid rule+LLM echo chamber: agents follow explicit social-psychological rules encoded in prompts"
  total_rounds: 200
  round_history_limit: 3
  record_path: "artifacts/records"
  save_diagram_interval: 50

environment:
  dotenv_path: .env
  workspace: "."

ray:
  address: null
  namespace: "echo_chamber_rulellm"
  actor_prefix: null
  num_cpus: null
  num_gpus: null
  # Derived: 21 players (1 env + 6 ideologue + 5 conformist + 3 critical + 2 bridge + 4 passive)
  #   Star topology -> ~42 msgs/round
  #   21 TurnResult + 21 pending_info + 42 Message = 84 Ray objects
  #   84 obj x 64 KB min-alloc = 5376 KB (5.25 MB) base peak
  #   LLM TurnResult also carries prompt+response strings (~4-8 KB each) -> extra overhead
  #   Minimum 512 MB floor for LLM simulations -> 536870912 bytes
  object_store_memory: 536870912
  include_dashboard: false
  logging_level: "warning"
  log_to_driver: false
  actor_options:
    max_restarts: 3
    max_task_retries: 1
    max_concurrency: 10
  runtime_env:
    working_dir: null
    pip: []
    env_vars: {}
  serialization:
    use_arrow: true
    register_custom_serializers: true

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "artifacts/communication"
  record_messages: true
  message_block_size: 500
