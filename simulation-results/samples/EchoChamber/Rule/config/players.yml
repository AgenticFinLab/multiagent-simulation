# =============================================================================
# EchoChamber Players Configuration
# =============================================================================
# Heterogeneous agents for echo chamber polarization simulation
#
# Agent Types (with opinion impact):
#   - OpinionEnvironment: Rule-based coordinator (polarization dynamics)
#   - Ideologue: Strong views amplifier (DESTABILIZING)
#   - Conformist: Group opinion adopter (DESTABILIZING)
#   - CriticalThinker: Evidence evaluator (STABILIZING)
#   - BridgeBuilder: Cross-group engager (STRONGLY STABILIZING)
#   - PassiveFollower: Low-engagement drifter (NEUTRAL)
# =============================================================================

# -----------------------------------------------------------------------------
# OpinionEnvironment (Coordinator)
# -----------------------------------------------------------------------------
environment:
  name: "OpinionEnvironment"
  class: "examples.EchoChamber.Rule.players:OpinionEnvironment"
  num_instances: 1
  config:
    identity: "environment"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - environment
    extras:
      record_path: "artifacts/records"
      # Polarization dynamics parameters
      initial_polarization: 0.15   # Low starting polarization (moderate population)
      polarization_impact: 0.12    # How strongly agent actions shift polarization
      centripetal_force: 0.01      # Weak center-pull (Sunstein: centripetal forces are weak)
      noise_std: 0.02              # Opinion perturbation noise
      custom_state_hot_limit: 3
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Ideologues (Primary Polarization Drivers)
# Split: 3 left-leaning, 3 right-leaning (initial_opinion sign determines lean)
# -----------------------------------------------------------------------------
ideologue:
  name: "Ideologue"
  class: "examples.EchoChamber.Rule.players:Ideologue"
  num_instances: 6
  config:
    identity: "ideologue"
    role: player
    steps_per_turn: 1
    group_tags:
      - agents
    extras:
      record_path: "artifacts/records"
      # Agent base parameters
      initial_opinion: 0.4         # Will be ±0.4 per instance (set at startup)
      custom_state_hot_limit: 3
      # Ideologue specific parameters (Sunstein, 2001)
      in_group_weight: 0.6         # Strong: amplifies in-group consensus
      extremity_boost: 1.3         # Pushes toward more extreme version
      out_group_discount: 0.05     # Almost ignores opposing views
      spread_eagerness: 0.9        # High: actively polarizes
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Conformists (Homophily Reinforcers)
# -----------------------------------------------------------------------------
conformist:
  name: "Conformist"
  class: "examples.EchoChamber.Rule.players:Conformist"
  num_instances: 5
  config:
    identity: "conformist"
    role: player
    steps_per_turn: 1
    group_tags:
      - agents
    extras:
      record_path: "artifacts/records"
      # Agent base parameters
      initial_opinion: 0.0         # Starts neutral, will drift
      custom_state_hot_limit: 3
      # Conformist specific parameters (Asch, 1951; Sunstein, 2001)
      conformity: 0.7              # High: adopts group opinion readily
      conformity_eagerness: 0.6    # Moderate-high: follows group
      group_proximity_threshold: 0.3  # Polarize when opinion exceeds this
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Critical Thinkers (Evidence Evaluators)
# -----------------------------------------------------------------------------
critical_thinker:
  name: "Critical Thinker"
  class: "examples.EchoChamber.Rule.players:CriticalThinker"
  num_instances: 3
  config:
    identity: "critical_thinker"
    role: player
    steps_per_turn: 1
    group_tags:
      - agents
    extras:
      record_path: "artifacts/records"
      # Agent base parameters
      initial_opinion: 0.0         # Starts neutral
      custom_state_hot_limit: 3
      # CriticalThinker specific parameters (Isenberg, 1986)
      critical_weight: 0.5         # Moderate: evaluates independently
      critical_eagerness: 0.7      # High: actively depolarizes when needed
      evidence_sensitivity: 0.6    # Responds to polarization as evidence of groupthink
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Bridge Builders (Cross-Group Engagers)
# -----------------------------------------------------------------------------
bridge_builder:
  name: "Bridge Builder"
  class: "examples.EchoChamber.Rule.players:BridgeBuilder"
  num_instances: 2
  config:
    identity: "bridge_builder"
    role: player
    steps_per_turn: 1
    group_tags:
      - agents
    extras:
      record_path: "artifacts/records"
      # Agent base parameters
      initial_opinion: 0.0         # Starts at center
      custom_state_hot_limit: 3
      # BridgeBuilder specific parameters (Sunstein, 2001; Pariser, 2011)
      bridge_weight: 0.4           # Moderate: pulls toward center
      bridge_strength: 0.8         # Strong: effective depolarizer
      centering_tendency: 0.5      # Tends toward moderate center
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Passive Followers (Baseline)
# -----------------------------------------------------------------------------
passive_follower:
  name: "Passive Follower"
  class: "examples.EchoChamber.Rule.players:PassiveFollower"
  num_instances: 4
  config:
    identity: "passive_follower"
    role: player
    steps_per_turn: 1
    group_tags:
      - agents
    extras:
      record_path: "artifacts/records"
      # Agent base parameters
      initial_opinion: 0.0         # Starts neutral
      custom_state_hot_limit: 3
      # PassiveFollower specific parameters (Lazarsfeld & Merton, 1954)
      engagement_probability: 0.3  # Low: rarely engages
      drift_rate: 0.1              # Small drift toward mean
      alignment_strength: 0.4      # When engaged, moderately aligns
  persona: !include persona.yml
