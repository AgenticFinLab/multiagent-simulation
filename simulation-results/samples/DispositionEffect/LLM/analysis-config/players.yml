# =============================================================================
# DispositionEffectLLM Players Configuration
# =============================================================================
# LLM-based Prospect Theory Trading Simulation
# =============================================================================

market:
  name: "Market with News Shocks"
  class: "examples.DispositionEffect.LLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "artifacts/records"
      # Market parameters
      initial_price: 100.0
      fundamental_value: 100.0
      price_impact: 0.08
      mean_reversion: 0.05
      noise_std: 0.6
      news_probability: 0.15
      news_impact_range: 4.0
      custom_state_hot_limit: 3
  persona: !include persona.yml

llm_disposition_biased:
  name: "LLM Disposition Biased"
  class: "examples.DispositionEffect.LLM.players:LLMDispositionBiased"
  # Expander → llm_disposition_biased_1, llm_disposition_biased_2, llm_disposition_biased_3
  num_instances: 3
  config:
    identity: "llm_disposition_biased"
    role: player
    steps_per_turn: 1
    group_tags:
      - llm_investors
    extras:
      record_path: "artifacts/records"
      initial_cash: 10000.0
      initial_position: 0.0
      initial_purchase_price: 100.0
      custom_state_hot_limit: 3
      llm:
        sys_message: "examples.DispositionEffect.LLM.prompts:LLM_DISPOSITION_BIASED_SYS"
        user_message: "examples.DispositionEffect.LLM.prompts:LLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.4
          max_new_tokens: 500
  persona: !include persona.yml

