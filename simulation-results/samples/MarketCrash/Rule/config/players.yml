# =============================================================================
# MarketCrash Players Configuration
# =============================================================================
# Heterogeneous agents for market crash / liquidity spiral simulation
#
# Investor Types:
#   - Market: Rule-based with liquidity-sensitive pricing
#   - RiskParityFund: Volatility targeting (PROCYCLICAL)
#   - LeveragedHedgeFund: Margin-constrained (PROCYCLICAL)
#   - MarketMaker: Liquidity provider (WITHDRAWAL)
#   - PassiveInvestor: Buy-and-hold (NEUTRAL)
#   - PanicSeller: Loss-triggered (PROCYCLICAL)
#   - BottomFisher: Contrarian buyer (STABILIZING)
# =============================================================================

# -----------------------------------------------------------------------------
# Market (Coordinator)
# -----------------------------------------------------------------------------
market:
  name: "Market"
  class: "examples.MarketCrash.Rule.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "artifacts/records"
      # Price dynamics
      fundamental_value: 100.0
      initial_price: 100.0
      base_price_impact: 0.08
      mean_reversion: 0.01
      noise_std: 0.5
      # Liquidity dynamics
      liquidity_decay: 0.1
      liquidity_recovery: 0.05
      min_liquidity: 0.1
      custom_state_hot_limit: 3
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Risk Parity Fund - Vol Targeting
# -----------------------------------------------------------------------------
risk_parity_fund:
  name: "Risk Parity Fund"
  class: "examples.MarketCrash.Rule.players:RiskParityFund"
  # Expander → risk_parity_fund_1, risk_parity_fund_2
  num_instances: 2
  config:
    identity: "risk_parity_fund"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "artifacts/records"
      initial_cash: 10000.0
      # Starts with position
      initial_position: 50.0
      custom_state_hot_limit: 3
      # Risk parity specific
      target_volatility: 2.0
      vol_lookback: 5
      rebalance_speed: 0.3
      base_position: 50.0
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Leveraged Hedge Funds
# -----------------------------------------------------------------------------
leveraged_hedge_fund:
  name: "Leveraged Hedge Fund"
  class: "examples.MarketCrash.Rule.players:LeveragedHedgeFund"
  # Expander → leveraged_hedge_fund_1, leveraged_hedge_fund_2, leveraged_hedge_fund_3
  num_instances: 3
  config:
    identity: "leveraged_hedge_fund"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "artifacts/records"
      initial_cash: 5000.0
      # Leveraged position
      initial_position: 60.0
      custom_state_hot_limit: 3
      # Leverage specific
      initial_leverage: 3.0
      margin_call_level: 0.5
      liquidation_level: 0.3
      momentum_sensitivity: 0.5
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Market Maker
# -----------------------------------------------------------------------------
market_maker:
  name: "Market Maker"
  class: "examples.MarketCrash.Rule.players:MarketMaker"
  # Expander → market_maker_1, market_maker_2
  num_instances: 2
  config:
    identity: "market_maker"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "artifacts/records"
      initial_cash: 10000.0
      initial_position: 0.0
      custom_state_hot_limit: 3
      # Market maker specific
      volatility_withdraw_threshold: 5.0
      inventory_limit: 30.0
      normal_quote_size: 20.0
      spread_multiplier: 0.02
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Passive Investor
# -----------------------------------------------------------------------------
passive_investor:
  name: "Passive Investor"
  class: "examples.MarketCrash.Rule.players:PassiveInvestor"
  num_instances: 1
  config:
    identity: "passive_investor"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "artifacts/records"
      initial_cash: 10000.0
      initial_position: 30.0
      custom_state_hot_limit: 3
      # Passive specific
      rebalance_frequency: 20
      target_position: 30.0
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Panic Sellers
# -----------------------------------------------------------------------------
panic_seller:
  name: "Panic Seller"
  class: "examples.MarketCrash.Rule.players:PanicSeller"
  # Expander → panic_seller_1, panic_seller_2, panic_seller_3
  num_instances: 3
  config:
    identity: "panic_seller"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "artifacts/records"
      initial_cash: 10000.0
      initial_position: 25.0
      custom_state_hot_limit: 3
      # Panic specific
      # 10% loss triggers panic
      loss_threshold: 0.10
      # 3% daily drop triggers partial sell
      crash_trigger: -0.03
      panic_sell_fraction: 0.5
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Bottom Fisher
# -----------------------------------------------------------------------------
bottom_fisher:
  name: "Bottom Fisher"
  class: "examples.MarketCrash.Rule.players:BottomFisher"
  num_instances: 1
  config:
    identity: "bottom_fisher"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "artifacts/records"
      initial_cash: 10000.0
      initial_position: 0.0
      custom_state_hot_limit: 3
      # Bottom fishing specific
      crash_buy_threshold: -0.03
      discount_threshold: 0.10
      buy_size: 15.0
      lookback: 10
  persona: !include persona.yml
