# =============================================================================
# CreditCycle LLM Agent Configuration
# =============================================================================
# 1 Market (rule-based) + 5 LLM investor types.
# LLM agents carry personality-only prompts (no scenario-target leakage).
# =============================================================================

# -----------------------------------------------------------------------------
# Market (Coordinator) — rule-based, identical to Rule variant
# -----------------------------------------------------------------------------
market:
  name: "Market"
  class: "examples.CreditCycle.LLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "artifacts/records"
      initial_price: 100.0
      fundamental_value: 100.0
      price_impact: 0.05
      mean_reversion: 0.02
      noise_std: 0.02
      custom_state_hot_limit: 3
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Pro-Cyclical Lenders — LLM with leveraged credit investor persona
# Theory: Adrian & Shin (2010)
# -----------------------------------------------------------------------------
procyclicallender:
  name: "ProCyclicalLender"
  class: "examples.CreditCycle.LLM.players:LLMProCyclicalLender"
  num_instances: 2
  config:
    identity: "procyclicallender"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "artifacts/records"
      initial_cash: 1000000.0
      initial_position: 0
      leverage_expansion_rate: 0.3
      leverage_contraction_rate: 0.4
      expansion_threshold: 0.01
      contraction_threshold: -0.015
      base_size: 500
      custom_state_hot_limit: 3
      llm:
        sys_message: "examples.CreditCycle.LLM.prompts:LLM_PRO_CYCLICAL_LENDER_SYS"
        user_message: "examples.CreditCycle.LLM.prompts:LLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.7
          max_tokens: 512
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Minsky Borrowers — LLM with aggressive borrower persona
# Theory: Minsky (1986)
# -----------------------------------------------------------------------------
minskyborrower:
  name: "MinskyBorrower"
  class: "examples.CreditCycle.LLM.players:LLMMinskyBorrower"
  num_instances: 2
  config:
    identity: "minskyborrower"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "artifacts/records"
      initial_cash: 500000.0
      initial_position: 0
      hedge_rounds: 20
      speculative_rounds: 40
      ponzi_rounds: 80
      hedge_size: 100
      speculative_size: 300
      ponzi_size: 600
      custom_state_hot_limit: 3
      llm:
        sys_message: "examples.CreditCycle.LLM.prompts:LLM_MINSKY_BORROWER_SYS"
        user_message: "examples.CreditCycle.LLM.prompts:LLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.8
          max_tokens: 512
  persona: !include persona.yml

