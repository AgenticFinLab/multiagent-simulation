# =============================================================================
# CreditCycle Rag Agent Configuration
# =============================================================================
# 1 Market (rule-based) + 5 RAG-augmented LLM investor types.
# Knowledge Architecture: shared knowledge block + per-agent private_knowledge.
# =============================================================================

# =============================================================================
# Shared Knowledge Configuration
# =============================================================================
knowledge:
  backend: "local"
  global_uri: "examples/document-sources"
  resource_csv:
    - "examples/document-sources/books.csv"
    - "examples/document-sources/source"
  preprocessing:
    parser: "mineru"
    output_position: "MinerU_processed"
  rag:
    output_position: "rag_index"
    embed_type: "litellm"
    embed_model: "openai/hunyuan-embedding"
    embed_api_key: "{{ HUNYUAN_API_KEY }}"
    embed_api_base: "https://api.hunyuan.cloud.tencent.com/v1"
    chunk_size: 512
    chunk_overlap: 64
    top_k: 5

# -----------------------------------------------------------------------------
# Market (Coordinator) — rule-based
# -----------------------------------------------------------------------------
market:
  name: "Market"
  class: "examples.CreditCycle.Rag.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "artifacts/records"
      initial_price: 100.0
      fundamental_value: 100.0
      price_impact: 0.05
      mean_reversion: 0.02
      noise_std: 0.02
      custom_state_hot_limit: 3
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# RAG Pro-Cyclical Lenders
# Theory: Adrian & Shin (2010)
# -----------------------------------------------------------------------------
procyclicallender:
  name: "ProCyclicalLender"
  class: "examples.CreditCycle.Rag.players:RagLLMProCyclicalLender"
  num_instances: 2
  config:
    identity: "procyclicallender"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "artifacts/records"
      initial_cash: 1000000.0
      initial_position: 0
      leverage_expansion_rate: 0.3
      leverage_contraction_rate: 0.4
      expansion_threshold: 0.01
      contraction_threshold: -0.015
      base_size: 500
      custom_state_hot_limit: 3
      private_knowledge:
        from_global_resources:
          - "MinerU_processed"
        local_resources:
          local_uri: ""
          local_resources: []
        rag:
          from_global_index_dir:
            - "rag_index"
          local_index_dir: ""
          embed_type: "litellm"
          embed_model: "openai/hunyuan-embedding"
          embed_api_key: "{{ HUNYUAN_API_KEY }}"
          embed_api_base: "https://api.hunyuan.cloud.tencent.com/v1"
          chunk_size: 512
          chunk_overlap: 64
          top_k: 5
      llm:
        sys_message: "examples.CreditCycle.Rag.prompts:RAG_PRO_CYCLICAL_LENDER_SYS"
        user_message: "examples.CreditCycle.Rag.prompts:RAG_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.4
          max_tokens: 600
  persona: !include persona.yml

