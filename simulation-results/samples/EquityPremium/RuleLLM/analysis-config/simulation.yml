# =============================================================================
# EquityPremiumRuleLLM Simulation Configuration
# =============================================================================
# Hybrid: LLM agents guided by explicit rule-based mathematical principles
# Each agent's system prompt encodes both persona profile AND quantitative rules
# derived from the rule-based EquityPremium counterpart.
#
# Usage:
#   python examples/EquityPremium/RuleLLM/run_equity_premium_rulellm.py -c configs/EquityPremium/RuleLLM/simulation.yml
# =============================================================================

setting:
  name: "equity_premium_rulellm_simulation"
  description: "Hybrid rule+LLM equity premium: agents follow explicit financial rules encoded in prompts"
  total_rounds: 200
  round_history_limit: 3
  record_path: "artifacts/records"
  save_diagram_interval: 50

environment:
  dotenv_path: .env
  workspace: "."

ray:
  address: null
  namespace: "equity_premium_rulellm"
  actor_prefix: null
  num_cpus: null
  num_gpus: null
  object_store_memory: 536870912
  include_dashboard: false
  logging_level: "warning"
  log_to_driver: false
  actor_options:
    max_restarts: 3
    max_task_retries: 1
    max_concurrency: 10
  runtime_env:
    working_dir: null
    pip: []
    env_vars: {}
  serialization:
    use_arrow: true
    register_custom_serializers: true

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "artifacts/communication"
  record_messages: true
  message_block_size: 500
