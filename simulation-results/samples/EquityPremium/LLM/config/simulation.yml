# =============================================================================
# EquityPremiumLLM Simulation Configuration
# =============================================================================
# LLM-based Equity Premium Puzzle simulation - Myopic Loss Aversion
# Tests: Evaluation frequency, loss aversion, risk premium dynamics
#
# Usage:
#   python examples/EquityPremium/LLM/run_equity_llm.py -c configs/EquityPremium/LLM/simulation.yml
# =============================================================================

setting:
  name: "equity_premium_llm_simulation"
  description: "LLM-based equity premium puzzle with myopic loss aversion"
  total_rounds: 200
  round_history_limit: 3
  record_path: "artifacts/records"
  save_diagram_interval: 100

environment:
  dotenv_path: .env
  workspace: "."

ray:
  address: null
  namespace: "equity_premium_llm"
  actor_prefix: null
  # null = Ray auto-detects from machine; actors use num_cpus=0 (async, I/O-bound)
  num_cpus: null
  num_gpus: null
  # Derived: 14 players, star topology -> 26 msgs/round
  #   14 TurnResult + 14 pending_info + 26 Message = 54 Ray objects
  #   54 obj x 64 KB min-alloc = 3456 KB (3.38 MB) base peak
  #   LLM TurnResult also carries prompt+response strings (~4-8 KB each) -> extra overhead
  #   Minimum 512 MB floor for LLM simulations -> 536870912 bytes
  object_store_memory: 536870912
  include_dashboard: false
  logging_level: "warning"
  log_to_driver: false
  actor_options:
    max_restarts: 3
    max_task_retries: 1
    max_concurrency: 10
  runtime_env:
    working_dir: null
    pip: []
    env_vars: {}
  serialization:
    use_arrow: true
    register_custom_serializers: true

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "artifacts/communication"
  record_messages: true
  message_block_size: 500
