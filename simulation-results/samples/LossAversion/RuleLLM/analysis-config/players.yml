# LossAversion RuleLLM Agent Configuration

market:
  name: "Market"
  class: "examples.LossAversion.RuleLLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "artifacts/records"
      initial_price: 100.0
      fundamental_value: 100.0
      price_impact: 0.03
      mean_reversion: 0.01
      noise_std: 0.015
      custom_state_hot_limit: 3
  persona: !include persona.yml

lossaverseinvestor:
  name: "LossAverseInvestor"
  class: "examples.LossAversion.RuleLLM.players:RuleLLMLossAverseInvestor"
  num_instances: 3
  config:
    identity: "lossaverseinvestor"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "artifacts/records"
      initial_cash: 1000000.0
      initial_position: 500
      initial_price: 100.0
      fundamental_value: 100.0
      loss_aversion_lambda: 2.25
      sell_gain_threshold: 0.05
      base_size: 400
      custom_state_hot_limit: 3
      llm:
        sys_message: "examples.LossAversion.RuleLLM.prompts:RULELLM_LOSS_AVERSE_PROMPT"
        user_message: "examples.LossAversion.RuleLLM.prompts:RULELLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.7
          max_tokens: 600
  persona: !include persona.yml

