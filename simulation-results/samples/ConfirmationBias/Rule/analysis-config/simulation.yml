# =============================================================================
# ConfirmationBias Rule Simulation Configuration
# =============================================================================
# Confirmation bias: traders overweight confirming evidence and underweight
# disconfirming evidence, leading to persistent price deviations from fundamentals.
#
# Usage:
#   python examples/ConfirmationBias/Rule/run_confirmationbias.py \
#       -c configs/ConfirmationBias/Rule/simulation.yml
# =============================================================================

setting:
  name: "confirmation_bias_rule_simulation"
  description: "Confirmation bias: belief anchors + selective scanners vs. balanced analysts + contrarians"
  total_rounds: 200
  round_history_limit: 3
  record_path: "artifacts/records"
  save_diagram_interval: 50

environment:
  dotenv_path: .env
  workspace: "."

ray:
  address: null
  namespace: "confirmation_rule"
  actor_prefix: null
  num_cpus: null
  num_gpus: null
  object_store_memory: 134217728
  include_dashboard: false
  logging_level: "warning"
  log_to_driver: false
  actor_options:
    max_restarts: 3
    max_task_retries: 1
    max_concurrency: 4
  runtime_env:
    working_dir: null
    pip: []
    env_vars: {}
  serialization:
    use_arrow: true
    register_custom_serializers: true

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "artifacts/communication"
  record_messages: true
  message_block_size: 500
