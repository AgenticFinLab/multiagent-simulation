# =============================================================================
# ConfirmationBias Rule Players Configuration
# =============================================================================
# Heterogeneous agents for confirmation bias simulation
#
# Price = normalized stock price (fundamental = 100.0)
#
# Agent Types:
#   - Market: Rule-based price coordinator
#   - BeliefAnchor: Overweights confirming signals (DESTABILIZING)
#     Theory: Nickerson (1998) — confirmation bias
#   - SelectiveScanner: Seeks confirming info, ignores contradictions (DESTABILIZING)
#     Theory: Lord, Ross & Lepper (1979)
#   - BalancedAnalyst: Bayesian rationality benchmark (STABILIZING)
#     Theory: Rabin & Schrag (1999) rational baseline
#   - ContrarianTrader: Fades bias-driven extremes (STABILIZING)
#   - NoiseTrader: Random background liquidity (NEUTRAL)
#     Theory: Black (1986)
# =============================================================================

# -----------------------------------------------------------------------------
# Market (Coordinator)
# -----------------------------------------------------------------------------
market:
  name: "Market"
  class: "examples.ConfirmationBias.Rule.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "artifacts/records"
      fundamental_value: 100.0
      initial_price: 100.0
      price_impact: 0.02          # Low: bias effect slows price discovery
      mean_reversion: 0.02
      noise_std: 0.02
      custom_state_hot_limit: 3
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Belief Anchors (Primary Destabilizers)
# Theory: Nickerson (1998)
# -----------------------------------------------------------------------------
belief_anchor:
  name: "Belief Anchor"
  class: "examples.ConfirmationBias.Rule.players:BeliefAnchor"
  # Expander → belief_anchor_1, belief_anchor_2
  num_instances: 2
  config:
    identity: "belief_anchor"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "artifacts/records"
      initial_cash: 50000.0
      initial_position: 0.0
      custom_state_hot_limit: 3
      belief_strength: 0.8        # Probability of staying in current belief
      confirm_weight: 2.5         # Amplify confirming signals by 2.5×
      disconfirm_weight: 0.3      # Dampen disconfirming signals to 0.3×
      base_size: 30.0
      confirmation_strength: 0.7
      initial_belief: 1.0
      order_size: 500
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Selective Scanners (Secondary Destabilizers)
# Theory: Lord, Ross & Lepper (1979)
# -----------------------------------------------------------------------------
selective_scanner:
  name: "Selective Scanner"
  class: "examples.ConfirmationBias.Rule.players:SelectiveScanner"
  # Expander → selective_scanner_1, selective_scanner_2
  num_instances: 2
  config:
    identity: "selective_scanner"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "artifacts/records"
      initial_cash: 50000.0
      initial_position: 0.0
      custom_state_hot_limit: 3
      search_bias: 0.7            # Amplify confirming signals by 1.7×
      ignore_contradiction: 0.6  # Dampen contradicting signals to 0.4×
      base_size: 25.0
      order_size: 600
      scan_threshold: 0.02
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Balanced Analyst (Stabilizer)
# Theory: Rabin & Schrag (1999) rational baseline
# -----------------------------------------------------------------------------
balanced_analyst:
  name: "Balanced Analyst"
  class: "examples.ConfirmationBias.Rule.players:BalancedAnalyst"
  num_instances: 1
  config:
    identity: "balanced_analyst"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "artifacts/records"
      initial_cash: 50000.0
      initial_position: 0.0
      custom_state_hot_limit: 3
      trade_threshold: 0.03      # Trade when |deviation| > 3%
      base_size: 30.0
      analysis_threshold: 0.05
      order_size: 400
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Contrarian Trader (Stabilizer)
# -----------------------------------------------------------------------------
contrarian_trader:
  name: "Contrarian Trader"
  class: "examples.ConfirmationBias.Rule.players:ContrarianTrader"
  num_instances: 1
  config:
    identity: "contrarian_trader"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "artifacts/records"
      initial_cash: 50000.0
      initial_position: 0.0
      custom_state_hot_limit: 3
      contrarian_threshold: 0.10  # Fade when |deviation| > 10%
      base_size: 40.0
      order_size: 500
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Noise Traders (Black, 1986)
# -----------------------------------------------------------------------------
noise_trader:
  name: "Noise Trader"
  class: "examples.ConfirmationBias.Rule.players:NoiseTrader"
  # Expander → noise_trader_1, noise_trader_2
  num_instances: 2
  config:
    identity: "noise_trader"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "artifacts/records"
      initial_cash: 20000.0
      initial_position: 0.0
      custom_state_hot_limit: 3
      trade_probability: 0.3
      min_order: 10.0
      max_order: 50.0
  persona: !include persona.yml
