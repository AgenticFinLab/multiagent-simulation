# =============================================================================
# ConfirmationBias LLM Players Configuration
# =============================================================================
# 1 Market (rule-based) + 5 LLM Investor types with confirmation-bias personas.
# =============================================================================

# -----------------------------------------------------------------------------
# Market (Coordinator) — rule-based, identical to Rule variant
# -----------------------------------------------------------------------------
market:
  name: "Market"
  class: "examples.ConfirmationBias.LLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "artifacts/records"
      fundamental_value: 100.0
      initial_price: 100.0
      price_impact: 0.02
      mean_reversion: 0.02
      noise_std: 0.02
      custom_state_hot_limit: 3
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# LLM Belief Anchors — conviction-driven persona
# Theory: Nickerson (1998)
# -----------------------------------------------------------------------------
llm_belief_anchor:
  name: "LLM Belief Anchor"
  class: "examples.ConfirmationBias.LLM.players:LLMBeliefAnchor"
  # Expander → llm_belief_anchor_1, llm_belief_anchor_2
  num_instances: 2
  config:
    identity: "llm_belief_anchor"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "artifacts/records"
      initial_cash: 50000.0
      initial_position: 0.0
      custom_state_hot_limit: 3
      llm:
        sys_message: "examples.ConfirmationBias.LLM.prompts:LLM_BELIEF_ANCHOR_SYS"
        user_message: "examples.ConfirmationBias.LLM.prompts:LLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.7
          max_tokens: 512
  persona: !include persona.yml

