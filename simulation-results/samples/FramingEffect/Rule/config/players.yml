# FramingEffect Rule Agent Configuration

market:
  name: "Market"
  class: "examples.FramingEffect.Rule.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "artifacts/records"
      initial_price: 100.0
      fundamental_value: 100.0
      price_impact: 0.05
      mean_reversion: 0.02
      noise_std: 0.01
      custom_state_hot_limit: 3
  persona: !include persona.yml

gainframefollower:
  name: "GainFrameFollower"
  class: "examples.FramingEffect.Rule.players:GainFrameFollower"
  num_instances: 2
  config:
    identity: "gainframefollower"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "artifacts/records"
      initial_cash: 1000000.0
      initial_position: 0
      initial_price: 100.0
      fundamental_value: 100.0
      gain_weight: 1.5
      base_size: 400
      custom_state_hot_limit: 3
  persona: !include persona.yml

