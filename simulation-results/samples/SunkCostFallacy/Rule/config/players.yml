market:
  name: "Market"
  class: "examples.SunkCostFallacy.Rule.players:Market"
  num_instances: 1
  persona: !include persona.yml
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags: [market]
    extras:
      initial_price: 100.0
      fundamental_value: 100.0
      price_impact: 0.02
      mean_reversion: 0.015
      noise_std: 0.01

sunkcostholder:
  name: "SunkCostHolder"
  class: "examples.SunkCostFallacy.Rule.players:SunkCostHolder"
  num_instances: 3
  persona: !include persona.yml
  config:
    identity: "sunkcostholder"
    role: player
    steps_per_turn: 1
    group_tags: [investors]
    extras:
      initial_cash: 1000000.0
      initial_position: 500
      initial_price: 100.0
      fundamental_value: 100.0
      hold_threshold: 0.1
      base_size: 200
      custom_state_hot_limit: 3

commitmentescalator:
  name: "CommitmentEscalator"
  class: "examples.SunkCostFallacy.Rule.players:CommitmentEscalator"
  num_instances: 3
  persona: !include persona.yml
  config:
    identity: "commitmentescalator"
    role: player
    steps_per_turn: 1
    group_tags: [investors]
    extras:
      initial_cash: 1200000.0
      initial_position: 400
      initial_price: 100.0
      fundamental_value: 100.0
      escalation_threshold: 0.05
      escalation_size: 400
      custom_state_hot_limit: 3

rationalcutter:
  name: "RationalCutter"
