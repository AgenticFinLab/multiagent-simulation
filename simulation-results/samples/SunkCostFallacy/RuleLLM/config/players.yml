market:
  name: "Market"
  class: "examples.SunkCostFallacy.Rule.players:Market"
  num_instances: 1
  persona: !include ../RuleLLM/persona.yml
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags: [market]
    extras:
      record_path: "artifacts/records"
      initial_price: 100.0
      fundamental_value: 100.0
      price_impact: 0.02
      mean_reversion: 0.015
      noise_std: 0.01

sunkcostholder:
  name: "SunkCostHolder"
  class: "examples.SunkCostFallacy.RuleLLM.players:RuleLLMSunkCostHolder"
  num_instances: 3
  persona: !include ../RuleLLM/persona.yml
  config:
    identity: "sunkcostholder"
    role: player
    steps_per_turn: 1
    group_tags: [investors]
    extras:
      record_path: "artifacts/records"
      initial_cash: 1000000.0
      initial_position: 500
      initial_price: 100.0
      fundamental_value: 100.0
      hold_threshold: 0.1
      base_size: 200
      custom_state_hot_limit: 3
      llm:
        sys_message: "examples.SunkCostFallacy.RuleLLM.prompts:RULELLM_SUNK_COST_HOLDER_SYS"
        user_message: "examples.SunkCostFallacy.RuleLLM.prompts:RULELLM_USER_TEMPLATE"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.7
          max_tokens: 512

