# StatusQuoBias Rule Agent Configuration

market:
  name: "Market"
  class: "examples.StatusQuoBias.Rule.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "artifacts/records"
      initial_price: 100.0
      fundamental_value: 100.0
      price_impact: 0.02
      mean_reversion: 0.02
      noise_std: 0.01
      custom_state_hot_limit: 3
  persona: !include persona.yml

inertialholder:
  name: "InertialHolder"
  class: "examples.StatusQuoBias.Rule.players:InertialHolder"
  num_instances: 3
  config:
    identity: "inertialholder"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "artifacts/records"
      initial_cash: 1000000.0
      initial_position: 500
      initial_price: 100.0
      fundamental_value: 100.0
      inertia_strength: 0.9
      change_threshold: 0.3
      base_size: 200
      custom_state_hot_limit: 3
  persona: !include persona.yml

defaultfollower:
  name: "DefaultFollower"
  class: "examples.StatusQuoBias.Rule.players:DefaultFollower"
  num_instances: 3
  config:
    identity: "defaultfollower"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "artifacts/records"
      initial_cash: 800000.0
      initial_position: 400
      initial_price: 100.0
      fundamental_value: 100.0
      default_weight: 0.5
      active_deviation: 0.15
      base_size: 250
      custom_state_hot_limit: 3
  persona: !include persona.yml

activerebalancer:
  name: "ActiveRebalancer"
  class: "examples.StatusQuoBias.Rule.players:ActiveRebalancer"
  num_instances: 2
  config:
    identity: "activerebalancer"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "artifacts/records"
      initial_cash: 1500000.0
      initial_position: 600
      initial_price: 100.0
      fundamental_value: 100.0
      rebalance_threshold: 0.05
      position_size: 350
      custom_state_hot_limit: 3
  persona: !include persona.yml

momentumtrader:
  name: "MomentumTrader"
  class: "examples.StatusQuoBias.Rule.players:MomentumTrader"
  num_instances: 2
  config:
    identity: "momentumtrader"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "artifacts/records"
      initial_cash: 1200000.0
      initial_position: 500
      initial_price: 100.0
      fundamental_value: 100.0
      entry_threshold: 0.01
      position_size: 300
      custom_state_hot_limit: 3
  persona: !include persona.yml

noisetrader:
  name: "NoiseTrader"
  class: "examples.StatusQuoBias.Rule.players:NoiseTrader"
  num_instances: 2
  config:
    identity: "noisetrader"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "artifacts/records"
      initial_cash: 500000.0
