type: "star"

sources:
  - environment

connections:
  environment:
    - rulellm_gullible_spreader
    - rulellm_distorting_relayer
    - rulellm_skeptical_evaluator
    - rulellm_fact_checker
    - rulellm_uninformed_bystander

  rulellm_gullible_spreader:
    - environment

  rulellm_distorting_relayer:
    - environment

  rulellm_skeptical_evaluator:
    - environment

  rulellm_fact_checker:
    - environment

  rulellm_uninformed_bystander:
    - environment
