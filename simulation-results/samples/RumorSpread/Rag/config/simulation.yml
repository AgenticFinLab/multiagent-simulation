# =============================================================================
# RumorSpreadRag Simulation Configuration
# =============================================================================
# RAG-augmented Rule+LLM Rumor Spread simulation
# Each agent's prompt embeds quantitative rules + RAG knowledge retrieval
#
# Usage:
#   python examples/RumorSpread/Rag/run_rumor_rag.py -c configs/RumorSpread/Rag/simulation.yml
# =============================================================================

setting:
  name: "rumor_spread_rag_simulation"
  description: "RAG-augmented rumor propagation with rule-grounded LLM agents"
  total_rounds: 200
  round_history_limit: 3
  record_path: "artifacts/records"
  save_diagram_interval: 50

environment:
  dotenv_path: .env
  workspace: "."

ray:
  address: null
  namespace: "rumor_spread_rag"
  actor_prefix: null
  num_cpus: null
  num_gpus: null
  object_store_memory: 536870912
  include_dashboard: false
  logging_level: "warning"
  log_to_driver: false
  actor_options:
    max_restarts: 3
    max_task_retries: 1
    max_concurrency: 10
  runtime_env:
    working_dir: null
    pip: []
    env_vars: {}
  serialization:
    use_arrow: true
    register_custom_serializers: true

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "artifacts/communication"
  record_messages: true
  message_block_size: 500
