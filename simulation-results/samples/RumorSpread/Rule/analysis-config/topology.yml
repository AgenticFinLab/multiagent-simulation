# =============================================================================
# RumorSpread Topology - Star Pattern
# =============================================================================
# InformationEnvironment as hub, all agents communicate through environment.
#
#         gullible_spreader ──────────┐
#         distorting_relayer ─────────┤
#         skeptical_evaluator ────────┼──▶ environment ──▶ all agents
#         fact_checker ───────────────┤             (belief, distortion, truth)
#         uninformed_bystander ───────┘
#
# Execution flow per round:
#   Level 0: environment executes (broadcasts belief + distortion metrics)
#   Level 1: all agents execute in parallel (submit spread/correct/ignore actions)
# =============================================================================

type: "star"

sources:
  - environment

connections:
  # Environment → All agents (belief + distortion data broadcast)
  environment:
    - gullible_spreader
    - distorting_relayer
    - skeptical_evaluator
    - fact_checker
    - uninformed_bystander

  # Each agent → Environment only (action submission)
  gullible_spreader:
    - environment

  distorting_relayer:
    - environment

  skeptical_evaluator:
    - environment

  fact_checker:
    - environment

  uninformed_bystander:
    - environment
