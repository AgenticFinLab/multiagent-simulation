# =============================================================================
# RumorSpread Players Configuration
# =============================================================================
# Heterogeneous agents for rumor propagation simulation
#
# Agent Types (with information impact):
#   - InformationEnvironment: Rule-based coordinator (belief dynamics)
#   - GullibleSpreader: Uncritical transmitter (DESTABILIZING)
#   - DistortingRelayer: Serial distortion (DESTABILIZING)
#   - SkepticalEvaluator: Critical assessor (STABILIZING)
#   - FactChecker: Active debunker (STRONGLY STABILIZING)
#   - UninformedBystander: Random participant (NEUTRAL)
# =============================================================================

# -----------------------------------------------------------------------------
# InformationEnvironment (Coordinator)
# -----------------------------------------------------------------------------
environment:
  name: "InformationEnvironment"
  class: "examples.RumorSpread.Rule.players:InformationEnvironment"
  num_instances: 1
  config:
    identity: "environment"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - environment
    extras:
      record_path: "artifacts/records"
      # Belief dynamics parameters
      rumor_truth_value: 0.1     # 0.0 = completely false, 1.0 = fully true
      initial_belief: 0.3        # Starting belief level (rumor seed)
      spread_impact: 0.15        # How strongly agent actions shift belief
      truth_correction: 0.02     # Rate of truth-based correction
      leveling_rate: 0.01        # Allport & Postman: detail loss rate
      sharpening_rate: 0.02      # Allport & Postman: exaggeration rate
      noise_std: 0.02            # Transmission noise
      custom_state_hot_limit: 3
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Gullible Spreaders (Primary Rumor Amplifiers)
# -----------------------------------------------------------------------------
gullible_spreader:
  name: "Gullible Spreader"
  class: "examples.RumorSpread.Rule.players:GullibleSpreader"
  num_instances: 5
  config:
    identity: "gullible_spreader"
    role: player
    steps_per_turn: 1
    group_tags:
      - agents
    extras:
      record_path: "artifacts/records"
      # Agent base parameters
      initial_belief: 0.3        # Starts believing rumor somewhat
      initial_credibility: 0.5
      custom_state_hot_limit: 3
      # GullibleSpreader specific parameters
      credulity: 0.8             # High: believes easily
      spread_eagerness: 0.9      # High: spreads actively
      distortion_amplification: 0.3  # Amplifies distortion
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Distorting Relayers (Serial Distortion)
# -----------------------------------------------------------------------------
distorting_relayer:
  name: "Distorting Relayer"
  class: "examples.RumorSpread.Rule.players:DistortingRelayer"
  num_instances: 3
  config:
    identity: "distorting_relayer"
    role: player
    steps_per_turn: 1
    group_tags:
      - agents
    extras:
      record_path: "artifacts/records"
      # Agent base parameters
      initial_belief: 0.2
      initial_credibility: 0.4
      custom_state_hot_limit: 3
      # DistortingRelayer specific parameters
      credulity: 0.5             # Moderate: somewhat believing
      relay_eagerness: 0.7       # Moderate-high: relays often
      sharpening_factor: 0.4     # Exaggerates dramatic elements
      leveling_factor: 0.2       # Drops nuance
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Skeptical Evaluators (Critical Assessors)
# -----------------------------------------------------------------------------
skeptical_evaluator:
  name: "Skeptical Evaluator"
  class: "examples.RumorSpread.Rule.players:SkepticalEvaluator"
  num_instances: 3
  config:
    identity: "skeptical_evaluator"
    role: player
    steps_per_turn: 1
    group_tags:
      - agents
    extras:
      record_path: "artifacts/records"
      # Agent base parameters
      initial_belief: 0.1        # Low: skeptical from start
      initial_credibility: 0.7
      custom_state_hot_limit: 3
      # SkepticalEvaluator specific parameters
      skepticism: 0.7            # High: demands evidence
      correction_eagerness: 0.6  # Moderate: corrects when confident
      belief_threshold: 0.4      # Corrects when own belief below this
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Fact Checkers (Active Debunkers)
# -----------------------------------------------------------------------------
fact_checker:
  name: "Fact Checker"
  class: "examples.RumorSpread.Rule.players:FactChecker"
  num_instances: 2
  config:
    identity: "fact_checker"
    role: player
    steps_per_turn: 1
    group_tags:
      - agents
    extras:
      record_path: "artifacts/records"
      # Agent base parameters
      initial_belief: 0.05       # Very low: professional skeptic
      initial_credibility: 0.9
      custom_state_hot_limit: 3
      # FactChecker specific parameters
      fact_check_strength: 0.8       # Strong: active investigator
      credibility_discount: 0.6      # Corrections travel slower
      distortion_sensitivity: 0.5    # Better at debunking obvious falsehoods
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Uninformed Bystanders (Baseline)
# -----------------------------------------------------------------------------
uninformed_bystander:
  name: "Uninformed Bystander"
  class: "examples.RumorSpread.Rule.players:UninformedBystander"
  num_instances: 4
  config:
    identity: "uninformed_bystander"
    role: player
    steps_per_turn: 1
    group_tags:
      - agents
    extras:
      record_path: "artifacts/records"
      # Agent base parameters
      initial_belief: 0.2
      initial_credibility: 0.3
      custom_state_hot_limit: 3
      # UninformedBystander specific parameters
      engagement_probability: 0.3    # Low: rarely engages
      spread_probability: 0.4       # When engaged, slightly more likely to spread
  persona: !include persona.yml
