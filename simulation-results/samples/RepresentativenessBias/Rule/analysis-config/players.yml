# RepresentativenessBias Rule Agent Configuration

market:
  name: "Market"
  class: "examples.RepresentativenessBias.Rule.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "artifacts/records"
      initial_price: 100.0
      fundamental_value: 100.0
      price_impact: 0.02
      mean_reversion: 0.01
      noise_std: 0.012
      custom_state_hot_limit: 3
  persona: !include persona.yml

patternmatcher:
  name: "PatternMatcher"
  class: "examples.RepresentativenessBias.Rule.players:PatternMatcher"
  num_instances: 2
  config:
    identity: "patternmatcher"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "artifacts/records"
      initial_cash: 1000000.0
      initial_position: 500
      initial_price: 100.0
      fundamental_value: 100.0
      streak_sensitivity: 2.0
      base_size: 400
      custom_state_hot_limit: 3
      base_rate_ignore: 0.8
      pattern_sensitivity: 1.0
  persona: !include persona.yml

categoryovergeneralizer:
  name: "CategoryOvergeneralizer"
  class: "examples.RepresentativenessBias.Rule.players:CategoryOvergeneralizer"
  num_instances: 2
  config:
    identity: "categoryovergeneralizer"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "artifacts/records"
      initial_cash: 1000000.0
      initial_position: 500
      initial_price: 100.0
      fundamental_value: 100.0
      sample_size: 2
      base_size: 350
      custom_state_hot_limit: 3
      category_weight: 1.2
      sample_bias: 0.7
  persona: !include persona.yml

bayesianupdater:
  name: "BayesianUpdater"
  class: "examples.RepresentativenessBias.Rule.players:BayesianUpdater"
  num_instances: 1
