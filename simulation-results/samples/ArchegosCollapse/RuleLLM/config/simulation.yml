# =============================================================================
# ArchegosCollapse RuleLLM Simulation Configuration
# =============================================================================
# RuleLLM hybrid: prompts embed both persona AND explicit quantitative rules.
# Enables comparison with pure Rule and pure LLM variants.
#
# Usage:
#   python examples/ArchegosCollapse/RuleLLM/run_archegsoscollapse_rulellm.py \
#       -c configs/ArchegosCollapse/RuleLLM/simulation.yml
# =============================================================================

setting:
  name: "archegsoscollapse_rulellm_simulation"
  description: "Archegos-style collapse: RuleLLM hybrid with explicit margin/liquidation rules in prompts"
  total_rounds: 200
  round_history_limit: 3
  record_path: "artifacts/records"
  save_diagram_interval: 50

environment:
  dotenv_path: .env
  workspace: "."

ray:
  address: null
  namespace: "archegsoscollapse_rulellm"
  actor_prefix: null
  num_cpus: null
  num_gpus: null
  object_store_memory: 536870912
  include_dashboard: false
  logging_level: "warning"
  log_to_driver: false
  actor_options:
    max_restarts: 3
    max_task_retries: 1
    max_concurrency: 10
  runtime_env:
    working_dir: null
    pip: []
    env_vars: {}
  serialization:
    use_arrow: true
    register_custom_serializers: true

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "artifacts/communication"
  record_messages: true
  message_block_size: 500
