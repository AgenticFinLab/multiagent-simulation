# LTCMCollapse RuleLLM Agent Configuration

market:
  name: "Market"
  class: "examples.LTCMCollapse.RuleLLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "artifacts/records"
      initial_price: 100.0
      fundamental_value: 100.0
      price_impact: 0.03
      mean_reversion: 0.01
      noise_std: 0.015
      custom_state_hot_limit: 3
  persona: !include persona.yml

convergencearbitrageur:
  name: "ConvergenceArbitrageur"
  class: "examples.LTCMCollapse.RuleLLM.players:RuleLLMConvergenceArbitrageur"
  num_instances: 2
  config:
    identity: "convergencearbitrageur"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "artifacts/records"
      initial_cash: 2000000.0
      initial_position: 500
      initial_price: 100.0
      fundamental_value: 100.0
      entry_spread: 0.03
      leverage: 15
      max_position: 5000
      base_size: 400
      custom_state_hot_limit: 3
      llm:
        sys_message: "examples.LTCMCollapse.RuleLLM.prompts:RULELLM_CONVERGENCEARBITRAGEUR_PROMPT"
        user_message: "examples.LTCMCollapse.RuleLLM.prompts:RULELLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.2
          max_tokens: 600
  persona: !include persona.yml

leveragetrader:
  name: "LeverageTrader"
  class: "examples.LTCMCollapse.RuleLLM.players:RuleLLMLeverageTrader"
  num_instances: 2
  config:
    identity: "leveragetrader"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "artifacts/records"
      initial_cash: 3000000.0
      initial_position: 500
      initial_price: 100.0
      fundamental_value: 100.0
      leverage_ratio: 25
      margin_call_threshold: 0.04
      base_size: 500
      custom_state_hot_limit: 3
      llm:
        sys_message: "examples.LTCMCollapse.RuleLLM.prompts:RULELLM_LEVERAGETRADER_PROMPT"
        user_message: "examples.LTCMCollapse.RuleLLM.prompts:RULELLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.3
          max_tokens: 600
  persona: !include persona.yml

