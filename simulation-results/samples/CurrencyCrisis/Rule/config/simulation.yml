# CurrencyCrisis Rule Simulation Configuration

setting:
  name: "CurrencyCrisis-Rule"
  description: "CurrencyCrisis simulation - Rule agents"
  total_rounds: 200
  record_path: "artifacts/records"
  storage_path: "artifacts/communication"
  log_level: "INFO"
  log_to_file: true
  log_path: "logs"
  round_history_limit: 3
  save_diagram_interval: 50

environment:
  dotenv_path: ".env"
  workspace: "."

ray:
  namespace: "currencycrisis_rule"
  ignore_reinit_error: true
  object_store_memory: 536870912
  num_cpus: 4

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "artifacts/communication"
  record_messages: true
  message_block_size: 500
