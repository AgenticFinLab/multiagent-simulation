knowledge:
  global_resources:
    MinerU_processed:
      path: "examples/document-sources/processed"
  global_index_dir:
    rag_index:
      path: "examples/document-sources/rag_index"

market:
  name: "Market"
  class: "examples.SVBBankRun.Rule.players:Market"
  num_instances: 1
  persona: !include persona.yml
  config:
    identity: "market"
    role: market
    steps_per_turn: 1
    group_tags: [market]
    extras:
      record_path: "artifacts/records"
      initial_price: 100.0
      fundamental_value: 100.0
      price_impact: 0.025
      mean_reversion: 0.01
      noise_std: 0.015

depositor:
  name: "Depositor"
  class: "examples.SVBBankRun.Rag.players:RagLLMDepositor"
  num_instances: 4
  persona: !include persona.yml
  config:
    identity: "depositor"
    role: player
    steps_per_turn: 1
    group_tags: [investors]
    extras:
      record_path: "artifacts/records"
      initial_cash: 1000000.0
      initial_position: 600
      initial_price: 100.0
      fundamental_value: 100.0
      withdrawal_threshold: 0.1
      social_influence: 0.5
      base_size: 300
      custom_state_hot_limit: 3
      private_knowledge:
        from_global_resources: ["MinerU_processed"]
        rag:
          from_global_index_dir: ["rag_index"]
          embed_type: "litellm"
          embed_model: "openai/hunyuan-embedding"
          embed_api_base: "https://api.hunyuan.cloud.tencent.com/v1"
          embed_api_key: "{{ HUNYUAN_API_KEY }}"
          chunk_size: 512
          chunk_overlap: 64
          top_k: 3
      llm:
        sys_message: "examples.SVBBankRun.Rag.prompts:RAGLLM_DEPOSITOR_SYS"
        user_message: "examples.SVBBankRun.Rag.prompts:RAG_USER_TEMPLATE"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.7
          max_tokens: 600

