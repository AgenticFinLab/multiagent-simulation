# =============================================================================
# AssetBubble Simulation Configuration
# =============================================================================
# Demonstrates asset bubble formation through heterogeneous agents.
#
# Usage:
#   python examples/AssetBubble/Rule/run_bubble.py -c configs/AssetBubble/simulation.yml
# =============================================================================

setting:
  name: "asset_bubble_simulation"
  description: "Asset bubble formation through speculative momentum and limited arbitrage"
  total_rounds: 200
  round_history_limit: 3
  record_path: "EXPERIMENT/AssetBubble/Rule/records"
  save_diagram_interval: 50

environment:
  dotenv_path: .env
  workspace: "."

ray:
  address: null
  namespace: "asset_bubble"
  actor_prefix: null
  # null = Ray auto-detects from machine; actors use num_cpus=0 (async, I/O-bound)
  num_cpus: null
  num_gpus: null
  # Derived: 20 players, star topology -> 38 msgs/round
  #   20 TurnResult + 20 pending_info + 38 Message = 78 Ray objects
  #   78 obj x 64 KB min-alloc = 4992 KB (4.88 MB)
  #   10x headroom = 48.8 MB; 128 MB minimum floor -> 134217728 bytes
  object_store_memory: 134217728
  include_dashboard: false
  logging_level: "warning"
  log_to_driver: false
  actor_options:
    max_restarts: 3
    max_task_retries: 1
    max_concurrency: 4
  runtime_env:
    working_dir: null
    pip: []
    env_vars: {}
  serialization:
    use_arrow: true
    register_custom_serializers: true

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/AssetBubble/Rule/communication"
  record_messages: true
  message_block_size: 500
