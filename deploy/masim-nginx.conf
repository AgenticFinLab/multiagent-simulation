# MASIM Nginx Configuration — Load-balanced multi-instance Streamlit
# Install: sudo cp deploy/masim-nginx.conf /etc/nginx/sites-available/masim
#          sudo ln -sf /etc/nginx/sites-available/masim /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# Serves 4 Streamlit instances (ports 8502-8505) behind a single port 80.
# Uses ip_hash for session affinity (critical for Streamlit WebSocket).

upstream masim_backend {
    # ip_hash ensures the same client always hits the same Streamlit instance.
    # This is REQUIRED because Streamlit uses WebSocket connections that must
    # persist to the same backend for session_state to work correctly.
    ip_hash;

    server 127.0.0.1:8502;
    server 127.0.0.1:8503;
    server 127.0.0.1:8504;
    server 127.0.0.1:8505;
}

server {
    listen 80;
    server_name _;

    # Timeouts — Streamlit long-poll and WebSocket need generous timeouts
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_connect_timeout 10s;

    # Buffers — reduce overhead for small WebSocket frames
    proxy_buffering off;
    proxy_request_buffering off;

    # Main application
    location / {
        proxy_pass http://masim_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Streamlit static assets (cache aggressively)
    location /static {
        proxy_pass http://masim_backend;
        proxy_cache_valid 200 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Health check endpoint (optional, useful for monitoring)
    location /healthz {
        access_log off;
        proxy_pass http://masim_backend/_stcore/health;
    }
}
