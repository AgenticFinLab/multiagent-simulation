# MASIM Nginx Configuration — Load-balanced multi-instance Streamlit
# Install: sudo cp deploy/masim-nginx.conf /etc/nginx/sites-available/masim
#          sudo ln -sf /etc/nginx/sites-available/masim /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# Serves 4 Streamlit instances (ports 8502-8505) behind a single port 80.
# Uses ip_hash for session affinity (critical for Streamlit WebSocket).

# --- Connection limiting ---
# Total concurrent connections across all clients.  Once the 6th WebSocket
# is established, new visitors get a 503 "at capacity" page.
limit_conn_zone $server_name zone=masim_total:1m;

upstream masim_backend {
    # ip_hash ensures the same client always hits the same Streamlit instance.
    # This is REQUIRED because Streamlit uses WebSocket connections that must
    # persist to the same backend for session_state to work correctly.
    ip_hash;

    server 127.0.0.1:8502;
    server 127.0.0.1:8503;
    server 127.0.0.1:8504;
    server 127.0.0.1:8505;
}

server {
    listen 80;
    server_name _;

    # Timeouts — balance between keeping active simulation sessions alive
    # and releasing idle/orphaned connections.  Streamlit sends periodic
    # heartbeat pings (~30s), so a truly active session will never hit this.
    # Idle/closed-browser connections get reclaimed after 30 min of silence.
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
    proxy_connect_timeout 10s;

    # Buffers — reduce overhead for small WebSocket frames
    proxy_buffering off;
    proxy_request_buffering off;

    # --- Concurrent user cap ---
    # At most 6 simultaneous connections to the entire server.
    # Each Streamlit session holds 1 WebSocket, so this ≈ 6 active users.
    limit_conn masim_total 6;
    limit_conn_status 503;

    # Custom "at capacity" page
    error_page 503 /503.html;
    location = /503.html {
        internal;
        default_type text/html;
        return 503 '<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>服务器已满</title><style>body{font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;background:#f8fafc}div{text-align:center;max-width:420px;padding:2rem}.icon{font-size:3rem;margin-bottom:1rem}h1{margin:0 0 .5rem;font-size:1.5rem}p{color:#64748b;line-height:1.6}</style></head><body><div><div class="icon">🚦</div><h1>当前访问人数已满</h1><p>服务器最多支持 6 位用户同时使用。<br>请稍后刷新页面重试。</p></div></body></html>';
    }

    # Main application
    location / {
        proxy_pass http://masim_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Streamlit static assets (cache aggressively)
    location /static {
        proxy_pass http://masim_backend;
        proxy_cache_valid 200 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Health check endpoint (optional, useful for monitoring)
    location /healthz {
        access_log off;
        proxy_pass http://masim_backend/_stcore/health;
    }
}
