# =============================================================================
# HerdEffectLLM Topology - Star Pattern
# =============================================================================
# Market as hub, all LLM investors communicate through market.
#
#         llm_momentum ──────┐
#         llm_contrarian ────┤
#         llm_risk_averse ───┼──▶ market ──┬──▶ llm_momentum
#         llm_aggressive ────┤             ├──▶ llm_contrarian
#         llm_noise ─────────┘             ├──▶ llm_risk_averse
#                                          ├──▶ llm_aggressive
#                    (orders: P,Q)         └──▶ llm_noise
#                                               (market data: price, volume)
#
# Execution flow per round:
#   Level 0: market executes (broadcasts price + volume)
#   Level 1: all LLM investors execute in parallel (submit orders)
# =============================================================================

type: "star"

sources:
  - market

connections:
  # Market → All LLM investors (price + volume broadcast)
  market:
    - llm_momentum
    - llm_contrarian
    - llm_risk_averse
    - llm_aggressive
    - llm_noise

  # Each LLM investor → Market only (order submission)
  llm_momentum:
    - market

  llm_contrarian:
    - market

  llm_risk_averse:
    - market

  llm_aggressive:
    - market

  llm_noise:
    - market
