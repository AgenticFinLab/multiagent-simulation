# =============================================================================
# HerdEffectLLM Simulation Configuration
# =============================================================================
# LLM-powered investors simulating emergent herding behavior.
# Market is rule-based, investors use LLM for decision making.
#
# LLM Provider: ByteDance Doubao (via lmbase)
# Environment Variable: ARK_API_KEY
#
# Usage:
#   python examples/HerdEffect/LLM/run_herd_llm.py -c configs/HerdEffect/LLM/simulation.yml
# =============================================================================

setting:
  name: "herd_effect_llm_simulation"
  description: "LLM-based investors with ByteDance Doubao"
  total_rounds: 200
  round_history_limit: 3
  record_path: "EXPERIMENT/HerdEffect/LLM/records"
  save_diagram_interval: 100

environment:
  dotenv_path: .env
  workspace: "."

ray:
  address: null
  namespace: "herd_effect_llm"
  actor_prefix: null
  # null = Ray auto-detects from machine; actors use num_cpus=0 (async, I/O-bound)
  num_cpus: null
  num_gpus: null
  # Derived: 11 players, star topology -> 20 msgs/round
  #   11 TurnResult + 11 pending_info + 20 Message = 42 Ray objects
  #   42 obj x 64 KB min-alloc = 2688 KB (2.63 MB) base peak
  #   LLM TurnResult also carries prompt+response strings (~4-8 KB each) -> extra overhead
  #   Minimum 512 MB floor for LLM simulations -> 536870912 bytes
  object_store_memory: 536870912
  include_dashboard: false
  logging_level: "warning"
  log_to_driver: false
  actor_options:
    max_restarts: 3
    max_task_retries: 1
    max_concurrency: 10
  runtime_env:
    working_dir: null
    pip: []
    env_vars: {}
  serialization:
    use_arrow: true
    register_custom_serializers: true

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/HerdEffect/LLM/communication"
  record_messages: true
  message_block_size: 500
