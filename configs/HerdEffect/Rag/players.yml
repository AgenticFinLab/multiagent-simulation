# =============================================================================
# HerdEffectRuleLLM Players Configuration
# =============================================================================
# 1 Market (rule-based) + 5 Hybrid Rule+LLM Investors
# Each LLM agent's system prompt embeds:
#   - Personal profile: identity, style, risk attitude
#   - Quantitative rules: exact financial/mathematical principles
# =============================================================================

# Market (rule-based, identical to HerdEffect)
# =============================================================================
# Shared Knowledge Configuration
# =============================================================================
knowledge:
  backend: "local"
  global_uri: "examples/document-sources"
  resource_csv:
    - "examples/document-sources/books.csv"
    - "examples/document-sources/source"
  preprocessing:
    parser: "mineru"
    timeout_per_page: 30
    max_pages: 250
    output_position: "MinerU_processed"
  rag:
    output_position: "rag_index"
    embed_type: "litellm"
    embed_model: "openai/hunyuan-embedding"
    embed_api_key: "{{ HUNYUAN_API_KEY }}"
    embed_api_base: "https://api.hunyuan.cloud.tencent.com/v1"
    chunk_size: 512
    chunk_overlap: 64

market:
  archetype: stock-standard-price-impact  # -> AGENT_POOL/market/stock-standard-price-impact.md
  name: "Market"
  class: "examples.HerdEffect.Rag.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/HerdEffect/Rag/records"  # Source: framework infrastructure
      fundamental_value: 100.0  # Source: simulation-bases.md §6
      initial_price: 100.0  # Source: simulation-bases.md §6
      supply_elasticity: 0.1  # Source: simulation-bases.md §6
      mean_reversion: 0.02  # Source: simulation-bases.md §6
      noise_std: 0.5  # Source: simulation-bases.md §6
      custom_state_hot_limit: 3  # Source: framework infrastructure
      base_liquidity: 50.0  # Source: simulation-bases.md §6
      base_price_impact: 0.08  # Source: simulation-bases.md §6
      high_impact_multiplier: 3.0  # Source: simulation-bases.md §6
      low_liquidity_threshold: 30.0  # Source: simulation-bases.md §6
  persona: !include persona.yml

# RuleLLM Momentum Investor (Trend Following)
ragllm_momentum_investor:
  name: "RAG Momentum Investor"
  class: "examples.HerdEffect.Rag.players:RagLLMMomentumInvestor"
  num_instances: 3
  config:
    identity: "ragllm_momentum_investor"
    role: player
    steps_per_turn: 1
    group_tags:
      - ragllm_investors
    extras:
      record_path: "EXPERIMENT/HerdEffect/Rag/records"  # Source: framework infrastructure
      initial_cash: 10000.0  # Source: simulation-bases.md §6
      initial_position: 0.0  # Source: simulation-bases.md §6
      fundamental: 100.0  # Source: simulation-bases.md §4.1.7
      custom_state_hot_limit: 3  # Source: framework infrastructure
      private_knowledge:
        from_global_resources:
          - "MinerU_processed"
        local_resources:
          local_uri: ""
          local_resources: []
        rag:
          from_global_index_dir:
            - "rag_index"
          local_index_dir: ""
          embed_type: "litellm"
          embed_model: "openai/hunyuan-embedding"
          embed_api_key: "{{ HUNYUAN_API_KEY }}"
          embed_api_base: "https://api.hunyuan.cloud.tencent.com/v1"
          chunk_size: 512
          chunk_overlap: 64
          top_k: 5
      llm:
        sys_message: "examples.HerdEffect.Rag.prompts:RAGLLM_MOMENTUM_SYS"
        user_message: "examples.HerdEffect.Rag.prompts:RAGLLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.3
          max_new_tokens: 600
  persona: !include persona.yml

