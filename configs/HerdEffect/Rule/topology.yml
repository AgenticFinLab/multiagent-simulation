# =============================================================================
# Herd Effect Topology - Star Pattern (Emergent Herding Model)
# =============================================================================
# Market as hub, all investors communicate through market.
# NO HerdingInvestor - herding EMERGES from positive feedback dynamics.
#
#         investor_momentum ──────┐
#         investor_contrarian ────┤
#         investor_risk_averse ───┼──▶ market ──┬──▶ investor_momentum
#         investor_aggressive ────┤             ├──▶ investor_contrarian
#         investor_noise ─────────┘             ├──▶ investor_risk_averse
#                                               ├──▶ investor_aggressive
#                    (orders: P,Q)              └──▶ investor_noise
#                                                    (market data: price, volume)
#
# Execution flow per round:
#   Level 0: market executes (broadcasts price + volume)
#   Level 1: all investors execute in parallel (submit P,Q orders)
# =============================================================================

type: "star"

sources:
  - market

connections:
  # Market → All investors (price + volume broadcast)
  market:
    - investor_momentum
    - investor_contrarian
    - investor_risk_averse
    - investor_aggressive
    - investor_noise

  # Each investor → Market only (order submission)
  investor_momentum:
    - market

  investor_contrarian:
    - market

  investor_risk_averse:
    - market

  investor_aggressive:
    - market

  investor_noise:
    - market
