# =============================================================================
# Herd Effect Simulation Configuration
# =============================================================================
# Demonstrates herd behavior in financial markets with multi-strategy investors.
#
# Usage:
#   python examples/HerdEffect/run_herd.py -c configs/HerdEffect/simulation.yml
# =============================================================================

setting:
  name: "herd_effect_simulation"
  description: "Multi-strategy investors interacting with market"
  total_rounds: 1000
  round_history_limit: 3
  record_path: "EXPERIMENT/HerdEffect/records"
  save_diagram_interval: 100  # Save diagram every N rounds (0 = disabled)

environment:
  dotenv_path: .env
  workspace: "."

ray:
  address: null
  namespace: "herd_effect"
  actor_prefix: null
  # Derived: 5 investors run parallel at level 1; +1 for OS/driver = 6
  num_cpus: 6
  num_gpus: null
  # Derived: 6 players, star topology -> 10 msgs/round
  #   6 TurnResult + 6 pending_info + 10 Message = 22 Ray objects
  #   22 obj x 64 KB min-alloc = 1408 KB (1.38 MB)
  #   10x headroom = 13.8 MB; 128 MB minimum floor -> 134217728 bytes
  object_store_memory: 134217728
  include_dashboard: false
  logging_level: "warning"
  log_to_driver: false
  actor_options:
    max_restarts: 3
    max_task_retries: 1
    max_concurrency: 4
  runtime_env:
    working_dir: null
    pip: []
    env_vars: {}
  serialization:
    use_arrow: true
    register_custom_serializers: true

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/HerdEffect/communication"
  record_messages: true
  message_block_size: 500
