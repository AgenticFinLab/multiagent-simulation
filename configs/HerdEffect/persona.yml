# =============================================================================
# Persona Configuration
# =============================================================================

auto_checkpoint: false
debug_mode: true

proxy:
  storage:
    checkpoint_dir: "EXPERIMENT/HerdEffect/checkpoints"
    record_path: "EXPERIMENT/HerdEffect/records"
    record_rounds: true
  
  monitoring:
    metrics_backend: "memory"
    logging_backend: "structured"
    log_dir: "EXPERIMENT/HerdEffect/logs"
    log_level: "INFO"
  
  communication:
    message_timeout_ms: 5000
    enable_compression: true
  
  resource:
    mcp_servers: []
    enable_caching: false
