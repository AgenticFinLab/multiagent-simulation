# =============================================================================
# HerdEffectRuleLLM Topology Configuration
# =============================================================================
# Star topology: Market broadcasts to all investors, investors send orders to market
# =============================================================================

type: star

sources:
  - market

connections:
  market:
    # Market broadcasts to all investors.
    # Instance keys must match the fully-expanded player keys
    # produced by expand_player_instances() — base key + '_' + index.
    - rulellm_momentum_investor_1
    - rulellm_momentum_investor_2
    - rulellm_momentum_investor_3
    - rulellm_contrarian_investor_1
    - rulellm_contrarian_investor_2
    - rulellm_risk_averse_investor_1
    - rulellm_risk_averse_investor_2
    - rulellm_aggressive_investor_1
    - rulellm_aggressive_investor_2
    - rulellm_noise_trader_1
    - rulellm_noise_trader_2
