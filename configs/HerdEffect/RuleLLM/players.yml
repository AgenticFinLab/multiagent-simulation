# =============================================================================
# HerdEffectRuleLLM Players Configuration
# =============================================================================
# 1 Market (rule-based) + 5 Hybrid Rule+LLM Investors
# Each LLM agent's system prompt embeds:
#   - Personal profile: identity, style, risk attitude
#   - Quantitative rules: exact financial/mathematical principles
# =============================================================================

# Market (rule-based, identical to HerdEffect)
market:
  name: "Market"
  class: "examples.HerdEffect.RuleLLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/HerdEffect/RuleLLM/records"
      fundamental_value: 100.0
      initial_price: 100.0
      supply_elasticity: 0.1
      mean_reversion: 0.02
      noise_std: 0.5
      custom_state_hot_limit: 3
  persona: !include persona.yml

# RuleLLM Momentum Investor (Trend Following)
rulellm_momentum_investor:
  name: "RuleLLM Momentum Investor"
  class: "examples.HerdEffect.RuleLLM.players:RuleLLMMomentumInvestor"
  num_instances: 3
  config:
    identity: "rulellm_momentum_investor"
    role: player
    steps_per_turn: 1
    group_tags:
      - rulellm_investors
    extras:
      record_path: "EXPERIMENT/HerdEffect/RuleLLM/records"
      initial_cash: 10000.0
      initial_position: 0.0
      fundamental: 100.0
      custom_state_hot_limit: 3
      llm:
        sys_message: "examples.HerdEffect.RuleLLM.prompts:RULELLM_MOMENTUM_SYS"
        user_message: "examples.HerdEffect.RuleLLM.prompts:RULELLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.3
          max_new_tokens: 500
  persona: !include persona.yml

