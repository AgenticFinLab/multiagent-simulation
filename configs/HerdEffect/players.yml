# =============================================================================
# Herd Effect Players Configuration - Emergent Herding Model
# =============================================================================
# 1 Market + 5 Investors (NO HerdingInvestor - herding EMERGES from dynamics)
#
# Strategies:
#   - Momentum:   Q ∝ +ΔP%, trend following (destabilizing)
#   - Contrarian: Q ∝ -ΔP%, value investing (stabilizing)
#   - RiskAverse: Q ∝ 1/σ², volatility-adjusted (early exit in crash)
#   - Aggressive: Q = κ×ΔP% + accel, leveraged momentum (extreme)
#   - Noise:      Q ~ N(0,σ²), random trading (liquidity/trigger)
#
# Key Insight: Herd behavior EMERGES from Momentum+Aggressive positive feedback
#              without an explicit imitator - more academically rigorous.
#
# References:
#   - Jegadeesh & Titman (1993), De Bondt & Thaler (1985)
#   - Shiller (1984), De Long et al. (1990), Markowitz (1952)
# =============================================================================

# -----------------------------------------------------------------------------
# Market (central price setter with order-based clearing)
# -----------------------------------------------------------------------------
market:
  name: "Market"
  class: "examples.HerdEffect.players:Market"
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras: {}
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Investors (5 types - NO HerdingInvestor for emergent model)
# -----------------------------------------------------------------------------

investor_momentum:
  name: "Momentum Investor"
  class: "examples.HerdEffect.players:MomentumInvestor"
  config:
    identity: "investor_momentum"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      strategy: momentum
  persona: !include persona.yml

investor_contrarian:
  name: "Contrarian Investor"
  class: "examples.HerdEffect.players:ContrarianInvestor"
  config:
    identity: "investor_contrarian"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      strategy: contrarian
  persona: !include persona.yml

# NOTE: HerdingInvestor REMOVED for Emergent Herding Model
# Herding behavior now emerges from Momentum + Aggressive interaction

investor_risk_averse:
  name: "Risk Averse Investor"
  class: "examples.HerdEffect.players:RiskAverseInvestor"
  config:
    identity: "investor_risk_averse"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      strategy: risk_averse
  persona: !include persona.yml

investor_aggressive:
  name: "Aggressive Investor"
  class: "examples.HerdEffect.players:AggressiveInvestor"
  config:
    identity: "investor_aggressive"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      strategy: aggressive
  persona: !include persona.yml

investor_noise:
  name: "Noise Trader"
  class: "examples.HerdEffect.players:NoiseTrader"
  config:
    identity: "investor_noise"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      strategy: noise
  persona: !include persona.yml
