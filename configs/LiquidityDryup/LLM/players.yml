# =============================================================================
# LiquidityDryupLLM Players Configuration
# =============================================================================

market:
  archetype: stock-standard-price-impact  # -> AGENT_POOL/market/stock-standard-price-impact.md
  name: "Market with Liquidity Dynamics"
  class: "examples.LiquidityDryup.LLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/LiquidityDryup/LLM/records"  # Source: framework infrastructure
      fundamental_value: 100.0  # Source: simulation-bases.md §6
      initial_price: 100.0  # Source: simulation-bases.md §6
      price_impact: 0.08  # Source: simulation-bases.md §6
      mean_reversion: 0.015  # Source: simulation-bases.md §6
      noise_std: 0.4  # Source: simulation-bases.md §6
      custom_state_hot_limit: 3  # Source: framework infrastructure
      base_liquidity: 50.0  # Source: simulation-bases.md §6
  persona: !include persona.yml

llm_market_maker:
  archetype: market-maker  # -> AGENT_POOL/finance/market-maker.md
  name: "LLM Market Maker"
  class: "examples.LiquidityDryup.LLM.players:LLMMarketMaker"
  # Expander → llm_market_maker_1, llm_market_maker_2, llm_market_maker_3
  num_instances: 3
  config:
    identity: "llm_market_maker"
    role: player
    steps_per_turn: 1
    group_tags:
      - llm_investors
    extras:
      record_path: "EXPERIMENT/LiquidityDryup/LLM/records"  # Source: framework infrastructure
      initial_cash: 10000.0  # Source: simulation-bases.md §6
      initial_position: 50.0  # Source: simulation-bases.md §6
      custom_state_hot_limit: 3  # Source: framework infrastructure
      llm:
        sys_message: "examples.LiquidityDryup.LLM.prompts:LLM_MARKET_MAKER_SYS"
        user_message: "examples.LiquidityDryup.LLM.prompts:LLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.3
          max_new_tokens: 500
  persona: !include persona.yml

