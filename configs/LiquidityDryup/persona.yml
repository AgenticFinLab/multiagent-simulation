# =============================================================================
# LiquidityDryup Persona Configuration
# =============================================================================
# Shared persona configuration for all players in the simulation.
# =============================================================================

auto_checkpoint: false
debug_mode: true

proxy:
  storage:
    checkpoint_dir: "EXPERIMENT/LiquidityDryup/checkpoints"
    record_path: "EXPERIMENT/LiquidityDryup/records"
    record_rounds: true
    turn_block_size: 3

  monitoring:
    record_path: "EXPERIMENT/LiquidityDryup/monitoring"
    monitor_hot_limit: 3

  communication:
    message_timeout_ms: 5000
    enable_compression: true

  resource:
    mcp_servers: []
    enable_caching: false
