setting:
  name: "liquidity_dryup_simulation"
  description: "Liquidity dry-up and market maker inventory model"
  total_rounds: 200
  round_history_limit: 3
  record_path: "EXPERIMENT/LiquidityDryup/records"
  save_diagram_interval: 50

environment: {dotenv_path: .env, workspace: "."}

ray:
  address: null
  namespace: "liquidity_dryup"
  num_cpus: 4
  include_dashboard: false
  logging_level: "warning"
  log_to_driver: true
  actor_options: {max_restarts: 3, max_task_retries: 1, max_concurrency: 10}
  runtime_env: {working_dir: null, pip: [], env_vars: {}}
  serialization: {use_arrow: true, register_custom_serializers: true}

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/LiquidityDryup/communication"
