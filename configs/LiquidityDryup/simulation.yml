setting:
  name: "liquidity_dryup_simulation"
  description: "Liquidity dry-up and market maker inventory model"
  total_rounds: 200
  round_history_limit: 3
  record_path: "EXPERIMENT/LiquidityDryup/records"
  save_diagram_interval: 50

environment: {dotenv_path: .env, workspace: "."}

ray:
  address: null
  namespace: "liquidity_dryup"
  actor_prefix: null
  # Derived: 7 investors run parallel at level 1; +1 for OS/driver = 8
  num_cpus: 8
  num_gpus: null
  # Derived: 8 players, star topology -> 14 msgs/round
  #   8 TurnResult + 8 pending_info + 14 Message = 30 Ray objects
  #   30 obj x 64 KB min-alloc = 1920 KB (1.88 MB)
  #   10x headroom = 18.8 MB; 128 MB minimum floor -> 134217728 bytes
  object_store_memory: 134217728
  include_dashboard: false
  logging_level: "warning"
  log_to_driver: false
  actor_options: {max_restarts: 3, max_task_retries: 1, max_concurrency: 4}
  runtime_env: {working_dir: null, pip: [], env_vars: {}}
  serialization: {use_arrow: true, register_custom_serializers: true}

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/LiquidityDryup/communication"
  record_messages: true
  message_block_size: 500
