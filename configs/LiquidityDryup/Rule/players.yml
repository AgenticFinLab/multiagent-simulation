# =============================================================================
# LiquidityDryup Players Configuration
# =============================================================================
# Market Maker Inventory Model Simulation
#
# Phenomenon: Liquidity Dry-up
#   - Market makers withdraw liquidity during stress
#   - Creates self-reinforcing cycles of illiquidity
#   - Reference: Grossman & Miller (1988), Amihud & Mendelson (1986)
#
# Investor Types:
#   - MarketMaker: Provides liquidity but withdraws in stress
#   - LiquiditySeeker: Needs liquidity, struggles during dry-up
#   - ValueTrader: Provides liquidity when mispricing detected
#   - MomentumTrader: Can trigger liquidity crises
#   - NoiseTrader: Random trades
# =============================================================================

market:
  name: "Market"
  class: "examples.LiquidityDryup.Rule.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/LiquidityDryup/Rule/records"
      # Market parameters
      fundamental_value: 100.0
      initial_price: 100.0
      price_impact: 0.08
      mean_reversion: 0.015
      noise_std: 0.4
      custom_state_hot_limit: 3
      base_liquidity: 50.0
  persona: !include persona.yml

market_maker:
  name: "Market Maker"
  class: "examples.LiquidityDryup.Rule.players:MarketMaker"
  # Expander → market_maker_1, market_maker_2, market_maker_3
  num_instances: 3
  config:
    identity: "market_maker"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/LiquidityDryup/Rule/records"
      initial_cash: 10000.0
      initial_position: 0.0
      custom_state_hot_limit: 3
      # MarketMaker specific
      volatility_threshold: 0.02
      base_liquidity: 30.0
      withdraw_rebalance: 0.3
      normal_rebalance: 0.2
  persona: !include persona.yml

liquidity_seeker:
  name: "Liquidity Seeker"
  class: "examples.LiquidityDryup.Rule.players:LiquiditySeeker"
  # Expander → liquidity_seeker_1, liquidity_seeker_2, liquidity_seeker_3
  num_instances: 3
  config:
    identity: "liquidity_seeker"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/LiquidityDryup/Rule/records"
      initial_cash: 10000.0
      initial_position: 0.0
      custom_state_hot_limit: 3
      # LiquiditySeeker specific
      target_volatility: 15.0
      liquidity_base: 100.0
  persona: !include persona.yml

value_trader:
  name: "Value Trader"
  class: "examples.LiquidityDryup.Rule.players:ValueTrader"
  # Expander → value_trader_1, value_trader_2
  num_instances: 2
  config:
    identity: "value_trader"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/LiquidityDryup/Rule/records"
      initial_cash: 10000.0
      initial_position: 0.0
      custom_state_hot_limit: 3
      # ValueTrader specific
      liquidity_threshold: 0.05
      trade_threshold: 0.03
      base_liquidity_provision: 20
      value_multiplier: 30
  persona: !include persona.yml

momentum_trader:
  name: "Momentum Trader"
  class: "examples.LiquidityDryup.Rule.players:MomentumTrader"
  # Expander → momentum_trader_1, momentum_trader_2
  num_instances: 2
  config:
    identity: "momentum_trader"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/LiquidityDryup/Rule/records"
      initial_cash: 10000.0
      initial_position: 0.0
      custom_state_hot_limit: 3
      # MomentumTrader specific
      momentum_threshold: 0.01
      momentum_multiplier: 200
  persona: !include persona.yml

noise_trader:
  name: "Noise Trader"
  class: "examples.LiquidityDryup.Rule.players:NoiseTrader"
  # Expander → noise_trader_1, noise_trader_2
  num_instances: 2
  config:
    identity: "noise_trader"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/LiquidityDryup/Rule/records"
      initial_cash: 10000.0
      initial_position: 0.0
      custom_state_hot_limit: 3
      # NoiseTrader specific
      noise_volatility: 10.0
  persona: !include persona.yml
