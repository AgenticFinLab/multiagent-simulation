# =============================================================================
# LiquidityDryup Players Configuration
# =============================================================================
# Market Maker Inventory Model Simulation
#
# Phenomenon: Liquidity Dry-up
#   - Market makers withdraw liquidity during stress
#   - Creates self-reinforcing cycles of illiquidity
#   - Reference: Grossman & Miller (1988), Amihud & Mendelson (1986)
#
# Investor Types:
#   - MarketMaker: Provides liquidity but withdraws in stress
#   - LiquiditySeeker: Needs liquidity, struggles during dry-up
#   - ValueTrader: Provides liquidity when mispricing detected
#   - MomentumTrader: Can trigger liquidity crises
#   - NoiseTrader: Random trades
# =============================================================================

market:
  archetype: stock-standard-price-impact  # -> AGENT_POOL/market/stock-standard-price-impact.md
  name: "Market"
  class: "examples.LiquidityDryup.Rule.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/LiquidityDryup/Rule/records"  # Source: framework infrastructure
      # Market parameters
      fundamental_value: 100.0  # Source: simulation-bases.md §6
      initial_price: 100.0  # Source: simulation-bases.md §6
      price_impact: 0.08  # Source: simulation-bases.md §6
      mean_reversion: 0.015  # Source: simulation-bases.md §6
      noise_std: 0.4  # Source: simulation-bases.md §6
      custom_state_hot_limit: 3  # Source: framework infrastructure
      base_liquidity: 50.0  # Source: simulation-bases.md §6
  persona: !include persona.yml

rule_market_maker:
  archetype: market-maker  # -> AGENT_POOL/finance/market-maker.md
  name: "Market Maker"
  class: "examples.LiquidityDryup.Rule.players:MarketMaker"
  # Expander → market_maker_1, market_maker_2, market_maker_3
  num_instances: 3
  config:
    identity: "rule_market_maker"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/LiquidityDryup/Rule/records"  # Source: framework infrastructure
      initial_cash: 10000.0  # Source: simulation-bases.md §6
      initial_position: 50.0  # Source: finance-liquidity-dryup.md §9
      custom_state_hot_limit: 3  # Source: framework infrastructure
      # MarketMaker specific
      volatility_threshold: 0.02  # Source: simulation-bases.md §4.1.7
      base_liquidity: 30.0  # Source: simulation-bases.md §4.1.7
      withdraw_rebalance: 0.3  # Source: simulation-bases.md §4.1.7
      normal_rebalance: 0.2  # Source: simulation-bases.md §4.1.7
  persona: !include persona.yml

rule_liquidity_seeker:
