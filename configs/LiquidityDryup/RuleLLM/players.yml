# =============================================================================
# LiquidityDryupLLM Players Configuration
# =============================================================================

market:
  archetype: stock-standard-price-impact  # -> masim/agents/defines/market/stock-standard-price-impact.md
  name: "Market with Liquidity Dynamics"
  class: "examples.LiquidityDryup.RuleLLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/LiquidityDryup/RuleLLM/records"  # Source: framework infrastructure
      fundamental_value: 100.0  # Source: simulation-bases.md §6
      initial_price: 100.0  # Source: simulation-bases.md §6
      base_price_impact: 0.08  # Source: simulation-bases.md §6
      mean_reversion: 0.015  # Source: simulation-bases.md §6
      noise_std: 0.4  # Source: simulation-bases.md §6
      custom_state_hot_limit: 3  # Source: framework infrastructure
      high_impact_multiplier: 3.0  # Source: simulation-bases.md §6
      low_liquidity_threshold: 30.0  # Source: simulation-bases.md §6
      base_liquidity: 50.0  # Source: simulation-bases.md §6
  persona: !include persona.yml

rulellm_market_maker:
  archetype: market-maker  # -> masim/agents/defines/finance/market-maker.md
  name: "RuleLLM Market Maker"
  class: "examples.LiquidityDryup.RuleLLM.players:RuleLLMMarketMaker"
  # Expander → rulellm_market_maker_1, rulellm_market_maker_2, rulellm_market_maker_3
  num_instances: 3
  config:
    identity: "rulellm_market_maker"
    role: player
    steps_per_turn: 1
    group_tags:
      - rulellm_investors
    extras:
      record_path: "EXPERIMENT/LiquidityDryup/RuleLLM/records"  # Source: framework infrastructure
      initial_cash: 10000.0  # Source: simulation-bases.md §6
      initial_position: 50.0  # Source: simulation-bases.md §6
      custom_state_hot_limit: 3  # Source: framework infrastructure
      llm:
        sys_message: "examples.LiquidityDryup.RuleLLM.prompts:RULELLM_MARKET_MAKER_SYS"
        user_message: "examples.LiquidityDryup.RuleLLM.prompts:RULELLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.3
          max_new_tokens: 500
  persona: !include persona.yml

