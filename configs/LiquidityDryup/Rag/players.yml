# =============================================================================
# LiquidityDryupLLM Players Configuration
# =============================================================================

# =============================================================================
# Shared Knowledge Configuration
# =============================================================================
knowledge:
  backend: "local"
  global_uri: "examples/document-sources"
  resource_csv:
    - "examples/document-sources/books.csv"
    - "examples/document-sources/source"
  preprocessing:
    parser: "mineru"
    timeout_per_page: 30
    max_pages: 250
    output_position: "MinerU_processed"
  rag:
    output_position: "rag_index"
    embed_type: "litellm"
    embed_model: "openai/hunyuan-embedding"
    embed_api_key: "{{ HUNYUAN_API_KEY }}"
    embed_api_base: "https://api.hunyuan.cloud.tencent.com/v1"
    chunk_size: 512
    chunk_overlap: 64

market:
  name: "Market with Liquidity Dynamics"
  class: "examples.LiquidityDryup.Rag.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/LiquidityDryup/Rag/records"  # Source: framework infrastructure
      fundamental_value: 100.0  # Source: simulation-bases.md §6
      initial_price: 100.0  # Source: simulation-bases.md §6
      base_price_impact: 0.08  # Source: simulation-bases.md §6
      mean_reversion: 0.015  # Source: simulation-bases.md §6
      noise_std: 0.4  # Source: simulation-bases.md §6
      custom_state_hot_limit: 3  # Source: framework infrastructure
      high_impact_multiplier: 3.0  # Source: simulation-bases.md §6
      low_liquidity_threshold: 30.0  # Source: simulation-bases.md §6
      base_liquidity: 50.0  # Source: simulation-bases.md §6
  persona: !include persona.yml

ragllm_market_maker:
  name: "RAG Market Maker"
  class: "examples.LiquidityDryup.Rag.players:RagLLMMarketMaker"
  # Expander → ragllm_market_maker_1, ragllm_market_maker_2, ragllm_market_maker_3
  num_instances: 3
  config:
    identity: "ragllm_market_maker"
    role: player
    steps_per_turn: 1
    group_tags:
      - ragllm_investors
    extras:
      record_path: "EXPERIMENT/LiquidityDryup/Rag/records"  # Source: framework infrastructure
      initial_cash: 10000.0  # Source: simulation-bases.md §6
      initial_position: 50.0  # Source: simulation-bases.md §6
      custom_state_hot_limit: 3  # Source: framework infrastructure
      private_knowledge:
        from_global_resources:
          - "MinerU_processed"
        local_resources:
          local_uri: ""
          local_resources: []
        rag:
          from_global_index_dir:
            - "rag_index"
          local_index_dir: ""
          embed_type: "litellm"
          embed_model: "openai/hunyuan-embedding"
          embed_api_key: "{{ HUNYUAN_API_KEY }}"
          embed_api_base: "https://api.hunyuan.cloud.tencent.com/v1"
          chunk_size: 512
          chunk_overlap: 64
          top_k: 5
      llm:
        sys_message: "examples.LiquidityDryup.Rag.prompts:RAGLLM_MARKET_MAKER_SYS"
        user_message: "examples.LiquidityDryup.Rag.prompts:RAGLLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.3
          max_new_tokens: 600
  persona: !include persona.yml

