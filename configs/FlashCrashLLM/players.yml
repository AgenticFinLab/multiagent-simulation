# =============================================================================
# FlashCrashLLM Players Configuration
# =============================================================================

market:
  name: "Market with Liquidity-Sensitive Pricing"
  class: "examples.FlashCrashLLM.players:Market"
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/FlashCrashLLM/records"
      fundamental_value: 100.0
      initial_price: 100.0
      base_price_impact: 0.05
      mean_reversion: 0.02
      noise_std: 0.3
      low_liquidity_threshold: 50.0
      high_impact_multiplier: 3.0
      custom_state_hot_limit: 3
  persona: !include persona.yml

llm_hft:
  name: "LLM High-Frequency Trader"
  class: "examples.FlashCrashLLM.players:LLMHighFrequencyTrader"
  config:
    identity: "llm_hft"
    role: player
    steps_per_turn: 1
    group_tags:
      - llm_investors
    extras:
      record_path: "EXPERIMENT/FlashCrashLLM/records"
      initial_cash: 10000.0
      initial_position: 0.0
      custom_state_hot_limit: 3
      llm:
        sys_message: "examples.FlashCrashLLM.prompts:LLM_HFT_SYS"
        user_message: "examples.FlashCrashLLM.prompts:LLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-1-6-lite-251015"
        generation_config:
          temperature: 0.3
          max_new_tokens: 500
  persona: !include persona.yml

