# FlashCrash2010 LLM Agent Configuration

market:
  name: "Market"
  class: "examples.FlashCrash2010.RuleLLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    extras:
      initial_price: 40.00
      fundamental_value: 40.00
      price_impact: 0.05
      mean_reversion: 0.02
      noise_std: 0.02
      base_depth: 10000
      stress_threshold: 0.02

hft_market_maker_1:
  name: "HFT Market Maker 1"
  class: "examples.FlashCrash2010.RuleLLM.players:LLMHFTMarketMaker"
  num_instances: 1
  config:
    identity: "hft_mm_1"
    role: player
    extras:
      initial_cash: 1000000.00
      initial_position: 0
      agent_type: "hft_market_maker"
      llm:
        model: "doubao-pro-32k"

