      initial_price: 40.0        # Source: target §9 row 1 (normalization)
      fundamental_value: 40.0    # Source: target §9 row 2 (normalization)
      entry_price: 40.0          # Source: target §9 row 17 (normalization)
      stop_percentage: 0.03      # Source: target §9 row 16; Brunnermeier & Pedersen (2005)
      position_size: 1000        # Source: simulation-bases.md §4.4 (initial_position)
