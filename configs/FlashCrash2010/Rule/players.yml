# FlashCrash2010 Rule Agent Configuration

market:
  archetype: stock-standard-price-impact  # -> AGENT_POOL/market/stock-standard-price-impact.md
  name: "Market"
  class: "examples.FlashCrash2010.Rule.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/FlashCrash2010/Rule/records"  # Source: infrastructure
      initial_price: 40.0        # Source: target §9 row 1 (normalization)
      fundamental_value: 40.0    # Source: target §9 row 2 (normalization)
      base_depth: 10000          # Source: target §9 row 3; CFTC-SEC (2010)
      price_impact: 0.05         # Source: target §9 row 4; Kirilenko et al. (2017)
      mean_reversion: 0.02       # Source: target §9 row 5; Shiller (1981)
      noise_std: 0.01            # Source: target §9 row 6 (calibration)
      custom_state_hot_limit: 3  # Source: infrastructure
  persona: !include persona.yml

rule_hft_market_maker:
  name: "HFTMarketMaker"
  class: "examples.FlashCrash2010.Rule.players:HFTMarketMaker"
  num_instances: 3
  config:
    identity: "rule_hft_market_maker"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/FlashCrash2010/Rule/records"  # Source: infrastructure
      initial_cash: 1000000.0    # Source: infrastructure
      initial_position: 0        # Source: infrastructure
      initial_price: 40.0        # Source: target §9 row 1 (normalization)
      fundamental_value: 40.0    # Source: target §9 row 2 (normalization)
      normal_spread: 0.0001      # Source: target §9 row 8; Biais et al. (2015)
      stress_spread: 0.005       # Source: target §9 row 9; Biais et al. (2015)
      inventory_limit: 1000      # Source: target §9 row 10 (calibration)
      withdrawal_threshold: 0.02 # Source: target §9 row 7; Kirilenko et al. (2017)
      mm_qty: 500                # Source: simulation-bases.md §4.1 (normal liquidity provision)
      custom_state_hot_limit: 3  # Source: infrastructure
  persona: !include persona.yml

rule_momentum_chaser:
  name: "MomentumChaser"
  class: "examples.FlashCrash2010.Rule.players:MomentumChaser"
  num_instances: 2
  config:
    identity: "rule_momentum_chaser"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/FlashCrash2010/Rule/records"  # Source: infrastructure
      initial_cash: 500000.0     # Source: infrastructure
      initial_position: 0        # Source: infrastructure
      initial_price: 40.0        # Source: target §9 row 1 (normalization)
      fundamental_value: 40.0    # Source: target §9 row 2 (normalization)
      entry_threshold: 0.001     # Source: target §9 row 12; De Long et al. (1990)
      lookback_window: 5         # Source: target §9 row 11; De Long et al. (1990)
      position_multiplier: 10000 # Source: target §9 row 13 (calibration)
      max_size: 1000             # Source: simulation-bases.md §4.2 (position cap)
      custom_state_hot_limit: 3  # Source: infrastructure
  persona: !include persona.yml

rule_fundamental_trader:
  name: "FundamentalTrader"
  class: "examples.FlashCrash2010.Rule.players:FundamentalTrader"
  num_instances: 2
  config:
    identity: "rule_fundamental_trader"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/FlashCrash2010/Rule/records"  # Source: infrastructure
      initial_cash: 2000000.0    # Source: infrastructure
      initial_position: 0        # Source: infrastructure
      initial_price: 40.0        # Source: target §9 row 1 (normalization)
      fundamental_value: 40.0    # Source: target §9 row 2 (normalization)
      value_trigger: 0.05        # Source: target §9 row 14; Shiller (1981)
      order_size: 500            # Source: target §9 row 15 (calibration)
      custom_state_hot_limit: 3  # Source: infrastructure
  persona: !include persona.yml

