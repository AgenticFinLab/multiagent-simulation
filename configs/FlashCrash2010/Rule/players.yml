# FlashCrash2010 Agent Configuration
#
# Agent parameters based on Kirilenko et al. (2017) and market microstructure literature.
# All values calibrated to match stylized facts from the May 6, 2010 event.

market:
  name: "Market"
  class: "examples.FlashCrash2010.Rule.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    extras:
      # Price formation parameters
      # Source: Kirilenko et al. (2017) - price impact estimates
      initial_price: 40.00
      fundamental_value: 40.00
      
      # Price impact coefficient
      # Source: Empirical estimates from HFT literature
      price_impact: 0.05
      
      # Mean reversion to fundamental
      # Source: Standard market efficiency assumption
      mean_reversion: 0.02
      
      # Noise standard deviation
      # Source: Calibrated to match observed volatility
      noise_std: 0.02
      
      # Base order book depth
      # Source: Typical depth for S&P 500 E-mini futures
      base_depth: 10000
      
      # Stress threshold for depth collapse
      # Source: Observed during flash crash
      stress_threshold: 0.02

hft_market_maker_1:
  name: "HFT Market Maker 1"
  class: "examples.FlashCrash2010.Rule.players:HFTMarketMaker"
  num_instances: 1
  config:
    identity: "hft_mm_1"
    role: player
    extras:
      initial_cash: 1000000.00
      initial_position: 0
      
      # Normal spread: 0.01% (tight)
      # Source: Typical HFT spreads in normal conditions
      normal_spread: 0.0001
      
      # Stress spread: 0.5% (widened)
      # Source: Observed spread expansion during flash crash
      stress_spread: 0.005
      
      # Inventory limit before withdrawal
      # Source: Kirilenko et al. (2017) - HFT risk limits
      inventory_limit: 1000
      
      # Withdrawal threshold: 2% price change
      # Source: Empirical HFT withdrawal patterns
      withdrawal_threshold: 0.02

hft_market_maker_2:
  name: "HFT Market Maker 2"
  class: "examples.FlashCrash2010.Rule.players:HFTMarketMaker"
  num_instances: 1
  config:
    identity: "hft_mm_2"
    role: player
    extras:
      initial_cash: 1000000.00
      initial_position: 0
      normal_spread: 0.0001
      stress_spread: 0.005
      inventory_limit: 1000
      withdrawal_threshold: 0.02

hft_market_maker_3:
  name: "HFT Market Maker 3"
  class: "examples.FlashCrash2010.Rule.players:HFTMarketMaker"
  num_instances: 1
  config:
    identity: "hft_mm_3"
    role: player
    extras:
      initial_cash: 1000000.00
      initial_position: 0
      normal_spread: 0.0001
      stress_spread: 0.005
