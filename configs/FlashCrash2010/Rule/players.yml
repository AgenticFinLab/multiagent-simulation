rule_noise_trader:
  name: "NoiseTrader"
  class: "examples.FlashCrash2010.Rule.players:NoiseTrader"
  num_instances: 2
  config:
    identity: "rule_noise_trader"
    role: player
    steps_per_turn: 1
    group_tags:
