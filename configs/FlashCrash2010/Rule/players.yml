momentum_chaser_1:
  name: "Momentum Chaser 1"
  class: "examples.FlashCrash2010.Rule.players:MomentumChaser"
  num_instances: 1
  config:
    identity: "mom_chaser_1"
    role: player
    extras:
      initial_cash: 500000.00
      initial_position: 0
      
      # Lookback window for velocity calculation
      # Source: Typical HFT signal windows
      lookback_window: 10
      
      # Entry threshold: 0.1% move
      # Source: Calibrated to capture meaningful trends
      entry_threshold: 0.001
      
      # Position size multiplier
      # Source: Proportional to signal strength
      position_multiplier: 10000

