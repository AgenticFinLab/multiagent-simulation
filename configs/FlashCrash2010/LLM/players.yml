# FlashCrash2010 LLM Agent Configuration

market:
  name: "Market"
  class: "examples.FlashCrash2010.LLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/FlashCrash2010/LLM/records"
      initial_price: 40.0
      fundamental_value: 40.0
      base_depth: 10000
      price_impact: 0.05
      mean_reversion: 0.02
      noise_std: 0.01
      custom_state_hot_limit: 3
  persona: !include persona.yml

hftmarketmaker:
  name: "HFTMarketMaker"
  class: "examples.FlashCrash2010.LLM.players:LLMHFTMarketMaker"
  num_instances: 3
  config:
    identity: "hftmarketmaker"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/FlashCrash2010/LLM/records"
      initial_cash: 1000000.0
      initial_position: 0
      initial_price: 40.0
      fundamental_value: 40.0
      normal_spread: 0.0001
      stress_spread: 0.005
      inventory_limit: 1000
      withdrawal_threshold: 0.02
      mm_qty: 500
      custom_state_hot_limit: 3
      llm:
        sys_message: "examples.FlashCrash2010.LLM.prompts:LLM_HFT_MARKET_MAKER_SYS"
        user_message: "examples.FlashCrash2010.LLM.prompts:LLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.4
          max_tokens: 512
  persona: !include persona.yml

momentumchaser:
  name: "MomentumChaser"
  class: "examples.FlashCrash2010.LLM.players:LLMMomentumChaser"
  num_instances: 2
  config:
    identity: "momentumchaser"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/FlashCrash2010/LLM/records"
      initial_cash: 500000.0
      initial_position: 0
      initial_price: 40.0
      fundamental_value: 40.0
      entry_threshold: 0.001
      position_multiplier: 10000
      max_size: 1000
      custom_state_hot_limit: 3
      llm:
        sys_message: "examples.FlashCrash2010.LLM.prompts:LLM_MOMENTUM_CHASER_SYS"
        user_message: "examples.FlashCrash2010.LLM.prompts:LLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.8
          max_tokens: 512
  persona: !include persona.yml

