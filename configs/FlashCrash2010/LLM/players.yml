# FlashCrash2010 LLM Agent Configuration

market:
  archetype: stock-standard-price-impact  # -> AGENT_POOL/market/stock-standard-price-impact.md
  name: "Market"
  class: "examples.FlashCrash2010.LLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/FlashCrash2010/LLM/records"  # Source: AGENT_POOL/finance/market.md §6
      initial_price: 40.0  # Source: AGENT_POOL/finance/market.md §6
      fundamental_value: 40.0  # Source: AGENT_POOL/finance/market.md §6
      base_depth: 10000  # Source: AGENT_POOL/finance/market.md §6
      price_impact: 0.05  # Source: AGENT_POOL/finance/market.md §6
      mean_reversion: 0.02  # Source: AGENT_POOL/finance/market.md §6
      noise_std: 0.01  # Source: AGENT_POOL/finance/market.md §6
      custom_state_hot_limit: 3  # Source: AGENT_POOL/finance/market.md §6
  persona: !include persona.yml

llm_hft_market_maker:
  name: "HFTMarketMaker"
  class: "examples.FlashCrash2010.LLM.players:LLMHFTMarketMaker"
  num_instances: 3
  config:
    identity: "llm_hft_market_maker"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/FlashCrash2010/LLM/records"  # Source: AGENT_POOL/finance/llm-hft-market-maker.md §6
      initial_cash: 1000000.0  # Source: AGENT_POOL/finance/llm-hft-market-maker.md §6
      initial_position: 0  # Source: AGENT_POOL/finance/llm-hft-market-maker.md §6
      initial_price: 40.0  # Source: AGENT_POOL/finance/llm-hft-market-maker.md §6
      fundamental_value: 40.0  # Source: AGENT_POOL/finance/llm-hft-market-maker.md §6
      normal_spread: 0.0001  # Source: AGENT_POOL/finance/llm-hft-market-maker.md §6
      stress_spread: 0.005  # Source: AGENT_POOL/finance/llm-hft-market-maker.md §6
      inventory_limit: 1000  # Source: AGENT_POOL/finance/llm-hft-market-maker.md §6
      withdrawal_threshold: 0.02  # Source: AGENT_POOL/finance/llm-hft-market-maker.md §6
      mm_qty: 500  # Source: AGENT_POOL/finance/llm-hft-market-maker.md §6
      custom_state_hot_limit: 3  # Source: AGENT_POOL/finance/llm-hft-market-maker.md §6
      llm:
        sys_message: "examples.FlashCrash2010.LLM.prompts:LLM_HFT_MARKET_MAKER_SYS"
        user_message: "examples.FlashCrash2010.LLM.prompts:LLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.4
          max_tokens: 512
  persona: !include persona.yml

