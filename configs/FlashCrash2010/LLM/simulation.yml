# FlashCrash2010 LLM Simulation Configuration
# 
# This simulation models the May 6, 2010 flash crash event with LLM-driven agents.
# Based on Kirilenko et al. (2017) findings about HFT behavior.
#
# Usage:
#   python examples/FlashCrash2010/LLM/run_flashcrash2010_llm.py \
#       -c configs/FlashCrash2010/LLM/simulation.yml

setting:
  name: "FlashCrash2010-LLM"
  description: "2010 Flash Crash simulation with LLM-driven HFT market makers, momentum chasers, fundamental traders, stop-loss traders, and noise traders."
  total_rounds: 200
  
  record_path: "EXPERIMENT/FlashCrash2010/LLM/records"
  storage_path: "EXPERIMENT/FlashCrash2010/LLM/communication"
  
  log_level: "INFO"
  log_to_file: true
  log_path: "EXPERIMENT/FlashCrash2010/LLM/logs"

environment:
  dotenv_path: ".env"
  workspace: "."

llm:
  model: "doubao-pro-32k"
  temperature: 0.3
  max_tokens: 500
  timeout: 30

ray:
  namespace: "flashcrash2010_llm"
  ignore_reinit_error: true
  object_store_memory: 536870912
  num_cpus: 4

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/FlashCrash2010/LLM/communication"
  record_messages: true
  message_timeout_ms: 30000
  max_retries: 3
