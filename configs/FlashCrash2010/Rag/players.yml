# FlashCrash2010 Rag Agent Configuration

knowledge:
  backend: "local"
  global_uri: "examples/document-sources"
  resource_csv:
    - "examples/document-sources/books.csv"
    - "examples/document-sources/source"
  preprocessing:
    parser: "mineru"
    output_position: "MinerU_processed"
  rag:
    output_position: "rag_index"
    embed_type: "litellm"
    embed_model: "openai/hunyuan-embedding"
    embed_api_key: "{{ HUNYUAN_API_KEY }}"
    embed_api_base: "https://api.hunyuan.cloud.tencent.com/v1"
    chunk_size: 512
    chunk_overlap: 64
    top_k: 5

market:
  archetype: stock-standard-price-impact  # -> masim/agents/defines/market/stock-standard-price-impact.md
  name: "Market"
  class: "examples.FlashCrash2010.Rag.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/FlashCrash2010/Rag/records"  # Source: masim/agents/defines/finance/market.md §6
      initial_price: 40.0  # Source: masim/agents/defines/finance/market.md §6
      fundamental_value: 40.0  # Source: masim/agents/defines/finance/market.md §6
      base_depth: 10000  # Source: masim/agents/defines/finance/market.md §6
      price_impact: 0.05  # Source: masim/agents/defines/finance/market.md §6
      mean_reversion: 0.02  # Source: masim/agents/defines/finance/market.md §6
      noise_std: 0.01  # Source: masim/agents/defines/finance/market.md §6
      custom_state_hot_limit: 3  # Source: masim/agents/defines/finance/market.md §6
  persona: !include persona.yml

ragllm_hft_market_maker:
  name: "HFTMarketMaker"
  class: "examples.FlashCrash2010.Rag.players:RagLLMHFTMarketMaker"
  num_instances: 3
  config:
    identity: "ragllm_hft_market_maker"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/FlashCrash2010/Rag/records"  # Source: masim/agents/defines/finance/ragllm-hft-market-maker.md §6
      initial_cash: 1000000.0  # Source: masim/agents/defines/finance/ragllm-hft-market-maker.md §6
      initial_position: 0  # Source: masim/agents/defines/finance/ragllm-hft-market-maker.md §6
      initial_price: 40.0  # Source: masim/agents/defines/finance/ragllm-hft-market-maker.md §6
      fundamental_value: 40.0  # Source: masim/agents/defines/finance/ragllm-hft-market-maker.md §6
      normal_spread: 0.0001  # Source: masim/agents/defines/finance/ragllm-hft-market-maker.md §6
      stress_spread: 0.005  # Source: masim/agents/defines/finance/ragllm-hft-market-maker.md §6
      inventory_limit: 1000  # Source: masim/agents/defines/finance/ragllm-hft-market-maker.md §6
      withdrawal_threshold: 0.02  # Source: masim/agents/defines/finance/ragllm-hft-market-maker.md §6
      mm_qty: 500  # Source: masim/agents/defines/finance/ragllm-hft-market-maker.md §6
      custom_state_hot_limit: 3  # Source: masim/agents/defines/finance/ragllm-hft-market-maker.md §6
      llm:
        sys_message: "examples.FlashCrash2010.Rag.prompts:RAGLLM_HFT_MARKET_MAKER_SYS"
        user_message: "examples.FlashCrash2010.Rag.prompts:RAG_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.4
          max_tokens: 512
      private_knowledge:
        from_global_resources:
          - "MinerU_processed"
        local_resources:
          local_uri: ""
          local_resources: []
        rag:
          from_global_index_dir:
            - "rag_index"
          local_index_dir: ""
          embed_type: "litellm"
          embed_model: "openai/hunyuan-embedding"
          embed_api_key: "{{ HUNYUAN_API_KEY }}"
          embed_api_base: "https://api.hunyuan.cloud.tencent.com/v1"
          chunk_size: 512
          chunk_overlap: 64
          top_k: 5
  persona: !include persona.yml

