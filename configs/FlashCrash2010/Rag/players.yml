# FlashCrash2010 Rag Agent Configuration

knowledge:
  backend: "local"
  global_uri: "examples/document-sources"
  resource_csv:
    - "examples/document-sources/books.csv"
    - "examples/document-sources/source"
  preprocessing:
    parser: "mineru"
    output_position: "MinerU_processed"
  rag:
    output_position: "rag_index"
    embed_type: "litellm"
    embed_model: "openai/hunyuan-embedding"
    embed_api_key: "{{ HUNYUAN_API_KEY }}"
    embed_api_base: "https://api.hunyuan.cloud.tencent.com/v1"
    chunk_size: 512
    chunk_overlap: 64
    top_k: 5

market:
  name: "Market"
  class: "examples.FlashCrash2010.Rag.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/FlashCrash2010/Rag/records"
      initial_price: 40.0
      fundamental_value: 40.0
      base_depth: 10000
      price_impact: 0.05
      mean_reversion: 0.02
      noise_std: 0.01
      custom_state_hot_limit: 3
  persona: !include persona.yml

hftmarketmaker:
  name: "HFTMarketMaker"
  class: "examples.FlashCrash2010.Rag.players:RagLLMHFTMarketMaker"
  num_instances: 3
  config:
    identity: "hftmarketmaker"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/FlashCrash2010/Rag/records"
      initial_cash: 1000000.0
      initial_position: 0
      initial_price: 40.0
      fundamental_value: 40.0
      normal_spread: 0.0001
      stress_spread: 0.005
      inventory_limit: 1000
      withdrawal_threshold: 0.02
      mm_qty: 500
      custom_state_hot_limit: 3
      llm:
        sys_message: "examples.FlashCrash2010.Rag.prompts:RAG_HFT_MARKET_MAKER_SYS"
        user_message: "examples.FlashCrash2010.Rag.prompts:RAG_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-1-6-lite-250115"
        generation_config:
          temperature: 0.4
          max_tokens: 512
      private_knowledge:
        from_global_resources:
          - "MinerU_processed"
        local_resources:
          local_uri: ""
          local_resources: []
        rag:
          from_global_index_dir:
            - "rag_index"
          local_index_dir: ""
          embed_type: "litellm"
          embed_model: "openai/hunyuan-embedding"
          embed_api_key: "{{ HUNYUAN_API_KEY }}"
          embed_api_base: "https://api.hunyuan.cloud.tencent.com/v1"
          chunk_size: 512
          chunk_overlap: 64
          top_k: 5
  persona: !include persona.yml

