# FlashCrash2010 Rag Simulation Configuration

setting:
  name: "flash_crash_2010_rag_simulation"
  description: "2010 Flash Crash: RAG-augmented LLM HFT withdrawal, momentum feedback, stop-loss cascades"
  total_rounds: 200
  round_history_limit: 3
  record_path: "EXPERIMENT/FlashCrash2010/Rag/records"
  save_diagram_interval: 50

environment:
  dotenv_path: .env
  workspace: "."

ray:
  address: null
  namespace: "flash_crash_2010_rag"
  actor_prefix: null
  num_cpus: null
  num_gpus: null
  object_store_memory: 134217728
  include_dashboard: false
  logging_level: "warning"
  log_to_driver: false
  actor_options:
    max_restarts: 3
    max_task_retries: 1
    max_concurrency: 4
  runtime_env:
    working_dir: null
    pip: []
    env_vars: {}
  serialization:
    use_arrow: true
    register_custom_serializers: true

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/FlashCrash2010/Rag/communication"
  record_messages: true
  message_block_size: 500
