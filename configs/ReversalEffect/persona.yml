# =============================================================================
# ReversalEffect Persona Configuration
# =============================================================================

auto_checkpoint: false
debug_mode: true

proxy:
  storage:
    checkpoint_dir: "EXPERIMENT/ReversalEffect/checkpoints"
    record_path: "EXPERIMENT/ReversalEffect/records"
    record_rounds: true

  monitoring:
    record_path: "EXPERIMENT/ReversalEffect/monitoring"
    entry_limit: 100

  communication:
    message_timeout_ms: 5000
    enable_compression: true

  resource:
    mcp_servers: []
    enable_caching: false
