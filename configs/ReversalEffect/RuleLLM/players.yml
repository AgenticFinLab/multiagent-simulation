# =============================================================================
# ReversalEffectLLM Players Configuration
# =============================================================================

market:
  archetype: stock-standard-price-impact  # -> masim/agents/defines/market/stock-standard-price-impact.md
  name: "Market with Mean Reversion"
  class: "examples.ReversalEffect.RuleLLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/ReversalEffectRuleLLM/records"  # Source: masim/agents/defines/finance/market.md §6
      fundamental_value: 100.0  # Source: masim/agents/defines/finance/market.md §6
      initial_price: 100.0  # Source: masim/agents/defines/finance/market.md §6
      base_price_impact: 0.08  # Source: masim/agents/defines/finance/market.md §6
      mean_reversion: 0.01  # Source: masim/agents/defines/finance/market.md §6
      noise_std: 0.5  # Source: masim/agents/defines/finance/market.md §6
      custom_state_hot_limit: 3  # Source: masim/agents/defines/finance/market.md §6
      base_liquidity: 50.0  # Source: masim/agents/defines/finance/market.md §6
      high_impact_multiplier: 3.0  # Source: masim/agents/defines/finance/market.md §6
      low_liquidity_threshold: 30.0  # Source: masim/agents/defines/finance/market.md §6
  persona: !include persona.yml

rulellm_contrarian_investor:
  name: "RuleLLM Contrarian Investor"
  class: "examples.ReversalEffect.RuleLLM.players:RuleLLMContrarianInvestor"
  # Expander → rulellm_contrarian_1, rulellm_contrarian_2, rulellm_contrarian_3
  num_instances: 3
  config:
    identity: "rulellm_contrarian_investor"
    role: player
    steps_per_turn: 1
    group_tags:
      - rulellm_investors
    extras:
      record_path: "EXPERIMENT/ReversalEffectRuleLLM/records"  # Source: masim/agents/defines/finance/contrarian-investor.md §6
      initial_cash: 10000.0  # Source: masim/agents/defines/finance/contrarian-investor.md §6
      initial_position: 50.0  # Source: masim/agents/defines/finance/contrarian-investor.md §6
      custom_state_hot_limit: 3  # Source: masim/agents/defines/finance/contrarian-investor.md §6
      llm:
        sys_message: "examples.ReversalEffect.RuleLLM.prompts:RULELLM_CONTRARIAN_INVESTOR_SYS"  # Source: masim/agents/defines/finance/contrarian-investor.md §6
        user_message: "examples.ReversalEffect.RuleLLM.prompts:RULELLM_USER_TEMPLATE"  # Source: masim/agents/defines/finance/contrarian-investor.md §6
        lm_type: "api"  # Source: masim/agents/defines/finance/contrarian-investor.md §6
        lm_name: "ark/doubao-seed-2-0-mini-260428"  # Source: masim/agents/defines/finance/contrarian-investor.md §6
        generation_config:
          temperature: 0.3  # Source: masim/agents/defines/finance/contrarian-investor.md §6
          max_new_tokens: 500  # Source: masim/agents/defines/finance/contrarian-investor.md §6
  persona: !include persona.yml

