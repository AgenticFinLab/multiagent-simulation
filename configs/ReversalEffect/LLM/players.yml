# =============================================================================
# ReversalEffectLLM Players Configuration
# =============================================================================

market:
  name: "Market with Mean Reversion"
  class: "examples.ReversalEffect.LLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/ReversalEffectLLM/records"  # Source: AGENT_POOL/finance/market.md §6
      fundamental_value: 100.0  # Source: AGENT_POOL/finance/market.md §6
      initial_price: 100.0  # Source: AGENT_POOL/finance/market.md §6
      price_impact: 0.08  # Source: AGENT_POOL/finance/market.md §6
      mean_reversion: 0.01  # Source: AGENT_POOL/finance/market.md §6
      noise_std: 0.5  # Source: AGENT_POOL/finance/market.md §6
      custom_state_hot_limit: 3  # Source: AGENT_POOL/finance/market.md §6
  persona: !include persona.yml

llm_contrarian_investor:
  name: "LLM Contrarian Investor"
  class: "examples.ReversalEffect.LLM.players:LLMContrarianInvestor"
  # Expander → llm_contrarian_1, llm_contrarian_2, llm_contrarian_3
  num_instances: 3
  config:
    identity: "llm_contrarian_investor"
    role: player
    steps_per_turn: 1
    group_tags:
      - llm_investors
    extras:
      record_path: "EXPERIMENT/ReversalEffectLLM/records"  # Source: AGENT_POOL/finance/contrarian-investor.md §6
      initial_cash: 10000.0  # Source: AGENT_POOL/finance/contrarian-investor.md §6
      initial_position: 50.0  # Source: AGENT_POOL/finance/contrarian-investor.md §6
      custom_state_hot_limit: 3  # Source: AGENT_POOL/finance/contrarian-investor.md §6
      llm:
        sys_message: "examples.ReversalEffect.LLM.prompts:LLM_CONTRARIAN_SYS"  # Source: AGENT_POOL/finance/contrarian-investor.md §6
        user_message: "examples.ReversalEffect.LLM.prompts:LLM_USER_TEMPLATE"  # Source: AGENT_POOL/finance/contrarian-investor.md §6
        lm_type: "api"  # Source: AGENT_POOL/finance/contrarian-investor.md §6
        lm_name: "ark/doubao-seed-2-0-mini-260428"  # Source: AGENT_POOL/finance/contrarian-investor.md §6
        generation_config:
          temperature: 0.3  # Source: AGENT_POOL/finance/contrarian-investor.md §6
          max_new_tokens: 500  # Source: AGENT_POOL/finance/contrarian-investor.md §6
  persona: !include persona.yml

