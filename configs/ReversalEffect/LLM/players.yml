# =============================================================================
# ReversalEffectLLM Players Configuration
# =============================================================================

market:
  name: "Market with Mean Reversion"
  class: "examples.ReversalEffect.LLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/ReversalEffectLLM/records"
      fundamental_value: 100.0
      initial_price: 100.0
      price_impact: 0.08
      mean_reversion: 0.01
      noise_std: 0.5
      custom_state_hot_limit: 3
  persona: !include persona.yml

llm_contrarian:
  name: "LLM Contrarian Investor"
  class: "examples.ReversalEffect.LLM.players:LLMContrarianInvestor"
  # Expander → llm_contrarian_1, llm_contrarian_2, llm_contrarian_3
  num_instances: 3
  config:
    identity: "llm_contrarian"
    role: player
    steps_per_turn: 1
    group_tags:
      - llm_investors
    extras:
      record_path: "EXPERIMENT/ReversalEffectLLM/records"
      initial_cash: 10000.0
      initial_position: 50.0
      custom_state_hot_limit: 3
      llm:
        sys_message: "examples.ReversalEffect.LLM.prompts:LLM_CONTRARIAN_SYS"
        user_message: "examples.ReversalEffect.LLM.prompts:LLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-1-6-251015"
        generation_config:
          temperature: 0.3
          max_new_tokens: 500
  persona: !include persona.yml

