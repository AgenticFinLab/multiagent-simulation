# =============================================================================
# ReversalEffect Simulation Configuration
# =============================================================================
# Demonstrates the reversal effect (De Bondt & Thaler, 1985):
# - Past losers outperform past winners over long horizons
# - Market overreaction followed by mean reversion
# =============================================================================

setting:
  name: "reversal_effect_simulation"
  description: "Long-term mean reversion and overreaction correction"
  total_rounds: 500
  round_history_limit: 3
  record_path: "EXPERIMENT/ReversalEffect/records"
  save_diagram_interval: 100

environment:
  dotenv_path: .env
  workspace: "."

ray:
  address: null
  namespace: "reversal_effect"
  actor_prefix: null
  # Derived: 9 investors run parallel at level 1; +1 for OS/driver = 10
  num_cpus: 10
  num_gpus: null
  # Derived: 10 players, star topology -> 18 msgs/round
  #   10 TurnResult + 10 pending_info + 18 Message = 38 Ray objects
  #   38 obj x 64 KB min-alloc = 2432 KB (2.38 MB)
  #   10x headroom = 23.8 MB; 128 MB minimum floor -> 134217728 bytes
  object_store_memory: 134217728
  include_dashboard: false
  logging_level: "warning"
  log_to_driver: false
  actor_options:
    max_restarts: 3
    max_task_retries: 1
    max_concurrency: 4
  runtime_env:
    working_dir: null
    pip: []
    env_vars: {}
  serialization:
    use_arrow: true
    register_custom_serializers: true

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/ReversalEffect/communication"
  record_messages: true
  message_block_size: 500
