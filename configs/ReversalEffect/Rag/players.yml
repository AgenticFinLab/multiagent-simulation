# =============================================================================
# ReversalEffectLLM Players Configuration
# =============================================================================

# =============================================================================
# Shared Knowledge Configuration
# =============================================================================
knowledge:
  backend: "local"
  global_uri: "examples/document-sources"
  resource_csv:
    - "examples/document-sources/books.csv"
    - "examples/document-sources/source"
  preprocessing:
    parser: "mineru"
    timeout_per_page: 30
    max_pages: 250
    output_position: "MinerU_processed"
  rag:
    output_position: "rag_index"
    embed_type: "litellm"
    embed_model: "openai/hunyuan-embedding"
    embed_api_key: "{{ HUNYUAN_API_KEY }}"
    embed_api_base: "https://api.hunyuan.cloud.tencent.com/v1"
    chunk_size: 512
    chunk_overlap: 64

market:
  archetype: stock-standard-price-impact  # -> masim/agents/defines/market/stock-standard-price-impact.md
  name: "Market with Mean Reversion"
  class: "examples.ReversalEffect.Rag.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/ReversalEffectRag/records"  # Source: masim/agents/defines/finance/market.md §6
      fundamental_value: 100.0  # Source: masim/agents/defines/finance/market.md §6
      initial_price: 100.0  # Source: masim/agents/defines/finance/market.md §6
      base_price_impact: 0.08  # Source: masim/agents/defines/finance/market.md §6
      mean_reversion: 0.01  # Source: masim/agents/defines/finance/market.md §6
      noise_std: 0.5  # Source: masim/agents/defines/finance/market.md §6
      custom_state_hot_limit: 3  # Source: masim/agents/defines/finance/market.md §6
      base_liquidity: 50.0  # Source: masim/agents/defines/finance/market.md §6
      high_impact_multiplier: 3.0  # Source: masim/agents/defines/finance/market.md §6
      low_liquidity_threshold: 30.0  # Source: masim/agents/defines/finance/market.md §6
  persona: !include persona.yml

ragllm_contrarian_investor:
  name: "RAG Contrarian Investor"
  class: "examples.ReversalEffect.Rag.players:RagLLMContrarianInvestor"
  # Expander → ragllm_contrarian_1, ragllm_contrarian_2, ragllm_contrarian_3
  num_instances: 3
  config:
    identity: "ragllm_contrarian_investor"
    role: player
    steps_per_turn: 1
    group_tags:
      - ragllm_investors
    extras:
      record_path: "EXPERIMENT/ReversalEffectRag/records"  # Source: masim/agents/defines/finance/contrarian-investor.md §6
      initial_cash: 10000.0  # Source: masim/agents/defines/finance/contrarian-investor.md §6
      initial_position: 50.0  # Source: masim/agents/defines/finance/contrarian-investor.md §6
      custom_state_hot_limit: 3  # Source: masim/agents/defines/finance/contrarian-investor.md §6
      private_knowledge:
        from_global_resources:
          - "MinerU_processed"  # Source: masim/agents/defines/finance/contrarian-investor.md §6
        local_resources:
          local_uri: ""  # Source: masim/agents/defines/finance/contrarian-investor.md §6
          local_resources: []  # Source: masim/agents/defines/finance/contrarian-investor.md §6
        rag:
          from_global_index_dir:
            - "rag_index"  # Source: masim/agents/defines/finance/contrarian-investor.md §6
          local_index_dir: ""  # Source: masim/agents/defines/finance/contrarian-investor.md §6
          embed_type: "litellm"  # Source: masim/agents/defines/finance/contrarian-investor.md §6
          embed_model: "openai/hunyuan-embedding"  # Source: masim/agents/defines/finance/contrarian-investor.md §6
          embed_api_key: "{{ HUNYUAN_API_KEY }}"  # Source: masim/agents/defines/finance/contrarian-investor.md §6
          embed_api_base: "https://api.hunyuan.cloud.tencent.com/v1"  # Source: masim/agents/defines/finance/contrarian-investor.md §6
          chunk_size: 512  # Source: masim/agents/defines/finance/contrarian-investor.md §6
          chunk_overlap: 64  # Source: masim/agents/defines/finance/contrarian-investor.md §6
          top_k: 5  # Source: masim/agents/defines/finance/contrarian-investor.md §6
      llm:
        sys_message: "examples.ReversalEffect.Rag.prompts:RAGLLM_CONTRARIAN_INVESTOR_SYS"  # Source: masim/agents/defines/finance/contrarian-investor.md §6
        user_message: "examples.ReversalEffect.Rag.prompts:RAGLLM_USER_TEMPLATE"  # Source: masim/agents/defines/finance/contrarian-investor.md §6
        lm_type: "api"  # Source: masim/agents/defines/finance/contrarian-investor.md §6
        lm_name: "ark/doubao-seed-2-0-mini-260428"  # Source: masim/agents/defines/finance/contrarian-investor.md §6
        generation_config:
          temperature: 0.3  # Source: masim/agents/defines/finance/contrarian-investor.md §6
          max_new_tokens: 600  # Source: masim/agents/defines/finance/contrarian-investor.md §6
  persona: !include persona.yml

