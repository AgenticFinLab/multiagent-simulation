# =============================================================================
# ReversalEffectLLM Players Configuration
# =============================================================================

# =============================================================================
# Shared Knowledge Configuration
# =============================================================================
knowledge:
  backend: "local"
  global_uri: "examples/document-sources"
  resource_csv:
    - "examples/document-sources/books.csv"
    - "examples/document-sources/source"
  preprocessing:
    parser: "mineru"
    timeout_per_page: 30
    max_pages: 250
    output_position: "MinerU_processed"
  rag:
    output_position: "rag_index"
    embed_type: "litellm"
    embed_model: "openai/hunyuan-embedding"
    embed_api_key: "{{ HUNYUAN_API_KEY }}"
    embed_api_base: "https://api.hunyuan.cloud.tencent.com/v1"
    chunk_size: 512
    chunk_overlap: 64

market:
  name: "Market with Mean Reversion"
  class: "examples.ReversalEffect.Rag.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/ReversalEffectRag/records"
      fundamental_value: 100.0
      initial_price: 100.0
      base_price_impact: 0.08
      mean_reversion: 0.01
      noise_std: 0.5
      custom_state_hot_limit: 3
      base_liquidity: 50.0
      high_impact_multiplier: 3.0
      low_liquidity_threshold: 30.0
  persona: !include persona.yml

ragllm_contrarian:
  name: "RAG Contrarian Investor"
  class: "examples.ReversalEffect.Rag.players:RagLLMContrarianInvestor"
  # Expander → ragllm_contrarian_1, ragllm_contrarian_2, ragllm_contrarian_3
  num_instances: 3
  config:
    identity: "ragllm_contrarian"
    role: player
    steps_per_turn: 1
    group_tags:
      - ragllm_investors
    extras:
      record_path: "EXPERIMENT/ReversalEffectRag/records"
      initial_cash: 10000.0
      initial_position: 50.0
      custom_state_hot_limit: 3
      private_knowledge:
        from_global_resources:
          - "MinerU_processed"
        local_resources:
          local_uri: ""
          local_resources: []
        rag:
          from_global_index_dir:
            - "rag_index"
          local_index_dir: ""
          embed_type: "litellm"
          embed_model: "openai/hunyuan-embedding"
          embed_api_key: "{{ HUNYUAN_API_KEY }}"
          embed_api_base: "https://api.hunyuan.cloud.tencent.com/v1"
          chunk_size: 512
          chunk_overlap: 64
          top_k: 5
      llm:
        sys_message: "examples.ReversalEffect.Rag.prompts:RAGLLM_CONTRARIAN_INVESTOR_SYS"
        user_message: "examples.ReversalEffect.Rag.prompts:RAGLLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.3
          max_new_tokens: 600
  persona: !include persona.yml

