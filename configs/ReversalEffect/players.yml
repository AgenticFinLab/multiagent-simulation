# =============================================================================
# ReversalEffect Players Configuration
# =============================================================================
# De Bondt & Thaler (1985) Overreaction Hypothesis
#
# Investor Types:
#   - ContrarianInvestor: Buys losers, sells winners (KEY reversal driver)
#   - MomentumInvestor: Short-term trend following (creates overreaction)
#   - OverconfidentTrader: Overreacts to news (causes initial overshoot)
#   - NoiseTrader: Random liquidity
#   - ValueInvestor: Slow fundamental investor
#   - IndexTracker: Passive benchmark
# =============================================================================

market:
  name: "Market"
  class: "examples.ReversalEffect.players:Market"
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/ReversalEffect/records"
      # Market parameters
      fundamental_value: 100.0
      initial_price: 100.0
      price_impact: 0.08
      mean_reversion: 0.01         # Slow reversion to fundamental
      noise_std: 0.5
      custom_state_hot_limit: 3
  persona: !include persona.yml

contrarian_1:
  name: "Contrarian Investor 1"
  class: "examples.ReversalEffect.players:ContrarianInvestor"
  config:
    identity: "contrarian_1"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/ReversalEffect/records"
      # Base investor parameters
      initial_cash: 10000.0
      initial_position: 0.0
      custom_state_hot_limit: 3
      # Contrarian specific (long-term reversal)
      lookback_window: 30          # Long-term horizon
      reversal_threshold: 0.15     # 15% deviation triggers trade
      base_position_size: 25.0
      value_sensitivity: 0.6
  persona: !include persona.yml

contrarian_2:
  name: "Contrarian Investor 2"
  class: "examples.ReversalEffect.players:ContrarianInvestor"
  config:
    identity: "contrarian_2"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/ReversalEffect/records"
      initial_cash: 10000.0
      initial_position: 0.0
      custom_state_hot_limit: 3
      lookback_window: 30
      reversal_threshold: 0.15
      base_position_size: 25.0
      value_sensitivity: 0.6
  persona: !include persona.yml

momentum_1:
  name: "Momentum Investor 1"
