# =============================================================================
# ReversalEffect Players Configuration
# =============================================================================
# De Bondt & Thaler (1985) Overreaction Hypothesis
# =============================================================================

market:
  name: "Market"
  class: "examples.ReversalEffect.players:Market"
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/ReversalEffect/records"
  persona: !include persona.yml

