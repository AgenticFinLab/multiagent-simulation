# LTCMCollapse Rag Agent Configuration

market:
  name: "Market"
  class: "examples.LTCMCollapse.Rag.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    extras:
      initial_price: 100.0
      fundamental_value: 100.0
      price_impact: 0.04
      mean_reversion: 0.005
      noise_std: 0.02

convergence_arbitrageur_1:
  name: "ConvergenceArbitrageur 1"
  class: "examples.LTCMCollapse.Rag.players:LLMConvergenceArbitrageur"
  num_instances: 2
  config:
    identity: "convergence_arbitrageur_1"
    role: player
    extras:
      initial_cash: 1000000.00
      initial_position: 0
      agent_type: "convergence_arbitrageur"
      llm:
        model: "doubao-pro-32k"


