# LTCMCollapse Rag Agent Configuration

knowledge:
  backend: "local"
  global_uri: "examples/document-sources"
  resource_csv:
    - "examples/document-sources/books.csv"
    - "examples/document-sources/source"
  preprocessing:
    parser: "mineru"
    output_position: "MinerU_processed"
  rag:
    output_position: "rag_index"
    embed_type: "litellm"
    embed_model: "openai/hunyuan-embedding"
    embed_api_key: "{{ HUNYUAN_API_KEY }}"
    embed_api_base: "https://api.hunyuan.cloud.tencent.com/v1"
    chunk_size: 512
    chunk_overlap: 64
    top_k: 5

market:
  archetype: bond-yield-spread-inverse  # -> masim/agents/defines/market/bond-yield-spread-inverse.md
  name: "Market"
  class: "examples.LTCMCollapse.Rag.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      # Source: target §10.2 runtime-output contract
      record_path: "EXPERIMENT/LTCMCollapse/Rag/records"
      # Source: target §9 / simulation-bases.md §4.N.6
      initial_price: 100.0
      # Source: target §9 / simulation-bases.md §4.N.6
      fundamental_value: 100.0
      # Source: target §9 / simulation-bases.md §4.N.6
      price_impact: 0.03
      # Source: target §9 / simulation-bases.md §4.N.6
      mean_reversion: 0.01
      # Source: target §9 / simulation-bases.md §4.N.6
      noise_std: 0.015
      # Source: target §9 / normalized order-flow calibration
      market_depth: 100.0
      # Source: target §9 / reproducibility invariant
      random_seed: 20260720
      # Source: target §9 / numerical invariant
      price_floor: 0.01
      # Source: target §9 / controlled identification stimulus
      shock_schedule:
        20: -0.06
        21: -0.05
        22: -0.04
        23: -0.03
      # Source: target §10.2 runtime-output contract
      custom_state_hot_limit: 3
  persona: !include persona.yml

ragllm_convergence_arbitrageur:
  name: "ConvergenceArbitrageur"
  class: "examples.LTCMCollapse.Rag.players:RagLLMConvergenceArbitrageur"
  num_instances: 2
  config:
    identity: "ragllm_convergence_arbitrageur"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      # Source: target §10.2 runtime-output contract
      record_path: "EXPERIMENT/LTCMCollapse/Rag/records"
      # Source: target §9 / simulation-bases.md §4.N.6
      initial_cash: 2000000.0
      # Source: target §9 / simulation-bases.md §4.N.6
      initial_position: 500
      # Source: target §9 / simulation-bases.md §4.N.6
      initial_price: 100.0
      # Source: target §9 / simulation-bases.md §4.N.6
      fundamental_value: 100.0
      # Source: target §9 / simulation-bases.md §4.N.6
      entry_spread: 0.03
      # Source: target §9 / simulation-bases.md §4.N.6
      leverage: 15
      # Source: target §9 / simulation-bases.md §4.N.6
      max_position: 5000
      # Source: target §9 / simulation-bases.md §4.N.6
      base_size: 400
      # Source: target §10.2 runtime-output contract
      custom_state_hot_limit: 3
      # Source: target §10.1 capability contract and target §9
      private_knowledge:
        from_global_resources:
          - "MinerU_processed"
        local_resources:
          local_uri: ""
          local_resources: []
        rag:
          from_global_index_dir:
            - "rag_index"
          local_index_dir: ""
          embed_type: "litellm"
          embed_model: "openai/hunyuan-embedding"
          embed_api_key: "{{ HUNYUAN_API_KEY }}"
          embed_api_base: "https://api.hunyuan.cloud.tencent.com/v1"
          chunk_size: 512
          chunk_overlap: 64
          top_k: 5
      # Source: target §10.1 capability contract and target §9
      llm:
        sys_message: "examples.LTCMCollapse.Rag.prompts:RAG_CONVERGENCEARBITRAGEUR_PROMPT"
        user_message: "examples.LTCMCollapse.Rag.prompts:RAG_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.3
          max_tokens: 600
  persona: !include persona.yml

