# LTCMCollapse LLM Communication Topology

graph:
  type: star
  center: market

connections:
  - from: market
    to:
      - convergence_arbitrageur_1_1
      - convergence_arbitrageur_1_2
      - leverage_trader_2_1
      - leverage_trader_2_2
      - risk_manager_3_1
      - risk_manager_3_2
      - liquidity_provider_4_1
      - central_bank_5_1
    bidirectional: false
    message_type: market_update

  - from: convergence_arbitrageur_1_1
    to: market
    bidirectional: false
    message_type: order
  - from: convergence_arbitrageur_1_2
    to: market
    bidirectional: false
    message_type: order
  - from: leverage_trader_2_1
    to: market
    bidirectional: false
    message_type: order
  - from: leverage_trader_2_2
    to: market
    bidirectional: false
    message_type: order
  - from: risk_manager_3_1
    to: market
    bidirectional: false
    message_type: order
  - from: risk_manager_3_2
    to: market
    bidirectional: false
    message_type: order
  - from: liquidity_provider_4_1
    to: market
    bidirectional: false
    message_type: order
  - from: central_bank_5_1
    to: market
    bidirectional: false
    message_type: order

broadcast:
  enabled: true
  from: market
  to: all_players
  message_type: market_update

execution:
  order:
    - market
    - convergence_arbitrageur_1_1
    - convergence_arbitrageur_1_2
    - leverage_trader_2_1
    - leverage_trader_2_2
    - risk_manager_3_1
    - risk_manager_3_2
    - liquidity_provider_4_1
    - central_bank_5_1
