# LTCMCollapse Rule Agent Configuration

market:
  name: "Market"
  class: "examples.LTCMCollapse.Rule.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    extras:
      initial_price: 100.0
      fundamental_value: 100.0
      price_impact: 0.04
      mean_reversion: 0.005
      noise_std: 0.02

convergence_arbitrageur_1:
  name: "ConvergenceArbitrageur 1"
  class: "examples.LTCMCollapse.Rule.players:ConvergenceArbitrageur"
  num_instances: 2
  config:
    identity: "convergence_arbitrageur_1"
    role: player
    extras:
      initial_cash: 1000000.00
      initial_position: 0

leverage_trader_2:
  name: "LeverageTrader 2"
  class: "examples.LTCMCollapse.Rule.players:LeverageTrader"
  num_instances: 2
  config:
    identity: "leverage_trader_2"
    role: player
    extras:
      initial_cash: 1000000.00
      initial_position: 0

risk_manager_3:
  name: "RiskManager 3"
  class: "examples.LTCMCollapse.Rule.players:RiskManager"
  num_instances: 2
  config:
    identity: "risk_manager_3"
    role: player
    extras:
      initial_cash: 1000000.00
      initial_position: 0

liquidity_provider_4:
  name: "LiquidityProvider 4"
  class: "examples.LTCMCollapse.Rule.players:LiquidityProvider"
  num_instances: 1
  config:
    identity: "liquidity_provider_4"
    role: player
    extras:
      initial_cash: 1000000.00
      initial_position: 0

central_bank_5:
  name: "CentralBank 5"
  class: "examples.LTCMCollapse.Rule.players:CentralBank"
  num_instances: 1
  config:
    identity: "central_bank_5"
    role: player
    extras:
      initial_cash: 1000000.00
      initial_position: 0

