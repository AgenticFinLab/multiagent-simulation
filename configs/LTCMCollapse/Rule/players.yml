# LTCMCollapse Rule Agent Configuration

market:
  archetype: bond-yield-spread-inverse  # -> AGENT_POOL/market/bond-yield-spread-inverse.md
  name: "Market"
  class: "examples.LTCMCollapse.Rule.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      # Source: target §10.2 runtime-output contract
      record_path: "EXPERIMENT/LTCMCollapse/Rule/records"
      # Source: target §9 / simulation-bases.md §4.N.6
      initial_price: 100.0
      # Source: target §9 / simulation-bases.md §4.N.6
      fundamental_value: 100.0
      # Source: target §9 / simulation-bases.md §4.N.6
      price_impact: 0.03
      # Source: target §9 / simulation-bases.md §4.N.6
      mean_reversion: 0.01
      # Source: target §9 / simulation-bases.md §4.N.6
      noise_std: 0.015
      # Source: target §9 / normalized order-flow calibration
      market_depth: 100.0
      # Source: target §9 / reproducibility invariant
      random_seed: 20260720
      # Source: target §9 / numerical invariant
      price_floor: 0.01
      # Source: target §9 / controlled identification stimulus
      shock_schedule:
        20: -0.06
        21: -0.05
        22: -0.04
        23: -0.03
      # Source: target §10.2 runtime-output contract
      custom_state_hot_limit: 3
  persona: !include persona.yml

