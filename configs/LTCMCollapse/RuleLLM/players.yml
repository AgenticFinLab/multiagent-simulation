# LTCMCollapse RuleLLM Agent Configuration

market:
  archetype: bond-yield-spread-inverse  # -> AGENT_POOL/market/bond-yield-spread-inverse.md
  name: "Market"
  class: "examples.LTCMCollapse.RuleLLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/LTCMCollapse/RuleLLM/records"  # Source: framework infrastructure
      initial_price: 100.0  # Source: simulation-bases.md §6
      fundamental_value: 100.0  # Source: simulation-bases.md §6
      price_impact: 0.03  # Source: simulation-bases.md §6
      mean_reversion: 0.01  # Source: simulation-bases.md §6
      noise_std: 0.015  # Source: simulation-bases.md §6
      custom_state_hot_limit: 3  # Source: framework infrastructure
  persona: !include persona.yml

rulellm_convergence_arbitrageur:
  name: "ConvergenceArbitrageur"
  class: "examples.LTCMCollapse.RuleLLM.players:RuleLLMConvergenceArbitrageur"
  num_instances: 2
  config:
    identity: "rulellm_convergence_arbitrageur"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/LTCMCollapse/RuleLLM/records"  # Source: framework infrastructure
      initial_cash: 2000000.0  # Source: simulation-bases.md §6
      initial_position: 500  # Source: simulation-bases.md §6
      initial_price: 100.0  # Source: simulation-bases.md §6
      fundamental_value: 100.0  # Source: simulation-bases.md §6
      entry_spread: 0.03  # Source: simulation-bases.md §4.1.7
      leverage: 15  # Source: simulation-bases.md §4.1.7
      max_position: 5000  # Source: simulation-bases.md §4.1.7
      base_size: 400  # Source: simulation-bases.md §4.1.7
      custom_state_hot_limit: 3  # Source: framework infrastructure
      llm:
        sys_message: "examples.LTCMCollapse.RuleLLM.prompts:RULELLM_CONVERGENCEARBITRAGEUR_PROMPT"
        user_message: "examples.LTCMCollapse.RuleLLM.prompts:RULELLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.2
          max_tokens: 600
  persona: !include persona.yml

