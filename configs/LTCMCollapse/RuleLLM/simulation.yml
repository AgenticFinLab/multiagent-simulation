# LTCMCollapse RuleLLM Simulation Configuration
#
# August-September 1998 LTCM crisis - Russian default triggered liquidity crisis
#
# Usage:
#   python examples/LTCMCollapse/RuleLLM/run_ltcmcollapse_rulellm.py \
#       -c configs/LTCMCollapse/RuleLLM/simulation.yml

setting:
  name: "LTCMCollapse-RuleLLM"
  description: "Long-Term Capital Management collapse simulation with convergence arbitrage, leverage cycles, and liquidity crisis"
  total_rounds: 200
  
  record_path: "EXPERIMENT/LTCMCollapse/RuleLLM/records"
  storage_path: "EXPERIMENT/LTCMCollapse/RuleLLM/communication"
  
  log_level: "INFO"
  log_to_file: true
  log_path: "EXPERIMENT/LTCMCollapse/RuleLLM/logs"

environment:
  dotenv_path: ".env"
  workspace: "."

llm:
  model: "doubao-pro-32k"
  temperature: 0.3
  max_tokens: 500
  timeout: 30

ray:
  namespace: "ltcmcollapse_rulellm"
  ignore_reinit_error: true
  object_store_memory: 536870912
  num_cpus: 4

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/LTCMCollapse/RuleLLM/communication"
  record_messages: true
  message_timeout_ms: 30000
  max_retries: 3
