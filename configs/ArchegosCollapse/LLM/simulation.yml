# =============================================================================
# ArchegosCollapse LLM Simulation Configuration
# =============================================================================
# LLM agents with Archegos-collapse personas make trading decisions via language
# model reasoning. Market dynamics are rule-based (same as Rule variant).
#
# Usage:
#   python examples/ArchegosCollapse/LLM/run_archegsoscollapse_llm.py \
#       -c configs/ArchegosCollapse/LLM/simulation.yml
# =============================================================================

setting:
  name: "archegsoscollapse_llm_simulation"
  description: "TRS leverage liquidation-race scenario with LLM-driven agents: TRS leverage, prime broker liquidation race"
  total_rounds: 200
  round_history_limit: 3
  record_path: "EXPERIMENT/ArchegosCollapse/LLM/records"
  save_diagram_interval: 50

environment:
  dotenv_path: .env
  workspace: "."

ray:
  address: null
  namespace: "archegsoscollapse_llm"
  actor_prefix: null
  num_cpus: null
  num_gpus: null
  object_store_memory: 536870912
  include_dashboard: false
  logging_level: "warning"
  log_to_driver: false
  actor_options:
    max_restarts: 3
    max_task_retries: 1
    max_concurrency: 10
  runtime_env:
    working_dir: null
    pip: []
    env_vars: {}
  serialization:
    use_arrow: true
    register_custom_serializers: true

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/ArchegosCollapse/LLM/communication"
  record_messages: true
  message_block_size: 500
