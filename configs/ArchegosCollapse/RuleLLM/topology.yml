# =============================================================================
# ArchegosCollapse RuleLLM - Topology Configuration
# =============================================================================
# Star topology: Market broadcasts to all RuleLLM agents; agents send orders to market.
#
#         rulellm_concentrated_fund ──────────────┐
#         rulellm_prime_broker_first_mover ──────┤
#         rulellm_prime_broker_delayed_liquidator┼──▶ market ──▶ all agents
#         rulellm_block_trade_buyer ──────────────┤        (price, deviation, volume)
#         rulellm_information_trader ─────────────┘
#
# Execution flow per round:
#   Level 0: market broadcasts current price + market data
#   Level 1: all RuleLLM agents execute in parallel, submit orders
# =============================================================================

type: "star"

sources:
  - market

connections:
  # Market → All agents (price + market data broadcast)
  market:
    - rulellm_concentrated_fund
    - rulellm_prime_broker_first_mover
    - rulellm_prime_broker_delayed_liquidator
    - rulellm_block_trade_buyer
    - rulellm_information_trader

  # Each agent → Market only (order submission)
  rulellm_concentrated_fund:
    - market

  rulellm_prime_broker_first_mover:
    - market

  rulellm_prime_broker_delayed_liquidator:
    - market

  rulellm_block_trade_buyer:
    - market

  rulellm_information_trader:
    - market
