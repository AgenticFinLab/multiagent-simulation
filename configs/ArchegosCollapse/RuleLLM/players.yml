# =============================================================================
# ArchegosCollapse RuleLLM Players Configuration
# =============================================================================
# 1 Market (rule-based coordinator) + 5 RuleLLM-driven agent types
#
# RuleLLM: System prompts embed both rich persona AND explicit quantitative rules.
# This enables direct comparison with pure Rule and pure LLM variants.
# =============================================================================

# -----------------------------------------------------------------------------
# Market (Coordinator) — rule-based, identical to Rule variant
# -----------------------------------------------------------------------------
market:
  name: "Market"
  class: "examples.ArchegosCollapse.RuleLLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/ArchegosCollapse/RuleLLM/records"  # Source: implementation infrastructure (record path convention per 07-step3-config.md §3.7)
      fundamental_value: 100.0  # Source: simulation-bases.md §3.1 and §6; normalized fundamental anchor
      initial_price: 100.0  # Source: simulation-bases.md §3.1 and §6; starts at fundamental value
      price_impact: 0.03  # Source: Hasbrouck (1991), J. Finance; simulation-bases.md §3.1/§6
      demand_scale: 10.0  # Source: normalized-share scaling for λ×NetDemand; keeps §6 price-impact range comparable to large notional positions
      initial_shock_round: 1  # Source: target §2.1 ViacomCBS offering / reference-asset drop trigger
      initial_shock_quantity: 5200.0  # Source: target §2.1 initial forced reference-asset decline calibrated to cross margin threshold
      mean_reversion: 0.01  # Source: French & Roll (1986), JFE; simulation-bases.md §3.1/§6
      noise_std: 0.015  # Source: Roll (1984), J. Finance; simulation-bases.md §3.1/§6
      custom_state_hot_limit: 3  # Source: implementation storage policy; bounded hot state cache
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# RuleLLM ConcentratedFund — TRS leverage + explicit margin rules in prompt
# Theory: Total Return Swap Leverage (Becketti, 2021)
# -----------------------------------------------------------------------------
rulellm_concentrated_fund:
  name: "Concentrated Fund"
  class: "examples.ArchegosCollapse.RuleLLM.players:RuleLLMConcentratedFund"
  # Expander → concentrated_fund_1, concentrated_fund_2
  num_instances: 2
  config:
    identity: "rulellm_concentrated_fund"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/ArchegosCollapse/RuleLLM/records"  # Source: implementation infrastructure (record path convention per 07-step3-config.md §3.7)
      initial_cash: 500000.0  # Source: simulation-bases.md §4 Population and Heterogeneity; scenario-normalized capital
      initial_position: 5000.0  # Source: simulation-bases.md §4 Population and Heterogeneity; scenario-normalized exposure
      initial_price: 100.0  # Source: simulation-bases.md §3.1 and §6; starts at fundamental value
      fundamental_value: 100.0  # Source: simulation-bases.md §3.1 and §6; normalized fundamental anchor
      custom_state_hot_limit: 3  # Source: implementation storage policy; bounded hot state cache
      llm:
        sys_message: "examples.ArchegosCollapse.RuleLLM.prompts:RULELLM_CONCENTRATED_FUND_SYS"  # Source: 08-step4-implement.md §4.2 LLM wiring contract; target §10.1 variant declaration
        user_message: "examples.ArchegosCollapse.RuleLLM.prompts:RULELLM_USER_TEMPLATE"  # Source: 08-step4-implement.md §4.2 LLM wiring contract; target §10.1 variant declaration
        lm_type: "api"  # Source: 08-step4-implement.md §4.2 LLM wiring contract; target §10.1 variant declaration
        lm_name: "ark/doubao-seed-2-0-mini-260428"  # Source: 08-step4-implement.md §4.2 LLM wiring contract; target §10.1 variant declaration
        generation_config:
          temperature: 0.5  # Source: variant prompt stochasticity setting; simulation-bases.md §9
          max_tokens: 512  # Source: LLM output budget for canonical decision format; 08-step4-implement.md §4.2.2
  persona: !include persona.yml

