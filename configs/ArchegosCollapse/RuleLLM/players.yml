# =============================================================================
# ArchegosCollapse RuleLLM Players Configuration
# =============================================================================
# 1 Market (rule-based coordinator) + 5 RuleLLM-driven agent types
#
# RuleLLM: System prompts embed both rich persona AND explicit quantitative rules.
# This enables direct comparison with pure Rule and pure LLM variants.
# =============================================================================

# -----------------------------------------------------------------------------
# Market (Coordinator) — rule-based, identical to Rule variant
# -----------------------------------------------------------------------------
market:
  name: "Market"
  class: "examples.ArchegosCollapse.RuleLLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/ArchegosCollapse/RuleLLM/records"
      fundamental_value: 100.0
      initial_price: 100.0
      price_impact: 0.03
      mean_reversion: 0.01
      noise_std: 0.015
      custom_state_hot_limit: 3
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# RuleLLM ConcentratedFund — TRS leverage + explicit margin rules in prompt
# Theory: Total Return Swap Leverage (Becketti, 2021)
# -----------------------------------------------------------------------------
concentrated_fund:
  name: "Concentrated Fund"
  class: "examples.ArchegosCollapse.RuleLLM.players:RuleLLMConcentratedFund"
  # Expander → concentrated_fund_1, concentrated_fund_2
  num_instances: 2
  config:
    identity: "concentrated_fund"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/ArchegosCollapse/RuleLLM/records"
      initial_cash: 500000.0
      initial_position: 5000.0
      initial_price: 100.0
      fundamental_value: 100.0
      custom_state_hot_limit: 3
      llm:
        sys_message: "examples.ArchegosCollapse.RuleLLM.prompts:RULELLM_CONCENTRATED_FUND_SYS"
        user_message: "examples.ArchegosCollapse.RuleLLM.prompts:RULELLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-1-6-251015"
        generation_config:
          temperature: 0.5
          max_tokens: 512
  persona: !include persona.yml

