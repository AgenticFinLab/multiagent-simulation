# ArchegosCollapse RuleLLM Simulation Configuration
#
# March 2021 - Archegos Capital Management lost $20B, triggering block trade fire sales
#
# Usage:
#   python examples/ArchegosCollapse/RuleLLM/run_archegsoscollapse_rulellm.py \
#       -c configs/ArchegosCollapse/RuleLLM/simulation.yml

setting:
  name: "ArchegosCollapse-RuleLLM"
  description: "Archegos collapse simulation with total return swaps, concentrated positions, and prime broker liquidation cascade"
  total_rounds: 200
  
  record_path: "EXPERIMENT/ArchegosCollapse/RuleLLM/records"
  storage_path: "EXPERIMENT/ArchegosCollapse/RuleLLM/communication"
  
  log_level: "INFO"
  log_to_file: true
  log_path: "EXPERIMENT/ArchegosCollapse/RuleLLM/logs"

environment:
  dotenv_path: ".env"
  workspace: "."

llm:
  model: "doubao-pro-32k"
  temperature: 0.3
  max_tokens: 500
  timeout: 30

ray:
  namespace: "archegsoscollapse_rulellm"
  ignore_reinit_error: true
  object_store_memory: 536870912
  num_cpus: 4

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/ArchegosCollapse/RuleLLM/communication"
  record_messages: true
  message_timeout_ms: 30000
  max_retries: 3
