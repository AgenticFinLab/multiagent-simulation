# =============================================================================
# ArchegosCollapse Rag Players Configuration
# =============================================================================
# 1 Market (rule-based coordinator) + 5 RAG-augmented LLM agent types
#
# Knowledge Architecture:
#   The shared knowledge: block is promoted to config top-level by the loader.
#   Each agent has private_knowledge for agent-specific RAG configuration.
# =============================================================================

# =============================================================================
# Shared Knowledge Configuration
# =============================================================================
knowledge:
  backend: "local"  # Source: 08-step4-implement.md §4.3 RAG wiring contract; target §10.1 Rag variant declaration
  global_uri: "examples/document-sources"  # Source: 08-step4-implement.md §4.3 RAG wiring contract; target §10.1 Rag variant declaration
  resource_csv:
    - "examples/document-sources/books.csv"
    - "examples/document-sources/source"
  preprocessing:
    parser: "mineru"  # Source: 08-step4-implement.md §4.3 RAG wiring contract; target §10.1 Rag variant declaration
    output_position: "MinerU_processed"  # Source: 08-step4-implement.md §4.3 RAG wiring contract; target §10.1 Rag variant declaration
  rag:
    output_position: "rag_index"  # Source: 08-step4-implement.md §4.3 RAG wiring contract; target §10.1 Rag variant declaration
    embed_type: "litellm"  # Source: 08-step4-implement.md §4.3 RAG wiring contract; target §10.1 Rag variant declaration
    embed_model: "openai/hunyuan-embedding"  # Source: 08-step4-implement.md §4.3 RAG wiring contract; target §10.1 Rag variant declaration
    embed_api_key: "{{ HUNYUAN_API_KEY }}"  # Source: 08-step4-implement.md §4.3 RAG wiring contract; target §10.1 Rag variant declaration
    embed_api_base: "https://api.hunyuan.cloud.tencent.com/v1"  # Source: 08-step4-implement.md §4.3 RAG wiring contract; target §10.1 Rag variant declaration
    chunk_size: 512  # Source: RAG indexing configuration; 07-step3-config.md §3.7
    chunk_overlap: 64  # Source: RAG indexing configuration; 07-step3-config.md §3.7
    top_k: 5  # Source: RAG retrieval target; 07-step3-config.md §3.7

# -----------------------------------------------------------------------------
# Market (Coordinator) — rule-based, identical to Rule variant
# -----------------------------------------------------------------------------
market:
  name: "Market"
  class: "examples.ArchegosCollapse.Rag.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/ArchegosCollapse/Rag/records"  # Source: implementation infrastructure (record path convention per 07-step3-config.md §3.7)
      fundamental_value: 100.0  # Source: simulation-bases.md §3.1 and §6; normalized fundamental anchor
      initial_price: 100.0  # Source: simulation-bases.md §3.1 and §6; starts at fundamental value
      price_impact: 0.03  # Source: Hasbrouck (1991), J. Finance; simulation-bases.md §3.1/§6
      mean_reversion: 0.01  # Source: French & Roll (1986), JFE; simulation-bases.md §3.1/§6
      noise_std: 0.015  # Source: Roll (1984), J. Finance; simulation-bases.md §3.1/§6
      custom_state_hot_limit: 3  # Source: implementation storage policy; bounded hot state cache
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# RAG ConcentratedFund — TRS leveraged position holder + domain knowledge
# Theory: Total Return Swap Leverage (Becketti, 2021)
# -----------------------------------------------------------------------------
ragllm_concentrated_fund:
  name: "RAG Concentrated Fund"
  class: "examples.ArchegosCollapse.Rag.players:RagLLMConcentratedFund"
  # Expander → ragllm_concentrated_fund_1, ragllm_concentrated_fund_2
  num_instances: 2
  config:
    identity: "ragllm_concentrated_fund"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/ArchegosCollapse/Rag/records"  # Source: implementation infrastructure (record path convention per 07-step3-config.md §3.7)
      initial_cash: 500000.0  # Source: simulation-bases.md §4 Population and Heterogeneity; scenario-normalized capital
      initial_position: 5000.0  # Source: simulation-bases.md §4 Population and Heterogeneity; scenario-normalized exposure
      initial_price: 100.0  # Source: simulation-bases.md §3.1 and §6; starts at fundamental value
      fundamental_value: 100.0  # Source: simulation-bases.md §3.1 and §6; normalized fundamental anchor
      custom_state_hot_limit: 3  # Source: implementation storage policy; bounded hot state cache
      private_knowledge:
        from_global_resources:
          - "MinerU_processed"
        local_resources:
          local_uri: ""  # Source: 08-step4-implement.md §4.3 RAG wiring contract; target §10.1 Rag variant declaration
          local_resources: []
        rag:
          from_global_index_dir:
            - "rag_index"
          local_index_dir: ""  # Source: 08-step4-implement.md §4.3 RAG wiring contract; target §10.1 Rag variant declaration
          embed_type: "litellm"  # Source: 08-step4-implement.md §4.3 RAG wiring contract; target §10.1 Rag variant declaration
          embed_model: "openai/hunyuan-embedding"  # Source: 08-step4-implement.md §4.3 RAG wiring contract; target §10.1 Rag variant declaration
          embed_api_key: "{{ HUNYUAN_API_KEY }}"  # Source: 08-step4-implement.md §4.3 RAG wiring contract; target §10.1 Rag variant declaration
          embed_api_base: "https://api.hunyuan.cloud.tencent.com/v1"  # Source: 08-step4-implement.md §4.3 RAG wiring contract; target §10.1 Rag variant declaration
          chunk_size: 512  # Source: RAG indexing configuration; 07-step3-config.md §3.7
          chunk_overlap: 64  # Source: RAG indexing configuration; 07-step3-config.md §3.7
          top_k: 5  # Source: RAG retrieval target; 07-step3-config.md §3.7
      llm:
        sys_message: "examples.ArchegosCollapse.Rag.prompts:RAG_CONCENTRATED_FUND_SYS"  # Source: 08-step4-implement.md §4.2 LLM wiring contract; target §10.1 variant declaration
        user_message: "examples.ArchegosCollapse.Rag.prompts:RAG_USER_TEMPLATE"  # Source: 08-step4-implement.md §4.2 LLM wiring contract; target §10.1 variant declaration
        lm_type: "api"  # Source: 08-step4-implement.md §4.2 LLM wiring contract; target §10.1 variant declaration
        lm_name: "ark/doubao-seed-2-0-mini-260428"  # Source: 08-step4-implement.md §4.2 LLM wiring contract; target §10.1 variant declaration
        generation_config:
          temperature: 0.5  # Source: variant prompt stochasticity setting; simulation-bases.md §9
          max_new_tokens: 600  # Source: RAG output budget for canonical decision format; 08-step4-implement.md §4.4.4
  persona: !include persona.yml

