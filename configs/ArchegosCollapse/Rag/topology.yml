# =============================================================================
# ArchegosCollapse Rag - Topology Configuration
# =============================================================================
# Star topology: Market broadcasts to all RAG agents; agents send orders to market.
#
#         ragllm_concentrated_fund ──────────────┐
#         ragllm_prime_broker1 ──────────────────┤
#         ragllm_prime_broker2 ──────────────────┼──▶ market ──▶ all agents
#         ragllm_block_trade_buyer ──────────────┤
#         ragllm_information_trader ─────────────┘
#
# Execution flow per round:
#   Level 0: market broadcasts current price + market data
#   Level 1: all RAG+LLM agents execute in parallel, submit orders
# =============================================================================

type: "star"

sources:
  - market

connections:
  # Market → All agents (price + market data broadcast)
  market:
    - ragllm_concentrated_fund
    - ragllm_prime_broker1
    - ragllm_prime_broker2
    - ragllm_block_trade_buyer
    - ragllm_information_trader

  # Each agent → Market only (order submission)
  ragllm_concentrated_fund:
    - market

  ragllm_prime_broker1:
    - market

  ragllm_prime_broker2:
    - market

  ragllm_block_trade_buyer:
    - market

  ragllm_information_trader:
    - market
