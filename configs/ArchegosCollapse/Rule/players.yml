# ArchegosCollapse Rule Agent Configuration

market:
  name: "Market"
  class: "examples.ArchegosCollapse.Rule.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    extras:
      initial_price: 100.0
      fundamental_value: 100.0
      price_impact: 0.03
      mean_reversion: 0.01
      noise_std: 0.02

concentrated_fund_1:
  name: "ConcentratedFund 1"
  class: "examples.ArchegosCollapse.Rule.players:ConcentratedFund"
  num_instances: 2
  config:
    identity: "concentrated_fund_1"
    role: player
    extras:
      initial_cash: 1000000.00
      initial_position: 0

