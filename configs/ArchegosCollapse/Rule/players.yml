# =============================================================================
# ArchegosCollapse Rule Players Configuration
# =============================================================================
# 1 Market (rule-based coordinator) + 5 rule-based agent types
#
# Scenario: March 2021 - Archegos Capital Management collapse ($20B loss)
# Agents: ConcentratedFund (TRS leverage) + PrimeBrokerFirstMover/2 (liquidation race)
#         + BlockTradeBuyer (discount buyer) + InformationTrader (front-runner)
# =============================================================================

# -----------------------------------------------------------------------------
# Market (Coordinator) — rule-based price formation
# -----------------------------------------------------------------------------
market:
  name: "Market"
  class: "examples.ArchegosCollapse.Rule.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/ArchegosCollapse/Rule/records"  # Source: implementation infrastructure (record path convention per 07-step3-config.md §3.7)
      # Price formation: P(t+1) = P(t) + λ×NetDemand + γ×(F-P(t)) + ε
      fundamental_value: 100.0  # Source: simulation-bases.md §3.1 and §6; normalized fundamental anchor
      initial_price: 100.0  # Source: simulation-bases.md §3.1 and §6; starts at fundamental value
      price_impact: 0.03  # Source: Hasbrouck (1991), J. Finance; simulation-bases.md §3.1/§6
      demand_scale: 10.0  # Source: normalized-share scaling for λ×NetDemand; keeps §6 price-impact range comparable to large notional positions
      initial_shock_round: 1  # Source: target §2.1 ViacomCBS offering / reference-asset drop trigger
      initial_shock_quantity: 5200.0  # Source: target §2.1 initial forced reference-asset decline calibrated to cross margin threshold
      mean_reversion: 0.01  # Source: French & Roll (1986), JFE; simulation-bases.md §3.1/§6
      noise_std: 0.015  # Source: Roll (1984), J. Finance; simulation-bases.md §3.1/§6
      custom_state_hot_limit: 3  # Source: implementation storage policy; bounded hot state cache
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# ConcentratedFund — TRS-leveraged position holder (TRS-based)
# Theory: Total Return Swap Leverage (Becketti, 2021)
# -----------------------------------------------------------------------------
rule_concentrated_fund:
  name: "Concentrated Fund"
  class: "examples.ArchegosCollapse.Rule.players:ConcentratedFund"
  # Expander → concentrated_fund_1, concentrated_fund_2
  num_instances: 2
  config:
    identity: "rule_concentrated_fund"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/ArchegosCollapse/Rule/records"  # Source: implementation infrastructure (record path convention per 07-step3-config.md §3.7)
      initial_cash: 500000.0  # Source: simulation-bases.md §4 Population and Heterogeneity; scenario-normalized capital
      initial_position: 5000.0  # Source: simulation-bases.md §4 Population and Heterogeneity; scenario-normalized exposure
      # Rule parameters
      margin_threshold: -0.15  # Source: Becketti (2021) and FSB (2022); simulation-bases.md §4.1.6
      trs_sell_ratio: 0.50  # Source: Becketti (2021) and FSB (2022); simulation-bases.md §4.1.6
      custom_state_hot_limit: 3  # Source: implementation storage policy; bounded hot state cache
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# PrimeBrokerFirstMover — First-mover liquidator (creates cascade)
# Theory: Prime broker liquidation race (information asymmetry)
# -----------------------------------------------------------------------------
rule_prime_broker_first_mover:
  name: "Prime Broker (First Mover)"
  class: "examples.ArchegosCollapse.Rule.players:PrimeBrokerFirstMover"
  num_instances: 1
  config:
    identity: "rule_prime_broker_first_mover"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/ArchegosCollapse/Rule/records"  # Source: implementation infrastructure (record path convention per 07-step3-config.md §3.7)
      initial_cash: 200000.0  # Source: simulation-bases.md §4 Population and Heterogeneity; scenario-normalized capital
      initial_position: 4000.0  # Source: simulation-bases.md §4 Population and Heterogeneity; scenario-normalized exposure
      # Rule parameters
      liquidation_threshold: -0.10  # Source: Gorton & Metrick (2012); simulation-bases.md §4.2/§4.3 Parameters
      liquidation_sell_ratio: 0.40  # Source: Gorton & Metrick (2012); simulation-bases.md §4.2/§4.3 Parameters
      # First mover: receives full market price
      custom_state_hot_limit: 3  # Source: implementation storage policy; bounded hot state cache
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# PrimeBrokerDelayedLiquidator — Second-mover liquidator (delayed, worse prices)
# Theory: Prime broker competition; cascade amplification
# -----------------------------------------------------------------------------
rule_prime_broker_delayed_liquidator:
  name: "Prime Broker (Delayed Liquidator)"
  class: "examples.ArchegosCollapse.Rule.players:PrimeBrokerDelayedLiquidator"
  num_instances: 1
  config:
    identity: "rule_prime_broker_delayed_liquidator"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/ArchegosCollapse/Rule/records"  # Source: implementation infrastructure (record path convention per 07-step3-config.md §3.7)
      initial_cash: 200000.0  # Source: simulation-bases.md §4 Population and Heterogeneity; scenario-normalized capital
      initial_position: 3500.0  # Source: simulation-bases.md §4 Population and Heterogeneity; scenario-normalized exposure
      # Rule parameters
      liquidation_threshold: -0.15  # Source: Gorton & Metrick (2012); simulation-bases.md §4.2/§4.3 Parameters
      liquidation_sell_ratio: 0.35  # Source: Gorton & Metrick (2012); simulation-bases.md §4.2/§4.3 Parameters
      price_penalty: 0.97  # Source: Archegos broker-loss timing calibration; simulation-bases.md §4.3.6
      custom_state_hot_limit: 3  # Source: implementation storage policy; bounded hot state cache
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# BlockTradeBuyer — Opportunistic discount buyer
# Theory: Opportunistic block trading; stabilizing force
# -----------------------------------------------------------------------------
rule_block_trade_buyer:
  name: "Block Trade Buyer"
  class: "examples.ArchegosCollapse.Rule.players:BlockTradeBuyer"
  num_instances: 1
  config:
    identity: "rule_block_trade_buyer"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/ArchegosCollapse/Rule/records"  # Source: implementation infrastructure (record path convention per 07-step3-config.md §3.7)
      initial_cash: 1000000.0  # Source: simulation-bases.md §4 Population and Heterogeneity; scenario-normalized capital
      initial_position: 0.0  # Source: simulation-bases.md §4 Population and Heterogeneity; scenario-normalized exposure
      # Rule parameters
      discount_threshold: -0.10  # Source: Grossman & Miller (1988); simulation-bases.md §4.4.6
      buy_ratio: 0.30  # Source: Grossman & Miller (1988); simulation-bases.md §4.4.6
      custom_state_hot_limit: 3  # Source: implementation storage policy; bounded hot state cache
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# InformationTrader — Front-runner detecting liquidation signals
# Theory: Information-based trading; detection of order flow
# -----------------------------------------------------------------------------
rule_information_trader:
  name: "Information Trader"
  class: "examples.ArchegosCollapse.Rule.players:InformationTrader"
  # Expander → information_trader_1, information_trader_2
  num_instances: 2
  config:
    identity: "rule_information_trader"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/ArchegosCollapse/Rule/records"  # Source: implementation infrastructure (record path convention per 07-step3-config.md §3.7)
      initial_cash: 300000.0  # Source: simulation-bases.md §4 Population and Heterogeneity; scenario-normalized capital
      initial_position: 1000.0  # Source: simulation-bases.md §4 Population and Heterogeneity; scenario-normalized exposure
      # Rule parameters
      detection_ability: 0.50  # Source: Kyle (1985) and Brunnermeier & Pedersen (2005); simulation-bases.md §4.5.6
      detection_threshold: -0.05  # Source: Kyle (1985); simulation-bases.md §4.5.6
      front_run_size: 1000  # Source: Brunnermeier & Pedersen (2005); simulation-bases.md §4.5.6
      cover_threshold: -0.03  # Source: Brunnermeier & Pedersen (2005); simulation-bases.md §4.5.6
      cover_size: 500  # Source: Brunnermeier & Pedersen (2005); simulation-bases.md §4.5.6
      custom_state_hot_limit: 3  # Source: implementation storage policy; bounded hot state cache
  persona: !include persona.yml
