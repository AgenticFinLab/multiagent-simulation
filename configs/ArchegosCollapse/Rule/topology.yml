# =============================================================================
# ArchegosCollapse Rule - Topology Configuration
# =============================================================================
# Star topology: Market broadcasts to all agents; agents send orders to market.
#
#         concentrated_fund ──────────────┐
#         prime_broker_first_mover ──────┤
#         prime_broker_delayed_liquidator┼──▶ market ──▶ all agents
#         block_trade_buyer ──────────────┤        (price, deviation, volume)
#         information_trader ─────────────┘
#
# Execution flow per round:
#   Level 0: market broadcasts current price + market data
#   Level 1: all agents execute in parallel, submit orders
# =============================================================================

type: "star"

sources:
  - market

connections:
  # Market → All agents (price + market data broadcast)
  market:
    - concentrated_fund
    - prime_broker_first_mover
    - prime_broker_delayed_liquidator
    - block_trade_buyer
    - information_trader

  # Each agent → Market only (order submission)
  concentrated_fund:
    - market

  prime_broker_first_mover:
    - market

  prime_broker_delayed_liquidator:
    - market

  block_trade_buyer:
    - market

  information_trader:
    - market
