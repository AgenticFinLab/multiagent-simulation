# =============================================================================
# ArchegosCollapse Rule Simulation Configuration
# =============================================================================
# Rule-based simulation of the March 2021 Archegos Capital Management collapse.
# ConcentratedFund with TRS leverage triggers margin calls; prime brokers race
# to liquidate; block buyer provides partial stabilization.
#
# Usage:
#   python examples/ArchegosCollapse/Rule/run_archegsoscollapse.py \
#       -c configs/ArchegosCollapse/Rule/simulation.yml
# =============================================================================

setting:
  name: "archegsoscollapse_rule_simulation"
  description: "TRS leverage liquidation-race scenario: TRS leverage, margin calls, prime broker liquidation race"
  total_rounds: 200
  round_history_limit: 3
  record_path: "EXPERIMENT/ArchegosCollapse/Rule/records"
  save_diagram_interval: 50

environment:
  dotenv_path: .env
  workspace: "."

ray:
  address: null
  namespace: "archegsoscollapse_rule"
  actor_prefix: null
  num_cpus: null
  num_gpus: null
  object_store_memory: 268435456
  include_dashboard: false
  logging_level: "warning"
  log_to_driver: false
  actor_options:
    max_restarts: 3
    max_task_retries: 1
    max_concurrency: 10
  runtime_env:
    working_dir: null
    pip: []
    env_vars: {}
  serialization:
    use_arrow: true
    register_custom_serializers: true

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/ArchegosCollapse/Rule/communication"
  record_messages: true
  message_block_size: 500
