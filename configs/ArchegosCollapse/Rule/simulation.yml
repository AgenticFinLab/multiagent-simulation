# ArchegosCollapse Rule Simulation Configuration
#
# March 2021 - Archegos Capital Management lost $20B, triggering block trade fire sales
#
# Usage:
#   python examples/ArchegosCollapse/Rule/run_archegsoscollapse.py \
#       -c configs/ArchegosCollapse/Rule/simulation.yml

setting:
  name: "ArchegosCollapse-Rule"
  description: "Archegos collapse simulation with total return swaps, concentrated positions, and prime broker liquidation cascade"
  total_rounds: 200
  
  record_path: "EXPERIMENT/ArchegosCollapse/Rule/records"
  storage_path: "EXPERIMENT/ArchegosCollapse/Rule/communication"
  
  log_level: "INFO"
  log_to_file: true
  log_path: "EXPERIMENT/ArchegosCollapse/Rule/logs"

environment:
  dotenv_path: ".env"
  workspace: "."

ray:
  namespace: "archegsoscollapse_rule"
  ignore_reinit_error: true
  object_store_memory: 536870912
  num_cpus: 4

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/ArchegosCollapse/Rule/communication"
  record_messages: true
  message_timeout_ms: 5000
  max_retries: 3
