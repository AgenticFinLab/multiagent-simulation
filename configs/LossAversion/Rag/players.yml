# LossAversion Rag Agent Configuration

knowledge:
  backend: "local"
  global_uri: "examples/document-sources"
  resource_csv:
    - "examples/document-sources/books.csv"
    - "examples/document-sources/source"
  preprocessing:
    parser: "mineru"
    output_position: "MinerU_processed"
  rag:
    output_position: "rag_index"
    embed_type: "litellm"
    embed_model: "openai/hunyuan-embedding"
    embed_api_key: "{{ HUNYUAN_API_KEY }}"
    embed_api_base: "https://api.hunyuan.cloud.tencent.com/v1"
    chunk_size: 512                   # Source: simulation-bases.md §6 — retrieval calibration
    chunk_overlap: 64                 # Source: simulation-bases.md §6 — retrieval calibration
    top_k: 5                          # Source: simulation-bases.md §6 — retrieval calibration

market:
  archetype: stock-standard-price-impact  # -> masim/agents/defines/market/stock-standard-price-impact.md
  name: "Market"
  class: "examples.LossAversion.Rag.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/LossAversion/Rag/records"
      initial_price: 100.0              # Source: target §9 — normalization
      fundamental_value: 100.0          # Source: target §9 — public benchmark
      price_impact: 0.0002              # Source: target §9 / simulation-bases.md §6
      mean_reversion: 0.01              # Source: target §9 / simulation-bases.md §6
      noise_std: 0.015                  # Source: target §9 / simulation-bases.md §6
      random_seed: 20260716             # Source: target §9 — reproducible common market path
      price_floor: 0.01                 # Source: target §9 — strictly positive price invariant
      shock_schedule:
        20: 0.06                        # Source: target §9 — controlled gain-domain stimulus
        80: -0.20                       # Source: target §9 — controlled loss-domain stimulus
      custom_state_hot_limit: 3         # Source: simulation-bases.md §6
  persona: !include persona.yml

ragllm_loss_averse_investor:
  name: "LossAverseInvestor"
  class: "examples.LossAversion.Rag.players:RagLLMLossAverseInvestor"
  num_instances: 3
  config:
    identity: "ragllm_loss_averse_investor"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/LossAversion/Rag/records"
      initial_cash: 1000000.0            # Source: target §9 — normalization
      initial_position: 500              # Source: target §9 — normalization
      initial_price: 100.0               # Source: target §9 — reference point
      fundamental_value: 100.0           # Source: target §9 — public benchmark
      loss_aversion_lambda: 2.25         # Source: target §9 / Kahneman & Tversky (1979)
      sell_gain_threshold: 0.05          # Source: target §9 — trigger calibration
      gain_sell_fraction: 0.70           # Source: target §9 — configured disposition benchmark
      loss_sell_fraction: 0.20           # Source: target §9 — configured disposition benchmark
      base_size: 400                     # Source: target §9 — order-cap calibration
      quantity_tolerance: 0.20           # Source: target §9 — hybrid quantity band
      custom_state_hot_limit: 3          # Source: simulation-bases.md §6
      private_knowledge:
        from_global_resources:
          - "MinerU_processed"
        local_resources:
          local_uri: ""
          local_resources: []
        rag:
          from_global_index_dir:
            - "rag_index"
          local_index_dir: ""
          embed_type: "litellm"
          embed_model: "openai/hunyuan-embedding"
          embed_api_key: "{{ HUNYUAN_API_KEY }}"
          embed_api_base: "https://api.hunyuan.cloud.tencent.com/v1"
          chunk_size: 512                # Source: simulation-bases.md §6 — retrieval calibration
          chunk_overlap: 64              # Source: simulation-bases.md §6 — retrieval calibration
          top_k: 5                       # Source: simulation-bases.md §6 — retrieval calibration
      llm:
        sys_message: "examples.LossAversion.Rag.prompts:RULELLM_LOSS_AVERSE_PROMPT"
        user_message: "examples.LossAversion.Rag.prompts:RAG_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.7               # Source: simulation-bases.md §6 — model calibration
          max_tokens: 600                # Source: simulation-bases.md §6 — bounded response budget
  persona: !include persona.yml

