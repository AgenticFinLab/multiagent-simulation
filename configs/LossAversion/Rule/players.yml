    role: player
    extras:
      initial_cash: 1000000.00
      initial_position: 0

rational_trader_3:
  name: "RationalTrader 3"
  class: "examples.LossAversion.Rule.players:RationalTrader"
  num_instances: 1
  config:
    identity: "rational_trader_3"
