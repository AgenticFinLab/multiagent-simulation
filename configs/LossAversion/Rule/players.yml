# LossAversion Rule Agent Configuration

market:
  name: "Market"
  class: "examples.LossAversion.Rule.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/LossAversion/Rule/records"
      initial_price: 100.0
      fundamental_value: 100.0
      price_impact: 0.03
      mean_reversion: 0.01
      noise_std: 0.015
      custom_state_hot_limit: 3
  persona: !include persona.yml

lossaverseinvestor:
  name: "LossAverseInvestor"
  class: "examples.LossAversion.Rule.players:LossAverseInvestor"
  num_instances: 3
  config:
    identity: "lossaverseinvestor"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/LossAversion/Rule/records"
      initial_cash: 1000000.0
      initial_position: 500
      initial_price: 100.0
      fundamental_value: 100.0
      loss_aversion_lambda: 2.25
      sell_gain_threshold: 0.05
      base_size: 400
      custom_state_hot_limit: 3
  persona: !include persona.yml

