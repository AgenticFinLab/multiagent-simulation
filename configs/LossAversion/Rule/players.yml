    extras:
      initial_cash: 1000000.00
      initial_position: 0

momentum_trader_4:
  name: "MomentumTrader 4"
  class: "examples.LossAversion.Rule.players:MomentumTrader"
  num_instances: 2
  config:
    identity: "momentum_trader_4"
