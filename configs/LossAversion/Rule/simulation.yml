# LossAversion Rule Simulation Configuration
#
# Loss aversion from prospect theory causes investors to hold losers too long and sell winners too early
#
# Usage:
#   python examples/LossAversion/Rule/run_lossaversion.py \
#       -c configs/LossAversion/Rule/simulation.yml

setting:
  name: "LossAversion-Rule"
  description: "Loss aversion simulation demonstrating how asymmetric utility functions lead to disposition effect and price patterns"
  total_rounds: 200
  
  record_path: "EXPERIMENT/LossAversion/Rule/records"
  storage_path: "EXPERIMENT/LossAversion/Rule/communication"
  
  log_level: "INFO"
  log_to_file: true
  log_path: "EXPERIMENT/LossAversion/Rule/logs"

environment:
  dotenv_path: ".env"
  workspace: "."

ray:
  namespace: "lossaversion_rule"
  ignore_reinit_error: true
  object_store_memory: 536870912
  num_cpus: 4

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/LossAversion/Rule/communication"
  record_messages: true
  message_timeout_ms: 5000
  max_retries: 3
