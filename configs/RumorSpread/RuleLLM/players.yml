# =============================================================================
# RumorSpreadRuleLLM Players Configuration
# =============================================================================
# 1 InformationEnvironment (rule-based, imported from Rule variant)
#   + 5 RuleLLM Social Agent Types
#
# Each agent's system prompt embeds BOTH persona AND quantitative rules
# derived from the rule-based RumorSpread variant.
# =============================================================================

# -----------------------------------------------------------------------------
# InformationEnvironment (Coordinator) — imported from Rule variant
# -----------------------------------------------------------------------------
rulellm_information_environment:
  name: "InformationEnvironment"
  class: "examples.RumorSpread.RuleLLM.players:InformationEnvironment"
  num_instances: 1
  config:
    identity: "rulellm_information_environment"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - environment
    extras:
      record_path: "EXPERIMENT/RumorSpread/RuleLLM/records"  # Source: AGENT_POOL/finance/information-environment.md §6
      rumor_truth_value: 0.1  # Source: AGENT_POOL/finance/information-environment.md §6
      initial_belief: 0.3  # Source: AGENT_POOL/finance/information-environment.md §6
      spread_impact: 0.15  # Source: AGENT_POOL/finance/information-environment.md §6
      truth_correction: 0.02  # Source: AGENT_POOL/finance/information-environment.md §6
      leveling_rate: 0.01  # Source: AGENT_POOL/finance/information-environment.md §6
      sharpening_rate: 0.02  # Source: AGENT_POOL/finance/information-environment.md §6
      noise_std: 0.02  # Source: AGENT_POOL/finance/information-environment.md §6
      custom_state_hot_limit: 3  # Source: AGENT_POOL/finance/information-environment.md §6
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# RuleLLM Gullible Spreaders
# -----------------------------------------------------------------------------
rulellm_gullible_spreader:
  name: "RuleLLM Gullible Spreader"
  class: "examples.RumorSpread.RuleLLM.players:RuleLLMGullibleSpreader"
  num_instances: 5
  config:
    identity: "rulellm_gullible_spreader"
    role: player
    steps_per_turn: 1
    group_tags:
      - rulellm_agents
    extras:
      record_path: "EXPERIMENT/RumorSpread/RuleLLM/records"  # Source: AGENT_POOL/opinion/gullible-spreader.md §6
      initial_belief: 0.3  # Source: AGENT_POOL/opinion/gullible-spreader.md §6
      initial_credibility: 0.5  # Source: AGENT_POOL/opinion/gullible-spreader.md §6
      custom_state_hot_limit: 3  # Source: AGENT_POOL/opinion/gullible-spreader.md §6
      llm:
        sys_message: "examples.RumorSpread.RuleLLM.prompts:RULELLM_GULLIBLE_SYS"  # Source: AGENT_POOL/opinion/gullible-spreader.md §6
        user_message: "examples.RumorSpread.RuleLLM.prompts:RULELLM_USER_TEMPLATE"  # Source: AGENT_POOL/opinion/gullible-spreader.md §6
        lm_type: "api"  # Source: AGENT_POOL/opinion/gullible-spreader.md §6
        lm_name: "ark/doubao-seed-2-0-mini-260428"  # Source: AGENT_POOL/opinion/gullible-spreader.md §6
        generation_config:
          temperature: 0.3  # Source: AGENT_POOL/opinion/gullible-spreader.md §6
          max_new_tokens: 500  # Source: AGENT_POOL/opinion/gullible-spreader.md §6
  persona: !include persona.yml

