# =============================================================================
# RumorSpreadRuleLLM Players Configuration
# =============================================================================
# 1 InformationEnvironment (rule-based, imported from Rule variant)
#   + 5 RuleLLM Social Agent Types
#
# Each agent's system prompt embeds BOTH persona AND quantitative rules
# derived from the rule-based RumorSpread variant.
# =============================================================================

# -----------------------------------------------------------------------------
# InformationEnvironment (Coordinator) — imported from Rule variant
# -----------------------------------------------------------------------------
environment:
  name: "InformationEnvironment"
  class: "examples.RumorSpread.RuleLLM.players:InformationEnvironment"
  num_instances: 1
  config:
    identity: "environment"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - environment
    extras:
      record_path: "EXPERIMENT/RumorSpread/RuleLLM/records"
      rumor_truth_value: 0.1
      initial_belief: 0.3
      spread_impact: 0.15
      truth_correction: 0.02
      leveling_rate: 0.01
      sharpening_rate: 0.02
      noise_std: 0.02
      custom_state_hot_limit: 3
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# RuleLLM Gullible Spreaders
# -----------------------------------------------------------------------------
rulellm_gullible_spreader:
  name: "RuleLLM Gullible Spreader"
  class: "examples.RumorSpread.RuleLLM.players:RuleLLMGullibleSpreader"
  num_instances: 5
  config:
    identity: "rulellm_gullible_spreader"
    role: player
    steps_per_turn: 1
    group_tags:
      - rulellm_agents
    extras:
      record_path: "EXPERIMENT/RumorSpread/RuleLLM/records"
      initial_belief: 0.3
      initial_credibility: 0.5
      custom_state_hot_limit: 3
      llm:
        sys_message: "examples.RumorSpread.RuleLLM.prompts:RULELLM_GULLIBLE_SYS"
        user_message: "examples.RumorSpread.RuleLLM.prompts:RULELLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-1-6-lite-251015"
        generation_config:
          temperature: 0.3
          max_new_tokens: 500
  persona: !include persona.yml

