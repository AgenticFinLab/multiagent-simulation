# =============================================================================
# RumorSpreadRag Players Configuration
# =============================================================================
# 1 InformationEnvironment (rule-based) + 5 RAG-augmented LLM Social Agents
#
# Knowledge Architecture:
#   The shared knowledge: block is defined at the TOP of this file.
#   The config loader automatically promotes it to config top-level.
#
#   Each agent has private_knowledge for agent-specific resources:
#     - from_global_resources: List of global resource sub-dirs to inherit
#     - local_resources:
#         local_uri:       Per-agent local directory
#         local_resources: Agent-specific local resource paths
#     - rag: Per-agent RAG configuration (MUST be nested inside private_knowledge)
# =============================================================================

# =============================================================================
# Shared Knowledge Configuration
# =============================================================================
knowledge:
  backend: "local"
  global_uri: "examples/document-sources"
  resource_csv:
    - "examples/document-sources/books.csv"
    - "examples/document-sources/source"
  preprocessing:
    parser: "mineru"
    timeout_per_page: 30
    max_pages: 250
    output_position: "MinerU_processed"
  rag:
    output_position: "rag_index"
    embed_type: "litellm"
    embed_model: "openai/hunyuan-embedding"
    embed_api_key: "{{ HUNYUAN_API_KEY }}"
    embed_api_base: "https://api.hunyuan.cloud.tencent.com/v1"
    chunk_size: 512
    chunk_overlap: 64

# -----------------------------------------------------------------------------
# InformationEnvironment (Coordinator) — identical to Rule variant
# -----------------------------------------------------------------------------
ragllm_information_environment:
  archetype: information-sis-contagion  # -> masim/agents/defines/market/information-sis-contagion.md
  name: "InformationEnvironment"
  class: "examples.RumorSpread.Rag.players:InformationEnvironment"
  num_instances: 1
  config:
    identity: "ragllm_information_environment"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - environment
    extras:
      record_path: "EXPERIMENT/RumorSpread/Rag/records"  # Source: masim/agents/defines/finance/information-environment.md §6
      rumor_truth_value: 0.1  # Source: masim/agents/defines/finance/information-environment.md §6
      initial_belief: 0.3  # Source: masim/agents/defines/finance/information-environment.md §6
      spread_impact: 0.15  # Source: masim/agents/defines/finance/information-environment.md §6
      truth_correction: 0.02  # Source: masim/agents/defines/finance/information-environment.md §6
      leveling_rate: 0.01  # Source: masim/agents/defines/finance/information-environment.md §6
      sharpening_rate: 0.02  # Source: masim/agents/defines/finance/information-environment.md §6
      noise_std: 0.02  # Source: masim/agents/defines/finance/information-environment.md §6
      custom_state_hot_limit: 3  # Source: masim/agents/defines/finance/information-environment.md §6
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# RAG Gullible Spreader
# -----------------------------------------------------------------------------
ragllm_gullible_spreader:
  name: "RAG Gullible Spreader"
  class: "examples.RumorSpread.Rag.players:RagLLMGullibleSpreader"
  num_instances: 5
  config:
    identity: "ragllm_gullible_spreader"
    role: player
    steps_per_turn: 1
    group_tags:
      - ragllm_agents
    extras:
      record_path: "EXPERIMENT/RumorSpread/Rag/records"  # Source: masim/agents/defines/opinion/gullible-spreader.md §6
      initial_belief: 0.3  # Source: masim/agents/defines/opinion/gullible-spreader.md §6
      initial_credibility: 0.5  # Source: masim/agents/defines/opinion/gullible-spreader.md §6
      custom_state_hot_limit: 3  # Source: masim/agents/defines/opinion/gullible-spreader.md §6
      private_knowledge:
        from_global_resources:
          - "MinerU_processed"  # Source: masim/agents/defines/opinion/gullible-spreader.md §6
        local_resources:
          local_uri: ""  # Source: masim/agents/defines/opinion/gullible-spreader.md §6
          local_resources: []  # Source: masim/agents/defines/opinion/gullible-spreader.md §6
        rag:
          from_global_index_dir:
            - "rag_index"  # Source: masim/agents/defines/opinion/gullible-spreader.md §6
          local_index_dir: ""  # Source: masim/agents/defines/opinion/gullible-spreader.md §6
          embed_type: "litellm"  # Source: masim/agents/defines/opinion/gullible-spreader.md §6
          embed_model: "openai/hunyuan-embedding"  # Source: masim/agents/defines/opinion/gullible-spreader.md §6
          embed_api_key: "{{ HUNYUAN_API_KEY }}"  # Source: masim/agents/defines/opinion/gullible-spreader.md §6
          embed_api_base: "https://api.hunyuan.cloud.tencent.com/v1"  # Source: masim/agents/defines/opinion/gullible-spreader.md §6
          chunk_size: 512  # Source: masim/agents/defines/opinion/gullible-spreader.md §6
          chunk_overlap: 64  # Source: masim/agents/defines/opinion/gullible-spreader.md §6
          top_k: 5  # Source: masim/agents/defines/opinion/gullible-spreader.md §6
      llm:
        sys_message: "examples.RumorSpread.Rag.prompts:RAG_GULLIBLE_SYS"  # Source: masim/agents/defines/opinion/gullible-spreader.md §6
        user_message: "examples.RumorSpread.Rag.prompts:RAG_USER_TEMPLATE"  # Source: masim/agents/defines/opinion/gullible-spreader.md §6
        lm_type: "api"  # Source: masim/agents/defines/opinion/gullible-spreader.md §6
        lm_name: "ark/doubao-seed-2-0-mini-260428"  # Source: masim/agents/defines/opinion/gullible-spreader.md §6
        generation_config:
          temperature: 0.3  # Source: masim/agents/defines/opinion/gullible-spreader.md §6
          max_new_tokens: 600  # Source: masim/agents/defines/opinion/gullible-spreader.md §6
  persona: !include persona.yml

