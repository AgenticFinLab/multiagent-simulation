# =============================================================================
# RumorSpreadLLM Players Configuration
# =============================================================================
# 1 InformationEnvironment (rule-based) + 5 LLM Social Agent Types
#
# Agent Types:
#   - InformationEnvironment: Rule-based coordinator (belief dynamics)
#   - LLMGullibleSpreader: Uncritical transmitter (DESTABILIZING)
#   - LLMDistortingRelayer: Serial distortion (DESTABILIZING)
#   - LLMSkepticalEvaluator: Critical assessor (STABILIZING)
#   - LLMFactChecker: Active debunker (STRONGLY STABILIZING)
#   - LLMUninformedBystander: Random participant (NEUTRAL)
# =============================================================================

# -----------------------------------------------------------------------------
# InformationEnvironment (Coordinator) — identical to Rule variant
# -----------------------------------------------------------------------------
llm_information_environment:
  archetype: information-sis-contagion  # -> AGENT_POOL/market/information-sis-contagion.md
  name: "InformationEnvironment"
  class: "examples.RumorSpread.LLM.players:InformationEnvironment"
  num_instances: 1
  config:
    identity: "llm_information_environment"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - environment
    extras:
      record_path: "EXPERIMENT/RumorSpread/LLM/records"  # Source: AGENT_POOL/finance/information-environment.md §6
      rumor_truth_value: 0.1     # 0.0 = completely false, 1.0 = fully true  # Source: AGENT_POOL/finance/information-environment.md §6
      initial_belief: 0.3        # Starting belief level (rumor seed)  # Source: AGENT_POOL/finance/information-environment.md §6
      spread_impact: 0.15        # How strongly agent actions shift belief  # Source: AGENT_POOL/finance/information-environment.md §6
      truth_correction: 0.02     # Rate of truth-based correction  # Source: AGENT_POOL/finance/information-environment.md §6
      leveling_rate: 0.01        # Allport & Postman: detail loss rate  # Source: AGENT_POOL/finance/information-environment.md §6
      sharpening_rate: 0.02      # Allport & Postman: exaggeration rate  # Source: AGENT_POOL/finance/information-environment.md §6
      noise_std: 0.02            # Transmission noise  # Source: AGENT_POOL/finance/information-environment.md §6
      custom_state_hot_limit: 3  # Source: AGENT_POOL/finance/information-environment.md §6
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# LLM Gullible Spreaders
# -----------------------------------------------------------------------------
llm_gullible_spreader:
  name: "LLM Gullible Spreader"
  class: "examples.RumorSpread.LLM.players:LLMGullibleSpreader"
  num_instances: 5
  config:
    identity: "llm_gullible_spreader"
    role: player
    steps_per_turn: 1
    group_tags:
      - llm_agents
    extras:
      record_path: "EXPERIMENT/RumorSpread/LLM/records"  # Source: AGENT_POOL/opinion/gullible-spreader.md §6
      initial_belief: 0.3  # Source: AGENT_POOL/opinion/gullible-spreader.md §6
      initial_credibility: 0.5  # Source: AGENT_POOL/opinion/gullible-spreader.md §6
      custom_state_hot_limit: 3  # Source: AGENT_POOL/opinion/gullible-spreader.md §6
      llm:
        sys_message: "examples.RumorSpread.LLM.prompts:LLM_GULLIBLE_SYS"  # Source: AGENT_POOL/opinion/gullible-spreader.md §6
        user_message: "examples.RumorSpread.LLM.prompts:LLM_USER_TEMPLATE"  # Source: AGENT_POOL/opinion/gullible-spreader.md §6
        lm_type: "api"  # Source: AGENT_POOL/opinion/gullible-spreader.md §6
        lm_name: "ark/doubao-seed-2-0-mini-260428"  # Source: AGENT_POOL/opinion/gullible-spreader.md §6
        generation_config:
          temperature: 0.3  # Source: AGENT_POOL/opinion/gullible-spreader.md §6
          max_new_tokens: 500  # Source: AGENT_POOL/opinion/gullible-spreader.md §6
  persona: !include persona.yml

