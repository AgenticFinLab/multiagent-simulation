# =============================================================================
# RumorSpreadLLM - Topology Configuration
# =============================================================================
# Star topology: InformationEnvironment broadcasts to all LLM agents
#
#         llm_gullible_spreader ────────┐
#         llm_distorting_relayer ───────┤
#         llm_skeptical_evaluator ──────┼──▶ llm_information_environment ──▶ all agents
#         llm_fact_checker ─────────────┤             (belief, distortion, truth)
#         llm_uninformed_bystander ─────┘
# =============================================================================

type: "star"

sources:
  - llm_information_environment

connections:
  llm_information_environment:
    - llm_gullible_spreader
    - llm_distorting_relayer
    - llm_skeptical_evaluator
    - llm_fact_checker
    - llm_uninformed_bystander

  llm_gullible_spreader:
    - llm_information_environment

  llm_distorting_relayer:
    - llm_information_environment

  llm_skeptical_evaluator:
    - llm_information_environment

  llm_fact_checker:
    - llm_information_environment

  llm_uninformed_bystander:
    - llm_information_environment
