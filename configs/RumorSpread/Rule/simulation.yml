# =============================================================================
# RumorSpread Simulation Configuration
# =============================================================================
# Demonstrates rumor propagation through serial transmission with distortion.
#
# Usage:
#   python examples/RumorSpread/Rule/run_rumor.py -c configs/RumorSpread/Rule/simulation.yml
# =============================================================================

setting:
  name: "rumor_spread_simulation"
  description: "Rumor propagation through populations via serial transmission with distortion and amplification"
  total_rounds: 200
  round_history_limit: 3
  record_path: "EXPERIMENT/RumorSpread/Rule/records"
  save_diagram_interval: 50

environment:
  dotenv_path: .env
  workspace: "."

ray:
  address: null
  namespace: "rumor_spread"
  actor_prefix: null
  num_cpus: null
  num_gpus: null
  object_store_memory: 134217728
  include_dashboard: false
  logging_level: "warning"
  log_to_driver: false
  actor_options:
    max_restarts: 3
    max_task_retries: 1
    max_concurrency: 4
  runtime_env:
    working_dir: null
    pip: []
    env_vars: {}
  serialization:
    use_arrow: true
    register_custom_serializers: true

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/RumorSpread/Rule/communication"
  record_messages: true
  message_block_size: 500
