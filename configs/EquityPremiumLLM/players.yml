# =============================================================================
# EquityPremiumLLM Players Configuration
# =============================================================================

market:
  name: "Market with Stock and Bond"
  class: "examples.EquityPremiumLLM.players:Market"
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/EquityPremiumLLM/records"
      stock_expected_return: 0.000238  # ~6% annual / 252 days
      bond_return: 0.0000397  # ~1% annual / 252 days
      stock_volatility: 0.00945  # ~15% annual vol / sqrt(252)
      initial_stock_price: 100.0
      history_limit: 200
  persona: !include persona.yml

llm_myopic:
  name: "LLM Myopic Loss-Averse"
  class: "examples.EquityPremiumLLM.players:LLMMyopicLossAverse"
  config:
    identity: "llm_myopic"
    role: player
    steps_per_turn: 1
    group_tags:
      - llm_investors
    extras:
      record_path: "EXPERIMENT/EquityPremiumLLM/records"
      initial_cash: 10000.0
      initial_cash_ratio: 0.5  # 50% cash
      initial_stock_shares: 50.0
      initial_bond_ratio: 0.25  # 25% bonds
      history_limit: 50
      llm:
        sys_message: "examples.EquityPremiumLLM.prompts:LLM_MYOPIC_LOSS_AVERSE_SYS"
        user_message: "examples.EquityPremiumLLM.prompts:LLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-1-6-lite-251015"
        generation_config:
          temperature: 0.3
          max_new_tokens: 500
  persona: !include persona.yml

