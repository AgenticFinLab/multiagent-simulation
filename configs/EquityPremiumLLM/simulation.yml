# =============================================================================
# EquityPremiumLLM Simulation Configuration
# =============================================================================
# LLM-based Equity Premium Puzzle simulation - Myopic Loss Aversion
# Tests: Evaluation frequency, loss aversion, risk premium dynamics
#
# Usage:
#   python examples/EquityPremiumLLM/run_equity_llm.py -c configs/EquityPremiumLLM/simulation.yml
# =============================================================================

setting:
  name: "equity_premium_llm_simulation"
  description: "LLM-based equity premium puzzle with myopic loss aversion"
  total_rounds: 50
  entry_limit: 10
  record_path: "EXPERIMENT/EquityPremiumLLM/records"
  save_diagram_interval: 25

environment:
  dotenv_path: .env
  workspace: "."

ray:
  address: null
  namespace: "equity_premium_llm"
  actor_prefix: null
  num_cpus: 4
  num_gpus: null
  object_store_memory: null
  include_dashboard: false
  logging_level: "warning"
  log_to_driver: true
  actor_options:
    max_restarts: 3
    max_task_retries: 1
    max_concurrency: 10
  runtime_env:
    working_dir: null
    pip: []
    env_vars: {}
  serialization:
    use_arrow: true
    register_custom_serializers: true

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/EquityPremiumLLM/communication"
