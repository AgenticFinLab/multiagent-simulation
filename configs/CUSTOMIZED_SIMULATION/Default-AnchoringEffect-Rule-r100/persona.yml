# =============================================================================
# AnchoringEffect Persona Configuration
# =============================================================================

auto_checkpoint: false
debug_mode: true

proxy:
  storage:
    checkpoint_dir: "EXPERIMENT/CUSTOMIZED_SIMULATION/Default-AnchoringEffect-Rule-r100/checkpoints"
    record_path: "EXPERIMENT/CUSTOMIZED_SIMULATION/Default-AnchoringEffect-Rule-r100/records"
    record_rounds: true
    turn_block_size: 3

  monitoring:
    record_path: "EXPERIMENT/CUSTOMIZED_SIMULATION/Default-AnchoringEffect-Rule-r100/monitoring"
    monitor_hot_limit: 3

  communication:
    message_timeout_ms: 5000
    enable_compression: true

  resource:
    mcp_servers: []
    enable_caching: false
