# =============================================================================
# Demo Players Configuration
# =============================================================================
# Each player has its own persona config (can be shared via !include).
# All players are equal - topology defines communication targets.
# =============================================================================

# -----------------------------------------------------------------------------
# Coordinator (hub in star topology)
# -----------------------------------------------------------------------------
coordinator:
  name: "Coordinator"
  class: "examples.Demo.players:SimpleCoordinator"
  config:
    identity: "coordinator"
    role: coordinator
    group_tags:
      - coordinators
    extras: {}
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Regular Players
# -----------------------------------------------------------------------------
player_1:
  name: "Player 1"
  class: "examples.Demo.players:SimplePlayer"
  config:
    identity: "player_1"
    role: player
    group_tags:
      - players
    extras: {}
  persona: !include persona.yml

player_2:
  name: "Player 2"
  class: "examples.Demo.players:SimplePlayer"
  config:
    identity: "player_2"
    role: player
    group_tags:
      - players
    extras: {}
  persona: !include persona.yml
