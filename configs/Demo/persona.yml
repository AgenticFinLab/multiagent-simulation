# =============================================================================
# Persona Configuration
# =============================================================================
# Defines proxy settings and runtime behavior for a player's persona.
# Each player can have its own persona config, or share one via !include.
# =============================================================================

auto_checkpoint: false
debug_mode: true

proxy:
  storage:
    checkpoint_dir: "EXPERIMENT/Demo/checkpoints"
    result_path: "EXPERIMENT/Demo/results"
    record_rounds: true
  
  observability:
    metrics_backend: "memory"
    logging_backend: "structured"
    log_dir: "EXPERIMENT/Demo/logs"
    log_level: "INFO"
  
  communication:
    message_timeout_ms: 5000
    enable_compression: true
  
  resource:
    mcp_servers: []
    enable_caching: false
