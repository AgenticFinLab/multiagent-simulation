# =============================================================================
# Demo Simulation Configuration
# =============================================================================
# Demonstrates topology-driven message passing architecture.
#
# Usage:
#   python examples/Demo/run_demo.py -c configs/Demo/simulation.yml
# =============================================================================

# -----------------------------------------------------------------------------
# Simulation Settings
# -----------------------------------------------------------------------------
setting:
  name: "demo_simulation"
  description: "Demo topology-driven message passing"
  total_rounds: 3
  entry_limit: 100
  steps_per_turn: 1

# -----------------------------------------------------------------------------
# Environment Settings
# -----------------------------------------------------------------------------
environment:
  dotenv_path: .env
  workspace: "."

# -----------------------------------------------------------------------------
# Ray Cluster Configuration
# -----------------------------------------------------------------------------
ray:
  address: null
  namespace: "demo_simulation"
  actor_prefix: null
  num_cpus: 2
  num_gpus: null
  object_store_memory: null
  include_dashboard: false
  logging_level: "warning"
  log_to_driver: true
  actor_options:
    max_restarts: 3
    max_task_retries: 1
    max_concurrency: 10
  runtime_env:
    working_dir: null
    pip: []
    env_vars: {}
  serialization:
    use_arrow: true
    register_custom_serializers: true

# -----------------------------------------------------------------------------
# Players Configuration
# -----------------------------------------------------------------------------
players: !include players.yml

# -----------------------------------------------------------------------------
# Communication Topology
# -----------------------------------------------------------------------------
topology: !include topology.yml
