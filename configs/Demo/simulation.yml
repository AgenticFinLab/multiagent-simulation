# =============================================================================
# Demo Simulation Configuration
# =============================================================================
# Demonstrates topology-driven message passing architecture.
#
# Usage:
#   python examples/Demo/run_demo.py -c configs/Demo/simulation.yml
# =============================================================================

# -----------------------------------------------------------------------------
# Simulation Settings
# -----------------------------------------------------------------------------
setting:
  name: "demo_simulation"
  description: "Demo topology-driven message passing"
  total_rounds: 3
  round_history_limit: 3
  save_diagram_interval: 1
  # Simulation-level records (diagrams, etc.)
  record_path: "EXPERIMENT/Demo/records"

# -----------------------------------------------------------------------------
# Environment Settings
# -----------------------------------------------------------------------------
environment:
  dotenv_path: .env
  workspace: "."

# -----------------------------------------------------------------------------
# Ray Cluster Configuration
# -----------------------------------------------------------------------------
ray:
  address: null
  namespace: "demo_simulation"
  actor_prefix: null
  # Derived: 2 investors run parallel at level 1; +1 for OS/driver = 3
  num_cpus: 3
  num_gpus: null
  # Derived: 3 players, star topology -> 4 msgs/round
  #   3 TurnResult + 3 pending_info + 4 Message = 10 Ray objects
  #   10 obj x 64 KB min-alloc = 640 KB (0.62 MB)
  #   10x headroom = 6.2 MB; 128 MB minimum floor -> 134217728 bytes
  object_store_memory: 134217728
  include_dashboard: false
  logging_level: "warning"
  log_to_driver: false
  actor_options:
    max_restarts: 3
    max_task_retries: 1
    max_concurrency: 4
  runtime_env:
    working_dir: null
    pip: []
    env_vars: {}
  serialization:
    use_arrow: true
    register_custom_serializers: true

# -----------------------------------------------------------------------------
# Players Configuration
# -----------------------------------------------------------------------------
players: !include players.yml

# -----------------------------------------------------------------------------
# Communication Topology
# -----------------------------------------------------------------------------
topology: !include topology.yml

# -----------------------------------------------------------------------------
# Communication Channel Configuration
# -----------------------------------------------------------------------------
# Settings for the central communication channel (message dispatch and recording)
communication:
  # Storage path for message records (required)
  storage_path: "EXPERIMENT/Demo/communication"
  record_messages: true
  message_block_size: 500
