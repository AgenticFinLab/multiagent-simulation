# EuropeanDebtCrisis RuleLLM Agent Configuration

market:
  name: "Market"
  class: "examples.EuropeanDebtCrisis.Rule.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/EuropeanDebtCrisis/RuleLLM/records"
      initial_price: 95.0
      fundamental_value: 100.0
      core_price: 100.0
      price_impact: 0.05
      mean_reversion: 0.02
      noise_std: 0.01
      custom_state_hot_limit: 3
  persona: !include persona.yml

rulellm_periphery_bond_seller:
  name: "PeripheryBondSeller"
  class: "examples.EuropeanDebtCrisis.RuleLLM.players:RuleLLMPeripheryBondSeller"
  num_instances: 2
  config:
    identity: "rulellm_periphery_bond_seller"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/EuropeanDebtCrisis/RuleLLM/records"
      initial_cash: 1000000.0
      initial_position: 500
      initial_price: 95.0
      fundamental_value: 100.0
      core_price: 100.0
      panic_threshold: 5.0
      base_size: 300
      custom_state_hot_limit: 3
      llm:
        sys_message: "examples.EuropeanDebtCrisis.RuleLLM.prompts:RULELLM_PERIPHERY_BOND_SELLER_SYS"
        user_message: "examples.EuropeanDebtCrisis.RuleLLM.prompts:RULELLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.7
          max_tokens: 512
  persona: !include persona.yml

