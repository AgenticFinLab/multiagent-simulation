# EuropeanDebtCrisis RuleLLM Agent Configuration

market:
  name: "Market"
  class: "examples.EuropeanDebtCrisis.Rule.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/EuropeanDebtCrisis/RuleLLM/records"  # Source: AGENT_POOL/finance/market.md §6
      initial_price: 95.0  # Source: AGENT_POOL/finance/market.md §6
