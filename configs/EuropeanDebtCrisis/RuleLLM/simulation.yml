# EuropeanDebtCrisis RuleLLM Simulation Configuration
#
# EuropeanDebtCrisis simulation
#
# Usage:
#   python examples/EuropeanDebtCrisis/RuleLLM/run_europeandebtcrisis_rulellm.py \
#       -c configs/EuropeanDebtCrisis/RuleLLM/simulation.yml

setting:
  name: "EuropeanDebtCrisis-RuleLLM"
  description: "EuropeanDebtCrisis simulation - RuleLLM agents"
  total_rounds: 200

  record_path: "EXPERIMENT/EuropeanDebtCrisis/RuleLLM/records"
  storage_path: "EXPERIMENT/EuropeanDebtCrisis/RuleLLM/communication"

  log_level: "INFO"
  log_to_file: true
  log_path: "EXPERIMENT/EuropeanDebtCrisis/RuleLLM/logs"

environment:
  dotenv_path: ".env"
  workspace: "."

ray:
  namespace: "europeandebtcrisis_rulellm"
  ignore_reinit_error: true
  object_store_memory: 536870912
  num_cpus: 4

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/EuropeanDebtCrisis/RuleLLM/communication"
  record_messages: true
  message_timeout_ms: 5000
  max_retries: 3
