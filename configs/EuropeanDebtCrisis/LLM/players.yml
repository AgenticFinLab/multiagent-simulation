# EuropeanDebtCrisis LLM Agent Configuration

market:
  archetype: bond-yield-spread-inverse  # -> masim/agents/defines/market/bond-yield-spread-inverse.md
  name: "Market"
  class: "examples.EuropeanDebtCrisis.LLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/EuropeanDebtCrisis/LLM/records"  # Source: masim/agents/defines/finance/market.md §6
      initial_price: 95.0  # Source: masim/agents/defines/finance/market.md §6
      fundamental_value: 100.0  # Source: masim/agents/defines/finance/market.md §6
      core_price: 100.0  # Source: masim/agents/defines/finance/market.md §6
      price_impact: 0.05  # Source: masim/agents/defines/finance/market.md §6
      mean_reversion: 0.02  # Source: masim/agents/defines/finance/market.md §6
      noise_std: 0.01  # Source: masim/agents/defines/finance/market.md §6
      custom_state_hot_limit: 3  # Source: masim/agents/defines/finance/market.md §6
  persona: !include persona.yml

