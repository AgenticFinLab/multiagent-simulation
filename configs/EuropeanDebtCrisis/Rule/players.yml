# EuropeanDebtCrisis Rule Agent Configuration

market:
  name: "Market"
  class: "examples.EuropeanDebtCrisis.Rule.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/EuropeanDebtCrisis/Rule/records"  # Source: infrastructure
      initial_price: 95.0        # Source: simulation-bases.md §3 (starts below fundamental)
      fundamental_value: 100.0   # Source: simulation-bases.md §3 (normalized sustainable bond price)
      core_price: 100.0          # Source: simulation-bases.md §3 (core market reference)
      price_impact: 0.05         # Source: simulation-bases.md §6 (sovereign bond market sensitivity)
      mean_reversion: 0.02       # Source: simulation-bases.md §6 (slow fiscal-fundamental reversion)
      noise_std: 0.01            # Source: simulation-bases.md §6 (low market noise)
      custom_state_hot_limit: 3  # Source: infrastructure
  persona: !include persona.yml

rule_periphery_bond_seller:
  name: "PeripheryBondSeller"
  class: "examples.EuropeanDebtCrisis.Rule.players:PeripheryBondSeller"
  num_instances: 2
  config:
    identity: "rule_periphery_bond_seller"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/EuropeanDebtCrisis/Rule/records"  # Source: infrastructure
      initial_cash: 1000000.0    # Source: simulation-bases.md §6 (normalization)
      initial_position: 500      # Source: simulation-bases.md §4.1 (initial periphery bond holdings)
      sell_threshold: -0.10      # Source: simulation-bases.md §4.1.4 (self-fulfilling sell trigger)
      base_size: 300             # Source: simulation-bases.md §4.1.4 (sell volume cap parameter)
      custom_state_hot_limit: 3  # Source: infrastructure
  persona: !include persona.yml

rule_creditor_panicker:
  name: "CreditorPanicker"
  class: "examples.EuropeanDebtCrisis.Rule.players:CreditorPanicker"
  num_instances: 2
  config:
    identity: "rule_creditor_panicker"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/EuropeanDebtCrisis/Rule/records"  # Source: infrastructure
      initial_cash: 1000000.0    # Source: simulation-bases.md §6 (normalization)
      initial_position: 400      # Source: simulation-bases.md §4.2 (creditor funding exposure)
      panic_threshold: -0.15     # Source: simulation-bases.md §4.2.4 (deeper stress threshold)
      base_size: 350             # Source: simulation-bases.md §4.2.4 (panic sell volume)
      custom_state_hot_limit: 3  # Source: infrastructure
  persona: !include persona.yml

rule_core_bond_buyer:
  name: "CoreBondBuyer"
  class: "examples.EuropeanDebtCrisis.Rule.players:CoreBondBuyer"
  num_instances: 1
  config:
    identity: "rule_core_bond_buyer"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/EuropeanDebtCrisis/Rule/records"  # Source: infrastructure
      initial_cash: 1000000.0    # Source: simulation-bases.md §6 (normalization)
      initial_position: 0        # Source: simulation-bases.md §4.3 (starts with no peripheral holdings)
      flight_threshold: -0.08    # Source: simulation-bases.md §4.3.4 (flight-to-quality activation)
      base_size: 300             # Source: simulation-bases.md §4.3.4 (buy volume cap)
      custom_state_hot_limit: 3  # Source: infrastructure
  persona: !include persona.yml

rule_ecb_intervenor:
  name: "ECBIntervenor"
  class: "examples.EuropeanDebtCrisis.Rule.players:ECBIntervenor"
  num_instances: 1
  config:
    identity: "rule_ecb_intervenor"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/EuropeanDebtCrisis/Rule/records"  # Source: infrastructure
      initial_cash: 5000000.0    # Source: simulation-bases.md §4.4 (large central-bank firepower)
      initial_position: 0        # Source: simulation-bases.md §4.4 (starts without bond holdings)
      intervention_threshold: -0.20  # Source: simulation-bases.md §4.4.4 (severe stress threshold)
      intervention_size: 600     # Source: simulation-bases.md §4.4.4 (large backstop order size)
      custom_state_hot_limit: 3  # Source: infrastructure
  persona: !include persona.yml

rule_hedged_fund:
  name: "HedgedFund"
  class: "examples.EuropeanDebtCrisis.Rule.players:HedgedFund"
  num_instances: 1
  config:
    identity: "rule_hedged_fund"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/EuropeanDebtCrisis/Rule/records"  # Source: infrastructure
      initial_cash: 1000000.0    # Source: simulation-bases.md §6 (normalization)
      initial_position: 0        # Source: simulation-bases.md §4.5 (starts flat for relative-value)
      entry_threshold: 0.07      # Source: simulation-bases.md §4.5.4 (spread entry threshold)
      base_size: 400             # Source: simulation-bases.md §4.5.4 (position size cap)
      custom_state_hot_limit: 3  # Source: infrastructure
  persona: !include persona.yml
