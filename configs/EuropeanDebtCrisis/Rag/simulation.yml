# EuropeanDebtCrisis Rag Simulation Configuration
#
# EuropeanDebtCrisis simulation
#
# Usage:
#   python examples/EuropeanDebtCrisis/Rag/run_europeandebtcrisis_rag.py \
#       -c configs/EuropeanDebtCrisis/Rag/simulation.yml

setting:
  name: "EuropeanDebtCrisis-Rag"
  description: "EuropeanDebtCrisis simulation - Rag agents"
  total_rounds: 200

  record_path: "EXPERIMENT/EuropeanDebtCrisis/Rag/records"
  storage_path: "EXPERIMENT/EuropeanDebtCrisis/Rag/communication"

  log_level: "INFO"
  log_to_file: true
  log_path: "EXPERIMENT/EuropeanDebtCrisis/Rag/logs"

environment:
  dotenv_path: ".env"
  workspace: "."

ray:
  namespace: "europeandebtcrisis_rag"
  ignore_reinit_error: true
  object_store_memory: 536870912
  num_cpus: 4

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/EuropeanDebtCrisis/Rag/communication"
  record_messages: true
  message_timeout_ms: 5000
  max_retries: 3
