# StatusQuoBias Rule Simulation Configuration
#
# StatusQuoBias simulation
#
# Usage:
#   python examples/StatusQuoBias/Rule/run_statusquobias_rule.py \
#       -c configs/StatusQuoBias/Rule/simulation.yml

setting:
  name: "StatusQuoBias-Rule"
  description: "StatusQuoBias simulation - Rule agents"
  total_rounds: 200

  record_path: "EXPERIMENT/StatusQuoBias/Rule/records"
  storage_path: "EXPERIMENT/StatusQuoBias/Rule/communication"

  log_level: "INFO"
  log_to_file: true
  log_path: "EXPERIMENT/StatusQuoBias/Rule/logs"

environment:
  dotenv_path: ".env"
  workspace: "."

ray:
  namespace: "statusquobias_rule"
  ignore_reinit_error: true
  object_store_memory: 536870912
  num_cpus: 4

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/StatusQuoBias/Rule/communication"
  record_messages: true
  message_timeout_ms: 5000
  max_retries: 3
