      initial_cash: 1000000.0
      initial_position: 0


momentumtrader_4:
  name: "MomentumTrader 4"
  class: "examples.StatusQuoBias.Rule.players:MomentumTrader"
  num_instances: 1
  config:
    identity: "momentumtrader_4"
    role: player
    extras:
      initial_cash: 1000000.0
