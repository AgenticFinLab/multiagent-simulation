# StatusQuoBias RuleLLM Simulation Configuration
#
# StatusQuoBias simulation
#
# Usage:
#   python examples/StatusQuoBias/RuleLLM/run_statusquobias_rulellm.py \
#       -c configs/StatusQuoBias/RuleLLM/simulation.yml

setting:
  name: "StatusQuoBias-RuleLLM"
  description: "StatusQuoBias simulation - RuleLLM agents"
  total_rounds: 200

  record_path: "EXPERIMENT/StatusQuoBias/RuleLLM/records"
  storage_path: "EXPERIMENT/StatusQuoBias/RuleLLM/communication"

  log_level: "INFO"
  log_to_file: true
  log_path: "EXPERIMENT/StatusQuoBias/RuleLLM/logs"

environment:
  dotenv_path: ".env"
  workspace: "."

ray:
  namespace: "statusquobias_rulellm"
  ignore_reinit_error: true
  object_store_memory: 536870912
  num_cpus: 4

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/StatusQuoBias/RuleLLM/communication"
  record_messages: true
  message_timeout_ms: 5000
  max_retries: 3
