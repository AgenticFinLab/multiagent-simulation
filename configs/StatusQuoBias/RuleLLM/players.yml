# StatusQuoBias RuleLLM Agent Configuration

market:
  name: "Market"
  class: "examples.StatusQuoBias.RuleLLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/StatusQuoBias/RuleLLM/records"
      initial_price: 100.0
      fundamental_value: 100.0
      price_impact: 0.02
      mean_reversion: 0.02
      noise_std: 0.01
      custom_state_hot_limit: 3
  persona: !include persona.yml

inertialholder:
  name: "InertialHolder"
  class: "examples.StatusQuoBias.RuleLLM.players:RuleLLMInertialHolder"
  num_instances: 3
  config:
    identity: "inertialholder"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/StatusQuoBias/RuleLLM/records"
      initial_cash: 1000000.0
      initial_position: 500
      initial_price: 100.0
      fundamental_value: 100.0
      inertia_strength: 0.9
      change_threshold: 0.3
      base_size: 200
      custom_state_hot_limit: 3
      llm:
        sys_message: "examples.StatusQuoBias.RuleLLM.prompts:RULELLM_INERTIAL_HOLDER_SYS"
        user_message: "examples.StatusQuoBias.RuleLLM.prompts:RULELLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.3
          max_tokens: 512
  persona: !include persona.yml

defaultfollower:
  name: "DefaultFollower"
  class: "examples.StatusQuoBias.RuleLLM.players:RuleLLMDefaultFollower"
  num_instances: 3
  config:
    identity: "defaultfollower"
