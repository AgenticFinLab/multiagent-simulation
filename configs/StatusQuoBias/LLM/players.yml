# StatusQuoBias LLM Agent Configuration
# Traceability: every extras leaf is annotated with a `# Source:` comment
# pointing to the corresponding row in the target-file §9 Parameter Seeds
# table (`examples/StatusQuoBias/finance-statusquobias.md`). Per
# `agent-design-skill.md §3.6.0 I/O Contract`, LLM/RuleLLM/Rag variants
# expose an `agent_type` field inside each investor's `extras` block so that
# the persona-driven policy can reference the intended archetype explicitly.

market:
  name: "Market"
  class: "examples.StatusQuoBias.LLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/StatusQuoBias/LLM/records"   # Source: runtime plumbing (records path); not a §9 parameter
      initial_price: 100.0                                  # Source: target §9 market.extras.initial_price row; normalization (simulation-bases.md §6)
      fundamental_value: 100.0                              # Source: target §9 market.extras.fundamental_value row; normalization (simulation-bases.md §6)
      price_impact: 0.02                                    # Source: target §9 market.extras.price_impact row; simulation-bases.md §3.1
      mean_reversion: 0.02                                  # Source: target §9 market.extras.mean_reversion row; simulation-bases.md §3.1
      noise_std: 0.01                                       # Source: target §9 market.extras.noise_std row; simulation-bases.md §3.1
      custom_state_hot_limit: 3                             # Source: target §9 custom_state_hot_limit row; runtime plumbing
  persona: !include persona.yml

llm_inertial_holder:
  name: "InertialHolder"
  class: "examples.StatusQuoBias.LLM.players:LLMInertialHolder"
  num_instances: 3                                          # Source: target §9 inertialholder.num_instances row; agent roster §7
  config:
    identity: "llm_inertial_holder"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/StatusQuoBias/LLM/records"   # Source: runtime plumbing (records path); not a §9 parameter
      agent_type: "InertialHolder"                          # Source: agent-design-skill.md §3.6.0 I/O Contract; identifies the persona archetype for logging/analysis
      initial_cash: 1000000.0                               # Source: target §9 inertialholder.extras.initial_cash row
      initial_position: 500                                 # Source: target §9 inertialholder.extras.initial_position row
      initial_price: 100.0                                  # Source: target §9 market.extras.initial_price row; agent-side echo
      fundamental_value: 100.0                              # Source: target §9 market.extras.fundamental_value row; agent-side echo
      inertia_strength: 0.9                                 # Source: target §9 inertialholder.extras.inertia_strength row; simulation-bases.md §4.1
      change_threshold: 0.3                                 # Source: target §9 inertialholder.extras.change_threshold row; Samuelson and Zeckhauser (1988), 10.1007/BF00055564
      base_size: 200                                        # Source: target §9 inertialholder.extras.base_size row; simulation-bases.md §4.1
      custom_state_hot_limit: 3                             # Source: target §9 custom_state_hot_limit row; runtime plumbing
      llm:
        sys_message: "examples.StatusQuoBias.LLM.prompts:LLM_INERTIAL_HOLDER_SYS"
        user_message: "examples.StatusQuoBias.LLM.prompts:LLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.3
          max_tokens: 512
  persona: !include persona.yml

