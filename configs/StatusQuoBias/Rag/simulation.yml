# StatusQuoBias Rag Simulation Configuration
#
# StatusQuoBias simulation
#
# Usage:
#   python examples/StatusQuoBias/Rag/run_statusquobias_rag.py \
#       -c configs/StatusQuoBias/Rag/simulation.yml

setting:
  name: "StatusQuoBias-Rag"
  description: "StatusQuoBias simulation - Rag agents"
  total_rounds: 200

  record_path: "EXPERIMENT/StatusQuoBias/Rag/records"
  storage_path: "EXPERIMENT/StatusQuoBias/Rag/communication"

  log_level: "INFO"
  log_to_file: true
  log_path: "EXPERIMENT/StatusQuoBias/Rag/logs"

environment:
  dotenv_path: ".env"
  workspace: "."

ray:
  namespace: "statusquobias_rag"
  ignore_reinit_error: true
  object_store_memory: 536870912
  num_cpus: 4

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/StatusQuoBias/Rag/communication"
  record_messages: true
  message_timeout_ms: 5000
  max_retries: 3
