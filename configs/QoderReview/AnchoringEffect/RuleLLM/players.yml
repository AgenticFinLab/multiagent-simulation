# =============================================================================
# AnchoringEffectRuleLLM Players Configuration
# =============================================================================
# 1 Market (rule-based) + 12 Hybrid Rule+LLM investor instances across 9 personas
# aligned with simulation-bases.md §4.1–§4.9.
# Each LLM agent's system prompt embeds:
#   - == PERSONA ==: identity, style, behavioral traits (from LLM variant)
#   - == DECISION RULES ==: exact quantitative formulas mirroring the Rule variant
# =============================================================================

# -----------------------------------------------------------------------------
# Market (Coordinator) — rule-based, identical to Rule variant
# -----------------------------------------------------------------------------
market:
  archetype: stock-standard-price-impact  # -> AGENT_POOL/market/stock-standard-price-impact.md
  name: "Market"
  class: "examples.AnchoringEffect.RuleLLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/AnchoringEffect/RuleLLM/records"  # Source: implementation infrastructure (record path convention per 07-step3-config.md §3.7)
      # Market dynamics parameters (identical to Rule variant)
      fundamental_value: 100.0  # Source: target §9 F; simulation-bases.md §3.1 (normalization, 100-scale index)
      initial_price: 105.0  # Source: target §9 P0; simulation-bases.md §3.1 (5% above F, IPO-anchor seed)
      price_impact: 0.01        # Low: anchoring effect slows price discovery
      mean_reversion: 0.01      # Low: sustains anchoring persistence
      noise_std: 0.5            # Moderate price noise
      custom_state_hot_limit: 3  # Source: implementation infrastructure (hot-state ring buffer per masim.core state contract)
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Hybrid Anchored Traders (Anchor persona + explicit anchor formula)
# Theory: Tversky & Kahneman (1974) — Anchoring and Insufficient Adjustment
# Rule: perceived = anchor + (F - anchor) * 0.3
# -----------------------------------------------------------------------------
rulellm_anchored_trader:
  name: "RuleLLM Anchored Trader"
  class: "examples.AnchoringEffect.RuleLLM.players:RuleLLMAnchoredTrader"
  # Expander → rulellm_anchored_trader_1, rulellm_anchored_trader_2
  num_instances: 2
  config:
    identity: "rulellm_anchored_trader"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/AnchoringEffect/RuleLLM/records"  # Source: implementation infrastructure (record path convention per 07-step3-config.md §3.7)
      initial_cash: 10000.0  # Source: target §9 C0; portfolio normalization (10000-scale)
      initial_position: 100.0  # Source: target §9 Q0; portfolio normalization (100-share seed)
      custom_state_hot_limit: 3  # Source: implementation infrastructure (hot-state ring buffer per masim.core state contract)
      # Rule parameters (from AnchoringEffect AnchoredTrader)
      adjustment_factor: 0.3  # Source: target §9 alpha; Tversky & Kahneman (1974) https://doi.org/10.1126/science.185.4157.1124
      base_position_size: 20.0  # Source: target §9 b; simulation-bases.md §6 (base-size normalization, mid-range)
      llm:
        sys_message: "examples.AnchoringEffect.RuleLLM.prompts:RULELLM_ANCHORED_TRADER_SYS"  # Source: LLM wiring — persona system prompt (prompts.py)
        user_message: "examples.AnchoringEffect.RuleLLM.prompts:RULELLM_USER_TEMPLATE"  # Source: LLM wiring — user-message template (prompts.py)
        lm_type: "api"  # Source: LLM wiring — OpenAI-style API adapter (masim.utils.llm_utils)
        lm_name: "ark/doubao-seed-2-0-mini-260428"  # Source: LLM wiring — ByteDance Doubao mini model endpoint
        generation_config:
          temperature: 0.7  # Source: LLM wiring — sampling temperature (persona-dependent)
          max_tokens: 512  # Source: LLM wiring — max response tokens
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Hybrid Historical Anchors (Historical anchor persona + historical avg formula)
# Theory: Northcraft & Neale (1987) — Experts anchor to past prices
# Rule: perceived_dev = (price - hist_avg) / hist_avg * (1 - 0.5)
# -----------------------------------------------------------------------------
