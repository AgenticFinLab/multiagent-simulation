  name: "RuleLLM Historical Anchor"
  class: "examples.AnchoringEffect.RuleLLM.players:RuleLLMHistoricalAnchor"
  # Expander → rulellm_historical_anchor_1, rulellm_historical_anchor_2
  num_instances: 2
