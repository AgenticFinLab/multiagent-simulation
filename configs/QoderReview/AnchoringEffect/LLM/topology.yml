# =============================================================================
# AnchoringEffectLLM Topology - Star Pattern
# =============================================================================
# Market as hub, all LLM investors communicate through market.
#
# Note: player keys with num_instances > 1 use their base key here.
# The simulator expander resolves them to foo_1, foo_2, ... before building
# the TopologyGraph, so all edge rules apply to every instance automatically.
#
#         llm_anchored_trader ──────────────┐
#         llm_historical_anchor ────────────┤
#         llm_rational_updater ─────────────┼──▶ market ──▶ all investors
#         llm_momentum_trader ──────────────┤             (market data: price, deviation)
#         llm_noise_trader ─────────────────┘
#
# Execution flow per round:
#   Level 0: market executes (broadcasts price + deviation metrics)
#   Level 1: all investors execute in parallel (submit P,Q orders)
# =============================================================================

type: "star"

sources:
  - market

connections:
  # Market → All investors (price + deviation data broadcast)
  market:
    - llm_anchored_trader
    - llm_historical_anchor
    - llm_rational_updater
    - llm_momentum_trader
    - llm_noise_trader

  # Each investor → Market only (order submission)
  llm_anchored_trader:
    - market

  llm_historical_anchor:
    - market

  llm_rational_updater:
    - market

  llm_momentum_trader:
    - market

  llm_noise_trader:
    - market
