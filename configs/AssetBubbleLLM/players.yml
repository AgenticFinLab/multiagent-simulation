# =============================================================================
# AssetBubbleLLM Players Configuration
# =============================================================================
# 1 Market (rule-based) + 5 LLM Bubble Investors
# =============================================================================

# Market (rule-based)
market:
  name: "Market"
  class: "examples.AssetBubbleLLM.players:Market"
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/AssetBubbleLLM/records"
      # Market parameters
      fundamental_value: 100.0
      initial_price: 100.0
      price_impact: 0.15
      mean_reversion: 0.005
      fundamental_growth: 0.001
      noise_std: 0.3
      short_cost_rate: 0.02
      history_limit: 300
  persona: !include persona.yml

# LLM Greater Fool Speculator
llm_greater_fool:
  name: "LLM Greater Fool Speculator"
  class: "examples.AssetBubbleLLM.players:LLMGreaterFoolSpeculator"
  config:
    identity: "llm_greater_fool"
    role: player
    steps_per_turn: 1
    group_tags:
      - llm_investors
    extras:
      record_path: "EXPERIMENT/AssetBubbleLLM/records"
      initial_cash: 10000.0
      initial_position: 0.0
      history_limit: 100
      llm:
        sys_message: "examples.AssetBubbleLLM.prompts:LLM_GREATER_FOOL_SYS"
        user_message: "examples.AssetBubbleLLM.prompts:LLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-1-6-lite-251015"
        generation_config:
          temperature: 0.3
          max_new_tokens: 500
  persona: !include persona.yml

