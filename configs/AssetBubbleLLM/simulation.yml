# =============================================================================
# AssetBubbleLLM Simulation Configuration
# =============================================================================
# LLM-based Asset Bubble simulation
# Tests: Greater Fool Theory, Limits to Arbitrage, Noise Trader Risk
#
# Usage:
#   python examples/AssetBubbleLLM/run_bubble_llm.py -c configs/AssetBubbleLLM/simulation.yml
# =============================================================================

setting:
  name: "asset_bubble_llm_simulation"
  description: "LLM-based asset bubble formation with heterogeneous investors"
  total_rounds: 50
  entry_limit: 10
  record_path: "EXPERIMENT/AssetBubbleLLM/records"
  save_diagram_interval: 25

environment:
  dotenv_path: .env
  workspace: "."

ray:
  address: null
  namespace: "asset_bubble_llm"
  actor_prefix: null
  num_cpus: 4
  num_gpus: null
  object_store_memory: null
  include_dashboard: false
  logging_level: "warning"
  log_to_driver: true
  actor_options:
    max_restarts: 3
    max_task_retries: 1
    max_concurrency: 10
  runtime_env:
    working_dir: null
    pip: []
    env_vars: {}
  serialization:
    use_arrow: true
    register_custom_serializers: true

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/AssetBubbleLLM/communication"
