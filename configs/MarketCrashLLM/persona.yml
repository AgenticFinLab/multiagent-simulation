# =============================================================================
# MarketCrashLLM Persona Configuration
# =============================================================================

auto_checkpoint: false
debug_mode: true

proxy:
  storage:
    checkpoint_dir: "EXPERIMENT/MarketCrashLLM/checkpoints"
    record_path: "EXPERIMENT/MarketCrashLLM/records"
    record_rounds: true
  
  monitoring:
    record_path: "EXPERIMENT/MarketCrashLLM/monitoring"
    entry_limit: 10
  
  communication:
    message_timeout_ms: 30000
    enable_compression: true
  
  resource:
    mcp_servers: []
    enable_caching: false
