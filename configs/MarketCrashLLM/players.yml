market:
  name: "Market with Liquidity Dynamics"
  class: "examples.MarketCrashLLM.players:Market"
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      price_model: "liquidity_adjusted"
      fundamental_value: 100.0
  persona: !include persona.yml

llm_panic_seller:
  name: "LLM Panic Seller"
  class: "examples.MarketCrashLLM.players:LLMPanicSeller"
  config:
    identity: "llm_panic_seller"
    role: player
    steps_per_turn: 1
    group_tags:
      - llm_investors
    extras:
      strategy: panic_seller
      llm:
        sys_message: "examples.MarketCrashLLM.prompts:LLM_PANIC_SELLER_SYS"
        user_message: "examples.MarketCrashLLM.prompts:LLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-1-6-lite-251015"
        generation_config:
          temperature: 0.5
          max_new_tokens: 500
  persona: !include persona.yml

