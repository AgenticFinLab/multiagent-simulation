# =============================================================================
# FlashCrash Persona Configuration
# =============================================================================

auto_checkpoint: false
debug_mode: true

proxy:
  storage:
    checkpoint_dir: "EXPERIMENT/FlashCrash/checkpoints"
    record_path: "EXPERIMENT/FlashCrash/records"
    record_rounds: true

  monitoring:
    record_path: "EXPERIMENT/FlashCrash/monitoring"
    entry_limit: 100

  communication:
    message_timeout_ms: 5000
    enable_compression: true

  resource:
    mcp_servers: []
    enable_caching: false
