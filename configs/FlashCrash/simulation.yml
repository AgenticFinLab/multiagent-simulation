# =============================================================================
# FlashCrash Simulation Configuration
# =============================================================================
# Demonstrates flash crash dynamics with algorithmic trading and liquidity

setting:
  name: "flash_crash_simulation"
  description: "Market microstructure with HFT and liquidity dynamics"
  total_rounds: 300
  entry_limit: 100
  record_path: "EXPERIMENT/FlashCrash/records"
  save_diagram_interval: 50

environment:
  dotenv_path: .env
  workspace: "."

ray:
  address: null
  namespace: "flash_crash"
  actor_prefix: null
  num_cpus: 4
  num_gpus: null
  object_store_memory: null
  include_dashboard: false
  logging_level: "warning"
  log_to_driver: true
  actor_options:
    max_restarts: 3
    max_task_retries: 1
    max_concurrency: 10
  runtime_env:
    working_dir: null
    pip: []
    env_vars: {}
  serialization:
    use_arrow: true
    register_custom_serializers: true

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/FlashCrash/communication"
