# =============================================================================
# FlashCrashRag - Topology Configuration
# =============================================================================
# Star topology: Market broadcasts to all RAG+LLM investors
# =============================================================================

type: "star"

sources:
  - market

connections:
  market:
    - ragllm_high_frequency_trader
    - ragllm_market_maker
    - ragllm_algorithmic_trader
    - ragllm_stop_loss_trader
    - ragllm_fundamental_trader

  ragllm_high_frequency_trader:
    - market

  ragllm_market_maker:
    - market

  ragllm_algorithmic_trader:
    - market

  ragllm_stop_loss_trader:
    - market

  ragllm_fundamental_trader:
    - market
