# =============================================================================
# FlashCrashRag Players Configuration
# =============================================================================
# 1 Market (rule-based) + 5 RAG-augmented LLM Investors
#
# Knowledge Architecture:
#   The shared knowledge: block is defined at the TOP of this file, before the
#   market definition. The config loader automatically detects "knowledge" inside
#   the players dict and promotes it to config top-level.
# =============================================================================

# =============================================================================
# Shared Knowledge Configuration
# =============================================================================
knowledge:
  backend: "local"
  global_uri: "examples/document-sources"
  resource_csv:
    - "examples/document-sources/books.csv"
    - "examples/document-sources/source"
  preprocessing:
    parser: "mineru"
    timeout_per_page: 30
    max_pages: 250
    output_position: "MinerU_processed"
  rag:
    output_position: "rag_index"
    embed_type: "litellm"
    embed_model: "openai/hunyuan-embedding"
    embed_api_key: "{{ HUNYUAN_API_KEY }}"
    embed_api_base: "https://api.hunyuan.cloud.tencent.com/v1"
    chunk_size: 512
    chunk_overlap: 64

# =============================================================================
# Market (rule-based, identical to FlashCrash)
# =============================================================================
market:
  archetype: stock-standard-price-impact  # -> masim/agents/defines/market/stock-standard-price-impact.md
  name: "Market"
  class: "examples.FlashCrash.Rag.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/FlashCrash/Rag/records"  # Source: infrastructure
      fundamental_value: 100.0  # Source: target §9 — normalization
      initial_price: 100.0  # Source: target §9 — normalization
      base_price_impact: 0.05  # Source: target §9 — simulation-bases.md §3
      mean_reversion: 0.02  # Source: target §9 — simulation-bases.md §3
      noise_std: 0.3  # Source: target §9 — simulation-bases.md §3
      low_liquidity_threshold: 50.0  # Source: target §9 — simulation-bases.md §3
      high_impact_multiplier: 3.0  # Source: target §9 — simulation-bases.md §3
      base_liquidity: 50.0  # Source: target §9 — simulation-bases.md §3
      custom_state_hot_limit: 3  # Source: infrastructure
  persona: !include persona.yml

# =============================================================================
# RAG HFT (Momentum detection + LLM + RAG)
# =============================================================================
ragllm_high_frequency_trader:
  name: "RAG HFT"
  class: "examples.FlashCrash.Rag.players:RagLLMHighFrequencyTrader"
  num_instances: 3
  config:
    identity: "ragllm_high_frequency_trader"
    role: player
    steps_per_turn: 1
    group_tags:
      - ragllm_investors
    extras:
      record_path: "EXPERIMENT/FlashCrash/Rag/records"  # Source: infrastructure
      initial_cash: 10000.0  # Source: target §9 — normalization
      initial_position: 0.0  # Source: target §9 — normalization
      custom_state_hot_limit: 3  # Source: infrastructure
      lookback: 2  # Source: target §9 — simulation-bases.md §4.1; range [2, 5]
      momentum_sensitivity: 3.0  # Source: target §9 — Kirilenko et al. (2017); range [0.5, 3.0]
      base_position_size: 40.0  # Source: target §9 — simulation-bases.md §4.1; range [20, 60]
      speed_advantage: 1.5  # Source: target §9 — simulation-bases.md §4.1; range [1.2, 2.0]
      private_knowledge:  # Source: RAG-wiring
        from_global_resources:
          - "MinerU_processed"
        local_resources:
          local_uri: ""
          local_resources: []
        rag:
          from_global_index_dir:
            - "rag_index"
          local_index_dir: ""
          embed_type: "litellm"
          embed_model: "openai/hunyuan-embedding"
          embed_api_key: "{{ HUNYUAN_API_KEY }}"
          embed_api_base: "https://api.hunyuan.cloud.tencent.com/v1"
          chunk_size: 512
          chunk_overlap: 64
          top_k: 5
      llm:
        sys_message: "examples.FlashCrash.Rag.prompts:RAGLLM_HFT_SYS"
        user_message: "examples.FlashCrash.Rag.prompts:RAGLLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.3
          max_new_tokens: 600
  persona: !include persona.yml

