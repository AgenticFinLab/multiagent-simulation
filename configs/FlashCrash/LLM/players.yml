# =============================================================================
# FlashCrashLLM Players Configuration
# =============================================================================

market:
  archetype: stock-standard-price-impact  # -> masim/agents/defines/market/stock-standard-price-impact.md
  name: "Market with Liquidity-Sensitive Pricing"
  class: "examples.FlashCrash.LLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/FlashCrash/LLM/records"  # Source: infrastructure
      fundamental_value: 100.0  # Source: target §9 — normalization
      initial_price: 100.0  # Source: target §9 — normalization
      base_price_impact: 0.05  # Source: target §9 — simulation-bases.md §3
      mean_reversion: 0.02  # Source: target §9 — simulation-bases.md §3
      noise_std: 0.3  # Source: target §9 — simulation-bases.md §3
      low_liquidity_threshold: 50.0  # Source: target §9 — simulation-bases.md §3
      high_impact_multiplier: 3.0  # Source: target §9 — simulation-bases.md §3
      base_liquidity: 50.0  # Source: target §9 — simulation-bases.md §3
      custom_state_hot_limit: 3  # Source: infrastructure
  persona: !include persona.yml

llm_high_frequency_trader:
  name: "LLM High-Frequency Trader"
  class: "examples.FlashCrash.LLM.players:LLMHighFrequencyTrader"
  # Expander → llm_hft_1, llm_hft_2, llm_hft_3
  num_instances: 3
  config:
    identity: "llm_high_frequency_trader"
    role: player
    steps_per_turn: 1
    group_tags:
      - llm_investors
    extras:
      record_path: "EXPERIMENT/FlashCrash/LLM/records"  # Source: infrastructure
      initial_cash: 10000.0  # Source: target §9 — normalization
      initial_position: 0.0  # Source: target §9 — normalization
      custom_state_hot_limit: 3  # Source: infrastructure
      llm:  # Source: LLM-wiring
        sys_message: "examples.FlashCrash.LLM.prompts:LLM_HFT_SYS"  # Source: LLM-wiring
        user_message: "examples.FlashCrash.LLM.prompts:LLM_USER_TEMPLATE"  # Source: LLM-wiring
        lm_type: "api"  # Source: LLM-wiring
        lm_name: "ark/doubao-seed-2-0-mini-260428"  # Source: LLM-wiring
        generation_config:  # Source: LLM-wiring
          temperature: 0.3  # Source: LLM-wiring — HFT moderate creativity
          max_new_tokens: 500  # Source: LLM-wiring
  persona: !include persona.yml

