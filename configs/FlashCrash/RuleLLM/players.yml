# =============================================================================
# FlashCrashRuleLLM Players Configuration
# =============================================================================
# 1 Market (rule-based) + 5 Hybrid Rule+LLM Investors
# Each LLM agent's system prompt embeds:
#   - Personal profile: identity, style, risk attitude (from LLM variant)
#   - Quantitative rules: exact financial/mathematical principles (from rule-based)
# =============================================================================

# Market (rule-based, identical to FlashCrash)
market:
  name: "Market"
  class: "examples.FlashCrash.RuleLLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/FlashCrash/RuleLLM/records"  # Source: infrastructure
      fundamental_value: 100.0  # Source: target §9 — normalization
      initial_price: 100.0  # Source: target §9 — normalization
      base_price_impact: 0.05  # Source: target §9 — simulation-bases.md §3
      mean_reversion: 0.02  # Source: target §9 — simulation-bases.md §3
      noise_std: 0.3  # Source: target §9 — simulation-bases.md §3
      low_liquidity_threshold: 50.0  # Source: target §9 — simulation-bases.md §3
      high_impact_multiplier: 3.0  # Source: target §9 — simulation-bases.md §3
      base_liquidity: 50.0  # Source: target §9 — simulation-bases.md §3
      custom_state_hot_limit: 3  # Source: infrastructure
  persona: !include persona.yml

# Hybrid HFT (Momentum detection + LLM rapid reasoning)
rulellm_high_frequency_trader:
  name: "RuleLLM HFT"
  class: "examples.FlashCrash.RuleLLM.players:RuleLLMHighFrequencyTrader"
  num_instances: 3
  config:
    identity: "rulellm_high_frequency_trader"
    role: player
    steps_per_turn: 1
    group_tags:
      - rulellm_investors
    extras:
      record_path: "EXPERIMENT/FlashCrash/RuleLLM/records"  # Source: infrastructure
      initial_cash: 10000.0  # Source: target §9 — normalization
      initial_position: 0.0  # Source: target §9 — normalization
      custom_state_hot_limit: 3  # Source: infrastructure
      lookback: 2  # Source: target §9 — simulation-bases.md §4.1; range [2, 5]
      momentum_sensitivity: 3.0  # Source: target §9 — Kirilenko et al. (2017); range [0.5, 3.0]
      base_position_size: 40.0  # Source: target §9 — simulation-bases.md §4.1; range [20, 60]
      speed_advantage: 1.5  # Source: target §9 — simulation-bases.md §4.1; range [1.2, 2.0]
      llm:  # Source: LLM-wiring
        sys_message: "examples.FlashCrash.RuleLLM.prompts:RULELLM_HFT_SYS"  # Source: LLM-wiring
        user_message: "examples.FlashCrash.RuleLLM.prompts:RULELLM_USER_TEMPLATE"  # Source: LLM-wiring
        lm_type: "api"  # Source: LLM-wiring
        lm_name: "ark/doubao-seed-2-0-mini-260428"  # Source: LLM-wiring
        generation_config:  # Source: LLM-wiring
          temperature: 0.3  # Source: LLM-wiring — HFT moderate creativity
          max_new_tokens: 500  # Source: LLM-wiring
  persona: !include persona.yml

# Hybrid Market Maker (Liquidity provision + LLM risk reasoning)
rulellm_market_maker:
  name: "RuleLLM Market Maker"
  class: "examples.FlashCrash.RuleLLM.players:RuleLLMMarketMaker"
  num_instances: 3
  config:
    identity: "rulellm_market_maker"
    role: player
    steps_per_turn: 1
    group_tags:
      - rulellm_investors
    extras:
      record_path: "EXPERIMENT/FlashCrash/RuleLLM/records"  # Source: infrastructure
      initial_cash: 10000.0  # Source: target §9 — normalization
      initial_position: 0.0  # Source: target §9 — normalization
      custom_state_hot_limit: 3  # Source: infrastructure
      volatility_threshold: 0.02  # Source: target §9 — Grossman & Miller (1988); range [0.005, 0.02]
      base_liquidity: 30.0  # Source: target §9 — simulation-bases.md §3; range [30, 100]
      spread_sensitivity: 0.5  # Source: simulation-bases.md §4.2 — market-maker inventory sizing
      llm:  # Source: LLM-wiring
        sys_message: "examples.FlashCrash.RuleLLM.prompts:RULELLM_MARKET_MAKER_SYS"  # Source: LLM-wiring
        user_message: "examples.FlashCrash.RuleLLM.prompts:RULELLM_USER_TEMPLATE"  # Source: LLM-wiring
        lm_type: "api"  # Source: LLM-wiring
        lm_name: "ark/doubao-seed-2-0-mini-260428"  # Source: LLM-wiring
        generation_config:  # Source: LLM-wiring
          temperature: 0.3  # Source: LLM-wiring — MM moderate
          max_new_tokens: 500  # Source: LLM-wiring
  persona: !include persona.yml

# Hybrid Algorithmic Trader (Trend-following + LLM systematic reasoning)
rulellm_algorithmic_trader:
  name: "RuleLLM Algorithmic Trader"
  class: "examples.FlashCrash.RuleLLM.players:RuleLLMAlgorithmicTrader"
  num_instances: 2
  config:
    identity: "rulellm_algorithmic_trader"
    role: player
    steps_per_turn: 1
    group_tags:
      - rulellm_investors
    extras:
      record_path: "EXPERIMENT/FlashCrash/RuleLLM/records"  # Source: infrastructure
      initial_cash: 10000.0  # Source: target §9 — normalization
      initial_position: 0.0  # Source: target §9 — normalization
      custom_state_hot_limit: 3  # Source: infrastructure
      lookback: 3  # Source: target §9 — simulation-bases.md §4.3; range [3, 10]
      trend_sensitivity: 2.0  # Source: target §9 — De Long et al. (1990); range [0.5, 2.0]
      base_position_size: 25.0  # Source: target §9 — simulation-bases.md §4.3
      trend_multiplier: 10  # Source: target §9 — simulation-bases.md §4.3; range [5, 15]
      llm:  # Source: LLM-wiring
        sys_message: "examples.FlashCrash.RuleLLM.prompts:RULELLM_ALGO_SYS"  # Source: LLM-wiring
        user_message: "examples.FlashCrash.RuleLLM.prompts:RULELLM_USER_TEMPLATE"  # Source: LLM-wiring
        lm_type: "api"  # Source: LLM-wiring
        lm_name: "ark/doubao-seed-2-0-mini-260428"  # Source: LLM-wiring
        generation_config:  # Source: LLM-wiring
          temperature: 0.2  # Source: LLM-wiring — Algo conservative
          max_new_tokens: 500  # Source: LLM-wiring
  persona: !include persona.yml

