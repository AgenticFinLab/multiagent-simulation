# =============================================================================
# FlashCrashRuleLLM Players Configuration
# =============================================================================
# 1 Market (rule-based) + 5 Hybrid Rule+LLM Investors
# Each LLM agent's system prompt embeds:
#   - Personal profile: identity, style, risk attitude (from LLM variant)
#   - Quantitative rules: exact financial/mathematical principles (from rule-based)
# =============================================================================

# Market (rule-based, identical to FlashCrash)
market:
  name: "Market"
  class: "examples.FlashCrash.RuleLLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/FlashCrash/RuleLLM/records"
      fundamental_value: 100.0
      initial_price: 100.0
      base_price_impact: 0.05
      mean_reversion: 0.02
      noise_std: 0.3
      low_liquidity_threshold: 50.0
      high_impact_multiplier: 3.0
      base_liquidity: 50.0
      custom_state_hot_limit: 3
  persona: !include persona.yml

# Hybrid HFT (Momentum detection + LLM rapid reasoning)
rulellm_hft:
  name: "RuleLLM HFT"
  class: "examples.FlashCrash.RuleLLM.players:RuleLLMHighFrequencyTrader"
  num_instances: 3
  config:
    identity: "rulellm_hft"
    role: player
    steps_per_turn: 1
    group_tags:
      - rulellm_investors
    extras:
      record_path: "EXPERIMENT/FlashCrash/RuleLLM/records"
      initial_cash: 10000.0
      initial_position: 0.0
      custom_state_hot_limit: 3
      lookback: 2
      momentum_sensitivity: 3.0
      base_position_size: 40.0
      speed_advantage: 1.5
      llm:
        sys_message: "examples.FlashCrash.RuleLLM.prompts:RULELLM_HFT_SYS"
        user_message: "examples.FlashCrash.RuleLLM.prompts:RULELLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.3
          max_new_tokens: 500
  persona: !include persona.yml

# Hybrid Market Maker (Liquidity provision + LLM risk reasoning)
rulellm_market_maker:
  name: "RuleLLM Market Maker"
  class: "examples.FlashCrash.RuleLLM.players:RuleLLMMarketMaker"
  num_instances: 3
  config:
    identity: "rulellm_market_maker"
    role: player
    steps_per_turn: 1
    group_tags:
      - rulellm_investors
    extras:
      record_path: "EXPERIMENT/FlashCrash/RuleLLM/records"
      initial_cash: 10000.0
      initial_position: 0.0
      custom_state_hot_limit: 3
      volatility_threshold: 0.02
      base_liquidity: 30.0
      spread_sensitivity: 0.5
      llm:
        sys_message: "examples.FlashCrash.RuleLLM.prompts:RULELLM_MARKET_MAKER_SYS"
        user_message: "examples.FlashCrash.RuleLLM.prompts:RULELLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.3
          max_new_tokens: 500
  persona: !include persona.yml

