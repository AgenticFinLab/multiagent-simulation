# =============================================================================
# FlashCrash Players Configuration
# =============================================================================
# Market Microstructure Simulation - Flash Crash (SEC/CFTC 2010)
#
# Investor Types:
#   - HighFrequencyTrader: Rapid momentum, can trigger cascades
#   - MarketMaker: Provides liquidity, withdraws in stress
#   - AlgorithmicTrader: Trend-following algorithm
#   - StopLossTrader: Triggered selling at price thresholds
#   - FundamentalTrader: Stabilizing, buys during crash
#   - RetailTrader: Slow, delayed reaction
# =============================================================================

market:
  name: "Market"
  class: "examples.FlashCrash.players:Market"
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/FlashCrash/records"
      # Market parameters
      fundamental_value: 100.0
      initial_price: 100.0
      base_price_impact: 0.05
      mean_reversion: 0.02
      noise_std: 0.3
      # Liquidity sensitivity
      low_liquidity_threshold: 50.0
      high_impact_multiplier: 3.0
      base_liquidity: 50.0
      custom_state_hot_limit: 3
  persona: !include persona.yml

hft_1:
  name: "HFT 1"
  class: "examples.FlashCrash.players:HighFrequencyTrader"
  config:
    identity: "hft_1"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/FlashCrash/records"
      initial_cash: 10000.0
      initial_position: 0.0
      custom_state_hot_limit: 3
      # HFT specific
      lookback: 2
      momentum_sensitivity: 3.0
      base_position_size: 40.0
      speed_advantage: 1.5
  persona: !include persona.yml

hft_2:
  name: "HFT 2"
  class: "examples.FlashCrash.players:HighFrequencyTrader"
