# =============================================================================
# FlashCrash Players Configuration
# =============================================================================

market:
  name: "Market"
  class: "examples.FlashCrash.players:Market"
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/FlashCrash/records"
  persona: !include persona.yml

