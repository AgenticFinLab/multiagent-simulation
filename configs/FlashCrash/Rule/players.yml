# =============================================================================
# FlashCrash Players Configuration
# =============================================================================
# Market Microstructure Simulation - Flash Crash (SEC/CFTC 2010)
#
# Investor Types:
#   - HighFrequencyTrader: Rapid momentum, can trigger cascades
#   - MarketMaker: Provides liquidity, withdraws in stress
#   - AlgorithmicTrader: Trend-following algorithm
#   - StopLossTrader: Triggered selling at price thresholds
#   - FundamentalTrader: Stabilizing, buys during crash
#   - RetailTrader: Slow, delayed reaction
# =============================================================================

market:
  name: "Market"
  class: "examples.FlashCrash.Rule.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/FlashCrash/Rule/records"  # Source: infrastructure
      # Market parameters
      fundamental_value: 100.0  # Source: target §9 — normalization
      initial_price: 100.0  # Source: target §9 — normalization
      base_price_impact: 0.05  # Source: target §9 — simulation-bases.md §3
      mean_reversion: 0.02  # Source: target §9 — simulation-bases.md §3
      noise_std: 0.3  # Source: target §9 — simulation-bases.md §3
      # Liquidity sensitivity
      low_liquidity_threshold: 50.0  # Source: target §9 — simulation-bases.md §3
      high_impact_multiplier: 3.0  # Source: target §9 — simulation-bases.md §3
      base_liquidity: 50.0  # Source: target §9 — simulation-bases.md §3
      custom_state_hot_limit: 3  # Source: infrastructure
  persona: !include persona.yml

rule_high_frequency_trader:
  name: "HFT"
  class: "examples.FlashCrash.Rule.players:HighFrequencyTrader"
  # Expander → hft_1, hft_2, hft_3
  num_instances: 3
  config:
    identity: "rule_high_frequency_trader"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/FlashCrash/Rule/records"  # Source: infrastructure
      initial_cash: 10000.0  # Source: target §9 — normalization
      initial_position: 0.0  # Source: target §9 — normalization
      custom_state_hot_limit: 3  # Source: infrastructure
      # HFT specific
      lookback: 2  # Source: target §9 — simulation-bases.md §4.1; range [2, 5]
      momentum_sensitivity: 3.0  # Source: target §9 — Kirilenko et al. (2017); range [0.5, 3.0]
      base_position_size: 40.0  # Source: target §9 — simulation-bases.md §4.1; range [20, 60]
      speed_advantage: 1.5  # Source: target §9 — simulation-bases.md §4.1; range [1.2, 2.0]
  persona: !include persona.yml

rule_market_maker:
  name: "Market Maker"
  class: "examples.FlashCrash.Rule.players:MarketMaker"
  # Expander → market_maker_1, market_maker_2, market_maker_3
  num_instances: 3
  config:
    identity: "rule_market_maker"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/FlashCrash/Rule/records"  # Source: infrastructure
      initial_cash: 10000.0  # Source: target §9 — normalization
      initial_position: 0.0  # Source: target §9 — normalization
      custom_state_hot_limit: 3  # Source: infrastructure
      # MarketMaker specific
      volatility_threshold: 0.02  # Source: target §9 — Grossman & Miller (1988); range [0.005, 0.02]
      base_liquidity: 30.0  # Source: target §9 — simulation-bases.md §3; range [30, 100]
      spread_sensitivity: 0.5  # Source: simulation-bases.md §4.2 — market-maker inventory sizing
  persona: !include persona.yml

rule_algorithmic_trader:
  name: "Algorithmic Trader"
  class: "examples.FlashCrash.Rule.players:AlgorithmicTrader"
  # Expander → algo_trader_1, algo_trader_2
  num_instances: 2
  config:
    identity: "rule_algorithmic_trader"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/FlashCrash/Rule/records"  # Source: infrastructure
      initial_cash: 10000.0  # Source: target §9 — normalization
      initial_position: 0.0  # Source: target §9 — normalization
      custom_state_hot_limit: 3  # Source: infrastructure
      # Algo specific
      lookback: 3  # Source: target §9 — simulation-bases.md §4.3; range [3, 10]
      trend_sensitivity: 2.0  # Source: target §9 — De Long et al. (1990); range [0.5, 2.0]
      base_position_size: 25.0  # Source: target §9 — simulation-bases.md §4.3
      trend_multiplier: 10  # Source: target §9 — simulation-bases.md §4.3; range [5, 15]
  persona: !include persona.yml

rule_stop_loss_trader:
  name: "Stop Loss Trader"
  class: "examples.FlashCrash.Rule.players:StopLossTrader"
  # Expander → stop_loss_1 .. stop_loss_5
  num_instances: 5
  config:
    identity: "rule_stop_loss_trader"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/FlashCrash/Rule/records"  # Source: infrastructure
      initial_cash: 10000.0  # Source: target §9 — normalization
      # Starts with position
      initial_position: 50.0  # Source: target §9 — simulation-bases.md §4.4; range [20, 100]
      custom_state_hot_limit: 3  # Source: infrastructure
      # StopLoss specific
      stop_loss_percent: 0.05  # Source: target §9 — Brunnermeier & Pedersen (2005); range [0.02, 0.10]
      initial_buy_price: 100.0  # Source: target §9 — normalization (entry price = initial_price)
  persona: !include persona.yml

rule_fundamental_trader:
  name: "Fundamental Trader"
  class: "examples.FlashCrash.Rule.players:FundamentalTrader"
  # Expander → fundamental_trader_1, fundamental_trader_2
  num_instances: 2
  config:
    identity: "rule_fundamental_trader"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/FlashCrash/Rule/records"  # Source: infrastructure
      initial_cash: 10000.0  # Source: target §9 — normalization
      initial_position: 0.0  # Source: target §9 — normalization
      custom_state_hot_limit: 3  # Source: infrastructure
      # Fundamental specific
      value_threshold: 0.10  # Source: target §9 — Shiller (1981); range [0.03, 0.10]
      base_position_size: 30.0  # Source: target §9 — simulation-bases.md §4.5
      value_sensitivity: 1.0  # Source: target §9 — simulation-bases.md §4.5; range [0.5, 2.0]
      value_multiplier: 10  # Source: target §9 — simulation-bases.md §4.5; range [5, 15]
  persona: !include persona.yml

rule_retail_trader:
  name: "Retail Trader"
  class: "examples.FlashCrash.Rule.players:RetailTrader"
  # Expander → retail_trader_1 .. retail_trader_5
  num_instances: 5
  config:
    identity: "rule_retail_trader"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/FlashCrash/Rule/records"  # Source: infrastructure
      initial_cash: 10000.0  # Source: target §9 — normalization
      initial_position: 0.0  # Source: target §9 — normalization
      custom_state_hot_limit: 3  # Source: infrastructure
      # Retail specific
      trade_frequency: 5  # Source: target §9 — Black (1986); range [1, 5]
      noise_std: 8.0  # Source: target §9 — simulation-bases.md §4.6; range [1.0, 8.0]
      position_mean_reversion: 0.1  # Source: target §9 — simulation-bases.md §4.6; range [0.05, 0.2]
  persona: !include persona.yml
