# =============================================================================
# FlashCrash Topology - Star Pattern
# =============================================================================
# Market microstructure simulation with liquidity dynamics
#
# Note: player keys with num_instances > 1 use their base key here.
# The simulator expander resolves them to foo_1, foo_2, ... before building
# the TopologyGraph, so all edge rules apply to every instance automatically.
# =============================================================================

type: "star"

sources:
  - market

connections:
  # num_instances: 2 → hft_1/2, market_maker_1/2, stop_loss_1/2
  market:
    - hft
    - market_maker
    - algo_trader
    - stop_loss
    - fundamental_trader
    - retail_trader

  # num_instances: 2 → expands to hft_1/2 → market
  hft:
    - market

  # num_instances: 2 → expands to market_maker_1/2 → market
  market_maker:
    - market

  algo_trader:
    - market

  # num_instances: 2 → expands to stop_loss_1/2 → market
  stop_loss:
    - market

  fundamental_trader:
    - market

  retail_trader:
    - market
