  num_instances: 1
  config:
    identity: "convergencetrader_3"
    role: player
    extras:
      initial_cash: 1000000.0
      initial_position: 0

opportunistictrader_4:
  name: "OpportunisticTrader 4"
  class: "examples.SorosPound.Rule.players:OpportunisticTrader"
  num_instances: 2
  config:
    identity: "opportunistictrader_4"
    role: player
