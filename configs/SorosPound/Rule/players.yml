# SorosPound Rule Agent Configuration

market:
  name: "Market"
  class: "examples.SorosPound.Rule.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    extras:
      initial_price: 100.0
      fundamental_value: 100.0
      price_impact: 0.05
      mean_reversion: 0.02
      noise_std: 0.02

macrohedgefund_1:
  name: "MacroHedgeFund 1"
  class: "examples.SorosPound.Rule.players:MacroHedgeFund"
  num_instances: 2
  config:
    identity: "macrohedgefund_1"
    role: player
    extras:
      initial_cash: 1000000.0
      initial_position: 0

pegdefender_2:
  name: "PegDefender 2"
  class: "examples.SorosPound.Rule.players:PegDefender"
  num_instances: 1
  config:
