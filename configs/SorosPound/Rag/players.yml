# SorosPound Rag Agent Configuration
# All extras values traceable to target §9 Parameter Seeds via inline `# Source:` comments.
# `agent_type` field required per agent-design-skill.md §3.6.0 I/O Contract.

knowledge:
  backend: "local"
  global_uri: "examples/document-sources"
  resource_csv:
    - "examples/document-sources/books.csv"
    - "examples/document-sources/source"
  preprocessing:
    parser: "mineru"
    output_position: "MinerU_processed"
  rag:
    output_position: "rag_index"
    embed_type: "litellm"
    embed_model: "openai/hunyuan-embedding"
    embed_api_key: "{{ HUNYUAN_API_KEY }}"
    embed_api_base: "https://api.hunyuan.cloud.tencent.com/v1"
    chunk_size: 512
    chunk_overlap: 64
    top_k: 5

market:
  archetype: fx-currency-peg-and-attack  # -> masim/agents/defines/market/fx-currency-peg-and-attack.md
  name: "Market"
  class: "examples.SorosPound.Rag.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/SorosPound/Rag/records"            # Source: target §8.1 coordinator record path
      initial_price: 100.0                                        # Source: target §9 initial_price row
      peg_rate: 100.0                                             # Source: target §9 peg_rate row; §4.3
      fundamental_value: 95.0                                     # Source: target §9 fundamental_value row; §2.2, §4.1
      price_impact: 0.03                                          # Source: target §9 price_impact row; §8.1
      mean_reversion: 0.015                                       # Source: target §9 mean_reversion row; §2.4
      noise_std: 0.012                                            # Source: target §9 noise_std row; Black 1986
      custom_state_hot_limit: 3                                   # Source: target §9 custom_state_hot_limit row
  persona: !include persona.yml

ragllm_macro_hedge_fund:
  name: "MacroHedgeFund"
  class: "examples.SorosPound.Rag.players:RagLLMMacroHedgeFund"
  num_instances: 2                                                # Source: target §7 MacroHedgeFund population
  config:
    identity: "ragllm_macro_hedge_fund"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/SorosPound/Rag/records"            # Source: target §8.1 coordinator record path
      agent_type: "MacroHedgeFund"                                # Source: target §7 agent class label; agent-design-skill.md §3.6.0 I/O contract
      initial_cash: 5000000.0                                     # Source: target §9 MacroHedgeFund initial_cash row; §4.1
      initial_position: 800                                       # Source: target §9 MacroHedgeFund initial_position row; §4.1
      initial_price: 100.0                                        # Source: target §9 initial_price row
      fundamental_value: 95.0                                     # Source: target §9 fundamental_value row
      leverage: 3.0                                               # Source: target §9 leverage row; §4.1 retained metadata (Krugman 1979)
      position_size: 600                                          # Source: target §9 MacroHedgeFund position_size row; §4.1 metadata
      custom_state_hot_limit: 3                                   # Source: target §9 custom_state_hot_limit row
      private_knowledge:
        from_global_resources:
          - "MinerU_processed"
        local_resources:
          local_uri: ""
          local_resources: []
        rag:
          from_global_index_dir:
            - "rag_index"
          local_index_dir: ""
          embed_type: "litellm"
          embed_model: "openai/hunyuan-embedding"
          embed_api_key: "{{ HUNYUAN_API_KEY }}"
          embed_api_base: "https://api.hunyuan.cloud.tencent.com/v1"
          chunk_size: 512
          chunk_overlap: 64
          top_k: 5
      llm:
        sys_message: "examples.SorosPound.Rag.prompts:RAGLLM_MACRO_HEDGE_FUND_SYS"
        user_message: "examples.SorosPound.Rag.prompts:RAG_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.8
          max_tokens: 600
  persona: !include persona.yml

