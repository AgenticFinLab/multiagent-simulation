# SorosPound LLM Agent Configuration

market:
  name: "Market"
  class: "examples.SorosPound.LLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/SorosPound/LLM/records"
      initial_price: 100.0
      peg_rate: 100.0
      fundamental_value: 95.0
      price_impact: 0.03
      mean_reversion: 0.015
      noise_std: 0.012
      custom_state_hot_limit: 3
  persona: !include persona.yml

macrohedgefund:
  name: "MacroHedgeFund"
  class: "examples.SorosPound.LLM.players:LLMMacroHedgeFund"
  num_instances: 2
  config:
    identity: "macrohedgefund"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/SorosPound/LLM/records"
      initial_cash: 5000000.0
      initial_position: 800
      initial_price: 100.0
      fundamental_value: 95.0
      leverage: 3.0
      position_size: 600
      custom_state_hot_limit: 3
      llm:
        sys_message: "examples.SorosPound.LLM.prompts:LLM_MACRO_HEDGE_FUND_SYS"
        user_message: "examples.SorosPound.LLM.prompts:LLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-1-6-251015"
        generation_config:
          temperature: 0.8
          max_tokens: 512
  persona: !include persona.yml

