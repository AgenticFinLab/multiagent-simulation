# SouthSeaBubble Rag Agent Configuration

knowledge:
  backend: "local"
  global_uri: "examples/document-sources"
  resource_csv:
    - "examples/document-sources/books.csv"
    - "examples/document-sources/source"
  preprocessing:
    parser: "mineru"
    output_position: "MinerU_processed"
  rag:
    output_position: "rag_index"
    embed_type: "litellm"
    embed_model: "openai/hunyuan-embedding"
    embed_api_key: "{{ HUNYUAN_API_KEY }}"
    embed_api_base: "https://api.hunyuan.cloud.tencent.com/v1"
    chunk_size: 512
    chunk_overlap: 64
    top_k: 5

market:
  name: "Market"
  class: "examples.SouthSeaBubble.Rag.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/SouthSeaBubble/Rag/records"
      initial_price: 100.0
      fundamental_value: 100.0
      price_impact: 0.025
      mean_reversion: 0.008
      noise_std: 0.015
      custom_state_hot_limit: 3
  persona: !include persona.yml

insideradvantaged:
  name: "InsiderAdvantaged"
  class: "examples.SouthSeaBubble.Rag.players:RagLLMInsiderAdvantaged"
  num_instances: 2
  config:
    identity: "insideradvantaged"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/SouthSeaBubble/Rag/records"
      initial_cash: 3000000.0
      initial_position: 800
      initial_price: 100.0
      fundamental_value: 100.0
      front_run_size: 500
      information_advantage: 0.8
      custom_state_hot_limit: 3
      private_knowledge:
        from_global_resources:
          - "MinerU_processed"
        local_resources:
          local_uri: ""
          local_resources: []
        rag:
          from_global_index_dir:
            - "rag_index"
          local_index_dir: ""
          embed_type: "litellm"
          embed_model: "openai/hunyuan-embedding"
          embed_api_key: "{{ HUNYUAN_API_KEY }}"
          embed_api_base: "https://api.hunyuan.cloud.tencent.com/v1"
          chunk_size: 512
          chunk_overlap: 64
          top_k: 5
      llm:
        sys_message: "examples.SouthSeaBubble.Rag.prompts:RAG_INSIDER_ADVANTAGED_SYS"
        user_message: "examples.SouthSeaBubble.Rag.prompts:RAG_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.8
          max_tokens: 600
  persona: !include persona.yml

