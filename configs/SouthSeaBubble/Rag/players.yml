# SouthSeaBubble Rag Agent Configuration
# Source: examples/SouthSeaBubble/finance-southseabubble.md §9 (Parameter Seeds table)

knowledge:
  backend: "local"
  global_uri: "examples/document-sources"
  resource_csv:
    - "examples/document-sources/books.csv"
    - "examples/document-sources/source"
  preprocessing:
    parser: "mineru"
    output_position: "MinerU_processed"
  rag:
    output_position: "rag_index"
    embed_type: "litellm"
    embed_model: "openai/hunyuan-embedding"
    embed_api_key: "{{ HUNYUAN_API_KEY }}"
    embed_api_base: "https://api.hunyuan.cloud.tencent.com/v1"
    chunk_size: 512
    chunk_overlap: 64
    top_k: 5

market:
  archetype: stock-standard-price-impact  # -> AGENT_POOL/market/stock-standard-price-impact.md
  name: "Market"
  class: "examples.SouthSeaBubble.Rag.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/SouthSeaBubble/Rag/records"
      initial_price: 100.0  # Source: target §9 market.extras.initial_price row; normalization
      fundamental_value: 100.0  # Source: target §9 market.extras.fundamental_value row; normalization
      price_impact: 0.025  # Source: target §9 market.extras.price_impact row; simulation-bases.md §3
      mean_reversion: 0.008  # Source: target §9 market.extras.mean_reversion row; simulation-bases.md §3
      noise_std: 0.015  # Source: target §9 market.extras.noise_std row; simulation-bases.md §3
      custom_state_hot_limit: 3
  persona: !include persona.yml

ragllm_insider_advantaged:
  name: "InsiderAdvantaged"
  class: "examples.SouthSeaBubble.Rag.players:RagLLMInsiderAdvantaged"
  num_instances: 2  # Source: target §9 insideradvantaged.num_instances row
  config:
    identity: "ragllm_insider_advantaged"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      agent_type: "InsiderAdvantaged"  # Source: agent-design-skill.md §3.6.0 I/O Contract
      record_path: "EXPERIMENT/SouthSeaBubble/Rag/records"
      initial_cash: 3000000.0  # Source: target §9 insideradvantaged.extras.initial_cash row; timing-advantage endowment (§4.3 Temin-Voth 2004)
      initial_position: 800  # Source: target §9 insideradvantaged.extras.initial_position row; timing-advantage inventory
      initial_price: 100.0  # Source: target §9 market.extras.initial_price row; normalization
      fundamental_value: 100.0  # Source: target §9 market.extras.fundamental_value row; normalization
      front_run_size: 500  # Source: target §9 insideradvantaged.extras.front_run_size row; metadata
      information_advantage: 0.8  # Source: target §9 insideradvantaged.extras.information_advantage row; metadata (§4.3 Temin-Voth 2004)
      custom_state_hot_limit: 3
      private_knowledge:
        from_global_resources:
          - "MinerU_processed"
        local_resources:
          local_uri: ""
          local_resources: []
        rag:
          from_global_index_dir:
            - "rag_index"
          local_index_dir: ""
          embed_type: "litellm"
          embed_model: "openai/hunyuan-embedding"
          embed_api_key: "{{ HUNYUAN_API_KEY }}"
          embed_api_base: "https://api.hunyuan.cloud.tencent.com/v1"
          chunk_size: 512
          chunk_overlap: 64
          top_k: 5
      llm:
        sys_message: "examples.SouthSeaBubble.Rag.prompts:RAGLLM_INSIDER_ADVANTAGED_SYS"
        user_message: "examples.SouthSeaBubble.Rag.prompts:RAG_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.8
          max_tokens: 600
  persona: !include persona.yml

