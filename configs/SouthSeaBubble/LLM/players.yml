# SouthSeaBubble LLM Agent Configuration
# Source: examples/SouthSeaBubble/finance-southseabubble.md §9 (Parameter Seeds table)

market:
  archetype: stock-standard-price-impact  # -> masim/agents/defines/market/stock-standard-price-impact.md
  name: "Market"
  class: "examples.SouthSeaBubble.LLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/SouthSeaBubble/LLM/records"
      initial_price: 100.0  # Source: target §9 market.extras.initial_price row; normalization
      fundamental_value: 100.0  # Source: target §9 market.extras.fundamental_value row; normalization
      price_impact: 0.025  # Source: target §9 market.extras.price_impact row; simulation-bases.md §3
      mean_reversion: 0.008  # Source: target §9 market.extras.mean_reversion row; simulation-bases.md §3
      noise_std: 0.015  # Source: target §9 market.extras.noise_std row; simulation-bases.md §3
      custom_state_hot_limit: 3
  persona: !include persona.yml

llm_insider_advantaged:
  name: "InsiderAdvantaged"
  class: "examples.SouthSeaBubble.LLM.players:LLMInsiderAdvantaged"
  num_instances: 2  # Source: target §9 insideradvantaged.num_instances row
  config:
    identity: "llm_insider_advantaged"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      agent_type: "InsiderAdvantaged"  # Source: agent-design-skill.md §3.6.0 I/O Contract; required for LLM decision logs
      record_path: "EXPERIMENT/SouthSeaBubble/LLM/records"
      initial_cash: 3000000.0  # Source: target §9 insideradvantaged.extras.initial_cash row; timing-advantage endowment (§4.3 Temin-Voth 2004)
      initial_position: 800  # Source: target §9 insideradvantaged.extras.initial_position row; timing-advantage inventory
      initial_price: 100.0  # Source: target §9 market.extras.initial_price row; normalization
      fundamental_value: 100.0  # Source: target §9 market.extras.fundamental_value row; normalization
      front_run_size: 500  # Source: target §9 insideradvantaged.extras.front_run_size row; metadata
      information_advantage: 0.8  # Source: target §9 insideradvantaged.extras.information_advantage row; metadata (§4.3 Temin-Voth 2004)
      custom_state_hot_limit: 3
      llm:
        sys_message: "examples.SouthSeaBubble.LLM.prompts:LLM_INSIDER_ADVANTAGED_SYS"
        user_message: "examples.SouthSeaBubble.LLM.prompts:LLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.8
          max_tokens: 512
  persona: !include persona.yml

llm_narrative_believer:
  name: "NarrativeBeliever"
  class: "examples.SouthSeaBubble.LLM.players:LLMNarrativeBeliever"
  num_instances: 3  # Source: target §9 narrativebeliever.num_instances row
  config:
    identity: "llm_narrative_believer"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      agent_type: "NarrativeBeliever"  # Source: agent-design-skill.md §3.6.0 I/O Contract
      record_path: "EXPERIMENT/SouthSeaBubble/LLM/records"
      initial_cash: 1000000.0  # Source: target §9 narrativebeliever.extras.initial_cash row; normalization
      initial_position: 500  # Source: target §9 narrativebeliever.extras.initial_position row; normalization
      initial_price: 100.0  # Source: target §9 market.extras.initial_price row; normalization
      fundamental_value: 100.0  # Source: target §9 market.extras.fundamental_value row; normalization
      narrative_weight: 0.8  # Source: target §9 narrativebeliever.extras.narrative_weight row; §4.2 Shiller (2017), 10.1257/aer.107.4.967
      base_size: 350  # Source: target §9 narrativebeliever.extras.base_size row; metadata
      custom_state_hot_limit: 3
      llm:
        sys_message: "examples.SouthSeaBubble.LLM.prompts:LLM_NARRATIVE_BELIEVER_SYS"
        user_message: "examples.SouthSeaBubble.LLM.prompts:LLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.9
          max_tokens: 512
  persona: !include persona.yml

