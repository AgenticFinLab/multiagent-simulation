# SouthSeaBubble Rule Agent Configuration
# Source: examples/SouthSeaBubble/finance-southseabubble.md §9 (Parameter Seeds table)

market:
  archetype: stock-standard-price-impact  # -> masim/agents/defines/market/stock-standard-price-impact.md
  name: "Market"
  class: "examples.SouthSeaBubble.Rule.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/SouthSeaBubble/Rule/records"
      initial_price: 100.0  # Source: target §9 market.extras.initial_price row; normalization (simulation-bases.md §6)
      fundamental_value: 100.0  # Source: target §9 market.extras.fundamental_value row; normalization
      price_impact: 0.025  # Source: target §9 market.extras.price_impact row; simulation-bases.md §3
      mean_reversion: 0.008  # Source: target §9 market.extras.mean_reversion row; simulation-bases.md §3
      noise_std: 0.015  # Source: target §9 market.extras.noise_std row; simulation-bases.md §3
      custom_state_hot_limit: 3  # Source: target §9 custom_state_hot_limit row; runtime plumbing
  persona: !include persona.yml

rule_insider_advantaged:
  name: "InsiderAdvantaged"
  class: "examples.SouthSeaBubble.Rule.players:InsiderAdvantaged"
  num_instances: 2  # Source: target §9 insideradvantaged.num_instances row
  config:
    identity: "rule_insider_advantaged"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/SouthSeaBubble/Rule/records"
      initial_cash: 3000000.0  # Source: target §9 insideradvantaged.extras.initial_cash row; timing-advantage endowment (§4.3 Temin-Voth 2004, 10.1257/0002828043052268)
      initial_position: 800  # Source: target §9 insideradvantaged.extras.initial_position row; timing-advantage inventory (§4.3 Temin-Voth 2004)
      initial_price: 100.0  # Source: target §9 market.extras.initial_price row; normalization
      fundamental_value: 100.0  # Source: target §9 market.extras.fundamental_value row; normalization
      front_run_size: 500  # Source: target §9 insideradvantaged.extras.front_run_size row; metadata (retained runtime uses cap 800)
      information_advantage: 0.8  # Source: target §9 insideradvantaged.extras.information_advantage row; metadata (§4.3 Temin-Voth 2004)
      custom_state_hot_limit: 3  # Source: target §9 custom_state_hot_limit row; runtime plumbing
  persona: !include persona.yml

