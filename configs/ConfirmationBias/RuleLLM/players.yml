# =============================================================================
# ConfirmationBias RuleLLM Players Configuration
# =============================================================================

# -----------------------------------------------------------------------------
# Market (Coordinator) — rule-based, identical to Rule variant
# -----------------------------------------------------------------------------
market:
  name: "Market"
  class: "examples.ConfirmationBias.RuleLLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/ConfirmationBias/RuleLLM/records"
      fundamental_value: 100.0
      initial_price: 100.0
      price_impact: 0.02
      mean_reversion: 0.02
      noise_std: 0.02
      custom_state_hot_limit: 3
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# RuleLLM Belief Anchors
# Theory: Nickerson (1998)
# -----------------------------------------------------------------------------
rulellm_belief_anchor:
  name: "RuleLLM Belief Anchor"
  class: "examples.ConfirmationBias.RuleLLM.players:RuleLLMBeliefAnchor"
  # Expander → rulellm_belief_anchor_1, rulellm_belief_anchor_2
  num_instances: 2
  config:
    identity: "rulellm_belief_anchor"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/ConfirmationBias/RuleLLM/records"
      initial_cash: 50000.0
      initial_position: 0.0
      custom_state_hot_limit: 3
      llm:
        sys_message: "examples.ConfirmationBias.RuleLLM.prompts:RULELLM_BELIEF_ANCHOR_SYS"
        user_message: "examples.ConfirmationBias.RuleLLM.prompts:RULELLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.3
          max_tokens: 512
  persona: !include persona.yml

