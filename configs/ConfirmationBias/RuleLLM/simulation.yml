# ConfirmationBias RuleLLM Simulation Configuration
#
# ConfirmationBias simulation
#
# Usage:
#   python examples/ConfirmationBias/RuleLLM/run_confirmationbias_rulellm.py \
#       -c configs/ConfirmationBias/RuleLLM/simulation.yml

setting:
  name: "ConfirmationBias-RuleLLM"
  description: "ConfirmationBias simulation - RuleLLM agents"
  total_rounds: 200

  record_path: "EXPERIMENT/ConfirmationBias/RuleLLM/records"
  storage_path: "EXPERIMENT/ConfirmationBias/RuleLLM/communication"

  log_level: "INFO"
  log_to_file: true
  log_path: "EXPERIMENT/ConfirmationBias/RuleLLM/logs"

environment:
  dotenv_path: ".env"
  workspace: "."

ray:
  namespace: "confirmationbias_rulellm"
  ignore_reinit_error: true
  object_store_memory: 536870912
  num_cpus: 4

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/ConfirmationBias/RuleLLM/communication"
  record_messages: true
  message_timeout_ms: 5000
  max_retries: 3
