# ConfirmationBias Rag Simulation Configuration
#
# ConfirmationBias simulation
#
# Usage:
#   python examples/ConfirmationBias/Rag/run_confirmationbias_rag.py \
#       -c configs/ConfirmationBias/Rag/simulation.yml

setting:
  name: "ConfirmationBias-Rag"
  description: "ConfirmationBias simulation - Rag agents"
  total_rounds: 200

  record_path: "EXPERIMENT/ConfirmationBias/Rag/records"
  storage_path: "EXPERIMENT/ConfirmationBias/Rag/communication"

  log_level: "INFO"
  log_to_file: true
  log_path: "EXPERIMENT/ConfirmationBias/Rag/logs"

environment:
  dotenv_path: ".env"
  workspace: "."

ray:
  namespace: "confirmationbias_rag"
  ignore_reinit_error: true
  object_store_memory: 536870912
  num_cpus: 4

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/ConfirmationBias/Rag/communication"
  record_messages: true
  message_timeout_ms: 5000
  max_retries: 3
