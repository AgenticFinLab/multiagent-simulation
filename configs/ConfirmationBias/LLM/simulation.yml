# ConfirmationBias LLM Simulation Configuration
#
# ConfirmationBias simulation
#
# Usage:
#   python examples/ConfirmationBias/LLM/run_confirmationbias_llm.py \
#       -c configs/ConfirmationBias/LLM/simulation.yml

setting:
  name: "ConfirmationBias-LLM"
  description: "ConfirmationBias simulation - LLM agents"
  total_rounds: 200

  record_path: "EXPERIMENT/ConfirmationBias/LLM/records"
  storage_path: "EXPERIMENT/ConfirmationBias/LLM/communication"

  log_level: "INFO"
  log_to_file: true
  log_path: "EXPERIMENT/ConfirmationBias/LLM/logs"

environment:
  dotenv_path: ".env"
  workspace: "."

ray:
  namespace: "confirmationbias_llm"
  ignore_reinit_error: true
  object_store_memory: 536870912
  num_cpus: 4

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/ConfirmationBias/LLM/communication"
  record_messages: true
  message_timeout_ms: 5000
  max_retries: 3
