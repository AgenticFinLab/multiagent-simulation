# =============================================================================
# ConfirmationBias LLM Players Configuration
# =============================================================================
# 1 Market (rule-based) + 5 LLM Investor types with confirmation-bias personas.
# Every non-infrastructure parameter is annotated with an inline
# `# Source: ...` reference tying it back to `finance-confirmation-bias.md §9`
# or to a labelled provenance (`normalization`, `implementation infrastructure`,
# `bias calibration`, `LLM decoding profile`).
# =============================================================================

# -----------------------------------------------------------------------------
# Market (Coordinator) — rule-based, identical to Rule variant
# -----------------------------------------------------------------------------
market:
  archetype: stock-standard-price-impact  # -> masim/agents/defines/market/stock-standard-price-impact.md
  name: "Market"
  class: "examples.ConfirmationBias.LLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/ConfirmationBias/LLM/records"  # Source: implementation infrastructure (record-path convention)
      fundamental_value: 100.0     # Source: target §9 F; normalization (100-scale index)
      initial_price: 100.0         # Source: target §9 P0; normalization (fundamental-anchored seed)
      price_impact: 0.02           # Source: target §9 λ; Hong & Stein (1999) https://doi.org/10.1111/0022-1082.00184
      mean_reversion: 0.02         # Source: target §9 γ; Fama (1970) https://doi.org/10.2307/2325486
      noise_std: 0.02              # Source: target §9 σ; standard calibration consistent with AvailabilityBias family
      custom_state_hot_limit: 3    # Source: implementation infrastructure (hot-state ring buffer)
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# LLM Belief Anchors — conviction-driven persona
# Theory: Nickerson (1998)
# -----------------------------------------------------------------------------
llm_belief_anchor:
  name: "LLM Belief Anchor"
  class: "examples.ConfirmationBias.LLM.players:LLMBeliefAnchor"
  # Expander → llm_belief_anchor_1, llm_belief_anchor_2
  num_instances: 2
  config:
    identity: "llm_belief_anchor"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/ConfirmationBias/LLM/records"  # Source: implementation infrastructure (record-path convention)
      initial_cash: 50000.0        # Source: normalization (cash endowment)
      initial_position: 0.0        # Source: normalization (flat opening position)
      custom_state_hot_limit: 3    # Source: implementation infrastructure (hot-state ring buffer)
      llm:
        sys_message: "examples.ConfirmationBias.LLM.prompts:LLM_BELIEF_ANCHOR_SYS"  # Source: implementation infrastructure (prompt binding)
        user_message: "examples.ConfirmationBias.LLM.prompts:LLM_USER_TEMPLATE"     # Source: implementation infrastructure (prompt binding)
        lm_type: "api"             # Source: implementation infrastructure (LLM backend selector)
        lm_name: "ark/doubao-seed-2-0-mini-260428"  # Source: implementation infrastructure (default LLM per masim runtime)
        generation_config:
          temperature: 0.7         # Source: LLM decoding profile — conviction-driven persona (higher stochasticity to expose bias)
          max_tokens: 512          # Source: LLM decoding profile — response length ceiling for decision output
  persona: !include persona.yml

