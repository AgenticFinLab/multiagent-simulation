# ConfirmationBias Rule Simulation Configuration
#
# ConfirmationBias simulation
#
# Usage:
#   python examples/ConfirmationBias/Rule/run_confirmationbias_rule.py \
#       -c configs/ConfirmationBias/Rule/simulation.yml

setting:
  name: "ConfirmationBias-Rule"
  description: "ConfirmationBias simulation - Rule agents"
  total_rounds: 200

  record_path: "EXPERIMENT/ConfirmationBias/Rule/records"
  storage_path: "EXPERIMENT/ConfirmationBias/Rule/communication"

  log_level: "INFO"
  log_to_file: true
  log_path: "EXPERIMENT/ConfirmationBias/Rule/logs"

environment:
  dotenv_path: ".env"
  workspace: "."

ray:
  namespace: "confirmationbias_rule"
  ignore_reinit_error: true
  object_store_memory: 536870912
  num_cpus: 4

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/ConfirmationBias/Rule/communication"
  record_messages: true
  message_timeout_ms: 5000
  max_retries: 3
