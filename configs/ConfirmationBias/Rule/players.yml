# ConfirmationBias Rule Agent Configuration

market:
  name: "Market"
  class: "examples.ConfirmationBias.Rule.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    extras:
      initial_price: 100.0
      fundamental_value: 100.0
      price_impact: 0.05
      mean_reversion: 0.02
      noise_std: 0.02

beliefanchor_1:
  name: "BeliefAnchor 1"
  class: "examples.ConfirmationBias.Rule.players:BeliefAnchor"
  num_instances: 2
  config:
    identity: "beliefanchor_1"
    role: player
    extras:
      initial_cash: 1000000.0
      initial_position: 0


