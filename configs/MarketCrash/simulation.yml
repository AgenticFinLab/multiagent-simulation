# =============================================================================
# MarketCrash Simulation Configuration
# =============================================================================
# Demonstrates market crash dynamics through forced deleveraging
# and liquidity spiral mechanisms.
#
# Usage:
#   python examples/MarketCrash/run_crash.py -c configs/MarketCrash/simulation.yml
# =============================================================================

setting:
  name: "market_crash_simulation"
  description: "Market crash through liquidity spiral and forced deleveraging"
  total_rounds: 200
  round_history_limit: 3
  record_path: "EXPERIMENT/MarketCrash/records"
  save_diagram_interval: 25

environment:
  dotenv_path: .env
  workspace: "."

ray:
  address: null
  namespace: "market_crash"
  actor_prefix: null
  # null = Ray auto-detects from machine; actors use num_cpus=0 (async, I/O-bound)
  num_cpus: null
  num_gpus: null
  # Derived: 9 players, star topology -> 16 msgs/round
  #   9 TurnResult + 9 pending_info + 16 Message = 34 Ray objects
  #   34 obj x 64 KB min-alloc = 2176 KB (2.12 MB)
  #   10x headroom = 21.2 MB; 128 MB minimum floor -> 134217728 bytes
  object_store_memory: 134217728
  include_dashboard: false
  logging_level: "warning"
  log_to_driver: false
  actor_options:
    max_restarts: 3
    max_task_retries: 1
    max_concurrency: 4
  runtime_env:
    working_dir: null
    pip: []
    env_vars: {}
  serialization:
    use_arrow: true
    register_custom_serializers: true

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/MarketCrash/communication"
  record_messages: true
  message_block_size: 500
