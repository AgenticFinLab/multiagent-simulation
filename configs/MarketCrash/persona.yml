# =============================================================================
# MarketCrash Persona Configuration
# =============================================================================

auto_checkpoint: false
debug_mode: true

proxy:
  storage:
    checkpoint_dir: "EXPERIMENT/MarketCrash/checkpoints"
    record_path: "EXPERIMENT/MarketCrash/records"
    record_rounds: true

  monitoring:
    record_path: "EXPERIMENT/MarketCrash/monitoring"
    entry_limit: 10

  communication:
    message_timeout_ms: 5000
    enable_compression: true

  resource:
    mcp_servers: []
    enable_caching: false
