# =============================================================================
# MarketCrashLLM Players Configuration
# =============================================================================

# =============================================================================
# Shared Knowledge Configuration
# =============================================================================
knowledge:
  backend: "local"
  global_uri: "examples/document-sources"
  resource_csv:
    - "examples/document-sources/books.csv"
    - "examples/document-sources/source"
  preprocessing:
    parser: "mineru"
    timeout_per_page: 30
    max_pages: 250
    output_position: "MinerU_processed"
  rag:
    output_position: "rag_index"
    embed_type: "litellm"
    embed_model: "openai/hunyuan-embedding"
    embed_api_key: "{{ HUNYUAN_API_KEY }}"
    embed_api_base: "https://api.hunyuan.cloud.tencent.com/v1"
    chunk_size: 512
    chunk_overlap: 64

market:
  archetype: stock-standard-price-impact  # -> AGENT_POOL/market/stock-standard-price-impact.md
  name: "Market with Liquidity Dynamics"
  class: "examples.MarketCrash.Rule.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      initial_volatility: 4.0  # Source: finance-market-crash.md §9
      stress_impact_multiplier: 1.5  # Source: finance-market-crash.md §9
      max_abs_return: 0.08  # Source: finance-market-crash.md §9
      initial_liquidity: 1.0  # Source: normalized market capacity
      random_seed: 20260721  # Source: reproducibility invariant
      price_floor: 30.0  # Source: finance-market-crash.md §9
      price_ceiling: 120.0  # Source: finance-market-crash.md §9
      record_path: "EXPERIMENT/MarketCrash/Rag/records"  # Source: framework infrastructure
      fundamental_value: 100.0  # Source: simulation-bases.md §6
      initial_price: 100.0  # Source: simulation-bases.md §6
      base_price_impact: 0.08  # Source: simulation-bases.md §6
      mean_reversion: 0.01  # Source: simulation-bases.md §6
      noise_std: 0.5  # Source: simulation-bases.md §6
      liquidity_decay: 0.1  # Source: simulation-bases.md §6
      liquidity_recovery: 0.05  # Source: simulation-bases.md §6
      min_liquidity: 0.1  # Source: simulation-bases.md §6
      custom_state_hot_limit: 3  # Source: framework infrastructure
  persona: !include persona.yml

ragllm_panic_seller:
  name: "RAG Panic Seller"
  class: "examples.MarketCrash.Rag.players:RagLLMPanicSeller"
  # Expander → ragllm_panic_seller_1, ragllm_panic_seller_2, ragllm_panic_seller_3
  num_instances: 3
  config:
    identity: "ragllm_panic_seller"
    role: player
    steps_per_turn: 1
    group_tags:
      - ragllm_investors
    extras:
      record_path: "EXPERIMENT/MarketCrash/Rag/records"  # Source: framework infrastructure
      initial_cash: 10000.0  # Source: simulation-bases.md §6
      initial_position: 50.0  # Source: simulation-bases.md §6
      custom_state_hot_limit: 3  # Source: framework infrastructure
      private_knowledge:
        from_global_resources:
          - "MinerU_processed"
        local_resources:
          local_uri: ""
          local_resources: []
        rag:
          from_global_index_dir:
            - "rag_index"
          local_index_dir: ""
          embed_type: "litellm"
          embed_model: "openai/hunyuan-embedding"
          embed_api_key: "{{ HUNYUAN_API_KEY }}"
          embed_api_base: "https://api.hunyuan.cloud.tencent.com/v1"
          chunk_size: 512
          chunk_overlap: 64
          top_k: 5
      llm:
        sys_message: "examples.MarketCrash.Rag.prompts:RAGLLM_PANIC_SELLER_SYS"
        user_message: "examples.MarketCrash.Rag.prompts:RAGLLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.5
          max_new_tokens: 600
  persona: !include persona.yml

