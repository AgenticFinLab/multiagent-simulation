# =============================================================================
# MarketCrash Players Configuration
# =============================================================================
# Heterogeneous agents for market crash / liquidity spiral simulation
#
# Investor Types:
#   - Market: Rule-based with liquidity-sensitive pricing
#   - RiskParityFund: Volatility targeting (PROCYCLICAL)
#   - LeveragedHedgeFund: Margin-constrained (PROCYCLICAL)
#   - MarketMaker: Liquidity provider (WITHDRAWAL)
#   - PassiveInvestor: Buy-and-hold (NEUTRAL)
#   - PanicSeller: Loss-triggered (PROCYCLICAL)
#   - BottomFisher: Contrarian buyer (STABILIZING)
# =============================================================================

# -----------------------------------------------------------------------------
# Market (Coordinator)
# -----------------------------------------------------------------------------
market:
  archetype: stock-standard-price-impact  # -> AGENT_POOL/market/stock-standard-price-impact.md
  name: "Market"
  class: "examples.MarketCrash.Rule.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/MarketCrash/Rule/records"  # Source: framework infrastructure
      # Price dynamics
      fundamental_value: 100.0  # Source: simulation-bases.md §6
      initial_price: 100.0  # Source: simulation-bases.md §6
      base_price_impact: 0.08  # Source: simulation-bases.md §6
      mean_reversion: 0.01  # Source: simulation-bases.md §6
      noise_std: 0.5  # Source: simulation-bases.md §6
      # Liquidity dynamics
      liquidity_decay: 0.1  # Source: simulation-bases.md §6
      liquidity_recovery: 0.05  # Source: simulation-bases.md §6
      min_liquidity: 0.1  # Source: simulation-bases.md §6
      custom_state_hot_limit: 3  # Source: framework infrastructure
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Risk Parity Fund - Vol Targeting
# -----------------------------------------------------------------------------
rule_risk_parity_fund:
  name: "Risk Parity Fund"
  class: "examples.MarketCrash.Rule.players:RiskParityFund"
  # Expander → risk_parity_fund_1, risk_parity_fund_2
  num_instances: 2
  config:
    identity: "rule_risk_parity_fund"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/MarketCrash/Rule/records"  # Source: framework infrastructure
      initial_cash: 10000.0  # Source: simulation-bases.md §6
      # Starts with position
      initial_position: 50.0  # Source: simulation-bases.md §6
      custom_state_hot_limit: 3  # Source: framework infrastructure
      # Risk parity specific
      target_volatility: 2.0  # Source: simulation-bases.md §4.1.7
      vol_lookback: 5  # Source: simulation-bases.md §4.1.7
      rebalance_speed: 0.3  # Source: simulation-bases.md §4.1.7
      base_position: 50.0  # Source: simulation-bases.md §4.1.7
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Leveraged Hedge Funds
# -----------------------------------------------------------------------------
rule_leveraged_hedge_fund:
  name: "Leveraged Hedge Fund"
  class: "examples.MarketCrash.Rule.players:LeveragedHedgeFund"
  # Expander → leveraged_hedge_fund_1, leveraged_hedge_fund_2, leveraged_hedge_fund_3
  num_instances: 3
  config:
    identity: "rule_leveraged_hedge_fund"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/MarketCrash/Rule/records"  # Source: framework infrastructure
      initial_cash: 5000.0  # Source: simulation-bases.md §6
      # Leveraged position
      initial_position: 60.0  # Source: simulation-bases.md §6
      custom_state_hot_limit: 3  # Source: framework infrastructure
      # Leverage specific
      initial_leverage: 3.0  # Source: simulation-bases.md §4.2.7
      margin_call_level: 0.5  # Source: simulation-bases.md §4.2.7
      liquidation_level: 0.3  # Source: simulation-bases.md §4.2.7
      momentum_sensitivity: 0.5  # Source: simulation-bases.md §4.2.7
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Market Maker
# -----------------------------------------------------------------------------
rule_market_maker:
  name: "Market Maker"
  class: "examples.MarketCrash.Rule.players:MarketMaker"
  # Expander → market_maker_1, market_maker_2
  num_instances: 2
  config:
    identity: "rule_market_maker"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/MarketCrash/Rule/records"  # Source: framework infrastructure
      initial_cash: 10000.0  # Source: simulation-bases.md §6
      initial_position: 0.0  # Source: simulation-bases.md §6
      custom_state_hot_limit: 3  # Source: framework infrastructure
      # Market maker specific
      volatility_withdraw_threshold: 5.0  # Source: simulation-bases.md §4.3.7
      inventory_limit: 30.0  # Source: simulation-bases.md §4.3.7
      normal_quote_size: 20.0  # Source: simulation-bases.md §4.3.7
      spread_multiplier: 0.02  # Source: simulation-bases.md §4.3.7
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Passive Investor
# -----------------------------------------------------------------------------
rule_passive_investor:
  name: "Passive Investor"
  class: "examples.MarketCrash.Rule.players:PassiveInvestor"
  num_instances: 1
  config:
    identity: "rule_passive_investor"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/MarketCrash/Rule/records"  # Source: framework infrastructure
      initial_cash: 10000.0  # Source: simulation-bases.md §6
      initial_position: 30.0  # Source: simulation-bases.md §6
      custom_state_hot_limit: 3  # Source: framework infrastructure
      # Passive specific
      rebalance_frequency: 20  # Source: simulation-bases.md §4.4.7
      target_position: 30.0  # Source: simulation-bases.md §4.4.7
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Panic Sellers
# -----------------------------------------------------------------------------
rule_panic_seller:
  name: "Panic Seller"
  class: "examples.MarketCrash.Rule.players:PanicSeller"
  # Expander → panic_seller_1, panic_seller_2, panic_seller_3
  num_instances: 3
  config:
    identity: "rule_panic_seller"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/MarketCrash/Rule/records"  # Source: framework infrastructure
      initial_cash: 10000.0  # Source: simulation-bases.md §6
      initial_position: 25.0  # Source: simulation-bases.md §6
      custom_state_hot_limit: 3  # Source: framework infrastructure
      # Panic specific
      # 10% loss triggers panic
      loss_threshold: 0.10  # Source: simulation-bases.md §4.5.7
      # 3% daily drop triggers partial sell
      crash_trigger: -0.03  # Source: simulation-bases.md §4.5.7
      panic_sell_fraction: 0.5  # Source: simulation-bases.md §4.5.7
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Bottom Fisher
# -----------------------------------------------------------------------------
rule_bottom_fisher:
  name: "Bottom Fisher"
  class: "examples.MarketCrash.Rule.players:BottomFisher"
  num_instances: 1
  config:
    identity: "rule_bottom_fisher"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/MarketCrash/Rule/records"  # Source: framework infrastructure
      initial_cash: 10000.0  # Source: simulation-bases.md §6
      initial_position: 0.0  # Source: simulation-bases.md §6
      custom_state_hot_limit: 3  # Source: framework infrastructure
      # Bottom fishing specific
      crash_buy_threshold: -0.03  # Source: simulation-bases.md §4.6.7
      discount_threshold: 0.10  # Source: simulation-bases.md §4.6.7
      buy_size: 15.0  # Source: simulation-bases.md §4.6.7
      lookback: 10  # Source: simulation-bases.md §4.6.7
  persona: !include persona.yml
