# =============================================================================
# MarketCrash Players Configuration
# =============================================================================
# Heterogeneous agents for market crash / liquidity spiral simulation
#
# Investor Types:
#   - Market: Rule-based with liquidity-sensitive pricing
#   - RiskParityFund: Volatility targeting (PROCYCLICAL)
#   - LeveragedHedgeFund: Margin-constrained (PROCYCLICAL)
#   - MarketMaker: Liquidity provider (WITHDRAWAL)
#   - PassiveInvestor: Buy-and-hold (NEUTRAL)
#   - PanicSeller: Loss-triggered (PROCYCLICAL)
#   - BottomFisher: Contrarian buyer (STABILIZING)
# =============================================================================

# -----------------------------------------------------------------------------
# Market (Coordinator)
# -----------------------------------------------------------------------------
market:
  name: "Market"
  class: "examples.MarketCrash.players:Market"
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/MarketCrash/records"
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Risk Parity Fund - Vol Targeting
# -----------------------------------------------------------------------------
risk_parity_fund:
  name: "Risk Parity Fund"
  class: "examples.MarketCrash.players:RiskParityFund"
