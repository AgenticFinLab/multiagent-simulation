# =============================================================================
# MarketCrashLLM Players Configuration
# =============================================================================

market:
  name: "Market with Liquidity Dynamics"
  class: "examples.MarketCrash.LLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/MarketCrash/LLM/records"
      fundamental_value: 100.0
      initial_price: 100.0
      base_price_impact: 0.08
      mean_reversion: 0.01
      noise_std: 0.5
      liquidity_decay: 0.1
      liquidity_recovery: 0.05
      min_liquidity: 0.1
      custom_state_hot_limit: 3
  persona: !include persona.yml

llm_panic_seller:
  name: "LLM Panic Seller"
  class: "examples.MarketCrash.LLM.players:LLMPanicSeller"
  # Expander → llm_panic_seller_1, llm_panic_seller_2, llm_panic_seller_3
  num_instances: 3
  config:
    identity: "llm_panic_seller"
    role: player
    steps_per_turn: 1
    group_tags:
      - llm_investors
    extras:
      record_path: "EXPERIMENT/MarketCrash/LLM/records"
      initial_cash: 10000.0
      initial_position: 50.0
      custom_state_hot_limit: 3
      llm:
        sys_message: "examples.MarketCrash.LLM.prompts:LLM_PANIC_SELLER_SYS"
        user_message: "examples.MarketCrash.LLM.prompts:LLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.5
          max_new_tokens: 500
  persona: !include persona.yml

