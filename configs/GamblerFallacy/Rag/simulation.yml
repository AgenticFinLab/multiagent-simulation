# GamblerFallacy Rag Simulation Configuration
#
# GamblerFallacy simulation
#
# Usage:
#   python examples/GamblerFallacy/Rag/run_gamblerfallacy_rag.py \
#       -c configs/GamblerFallacy/Rag/simulation.yml

setting:
  name: "GamblerFallacy-Rag"
  description: "GamblerFallacy simulation - Rag agents"
  total_rounds: 200

  record_path: "EXPERIMENT/GamblerFallacy/Rag/records"
  storage_path: "EXPERIMENT/GamblerFallacy/Rag/communication"

  log_level: "INFO"
  log_to_file: true
  log_path: "EXPERIMENT/GamblerFallacy/Rag/logs"

environment:
  dotenv_path: ".env"
  workspace: "."

ray:
  namespace: "gamblerfallacy_rag"
  ignore_reinit_error: true
  object_store_memory: 536870912
  num_cpus: 4

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/GamblerFallacy/Rag/communication"
  record_messages: true
  message_timeout_ms: 5000
  max_retries: 3
