# GamblerFallacy Rule Simulation Configuration
#
# GamblerFallacy simulation
#
# Usage:
#   python examples/GamblerFallacy/Rule/run_gamblerfallacy_rule.py \
#       -c configs/GamblerFallacy/Rule/simulation.yml

setting:
  name: "GamblerFallacy-Rule"
  description: "GamblerFallacy simulation - Rule agents"
  total_rounds: 200

  record_path: "EXPERIMENT/GamblerFallacy/Rule/records"
  storage_path: "EXPERIMENT/GamblerFallacy/Rule/communication"

  log_level: "INFO"
  log_to_file: true
  log_path: "EXPERIMENT/GamblerFallacy/Rule/logs"

environment:
  dotenv_path: ".env"
  workspace: "."

ray:
  namespace: "gamblerfallacy_rule"
  ignore_reinit_error: true
  object_store_memory: 536870912
  num_cpus: 4

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/GamblerFallacy/Rule/communication"
  record_messages: true
  message_timeout_ms: 5000
  max_retries: 3
