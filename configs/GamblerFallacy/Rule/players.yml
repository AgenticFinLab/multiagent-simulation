# GamblerFallacy Rule Agent Configuration

market:
  name: "Market"
  class: "examples.GamblerFallacy.Rule.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/GamblerFallacy/Rule/records"
      initial_price: 100.0
      fundamental_value: 100.0
      price_impact: 0.05
      mean_reversion: 0.02
      noise_std: 0.01
      custom_state_hot_limit: 3
  persona: !include persona.yml

rule_streak_reversal_trader:
  name: "StreakReversalTrader"
  class: "examples.GamblerFallacy.Rule.players:StreakReversalTrader"
  num_instances: 2
  config:
    identity: "rule_streak_reversal_trader"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/GamblerFallacy/Rule/records"
      initial_cash: 1000000.0
      initial_position: 0
      initial_price: 100.0
      fundamental_value: 100.0
      activation_threshold: 0.02
      quantity_scale: 5000
      max_order: 800
      custom_state_hot_limit: 3
  persona: !include persona.yml

