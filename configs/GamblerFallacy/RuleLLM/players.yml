# GamblerFallacy RuleLLM Agent Configuration

market:
  name: "Market"
  class: "examples.GamblerFallacy.RuleLLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/GamblerFallacy/RuleLLM/records"
      initial_price: 100.0
      fundamental_value: 100.0
      price_impact: 0.05
      mean_reversion: 0.02
      noise_std: 0.01
      custom_state_hot_limit: 3
  persona: !include persona.yml

rulellm_streak_reversal_trader:
  name: "StreakReversalTrader"
  class: "examples.GamblerFallacy.RuleLLM.players:RuleLLMStreakReversalTrader"
  num_instances: 2
  config:
    identity: "rulellm_streak_reversal_trader"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/GamblerFallacy/RuleLLM/records"
      initial_cash: 1000000.0
      initial_position: 0
      initial_price: 100.0
      fundamental_value: 100.0
      max_order: 800
      custom_state_hot_limit: 3
      llm:
        sys_message: "examples.GamblerFallacy.RuleLLM.prompts:RULELLM_STREAK_REVERSAL_TRADER_SYS"
        user_message: "examples.GamblerFallacy.RuleLLM.prompts:RULELLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.5
          max_tokens: 512
  persona: !include persona.yml

