# GamblerFallacy RuleLLM Simulation Configuration
#
# GamblerFallacy simulation
#
# Usage:
#   python examples/GamblerFallacy/RuleLLM/run_gamblerfallacy_rulellm.py \
#       -c configs/GamblerFallacy/RuleLLM/simulation.yml

setting:
  name: "GamblerFallacy-RuleLLM"
  description: "GamblerFallacy simulation - RuleLLM agents"
  total_rounds: 200

  record_path: "EXPERIMENT/GamblerFallacy/RuleLLM/records"
  storage_path: "EXPERIMENT/GamblerFallacy/RuleLLM/communication"

  log_level: "INFO"
  log_to_file: true
  log_path: "EXPERIMENT/GamblerFallacy/RuleLLM/logs"

environment:
  dotenv_path: ".env"
  workspace: "."

ray:
  namespace: "gamblerfallacy_rulellm"
  ignore_reinit_error: true
  object_store_memory: 536870912
  num_cpus: 4

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/GamblerFallacy/RuleLLM/communication"
  record_messages: true
  message_timeout_ms: 5000
  max_retries: 3
