# =============================================================================
# EquityPremiumLLM Players Configuration
# =============================================================================

market:
  name: "Market with Stock and Bond"
  class: "examples.EquityPremium.LLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      # Source: infrastructure
      record_path: "EXPERIMENT/EquityPremium/LLM/records"
      # Source: target §9 — ~6% annual / 252 (Mehra & Prescott 1985)
      stock_expected_return: 0.000238
      # Source: target §9 — ~1% annual / 252
      bond_return: 0.0000397
      # Source: target §9 — ~15% annual vol / sqrt(252)
      stock_volatility: 0.00945
      # Source: target §9 — normalization
      initial_stock_price: 100.0
      # Source: implementation-infrastructure
      custom_state_hot_limit: 3
  persona: !include persona.yml

llm_myopic_loss_averse:
  name: "LLM Myopic Loss-Averse"
  class: "examples.EquityPremium.LLM.players:LLMMyopicLossAverse"
  # Expander → llm_myopic_1, llm_myopic_2, llm_myopic_3, llm_myopic_4, llm_myopic_5
  num_instances: 5
  config:
    identity: "llm_myopic_loss_averse"
    role: player
    steps_per_turn: 1
    group_tags:
      - llm_investors
    extras:
      # Source: infrastructure
      record_path: "EXPERIMENT/EquityPremium/LLM/records"
      # Source: target §9 — normalization
      initial_cash: 10000.0
      # Source: simulation-bases.md §4.1 — 50% cash allocation
      initial_cash_ratio: 0.5
      # Source: simulation-bases.md §4.1 — initial stock position
      initial_stock_shares: 50.0
      # Source: simulation-bases.md §4.1 — 25% bonds
      initial_bond_ratio: 0.25
      # Source: implementation-infrastructure
      custom_state_hot_limit: 3
      # Source: LLM-wiring
      llm:
        sys_message: "examples.EquityPremium.LLM.prompts:LLM_MYOPIC_LOSS_AVERSE_SYS"
        user_message: "examples.EquityPremium.LLM.prompts:LLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.3
          max_new_tokens: 500
  persona: !include persona.yml

