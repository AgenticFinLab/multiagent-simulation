# =============================================================================
# EquityPremiumLLM Persona Configuration
# =============================================================================
# Shared persona configuration for all players in the simulation.
# =============================================================================

auto_checkpoint: false
debug_mode: true

proxy:
  storage:
    checkpoint_dir: "EXPERIMENT/EquityPremium/LLM/checkpoints"
    record_path: "EXPERIMENT/EquityPremium/LLM/records"
    record_rounds: true
    turn_block_size: 3

  monitoring:
    record_path: "EXPERIMENT/EquityPremium/LLM/monitoring"
    monitor_hot_limit: 3

  communication:
    # Longer timeout for LLM API calls (2–8 s inference latency)
    message_timeout_ms: 30000
    enable_compression: true

  resource:
    mcp_servers: []
    enable_caching: false
