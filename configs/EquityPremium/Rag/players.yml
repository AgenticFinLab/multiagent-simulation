# =============================================================================
# EquityPremiumLLM Players Configuration
# =============================================================================

# =============================================================================
# Shared Knowledge Configuration
# =============================================================================
knowledge:
  backend: "local"
  global_uri: "examples/document-sources"
  resource_csv:
    - "examples/document-sources/books.csv"
    - "examples/document-sources/source"
  preprocessing:
    parser: "mineru"
    timeout_per_page: 30
    max_pages: 250
    output_position: "MinerU_processed"
  rag:
    output_position: "rag_index"
    embed_type: "litellm"
    embed_model: "openai/hunyuan-embedding"
    embed_api_key: "{{ HUNYUAN_API_KEY }}"
    embed_api_base: "https://api.hunyuan.cloud.tencent.com/v1"
    chunk_size: 512
    chunk_overlap: 64

market:
  name: "Market with Stock and Bond"
  class: "examples.EquityPremium.Rag.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/EquityPremium/Rag/records"
      # ~6% annual / 252 days
      stock_expected_return: 0.000238
      # ~1% annual / 252 days
      bond_return: 0.0000397
      # ~15% annual vol / sqrt(252)
      stock_volatility: 0.00945
      initial_stock_price: 100.0
      custom_state_hot_limit: 3
  persona: !include persona.yml

ragllm_myopic:
  name: "RAG Myopic Loss-Averse"
  class: "examples.EquityPremium.Rag.players:RagLLMMyopicLossAverse"
  # Expander → ragllm_myopic_1, ragllm_myopic_2, ragllm_myopic_3, ragllm_myopic_4, ragllm_myopic_5
  num_instances: 5
  config:
    identity: "ragllm_myopic"
    role: player
    steps_per_turn: 1
    group_tags:
      - ragllm_investors
    extras:
      record_path: "EXPERIMENT/EquityPremium/Rag/records"
      initial_cash: 10000.0
      # 50% cash
      initial_cash_ratio: 0.5
      initial_stock_shares: 50.0
      # 25% bonds
      initial_bond_ratio: 0.25
      custom_state_hot_limit: 3
      private_knowledge:
        from_global_resources:
          - "MinerU_processed"
        local_resources:
          local_uri: ""
          local_resources: []
        rag:
          from_global_index_dir:
            - "rag_index"
          local_index_dir: ""
          embed_type: "litellm"
          embed_model: "openai/hunyuan-embedding"
          embed_api_key: "{{ HUNYUAN_API_KEY }}"
          embed_api_base: "https://api.hunyuan.cloud.tencent.com/v1"
          chunk_size: 512
          chunk_overlap: 64
          top_k: 5
      llm:
        sys_message: "examples.EquityPremium.Rag.prompts:RAGLLM_MYOPIC_LOSS_AVERSE_SYS"
        user_message: "examples.EquityPremium.Rag.prompts:RAGLLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-1-6-lite-251015"
        generation_config:
          temperature: 0.3
          max_new_tokens: 600
  persona: !include persona.yml

