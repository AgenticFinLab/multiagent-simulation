# =============================================================================
# EquityPremium Rag Players Configuration
# =============================================================================

# =============================================================================
# Shared Knowledge Configuration
# =============================================================================
knowledge:
  backend: "local"
  global_uri: "examples/document-sources"
  resource_csv:
    - "examples/document-sources/books.csv"
    - "examples/document-sources/source"
  preprocessing:
    parser: "mineru"
    timeout_per_page: 30
    max_pages: 250
    output_position: "MinerU_processed"
  rag:
    output_position: "rag_index"
    embed_type: "litellm"
    embed_model: "openai/hunyuan-embedding"
    embed_api_key: "{{ HUNYUAN_API_KEY }}"
    embed_api_base: "https://api.hunyuan.cloud.tencent.com/v1"
    chunk_size: 512
    chunk_overlap: 64

market:
  archetype: stock-standard-price-impact  # -> AGENT_POOL/market/stock-standard-price-impact.md
  name: "Market with Stock and Bond"
  class: "examples.EquityPremium.Rag.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      # Source: infrastructure
      record_path: "EXPERIMENT/EquityPremium/Rag/records"
      # Source: target §9 — ~6% annual / 252 (Mehra & Prescott 1985)
      stock_expected_return: 0.000238
      # Source: target §9 — ~1% annual / 252
      bond_return: 0.0000397
      # Source: target §9 — ~15% annual vol / sqrt(252)
      stock_volatility: 0.00945
      # Source: target §9 — normalization
      initial_stock_price: 100.0
      # Source: implementation-infrastructure
      custom_state_hot_limit: 3
  persona: !include persona.yml

ragllm_myopic_loss_averse:
  name: "RAG Myopic Loss-Averse"
  class: "examples.EquityPremium.Rag.players:RagLLMMyopicLossAverse"
  # Expander → ragllm_myopic_1, ragllm_myopic_2, ragllm_myopic_3, ragllm_myopic_4, ragllm_myopic_5
  num_instances: 5
  config:
    identity: "ragllm_myopic_loss_averse"
    role: player
    steps_per_turn: 1
    group_tags:
      - ragllm_investors
    extras:
      # Source: infrastructure
      record_path: "EXPERIMENT/EquityPremium/Rag/records"
      # Source: target §9 — normalization
      initial_cash: 10000.0
      # Source: simulation-bases.md §4.1 — 50% cash allocation
      initial_cash_ratio: 0.5
      # Source: simulation-bases.md §4.1 — initial stock position
      initial_stock_shares: 50.0
      # Source: simulation-bases.md §4.1 — 25% bonds
      initial_bond_ratio: 0.25
      # Source: implementation-infrastructure
      custom_state_hot_limit: 3
      # Source: RAG-wiring
      private_knowledge:
        from_global_resources:
          - "MinerU_processed"
        local_resources:
          local_uri: ""
          local_resources: []
        rag:
          from_global_index_dir:
            - "rag_index"
          local_index_dir: ""
          embed_type: "litellm"
          embed_model: "openai/hunyuan-embedding"
          embed_api_key: "{{ HUNYUAN_API_KEY }}"
          embed_api_base: "https://api.hunyuan.cloud.tencent.com/v1"
          chunk_size: 512
          chunk_overlap: 64
          top_k: 5
      # Source: LLM-wiring
      llm:
        sys_message: "examples.EquityPremium.Rag.prompts:RAGLLM_MYOPIC_LOSS_AVERSE_INVESTOR_SYS"
        user_message: "examples.EquityPremium.Rag.prompts:RAGLLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.3
          max_new_tokens: 600
  persona: !include persona.yml

