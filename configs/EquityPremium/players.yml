# =============================================================================
# EquityPremium Players Configuration
# =============================================================================
# Equity Premium Puzzle Simulation (Mehra & Prescott, 1985)
#
# Investor Types:
#   - Market: Two-asset market (stock + bond)
#   - MyopicLossAverseInvestor: Short-horizon, loss averse (key driver)
#   - LongHorizonInvestor: Patient investor
#   - RiskNeutralInvestor: Theoretically optimal
#   - ConservativeInvestor: Bond-preferring
#   - NoiseTrader: Random liquidity
# =============================================================================

market:
  name: "Market"
  class: "examples.EquityPremium.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/EquityPremium/records"
      # Market parameters (daily basis)
      # ~6% annual / 252
      stock_expected_return: 0.000238
      # ~1% annual / 252
      bond_return: 0.0000397
      # ~15% annual / sqrt(252)
      stock_volatility: 0.00945
      initial_stock_price: 100.0
      custom_state_hot_limit: 3
  persona: !include persona.yml

mla:
  name: "Myopic Loss Averse"
  class: "examples.EquityPremium.players:MyopicLossAverseInvestor"
  # Expander → mla_1, mla_2, mla_3, mla_4, mla_5
  num_instances: 5
  config:
    identity: "mla"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/EquityPremium/records"
      initial_cash: 10000.0
      initial_stock: 0.0
      custom_state_hot_limit: 3
      # MLA specific
      loss_aversion: 2.25
      evaluation_window: 5
      risk_aversion: 2.0
  persona: !include persona.yml

long_horizon:
  name: "Long Horizon Investor"
  class: "examples.EquityPremium.players:LongHorizonInvestor"
  # Expander → long_horizon_1, long_horizon_2
  num_instances: 2
  config:
    identity: "long_horizon"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/EquityPremium/records"
      initial_cash: 10000.0
      initial_stock: 0.0
      custom_state_hot_limit: 3
      # Long horizon specific
      evaluation_window: 50
      target_stock_pct: 0.6
  persona: !include persona.yml

risk_neutral:
  name: "Risk Neutral Investor"
  class: "examples.EquityPremium.players:RiskNeutralInvestor"
  num_instances: 1
  config:
    identity: "risk_neutral"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/EquityPremium/records"
      initial_cash: 10000.0
      initial_stock: 0.0
      custom_state_hot_limit: 3
      # Risk neutral specific
      excess_return_multiplier: 500
  persona: !include persona.yml

conservative:
  name: "Conservative Investor"
  class: "examples.EquityPremium.players:ConservativeInvestor"
  # Expander → conservative_1, conservative_2, conservative_3
  num_instances: 3
  config:
    identity: "conservative"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/EquityPremium/records"
      initial_cash: 10000.0
      initial_stock: 0.0
      custom_state_hot_limit: 3
      # Conservative specific
      target_stock_pct: 0.2
  persona: !include persona.yml

noise_trader:
  name: "Noise Trader"
  class: "examples.EquityPremium.players:NoiseTrader"
  # Expander → noise_trader_1, noise_trader_2
  num_instances: 2
  config:
    identity: "noise_trader"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/EquityPremium/records"
      initial_cash: 10000.0
      initial_stock: 0.0
      custom_state_hot_limit: 3
      # Noise specific
      noise_std: 8.0
  persona: !include persona.yml
