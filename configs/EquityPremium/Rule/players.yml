# =============================================================================
# EquityPremium Players Configuration
# =============================================================================
# Equity Premium Puzzle Simulation (Mehra & Prescott, 1985)
#
# Investor Types:
#   - Market: Two-asset market (stock + bond)
#   - MyopicLossAverseInvestor: Short-horizon, loss averse (key driver)
#   - LongHorizonInvestor: Patient investor
#   - RiskNeutralInvestor: Theoretically optimal
#   - ConservativeInvestor: Bond-preferring
#   - NoiseTrader: Random liquidity
# =============================================================================

market:
  archetype: stock-standard-price-impact  # -> masim/agents/defines/market/stock-standard-price-impact.md
  name: "Market"
  class: "examples.EquityPremium.Rule.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      # Source: infrastructure
      record_path: "EXPERIMENT/EquityPremium/Rule/records"
      # Source: target §9 — ~6% annual / 252 (Mehra & Prescott 1985)
      stock_expected_return: 0.000238
      # Source: target §9 — ~1% annual / 252
      bond_return: 0.0000397
      # Source: target §9 — ~15% annual / sqrt(252)
      stock_volatility: 0.00945
      # Source: target §9 — normalization
      initial_stock_price: 100.0
      # Source: implementation-infrastructure
      custom_state_hot_limit: 3
  persona: !include persona.yml

rule_myopic_loss_averse_investor:
  name: "Myopic Loss Averse"
  class: "examples.EquityPremium.Rule.players:MyopicLossAverseInvestor"
  # Expander → mla_1, mla_2, mla_3, mla_4, mla_5
  num_instances: 5
  config:
    identity: "rule_myopic_loss_averse_investor"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      # Source: infrastructure
      record_path: "EXPERIMENT/EquityPremium/Rule/records"
      # Source: target §9 — normalization
      initial_cash: 10000.0
      # Source: target §9 — normalization
      initial_stock: 0.0
      # Source: implementation-infrastructure
      custom_state_hot_limit: 3
      # Source: target §9 — Benartzi & Thaler (1995) DOI: 10.2307/2118511
      loss_aversion: 2.25
      # Source: target §9 — Benartzi & Thaler (1995) DOI: 10.2307/2118511
      evaluation_window: 5
      # Source: target §9 — standard CRRA range
      risk_aversion: 2.0
  persona: !include persona.yml

rule_long_horizon_investor:
  name: "Long Horizon Investor"
  class: "examples.EquityPremium.Rule.players:LongHorizonInvestor"
  # Expander → long_horizon_1, long_horizon_2
  num_instances: 2
  config:
    identity: "rule_long_horizon_investor"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      # Source: infrastructure
      record_path: "EXPERIMENT/EquityPremium/Rule/records"
      # Source: target §9 — normalization
      initial_cash: 10000.0
      # Source: target §9 — normalization
      initial_stock: 0.0
      # Source: implementation-infrastructure
      custom_state_hot_limit: 3
      # Source: simulation-bases.md §4.2 — long evaluation window
      evaluation_window: 50
      # Source: target §9 — Samuelson (1969) DOI: 10.2307/1926559
      target_stock_pct: 0.6
  persona: !include persona.yml

rule_risk_neutral_investor:
  name: "Risk Neutral Investor"
  class: "examples.EquityPremium.Rule.players:RiskNeutralInvestor"
  num_instances: 1
  config:
    identity: "rule_risk_neutral_investor"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      # Source: infrastructure
      record_path: "EXPERIMENT/EquityPremium/Rule/records"
      # Source: target §9 — normalization
      initial_cash: 10000.0
      # Source: target §9 — normalization
      initial_stock: 0.0
      # Source: implementation-infrastructure
      custom_state_hot_limit: 3
      # Source: target §9 — calibration to match rational benchmark
      excess_return_multiplier: 500
  persona: !include persona.yml

rule_conservative_investor:
  name: "Conservative Investor"
  class: "examples.EquityPremium.Rule.players:ConservativeInvestor"
  # Expander → conservative_1, conservative_2, conservative_3
  num_instances: 3
  config:
    identity: "rule_conservative_investor"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      # Source: infrastructure
      record_path: "EXPERIMENT/EquityPremium/Rule/records"
      # Source: target §9 — normalization
      initial_cash: 10000.0
      # Source: target §9 — normalization
      initial_stock: 0.0
      # Source: implementation-infrastructure
      custom_state_hot_limit: 3
      # Source: target §9 — Kahneman & Tversky (1979) DOI: 10.2307/1914185
      target_stock_pct: 0.2
  persona: !include persona.yml

rule_noise_trader:
  name: "Noise Trader"
  class: "examples.EquityPremium.Rule.players:NoiseTrader"
  # Expander → noise_trader_1, noise_trader_2
  num_instances: 2
  config:
    identity: "rule_noise_trader"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      # Source: infrastructure
      record_path: "EXPERIMENT/EquityPremium/Rule/records"
      # Source: target §9 — normalization
      initial_cash: 10000.0
      # Source: target §9 — normalization
      initial_stock: 0.0
      # Source: implementation-infrastructure
      custom_state_hot_limit: 3
      # Source: target §9 — Black (1986) DOI: 10.1111/j.1540-6261.1986.tb04513.x
      noise_std: 8.0
  persona: !include persona.yml
