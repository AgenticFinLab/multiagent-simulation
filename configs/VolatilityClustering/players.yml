# =============================================================================
# VolatilityClustering Players Configuration
# =============================================================================
# Heterogeneous Agent Model for GARCH-like Volatility Clustering
#
# Investor Types:
#   - Market:           Rule-based coordinator with GARCH volatility dynamics
#   - Fundamentalist:   Slow mean reversion (stabilizing, delayed)
#   - TrendFollower:    Fast momentum, high volatility sensitivity (destabilizing)
#   - NoiseTrader:      Random liquidity provider (neutral)
#   - SlowAdapter:      Conservative, slow information processing (weak stabilizing)
#   - VolatilityTrader: Trades volatility regime (weak stabilizing)
# =============================================================================

# -----------------------------------------------------------------------------
# Market (Coordinator)
# -----------------------------------------------------------------------------
market:
  name: "Market"
  class: "examples.VolatilityClustering.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/VolatilityClustering/records"
      # Price dynamics
      fundamental_value: 100.0
      initial_price: 100.0
      price_impact: 0.05
      mean_reversion: 0.02
      # GARCH parameters
      garch_omega: 0.0001
      garch_alpha: 0.15
      garch_beta: 0.80
      min_volatility: 0.5
      max_volatility: 10.0
      custom_state_hot_limit: 3
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Fundamentalist - Slow Mean Reversion
# -----------------------------------------------------------------------------
fundamentalist:
  name: "Fundamentalist Investor"
  class: "examples.VolatilityClustering.players:Fundamentalist"
  num_instances: 1
  config:
    identity: "fundamentalist"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/VolatilityClustering/records"
      initial_cash: 10000.0
      initial_position: 0.0
      custom_state_hot_limit: 3
      # Fundamentalist specific
      trade_frequency: 3
      value_sensitivity: 0.5
      base_position_size: 20.0
      value_noise_std: 2.0
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Trend Followers (Multiple for stronger effect)
# -----------------------------------------------------------------------------
trend_follower:
  name: "Trend Follower"
  class: "examples.VolatilityClustering.players:TrendFollower"
  # Expander → trend_follower_1, trend_follower_2
  num_instances: 2
  config:
    identity: "trend_follower"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/VolatilityClustering/records"
      initial_cash: 10000.0
      initial_position: 0.0
      custom_state_hot_limit: 3
      # Trend follower specific
      lookback_window: 3
      base_position_size: 30.0
      volatility_sensitivity: 0.8
      baseline_volatility: 1.0
      trend_threshold: 0.005
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Noise Traders
# -----------------------------------------------------------------------------
noise_trader:
  name: "Noise Trader"
  class: "examples.VolatilityClustering.players:NoiseTrader"
  # Expander → noise_trader_1, noise_trader_2
  num_instances: 2
  config:
    identity: "noise_trader"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/VolatilityClustering/records"
      initial_cash: 10000.0
      initial_position: 0.0
      custom_state_hot_limit: 3
      # Noise trader specific
      position_volatility: 15.0
      mean_reversion_speed: 0.1
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Slow Adapter
# -----------------------------------------------------------------------------
slow_adapter:
  name: "Slow Adapter"
  class: "examples.VolatilityClustering.players:SlowAdapter"
  num_instances: 1
  config:
    identity: "slow_adapter"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/VolatilityClustering/records"
      initial_cash: 10000.0
      initial_position: 0.0
      custom_state_hot_limit: 3
      # Slow adapter specific
      lookback_window: 10
      update_weight: 0.1
      base_position_size: 10.0
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Volatility Trader
# -----------------------------------------------------------------------------
volatility_trader:
  name: "Volatility Trader"
  class: "examples.VolatilityClustering.players:VolatilityTrader"
  num_instances: 1
  config:
    identity: "volatility_trader"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/VolatilityClustering/records"
      initial_cash: 10000.0
      initial_position: 0.0
      custom_state_hot_limit: 3
      # Volatility trader specific
      vol_lookback: 5
      high_vol_threshold: 1.5
      low_vol_threshold: 0.7
      base_position_size: 15.0
  persona: !include persona.yml
