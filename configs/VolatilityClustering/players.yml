# =============================================================================
# VolatilityClustering Players Configuration
# =============================================================================
# Heterogeneous Agent Model for GARCH-like Volatility Clustering
#
# Investor Types:
#   - Market:           Rule-based coordinator with GARCH volatility dynamics
#   - Fundamentalist:   Slow mean reversion (stabilizing, delayed)
#   - TrendFollower:    Fast momentum, high volatility sensitivity (destabilizing)
#   - NoiseTrader:      Random liquidity provider (neutral)
#   - SlowAdapter:      Conservative, slow information processing (weak stabilizing)
#   - VolatilityTrader: Trades volatility regime (weak stabilizing)
# =============================================================================

# -----------------------------------------------------------------------------
# Market (Coordinator)
# -----------------------------------------------------------------------------
market:
  name: "Market"
  class: "examples.VolatilityClustering.players:Market"
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/VolatilityClustering/records"
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Fundamentalist - Slow Mean Reversion
# -----------------------------------------------------------------------------
fundamentalist:
  name: "Fundamentalist Investor"
  class: "examples.VolatilityClustering.players:Fundamentalist"
  config:
    identity: "fundamentalist"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      strategy: fundamentalist
      record_path: "EXPERIMENT/VolatilityClustering/records"
  persona: !include persona.yml

