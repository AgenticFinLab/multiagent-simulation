# =============================================================================
# VolatilityClustering Players Configuration
# =============================================================================
# Heterogeneous Agent Model for GARCH-like Volatility Clustering
#
# Investor Types:
#   - Market:           Rule-based coordinator with GARCH volatility dynamics
#   - Fundamentalist:   Slow mean reversion (stabilizing, delayed)
#   - TrendFollower:    Fast momentum, high volatility sensitivity (destabilizing)
#   - NoiseTrader:      Random liquidity provider (neutral)
#   - SlowAdapter:      Conservative, slow information processing (weak stabilizing)
#   - VolatilityTrader: Trades volatility regime (weak stabilizing)
# =============================================================================

# -----------------------------------------------------------------------------
# Market (Coordinator)
# -----------------------------------------------------------------------------
market:
  name: "Market"
  class: "examples.VolatilityClustering.Rule.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/VolatilityClustering/Rule/records"
      # Price dynamics
      fundamental_value: 100.0  # Source: target §9 fundamental_value row; normalization
      initial_price: 100.0  # Source: target §9 initial_price row; normalization
      price_impact: 0.05  # Source: target §9 price_impact row; Brock and Hommes (1998) 10.1016/S0165-1889(98)00011-6
      mean_reversion: 0.02  # Source: target §9 mean_reversion row; Brock and Hommes (1998) 10.1016/S0165-1889(98)00011-6
      # GARCH parameters
      garch_omega: 0.0001  # Source: target §9 GARCH_omega row; Engle (1982) 10.2307/1912773
      garch_alpha: 0.15  # Source: target §9 GARCH_alpha row; Engle (1982) 10.2307/1912773; Bollerslev (1986) 10.1016/0304-4076(86)90063-1
      garch_beta: 0.80  # Source: target §9 GARCH_beta row; Bollerslev (1986) 10.1016/0304-4076(86)90063-1
      min_volatility: 0.5  # Source: target §9 min_volatility row; numerical stability bound
      max_volatility: 10.0  # Source: target §9 max_volatility row; numerical stability bound
      custom_state_hot_limit: 3
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Fundamentalist - Slow Mean Reversion
# -----------------------------------------------------------------------------
rule_fundamentalist:
  name: "Fundamentalist Investor"
  class: "examples.VolatilityClustering.Rule.players:Fundamentalist"
  # Expander → fundamentalist_1, fundamentalist_2
  num_instances: 2
  config:
    identity: "rule_fundamentalist"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/VolatilityClustering/Rule/records"
      initial_cash: 10000.0  # Source: target §9 initial_cash row; normalization
      initial_position: 0.0  # Source: target §9 initial_position row; normalization
      custom_state_hot_limit: 3
      # Fundamentalist specific
      trade_frequency: 3  # Source: target §9 trade_frequency row; Brock and Hommes (1998) 10.1016/S0165-1889(98)00011-6
      value_sensitivity: 0.5  # Source: target §9 value_sensitivity row; Brock and Hommes (1998) 10.1016/S0165-1889(98)00011-6
      base_position_size: 20.0  # Source: target §9 base_position_size row; calibrated
      value_noise_std: 2.0  # Source: target §9 value_noise_std row; estimation noise
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Trend Followers (Multiple for stronger effect)
# -----------------------------------------------------------------------------
rule_trend_follower:
  name: "Trend Follower"
  class: "examples.VolatilityClustering.Rule.players:TrendFollower"
  # Expander → trend_follower_1, trend_follower_2, trend_follower_3
  num_instances: 3
  config:
    identity: "rule_trend_follower"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/VolatilityClustering/Rule/records"
      initial_cash: 10000.0  # Source: target §9 initial_cash row; normalization
      initial_position: 0.0  # Source: target §9 initial_position row; normalization
      custom_state_hot_limit: 3
      # Trend follower specific
      lookback_window: 3  # Source: target §9 lookback_window(TF) row; Moskowitz et al. (2012) 10.1016/j.jfineco.2011.11.003
      base_position_size: 30.0  # Source: target §9 base_position_size row; calibrated
      volatility_sensitivity: 0.8  # Source: target §9 volatility_sensitivity row; Moskowitz et al. (2012) 10.1016/j.jfineco.2011.11.003
      baseline_volatility: 1.0  # Source: target §9 baseline_volatility row; calibration reference
      trend_threshold: 0.005  # Source: target §9 trend_threshold row; Moskowitz et al. (2012) 10.1016/j.jfineco.2011.11.003
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Noise Traders
# -----------------------------------------------------------------------------
rule_noise_trader:
  name: "Noise Trader"
  class: "examples.VolatilityClustering.Rule.players:NoiseTrader"
  # Expander → noise_trader_1, noise_trader_2, noise_trader_3
  num_instances: 3
  config:
    identity: "rule_noise_trader"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/VolatilityClustering/Rule/records"
      initial_cash: 10000.0  # Source: target §9 initial_cash row; normalization
      initial_position: 0.0  # Source: target §9 initial_position row; normalization
      custom_state_hot_limit: 3
      # Noise trader specific
      position_volatility: 15.0  # Source: target §9 position_volatility row; De Long et al. (1990) 10.1086/261703
      mean_reversion_speed: 0.1  # Source: target §9 mean_reversion_speed row; De Long et al. (1990) 10.1086/261703
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Slow Adapter
# -----------------------------------------------------------------------------
rule_slow_adapter:
  name: "Slow Adapter"
  class: "examples.VolatilityClustering.Rule.players:SlowAdapter"
  num_instances: 1
  config:
    identity: "rule_slow_adapter"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/VolatilityClustering/Rule/records"
      initial_cash: 10000.0  # Source: target §9 initial_cash row; normalization
      initial_position: 0.0  # Source: target §9 initial_position row; normalization
      custom_state_hot_limit: 3
      # Slow adapter specific
      lookback_window: 10  # Source: target §9 lookback_window(SA) row; Brock and Hommes (1998) 10.1016/S0165-1889(98)00011-6
      update_weight: 0.1  # Source: target §9 update_weight row; adaptive expectations literature
      base_position_size: 10.0  # Source: target §9 base_position_size row; calibrated
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Volatility Trader
# -----------------------------------------------------------------------------
rule_volatility_trader:
  name: "Volatility Trader"
  class: "examples.VolatilityClustering.Rule.players:VolatilityTrader"
  num_instances: 1
  config:
    identity: "rule_volatility_trader"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/VolatilityClustering/Rule/records"
      initial_cash: 10000.0  # Source: target §9 initial_cash row; normalization
      initial_position: 0.0  # Source: target §9 initial_position row; normalization
      custom_state_hot_limit: 3
      # Volatility trader specific
      vol_lookback: 5  # Source: target §9 vol_lookback row; Engle (1982) 10.2307/1912773
      high_vol_threshold: 1.5  # Source: target §9 high_vol_threshold row; Moreira and Muir (2017) 10.1111/jofi.12575
      low_vol_threshold: 0.7  # Source: target §9 low_vol_threshold row; Moreira and Muir (2017) 10.1111/jofi.12575
      base_position_size: 15.0  # Source: target §9 base_position_size row; calibrated
  persona: !include persona.yml
