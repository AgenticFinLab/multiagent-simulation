# =============================================================================
# VolatilityClusteringLLM Players Configuration
# =============================================================================
# LLM-powered Heterogeneous Agent Model for GARCH-like Volatility Clustering
#
# LLM Investor Types:
#   - Market:               Rule-based coordinator with GARCH volatility
#   - LLMFundamentalist:    Slow mean reversion (stabilizing, delayed)
#   - LLMTrendFollower:     Fast momentum, vol-sensitive (destabilizing)
#   - LLMNoiseTrader:       Random liquidity (neutral)
#   - LLMSlowAdapter:       Conservative, delayed (weak stabilizing)
#   - LLMVolatilityTrader:  Trades vol regime (weak stabilizing)
# =============================================================================

# -----------------------------------------------------------------------------
# Market (Coordinator) - Rule-Based with GARCH Volatility
# -----------------------------------------------------------------------------
# =============================================================================
# Shared Knowledge Configuration
# =============================================================================
knowledge:
  backend: "local"
  global_uri: "examples/document-sources"
  resource_csv:
    - "examples/document-sources/books.csv"
    - "examples/document-sources/source"
  preprocessing:
    parser: "mineru"
    timeout_per_page: 30
    max_pages: 250
    output_position: "MinerU_processed"
  rag:
    output_position: "rag_index"
    embed_type: "litellm"
    embed_model: "openai/hunyuan-embedding"
    embed_api_key: "{{ HUNYUAN_API_KEY }}"
    embed_api_base: "https://api.hunyuan.cloud.tencent.com/v1"
    chunk_size: 512
    chunk_overlap: 64

market:
  name: "Market"
  class: "examples.VolatilityClustering.Rag.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/VolatilityClustering/Rag/records"
      fundamental_value: 100.0
      initial_price: 100.0
      price_impact: 0.05
      mean_reversion: 0.02
      garch_omega: 0.0001
      garch_alpha: 0.15
      garch_beta: 0.80
      min_volatility: 0.5
      max_volatility: 10.0
      custom_state_hot_limit: 3
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# LLM Fundamentalist - Slow Mean Reversion
# -----------------------------------------------------------------------------
ragllm_fundamentalist:
  name: "RAG Fundamentalist"
  class: "examples.VolatilityClustering.Rag.players:RagLLMFundamentalist"
  # Expander → ragllm_fundamentalist_1, ragllm_fundamentalist_2
  num_instances: 2
  config:
    identity: "ragllm_fundamentalist"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/VolatilityClustering/Rag/records"
      initial_cash: 10000.0
      initial_position: 0.0
      custom_state_hot_limit: 3
      private_knowledge:
        from_global_resources:
          - "MinerU_processed"
        local_resources:
          local_uri: ""
          local_resources: []
        rag:
          from_global_index_dir:
            - "rag_index"
          local_index_dir: ""
          embed_type: "litellm"
          embed_model: "openai/hunyuan-embedding"
          embed_api_key: "{{ HUNYUAN_API_KEY }}"
          embed_api_base: "https://api.hunyuan.cloud.tencent.com/v1"
          chunk_size: 512
          chunk_overlap: 64
          top_k: 5
      llm:
        sys_message: "examples.VolatilityClustering.Rag.prompts:RAGLLM_FUNDAMENTALIST_SYS"
        user_message: "examples.VolatilityClustering.Rag.prompts:RAGLLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-1-6-lite-251015"
        generation_config:
          temperature: 0.3
          max_new_tokens: 600
  persona: !include persona.yml

