# CreditCycle Rule Simulation Configuration

setting:
  name: "CreditCycle-Rule"
  description: "CreditCycle simulation - Rule agents"
  total_rounds: 200
  record_path: "EXPERIMENT/CreditCycle/Rule/records"
  storage_path: "EXPERIMENT/CreditCycle/Rule/communication"
  log_level: "INFO"
  log_to_file: true
  log_path: "EXPERIMENT/CreditCycle/Rule/logs"

environment:
  dotenv_path: ".env"
  workspace: "."

ray:
  namespace: "creditcycle_rule"
  ignore_reinit_error: true
  object_store_memory: 536870912
  num_cpus: 4

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/CreditCycle/Rule/communication"
  record_messages: true
  message_timeout_ms: 5000
  max_retries: 3
