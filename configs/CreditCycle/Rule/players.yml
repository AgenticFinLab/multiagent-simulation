# =============================================================================
# CreditCycle Rule Agent Configuration
# =============================================================================
# 1 Market (coordinator) + 5 rule-based investor types.
# Theory: Minsky (1986) credit cycle, Adrian & Shin (2010) pro-cyclical leverage,
#         Geanakoplos (2010) leverage cycle, Graham (1949) value investing.
# =============================================================================

# -----------------------------------------------------------------------------
# Market (Coordinator) — rule-based price mechanism
# -----------------------------------------------------------------------------
market:
  name: "Market"
  class: "examples.CreditCycle.Rule.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/CreditCycle/Rule/records"
      initial_price: 100.0            # Source: target §9 row 1 (normalization)
      fundamental_value: 100.0        # Source: target §9 row 2 (normalization)
      price_impact: 0.05              # Source: target §9 row 3; simulation-bases.md §3
      mean_reversion: 0.02            # Source: target §9 row 4; simulation-bases.md §3
      noise_std: 0.02                 # Source: target §9 row 5; simulation-bases.md §3
      custom_state_hot_limit: 3       # Source: implementation-infrastructure
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Pro-Cyclical Lenders — amplify credit expansion and contraction
# Theory: Adrian & Shin (2010) — VaR-based pro-cyclical leverage
# -----------------------------------------------------------------------------
rule_pro_cyclical_lender:
  name: "ProCyclicalLender"
  class: "examples.CreditCycle.Rule.players:ProCyclicalLender"
  num_instances: 2
  config:
    identity: "rule_pro_cyclical_lender"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/CreditCycle/Rule/records"
      initial_cash: 1000000.0         # Source: implementation-infrastructure
      initial_position: 0             # Source: implementation-infrastructure
      leverage_expansion_rate: 0.3    # Source: simulation-bases.md §4.1.3
      leverage_contraction_rate: 0.4  # Source: simulation-bases.md §4.1.3
      expansion_threshold: 0.01       # Source: target §9 row 6; simulation-bases.md §4.1.3
      contraction_threshold: -0.015   # Source: target §9 row 7; simulation-bases.md §4.1.3
      base_size: 500                  # Source: simulation-bases.md §4.1.3
      custom_state_hot_limit: 3       # Source: implementation-infrastructure
      credit_multiplier: 2.0          # Source: target §9 row 8; Adrian & Shin (2010)
      order_size: 600                 # Source: target §9 row 9; simulation-bases.md §4.1.3
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Minsky Borrowers — cycle through hedge→speculative→Ponzi financing
# Theory: Minsky (1986) — Financial Instability Hypothesis
# -----------------------------------------------------------------------------
rule_minsky_borrower:
  name: "MinskyBorrower"
  class: "examples.CreditCycle.Rule.players:MinskyBorrower"
  num_instances: 2
  config:
    identity: "rule_minsky_borrower"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/CreditCycle/Rule/records"
      initial_cash: 500000.0          # Source: implementation-infrastructure
      initial_position: 0             # Source: implementation-infrastructure
      hedge_rounds: 20                # Source: simulation-bases.md §4.2.3 (phase sizing)
      speculative_rounds: 40          # Source: simulation-bases.md §4.2.3 (phase sizing)
      ponzi_rounds: 80                # Source: simulation-bases.md §4.2.3 (phase sizing)
      hedge_size: 100                 # Source: simulation-bases.md §4.2.3
      speculative_size: 300           # Source: simulation-bases.md §4.2.3
      ponzi_size: 600                 # Source: simulation-bases.md §4.2.3
      custom_state_hot_limit: 3       # Source: implementation-infrastructure
      crisis_threshold: -0.05         # Source: target §9 row 10; Minsky (1986)
      initial_leverage: 1.0           # Source: simulation-bases.md §4.2.3
      max_leverage: 5.0               # Source: target §9 row 11; Minsky (1986)
      order_size: 500                 # Source: target §9 row 12; simulation-bases.md §4.2.3
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Counter-Cyclical Lenders — provide stabilizing credit in downturns
# Theory: Geanakoplos (2010) — Leverage Cycle / counter-cyclical capital
# -----------------------------------------------------------------------------
rule_counter_cyclical_lender:
  name: "CounterCyclicalLender"
  class: "examples.CreditCycle.Rule.players:CounterCyclicalLender"
  num_instances: 1
  config:
    identity: "rule_counter_cyclical_lender"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/CreditCycle/Rule/records"
      initial_cash: 2000000.0         # Source: implementation-infrastructure
      initial_position: 0             # Source: implementation-infrastructure
      buy_threshold: -0.05            # Source: simulation-bases.md §4.3.3 (alias)
      sell_threshold: 0.10            # Source: simulation-bases.md §4.3.3 (alias)
      counter_cycle_size: 400         # Source: simulation-bases.md §4.3.3
      custom_state_hot_limit: 3       # Source: implementation-infrastructure
      boom_sell_threshold: 0.05       # Source: target §9 row 14; simulation-bases.md §4.3.3
      crisis_buy_threshold: -0.05     # Source: target §9 row 13; Basel III CCyB
      order_size: 500                 # Source: target §9 row 15; simulation-bases.md §4.3.3
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Value Investors — fundamental anchors
# Theory: Graham (1949) — The Intelligent Investor
# -----------------------------------------------------------------------------
rule_value_investor:
  name: "ValueInvestor"
  class: "examples.CreditCycle.Rule.players:ValueInvestor"
  num_instances: 1
  config:
    identity: "rule_value_investor"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/CreditCycle/Rule/records"
      initial_cash: 1000000.0         # Source: implementation-infrastructure
      initial_position: 0             # Source: implementation-infrastructure
      value_discount: 0.10            # Source: target §9 row 16; Graham (1949)
      value_premium: 0.10             # Source: target §9 row 16 (symmetric)
      value_size: 300                 # Source: simulation-bases.md §4.4.3
      custom_state_hot_limit: 3       # Source: implementation-infrastructure
      order_size: 400                 # Source: target §9 row 17; simulation-bases.md §4.4.3
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Noise Traders — random background liquidity
# Theory: Black (1986) — Noise
# -----------------------------------------------------------------------------
rule_noise_trader:
  name: "NoiseTrader"
  class: "examples.CreditCycle.Rule.players:NoiseTrader"
  num_instances: 1
  config:
    identity: "rule_noise_trader"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/CreditCycle/Rule/records"
      initial_cash: 500000.0          # Source: implementation-infrastructure
      initial_position: 0             # Source: implementation-infrastructure
      trade_probability: 0.3          # Source: target §9 row 18; Black (1986)
      noise_size: 100                 # Source: simulation-bases.md §4.5.3
      custom_state_hot_limit: 3       # Source: implementation-infrastructure
  persona: !include persona.yml
