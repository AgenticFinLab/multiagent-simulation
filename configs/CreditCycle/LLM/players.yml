# =============================================================================
# CreditCycle LLM Agent Configuration
# =============================================================================
# 1 Market (rule-based) + 5 LLM investor types.
# LLM agents carry personality-only prompts (no scenario-target leakage).
# =============================================================================

# -----------------------------------------------------------------------------
# Market (Coordinator) — rule-based, identical to Rule variant
# -----------------------------------------------------------------------------
market:
  archetype: credit-minsky-cycle  # -> AGENT_POOL/market/credit-minsky-cycle.md
  name: "Market"
  class: "examples.CreditCycle.LLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/CreditCycle/LLM/records"
      initial_price: 100.0            # Source: target §9 row 1 (normalization)
      fundamental_value: 100.0        # Source: target §9 row 2 (normalization)
      price_impact: 0.05              # Source: target §9 row 3; simulation-bases.md §3
      mean_reversion: 0.02            # Source: target §9 row 4; simulation-bases.md §3
      noise_std: 0.02                 # Source: target §9 row 5; simulation-bases.md §3
      custom_state_hot_limit: 3       # Source: implementation-infrastructure
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Pro-Cyclical Lenders — LLM with leveraged credit investor persona
# Theory: Adrian & Shin (2010)
# -----------------------------------------------------------------------------
llm_pro_cyclical_lender:
  name: "ProCyclicalLender"
  class: "examples.CreditCycle.LLM.players:LLMProCyclicalLender"
  num_instances: 2
  config:
    identity: "llm_pro_cyclical_lender"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/CreditCycle/LLM/records"
      initial_cash: 1000000.0         # Source: implementation-infrastructure
      initial_position: 0             # Source: implementation-infrastructure
      leverage_expansion_rate: 0.3    # Source: simulation-bases.md §4.1.3
      leverage_contraction_rate: 0.4  # Source: simulation-bases.md §4.1.3
      expansion_threshold: 0.01       # Source: target §9 row 6; simulation-bases.md §4.1.3
      contraction_threshold: -0.015   # Source: target §9 row 7; simulation-bases.md §4.1.3
      base_size: 500                  # Source: simulation-bases.md §4.1.3
      custom_state_hot_limit: 3       # Source: implementation-infrastructure
      llm:                            # Source: LLM-wiring
        sys_message: "examples.CreditCycle.LLM.prompts:LLM_PRO_CYCLICAL_LENDER_SYS"
        user_message: "examples.CreditCycle.LLM.prompts:LLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.7
          max_tokens: 512
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Minsky Borrowers — LLM with aggressive borrower persona
# Theory: Minsky (1986)
# -----------------------------------------------------------------------------
llm_minsky_borrower:
  name: "MinskyBorrower"
  class: "examples.CreditCycle.LLM.players:LLMMinskyBorrower"
  num_instances: 2
  config:
    identity: "llm_minsky_borrower"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/CreditCycle/LLM/records"
      initial_cash: 500000.0          # Source: implementation-infrastructure
      initial_position: 0             # Source: implementation-infrastructure
      hedge_rounds: 20                # Source: simulation-bases.md §4.2.3 (phase sizing)
      speculative_rounds: 40          # Source: simulation-bases.md §4.2.3 (phase sizing)
      ponzi_rounds: 80                # Source: simulation-bases.md §4.2.3 (phase sizing)
      hedge_size: 100                 # Source: simulation-bases.md §4.2.3
      speculative_size: 300           # Source: simulation-bases.md §4.2.3
      ponzi_size: 600                 # Source: simulation-bases.md §4.2.3
      custom_state_hot_limit: 3       # Source: implementation-infrastructure
      llm:                            # Source: LLM-wiring
        sys_message: "examples.CreditCycle.LLM.prompts:LLM_MINSKY_BORROWER_SYS"
        user_message: "examples.CreditCycle.LLM.prompts:LLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.8
          max_tokens: 512
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Counter-Cyclical Lenders — LLM with deep-pockets patient investor persona
# Theory: Geanakoplos (2010)
# -----------------------------------------------------------------------------
llm_counter_cyclical_lender:
  name: "CounterCyclicalLender"
  class: "examples.CreditCycle.LLM.players:LLMCounterCyclicalLender"
  num_instances: 1
  config:
    identity: "llm_counter_cyclical_lender"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/CreditCycle/LLM/records"
      initial_cash: 2000000.0         # Source: implementation-infrastructure
      initial_position: 0             # Source: implementation-infrastructure
      buy_threshold: -0.05            # Source: simulation-bases.md §4.3.3 (alias)
      sell_threshold: 0.10            # Source: simulation-bases.md §4.3.3 (alias)
      counter_cycle_size: 400         # Source: simulation-bases.md §4.3.3
      custom_state_hot_limit: 3       # Source: implementation-infrastructure
      llm:                            # Source: LLM-wiring
        sys_message: "examples.CreditCycle.LLM.prompts:LLM_COUNTER_CYCLICAL_LENDER_SYS"
        user_message: "examples.CreditCycle.LLM.prompts:LLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.5
          max_tokens: 512
  persona: !include persona.yml

