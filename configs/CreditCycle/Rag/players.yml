# =============================================================================
# CreditCycle Rag Agent Configuration
# =============================================================================
# 1 Market (rule-based) + 5 RAG-augmented LLM investor types.
# Knowledge Architecture: shared knowledge block + per-agent private_knowledge.
# =============================================================================

# =============================================================================
# Shared Knowledge Configuration
# =============================================================================
knowledge:
  backend: "local"
  global_uri: "examples/document-sources"
  resource_csv:
    - "examples/document-sources/books.csv"
    - "examples/document-sources/source"
  preprocessing:
    parser: "mineru"
    output_position: "MinerU_processed"
  rag:
    output_position: "rag_index"
    embed_type: "litellm"
    embed_model: "openai/hunyuan-embedding"
    embed_api_key: "{{ HUNYUAN_API_KEY }}"
    embed_api_base: "https://api.hunyuan.cloud.tencent.com/v1"
    chunk_size: 512
    chunk_overlap: 64
    top_k: 5

# -----------------------------------------------------------------------------
# Market (Coordinator) — rule-based
# -----------------------------------------------------------------------------
market:
  archetype: credit-minsky-cycle  # -> AGENT_POOL/market/credit-minsky-cycle.md
  name: "Market"
  class: "examples.CreditCycle.Rag.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/CreditCycle/Rag/records"
      initial_price: 100.0            # Source: target §9 row 1 (normalization)
      fundamental_value: 100.0        # Source: target §9 row 2 (normalization)
      price_impact: 0.05              # Source: target §9 row 3; simulation-bases.md §3
      mean_reversion: 0.02            # Source: target §9 row 4; simulation-bases.md §3
      noise_std: 0.02                 # Source: target §9 row 5; simulation-bases.md §3
      custom_state_hot_limit: 3       # Source: implementation-infrastructure
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# RAG Pro-Cyclical Lenders
# Theory: Adrian & Shin (2010)
# -----------------------------------------------------------------------------
ragllm_pro_cyclical_lender:
  name: "ProCyclicalLender"
  class: "examples.CreditCycle.Rag.players:RagLLMProCyclicalLender"
  num_instances: 2
  config:
    identity: "ragllm_pro_cyclical_lender"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/CreditCycle/Rag/records"
      initial_cash: 1000000.0         # Source: implementation-infrastructure
      initial_position: 0             # Source: implementation-infrastructure
      leverage_expansion_rate: 0.3    # Source: simulation-bases.md §4.1.3
      leverage_contraction_rate: 0.4  # Source: simulation-bases.md §4.1.3
      expansion_threshold: 0.01       # Source: target §9 row 6; simulation-bases.md §4.1.3
      contraction_threshold: -0.015   # Source: target §9 row 7; simulation-bases.md §4.1.3
      base_size: 500                  # Source: simulation-bases.md §4.1.3
      custom_state_hot_limit: 3       # Source: implementation-infrastructure
      private_knowledge:              # Source: RAG-wiring
        from_global_resources:
          - "MinerU_processed"
        local_resources:
          local_uri: ""
          local_resources: []
        rag:
          from_global_index_dir:
            - "rag_index"
          local_index_dir: ""
          embed_type: "litellm"
          embed_model: "openai/hunyuan-embedding"
          embed_api_key: "{{ HUNYUAN_API_KEY }}"
          embed_api_base: "https://api.hunyuan.cloud.tencent.com/v1"
          chunk_size: 512
          chunk_overlap: 64
          top_k: 5
      llm:
        sys_message: "examples.CreditCycle.Rag.prompts:RAG_PRO_CYCLICAL_LENDER_SYS"
        user_message: "examples.CreditCycle.Rag.prompts:RAG_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.4
          max_tokens: 600
  persona: !include persona.yml

