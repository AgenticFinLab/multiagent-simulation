# =============================================================================
# CreditCycle RuleLLM Agent Configuration
# =============================================================================
# 1 Market (rule-based) + 5 RuleLLM investor types.
# Prompts embed explicit quantitative credit-cycle rules.
# =============================================================================

market:
  name: "Market"
  class: "examples.CreditCycle.RuleLLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/CreditCycle/RuleLLM/records"
      initial_price: 100.0
      fundamental_value: 100.0
      price_impact: 0.05
      mean_reversion: 0.02
      noise_std: 0.02
      custom_state_hot_limit: 3
  persona: !include persona.yml

rulellm_pro_cyclical_lender:
  name: "ProCyclicalLender"
  class: "examples.CreditCycle.RuleLLM.players:RuleLLMProCyclicalLender"
  num_instances: 2
  config:
    identity: "rulellm_pro_cyclical_lender"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/CreditCycle/RuleLLM/records"
      initial_cash: 1000000.0
      initial_position: 0
      leverage_expansion_rate: 0.3
      leverage_contraction_rate: 0.4
      expansion_threshold: 0.01
      contraction_threshold: -0.015
      base_size: 500
      custom_state_hot_limit: 3
      llm:
        sys_message: "examples.CreditCycle.RuleLLM.prompts:RULELLM_PRO_CYCLICAL_LENDER_SYS"
        user_message: "examples.CreditCycle.RuleLLM.prompts:RULELLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.4
          max_tokens: 512
  persona: !include persona.yml

rulellm_minsky_borrower:
  name: "MinskyBorrower"
  class: "examples.CreditCycle.RuleLLM.players:RuleLLMMinskyBorrower"
  num_instances: 2
  config:
    identity: "rulellm_minsky_borrower"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/CreditCycle/RuleLLM/records"
      initial_cash: 500000.0
      initial_position: 0
      hedge_rounds: 20
      speculative_rounds: 40
      ponzi_rounds: 80
      hedge_size: 100
      speculative_size: 300
      ponzi_size: 600
      custom_state_hot_limit: 3
      llm:
        sys_message: "examples.CreditCycle.RuleLLM.prompts:RULELLM_MINSKY_BORROWER_SYS"
        user_message: "examples.CreditCycle.RuleLLM.prompts:RULELLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.4
          max_tokens: 512
  persona: !include persona.yml

