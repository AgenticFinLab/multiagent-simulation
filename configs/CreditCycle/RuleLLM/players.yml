# =============================================================================
# CreditCycle RuleLLM Agent Configuration
# =============================================================================
# 1 Market (rule-based) + 5 RuleLLM investor types.
# Prompts embed explicit quantitative credit-cycle rules.
# =============================================================================

market:
  archetype: credit-minsky-cycle  # -> AGENT_POOL/market/credit-minsky-cycle.md
  name: "Market"
  class: "examples.CreditCycle.RuleLLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/CreditCycle/RuleLLM/records"
      initial_price: 100.0            # Source: target §9 row 1 (normalization)
      fundamental_value: 100.0        # Source: target §9 row 2 (normalization)
      price_impact: 0.05              # Source: target §9 row 3; simulation-bases.md §3
      mean_reversion: 0.02            # Source: target §9 row 4; simulation-bases.md §3
      noise_std: 0.02                 # Source: target §9 row 5; simulation-bases.md §3
      custom_state_hot_limit: 3       # Source: implementation-infrastructure
  persona: !include persona.yml

rulellm_pro_cyclical_lender:
  name: "ProCyclicalLender"
  class: "examples.CreditCycle.RuleLLM.players:RuleLLMProCyclicalLender"
  num_instances: 2
  config:
    identity: "rulellm_pro_cyclical_lender"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/CreditCycle/RuleLLM/records"
      initial_cash: 1000000.0         # Source: implementation-infrastructure
      initial_position: 0             # Source: implementation-infrastructure
      leverage_expansion_rate: 0.3    # Source: simulation-bases.md §4.1.3
      leverage_contraction_rate: 0.4  # Source: simulation-bases.md §4.1.3
      expansion_threshold: 0.01       # Source: target §9 row 6; simulation-bases.md §4.1.3
      contraction_threshold: -0.015   # Source: target §9 row 7; simulation-bases.md §4.1.3
      base_size: 500                  # Source: simulation-bases.md §4.1.3
      custom_state_hot_limit: 3       # Source: implementation-infrastructure
      llm:                            # Source: LLM-wiring (RuleLLM dual-section)
        sys_message: "examples.CreditCycle.RuleLLM.prompts:RULELLM_PRO_CYCLICAL_LENDER_SYS"
        user_message: "examples.CreditCycle.RuleLLM.prompts:RULELLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.4
          max_tokens: 512
  persona: !include persona.yml

rulellm_minsky_borrower:
  name: "MinskyBorrower"
  class: "examples.CreditCycle.RuleLLM.players:RuleLLMMinskyBorrower"
  num_instances: 2
  config:
    identity: "rulellm_minsky_borrower"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/CreditCycle/RuleLLM/records"
      initial_cash: 500000.0          # Source: implementation-infrastructure
      initial_position: 0             # Source: implementation-infrastructure
      hedge_rounds: 20                # Source: simulation-bases.md §4.2.3 (phase sizing)
      speculative_rounds: 40          # Source: simulation-bases.md §4.2.3 (phase sizing)
      ponzi_rounds: 80                # Source: simulation-bases.md §4.2.3 (phase sizing)
      hedge_size: 100                 # Source: simulation-bases.md §4.2.3
      speculative_size: 300           # Source: simulation-bases.md §4.2.3
      ponzi_size: 600                 # Source: simulation-bases.md §4.2.3
      custom_state_hot_limit: 3       # Source: implementation-infrastructure
      llm:                            # Source: LLM-wiring (RuleLLM dual-section)
        sys_message: "examples.CreditCycle.RuleLLM.prompts:RULELLM_MINSKY_BORROWER_SYS"
        user_message: "examples.CreditCycle.RuleLLM.prompts:RULELLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.4
          max_tokens: 512
  persona: !include persona.yml

