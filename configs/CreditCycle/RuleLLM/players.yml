      buy_threshold: -0.05            # Source: simulation-bases.md §4.3.3 (alias)
      sell_threshold: 0.10            # Source: simulation-bases.md §4.3.3 (alias)
      counter_cycle_size: 400         # Source: simulation-bases.md §4.3.3
      custom_state_hot_limit: 3       # Source: implementation-infrastructure
      llm:                            # Source: LLM-wiring (RuleLLM dual-section)
        sys_message: "examples.CreditCycle.RuleLLM.prompts:RULELLM_COUNTER_CYCLICAL_LENDER_SYS"
        user_message: "examples.CreditCycle.RuleLLM.prompts:RULELLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.3
          max_tokens: 512
  persona: !include persona.yml

