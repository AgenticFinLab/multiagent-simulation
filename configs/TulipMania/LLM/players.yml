market:
  name: "Market"
  class: "examples.TulipMania.Rule.players:Market"
  num_instances: 1
  persona: !include ../LLM/persona.yml
  config:
    identity: "market"
    role: market
    steps_per_turn: 1
    group_tags: [market]
    extras:
      record_path: "EXPERIMENT/TulipMania/LLM/records/market"
      initial_price: 100.0
      fundamental_value: 100.0
      price_impact: 0.02
      mean_reversion: 0.008
      noise_std: 0.015

trendchaser:
  name: "TrendChaser"
  class: "examples.TulipMania.LLM.players:LLMTrendChaser"
  num_instances: 4
  persona: !include ../LLM/persona.yml
  config:
    identity: "trendchaser"
    role: player
    steps_per_turn: 1
    group_tags: [investors]
    extras:
      record_path: "EXPERIMENT/TulipMania/LLM/records/trendchaser"
      initial_cash: 1000000.0
      initial_position: 300
      initial_price: 100.0
      fundamental_value: 100.0
      trend_threshold: 0.01
      chase_size: 400
      custom_state_hot_limit: 3
      llm:
        sys_message: "examples.TulipMania.LLM.prompts:LLM_TREND_CHASER_SYS"
        user_message: "examples.TulipMania.LLM.prompts:LLM_USER_TEMPLATE"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.7
          max_tokens: 512

