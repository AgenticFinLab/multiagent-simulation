market:
  archetype: stock-standard-price-impact  # -> masim/agents/defines/market/stock-standard-price-impact.md
  name: "Market"
  class: "examples.TulipMania.Rule.players:Market"
  num_instances: 1
  persona: !include ../LLM/persona.yml
  config:
    identity: "market"
    role: market
    steps_per_turn: 1
    group_tags: [market]
    extras:
      record_path: "EXPERIMENT/TulipMania/LLM/records/market"  # Source: target §10.1 LLM variant records path convention
      initial_price: 100.0  # Source: target §9 market.extras.initial_price; normalization (simulation-bases.md §6)
      fundamental_value: 100.0  # Source: target §9 market.extras.fundamental_value; normalization, equal to initial_price (simulation-bases.md §6)
      price_impact: 0.02  # Source: target §9 market.extras.price_impact; Shiller (2003), 10.1257/089533003321164967
      mean_reversion: 0.008  # Source: target §9 market.extras.mean_reversion; Garber (1990), 10.1257/jep.4.2.35
      noise_std: 0.015  # Source: target §9 market.extras.noise_std; Rule/players.py Market.perceive

llm_trend_chaser:
  name: "TrendChaser"
  class: "examples.TulipMania.LLM.players:LLMTrendChaser"
  num_instances: 4  # Source: target §9 trendchaser.num_instances; §7 Agent Roster
  persona: !include ../LLM/persona.yml
  config:
    identity: "llm_trend_chaser"
    role: player
    steps_per_turn: 1
    group_tags: [investors]
    extras:
      record_path: "EXPERIMENT/TulipMania/LLM/records/trendchaser"  # Source: target §10.1 LLM variant records path convention
      initial_cash: 1000000.0  # Source: target §9 trendchaser.extras.initial_cash; normalization
      initial_position: 300  # Source: target §9 trendchaser.extras.initial_position; normalization
      initial_price: 100.0  # Source: target §9 market.extras.initial_price; mirrored for agent-local reference
      fundamental_value: 100.0  # Source: target §9 market.extras.fundamental_value; mirrored for agent-local reference
      trend_threshold: 0.01  # Source: target §9 legacy-extras footnote (retained for backward compatibility; runtime uses 0.02 per Shiller 2003, 10.1257/089533003321164967)
      chase_size: 400  # Source: target §9 legacy-extras footnote (retained for backward compatibility; runtime uses cap 800 / slope 5000)
      agent_type: "trend_chaser"  # Source: target §7 Agent Roster + agent-design-skill §3.6.0 I/O Contract
      custom_state_hot_limit: 3  # Source: target §9 custom_state_hot_limit row (runtime plumbing)
      llm:  # Source: target §10.1 LLM variant declaration
        sys_message: "examples.TulipMania.LLM.prompts:LLM_TREND_CHASER_SYS"
        user_message: "examples.TulipMania.LLM.prompts:LLM_USER_TEMPLATE"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.7
          max_tokens: 512

