market:
  name: "Market"
  class: "examples.TulipMania.Rule.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: market
    steps_per_turn: 1
    group_tags: [market]
    record_path: "EXPERIMENT/TulipMania/Rule/records/market"
    persona: !include ../Rule/persona.yml
    extras:
      initial_price: 100.0
      fundamental_value: 100.0
      price_impact: 0.02
      mean_reversion: 0.008
      noise_std: 0.015

trendchaser:
  name: "TrendChaser"
  class: "examples.TulipMania.Rule.players:TrendChaser"
  num_instances: 4
  config:
    identity: "trendchaser"
    role: player
    steps_per_turn: 1
    group_tags: [investors]
    record_path: "EXPERIMENT/TulipMania/Rule/records/trendchaser"
    persona: !include ../Rule/persona.yml
    extras:
      initial_cash: 1000000.0
      initial_position: 300
      initial_price: 100.0
      fundamental_value: 100.0
      trend_threshold: 0.01
      chase_size: 400
      custom_state_hot_limit: 3

