market:
  archetype: stock-standard-price-impact  # -> masim/agents/defines/market/stock-standard-price-impact.md
  name: "Market"
  class: "examples.TulipMania.Rule.players:Market"
  num_instances: 1
  persona: !include persona.yml
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags: [market]
    extras:
      initial_price: 100.0  # Source: target §9 market.extras.initial_price; normalization (simulation-bases.md §6)
      fundamental_value: 100.0  # Source: target §9 market.extras.fundamental_value; normalization, equal to initial_price so starting deviation is zero (simulation-bases.md §6)
      price_impact: 0.02  # Source: target §9 market.extras.price_impact; Shiller (2003), 10.1257/089533003321164967; simulation-bases.md §6
      mean_reversion: 0.008  # Source: target §9 market.extras.mean_reversion; Garber (1990), 10.1257/jep.4.2.35; simulation-bases.md §6
      noise_std: 0.015  # Source: target §9 market.extras.noise_std; Rule/players.py Market.perceive
      custom_state_hot_limit: 3  # runtime plumbing; hot-state ring buffer

rule_trend_chaser:
  name: "TrendChaser"
  class: "examples.TulipMania.Rule.players:TrendChaser"
  num_instances: 4  # Source: target §9 trendchaser.num_instances; configs/TulipMania/Rule/players.yml (§7 Agent Roster: 4)
  persona: !include persona.yml
  config:
    identity: "rule_trend_chaser"
    role: player
    steps_per_turn: 1
    group_tags: [investors]
    extras:
      initial_cash: 1000000.0  # Source: target §9 trendchaser.extras.initial_cash; normalization
      initial_position: 300  # Source: target §9 trendchaser.extras.initial_position; normalization
      initial_price: 100.0  # Source: target §9 market.extras.initial_price; mirrored for agent-local reference
      fundamental_value: 100.0  # Source: target §9 market.extras.fundamental_value; mirrored for agent-local reference
      activation_threshold: 0.02  # canonical TrendChaser activation threshold (Shiller 2003)
      scaling_factor: 5000.0  # canonical TrendChaser slope
      max_quantity: 800.0  # canonical TrendChaser quantity cap
      custom_state_hot_limit: 3  # Source: target §9 custom_state_hot_limit row (runtime plumbing; not a scenario parameter)

rule_social_proof_follower:
  name: "SocialProofFollower"
  class: "examples.TulipMania.Rule.players:SocialProofFollower"
  num_instances: 3  # Source: target §9 socialprooffollower.num_instances; configs/TulipMania/Rule/players.yml (§7 Agent Roster: 3)
  persona: !include persona.yml
  config:
    identity: "rule_social_proof_follower"
    role: player
    steps_per_turn: 1
    group_tags: [investors]
    extras:
      initial_cash: 800000.0  # Source: target §9 socialprooffollower.extras.initial_cash; normalization
      initial_position: 400  # Source: target §9 socialprooffollower.extras.initial_position; normalization
      initial_price: 100.0  # Source: target §9 market.extras.initial_price; mirrored for agent-local reference
      fundamental_value: 100.0  # Source: target §9 market.extras.fundamental_value; mirrored for agent-local reference
