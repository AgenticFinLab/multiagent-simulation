# =============================================================================
# DispositionEffectLLM Players Configuration
# =============================================================================
# LLM-based Prospect Theory Trading Simulation
# =============================================================================

market:
  name: "Market with News Shocks"
  class: "examples.DispositionEffectLLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/DispositionEffectLLM/records"
      # Market parameters
      initial_price: 100.0
      fundamental_value: 100.0
      price_impact: 0.06
      mean_reversion: 0.015
      noise_std: 0.4
      news_probability: 0.15
      news_impact_range: 5.0
      custom_state_hot_limit: 3
  persona: !include persona.yml

llm_disposition_biased:
  name: "LLM Disposition Biased"
  class: "examples.DispositionEffectLLM.players:LLMDispositionBiased"
  num_instances: 1
  config:
    identity: "llm_disposition_biased"
    role: player
    steps_per_turn: 1
    group_tags:
      - llm_investors
    extras:
      record_path: "EXPERIMENT/DispositionEffectLLM/records"
      initial_cash: 10000.0
      initial_position: 0.0
      custom_state_hot_limit: 3
      llm:
        sys_message: "examples.DispositionEffectLLM.prompts:LLM_DISPOSITION_BIASED_SYS"
        user_message: "examples.DispositionEffectLLM.prompts:LLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-1-6-lite-251015"
        generation_config:
          temperature: 0.4
          max_new_tokens: 500
  persona: !include persona.yml

