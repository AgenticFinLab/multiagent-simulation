# =============================================================================
# DispositionEffectLLM Simulation Configuration
# =============================================================================
# LLM-based Disposition Effect simulation - Prospect Theory
# Tests: Loss aversion, selling winners too early, holding losers too long
#
# Usage:
#   python examples/DispositionEffectLLM/run_disposition_llm.py -c configs/DispositionEffectLLM/simulation.yml
# =============================================================================

setting:
  name: "disposition_effect_llm_simulation"
  description: "LLM-based disposition effect with prospect theory investors"
  total_rounds: 50
  round_history_limit: 3
  record_path: "EXPERIMENT/DispositionEffectLLM/records"
  save_diagram_interval: 25

environment:
  dotenv_path: .env
  workspace: "."

ray:
  address: null
  namespace: "disposition_effect_llm"
  actor_prefix: null
  num_cpus: 4
  num_gpus: null
  object_store_memory: null
  include_dashboard: false
  logging_level: "warning"
  log_to_driver: true
  actor_options:
    max_restarts: 3
    max_task_retries: 1
    max_concurrency: 10
  runtime_env:
    working_dir: null
    pip: []
    env_vars: {}
  serialization:
    use_arrow: true
    register_custom_serializers: true

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/DispositionEffectLLM/communication"
