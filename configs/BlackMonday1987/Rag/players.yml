# =============================================================================
# BlackMonday1987 Rag Players Configuration
# =============================================================================
# 1 Market (rule-based) + 5 RAG-augmented LLM Investor types
#
# Knowledge Architecture:
#   The shared knowledge: block is defined at the TOP of this file, before the
#   market definition. The config loader automatically detects "knowledge" inside
#   the players dict and promotes it to config top-level.
#
#   Each agent has private_knowledge for agent-specific resources:
#     - from_global_resources: List of global resource sub-dirs to inherit
#     - local_resources: Agent-specific local directory + resources
#     - rag: Per-agent RAG configuration (MUST be nested inside private_knowledge)
# =============================================================================

# =============================================================================
# Shared Knowledge Configuration (processed once, accessible by all agents)
# =============================================================================
knowledge:
  backend: "local"
  global_uri: "examples/document-sources"
  resource_csv:
    - "examples/document-sources/books.csv"
    - "examples/document-sources/source"
  preprocessing:
    parser: "mineru"
    output_position: "MinerU_processed"
  rag:
    output_position: "rag_index"
    embed_type: "litellm"
    embed_model: "openai/hunyuan-embedding"
    embed_api_key: "{{ HUNYUAN_API_KEY }}"
    embed_api_base: "https://api.hunyuan.cloud.tencent.com/v1"
    chunk_size: 512
    chunk_overlap: 64
    top_k: 5

# -----------------------------------------------------------------------------
# Market (Coordinator) — rule-based, identical to Rule variant
# -----------------------------------------------------------------------------
market:
  name: "Market"
  class: "examples.BlackMonday1987.Rag.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/BlackMonday1987/Rag/records"  # Source: infrastructure
      # Source: target §9 `fundamental value` row (normalization)
      fundamental_value: 250.0
      # Source: target §8.1 (initial index price, normalization)
      initial_price: 250.0
      # Source: target §9 `price impact` row (Kyle 1985; Brady 1988)
      price_impact: 0.05
      # Source: target §9 `mean reversion` row (Shleifer & Vishny 1997)
      mean_reversion: 0.01
      # Source: simulation-bases.md §3.1 σ row (Roll 1984)
      noise_std: 0.02
      custom_state_hot_limit: 3  # Source: infrastructure
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# RAG Portfolio Insurers — mechanical hedger + rules + RAG
# Theory: Leland & Rubinstein (1976), Brady Commission (1988)
# -----------------------------------------------------------------------------
ragllm_portfolio_insurer:
  name: "RAG Portfolio Insurer"
  class: "examples.BlackMonday1987.Rag.players:RagLLMPortfolioInsurer"
  # Expander → ragllm_portfolio_insurer_1, ragllm_portfolio_insurer_2
  num_instances: 2
  config:
    identity: "ragllm_portfolio_insurer"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/BlackMonday1987/Rag/records"  # Source: infrastructure
      # Source: simulation-bases.md §4.x agent initial_cash spec
      initial_cash: 500000.0
      # Source: simulation-bases.md §4.x agent initial_position spec
      initial_position: 1000.0
      custom_state_hot_limit: 3  # Source: infrastructure
      # Rule parameters
      # Source: target §9 `rebalance threshold` row (Leland 1980; Brady 1988)
      rebalance_threshold: 0.02
      # Source: target §9 `hedge ratio` row (Brady 1988)
      hedge_ratio: 0.5
      # Source: simulation-bases.md §4.x agent base_size spec
      base_size: 100.0
      # Private Knowledge
      private_knowledge:
        from_global_resources:
          - "MinerU_processed"
        local_resources:
          local_uri: ""
          local_resources: []
        rag:
          from_global_index_dir:
            - "rag_index"
          local_index_dir: ""
          embed_type: "litellm"
          embed_model: "openai/hunyuan-embedding"
          embed_api_key: "{{ HUNYUAN_API_KEY }}"
          embed_api_base: "https://api.hunyuan.cloud.tencent.com/v1"
          chunk_size: 512
          chunk_overlap: 64
          top_k: 5
      # LLM Configuration
      llm:
        sys_message: "examples.BlackMonday1987.Rag.prompts:RAG_PORTFOLIO_INSURER_SYS"
        user_message: "examples.BlackMonday1987.Rag.prompts:RAG_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.3
          max_new_tokens: 600
  persona: !include persona.yml

