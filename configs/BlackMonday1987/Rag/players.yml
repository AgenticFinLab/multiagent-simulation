# BlackMonday1987 Rag Agent Configuration

market:
  name: "Market"
  class: "examples.BlackMonday1987.Rag.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    extras:
      initial_price: 250.0
      fundamental_value: 250.0
      price_impact: 0.03
      mean_reversion: 0.01
      noise_std: 0.015

portfolio_insurer_1:
  name: "PortfolioInsurer 1"
  class: "examples.BlackMonday1987.Rag.players:LLMPortfolioInsurer"
  num_instances: 2
  config:
    identity: "portfolio_insurer_1"
    role: player
    extras:
      initial_cash: 1000000.00
      initial_position: 0
      agent_type: "portfolio_insurer"
      llm:
        model: "doubao-pro-32k"


