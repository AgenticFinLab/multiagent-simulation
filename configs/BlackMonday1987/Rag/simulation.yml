# BlackMonday1987 Rag Simulation Configuration
#
# October 19, 1987 stock market crash - Dow fell 22.6% in one day
#
# Usage:
#   python examples/BlackMonday1987/Rag/run_blackmonday1987_rag.py \
#       -c configs/BlackMonday1987/Rag/simulation.yml

setting:
  name: "BlackMonday1987-Rag"
  description: "Black Monday 1987 crash simulation with portfolio insurance, index arbitrage, and program trading feedback loops"
  total_rounds: 200
  
  record_path: "EXPERIMENT/BlackMonday1987/Rag/records"
  storage_path: "EXPERIMENT/BlackMonday1987/Rag/communication"
  
  log_level: "INFO"
  log_to_file: true
  log_path: "EXPERIMENT/BlackMonday1987/Rag/logs"

environment:
  dotenv_path: ".env"
  workspace: "."

llm:
  model: "doubao-pro-32k"
  temperature: 0.3
  max_tokens: 500
  timeout: 30

ray:
  namespace: "blackmonday1987_rag"
  ignore_reinit_error: true
  object_store_memory: 536870912
  num_cpus: 4

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/BlackMonday1987/Rag/communication"
  record_messages: true
  message_timeout_ms: 30000
  max_retries: 3
