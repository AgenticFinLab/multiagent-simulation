# BlackMonday1987 Rule Communication Topology

graph:
  type: star
  center: market

connections:
  - from: market
    to:
      - portfolio_insurer_1_1
      - portfolio_insurer_1_2
      - index_arbitrageur_2_1
      - index_arbitrageur_2_2
      - program_trader_3_1
      - program_trader_3_2
      - value_investor_4_1
      - noise_trader_5_1
      - noise_trader_5_2
    bidirectional: false
    message_type: market_update

  - from: portfolio_insurer_1_1
    to: market
    bidirectional: false
    message_type: order
  - from: portfolio_insurer_1_2
    to: market
    bidirectional: false
    message_type: order
  - from: index_arbitrageur_2_1
    to: market
    bidirectional: false
    message_type: order
  - from: index_arbitrageur_2_2
    to: market
    bidirectional: false
    message_type: order
  - from: program_trader_3_1
    to: market
    bidirectional: false
    message_type: order
  - from: program_trader_3_2
    to: market
    bidirectional: false
    message_type: order
  - from: value_investor_4_1
    to: market
    bidirectional: false
    message_type: order
  - from: noise_trader_5_1
    to: market
    bidirectional: false
    message_type: order
  - from: noise_trader_5_2
    to: market
    bidirectional: false
    message_type: order

broadcast:
  enabled: true
  from: market
  to: all_players
  message_type: market_update

execution:
  order:
    - market
    - portfolio_insurer_1_1
    - portfolio_insurer_1_2
    - index_arbitrageur_2_1
    - index_arbitrageur_2_2
    - program_trader_3_1
    - program_trader_3_2
    - value_investor_4_1
    - noise_trader_5_1
    - noise_trader_5_2
