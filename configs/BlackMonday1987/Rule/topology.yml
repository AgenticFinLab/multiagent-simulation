# =============================================================================
# BlackMonday1987 Rule Topology - Star Pattern
# =============================================================================
# Market as hub, all investors communicate through market.
#
# Note: player keys with num_instances > 1 use their base key here.
# The simulator expander resolves them to foo_1, foo_2, ... before building
# the TopologyGraph, so all edge rules apply to every instance automatically.
#
#    portfolio_insurer ──────────┐
#    index_arbitrageur ──────────┤
#    program_trader    ──────────┼──▶ market ──▶ all investors
#    value_investor    ──────────┤             (market data: price, return)
#    noise_trader      ──────────┘
#
# Execution flow per round:
#   Level 0: market executes (broadcasts price + dynamics data)
#   Level 1: all investors execute in parallel (submit P,Q orders)
# =============================================================================

type: "star"

sources:
  - market

connections:
  # Market → All investors (price + market data broadcast)
  market:
    - portfolio_insurer
    - index_arbitrageur
    - program_trader
    - value_investor
    - noise_trader

  # Each investor → Market only (order submission)
  portfolio_insurer:
    - market

  index_arbitrageur:
    - market

  program_trader:
    - market

  value_investor:
    - market

  noise_trader:
    - market
