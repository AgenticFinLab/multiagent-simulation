# =============================================================================
# BlackMonday1987 RuleLLM Players Configuration
# =============================================================================
# 1 Market (rule-based) + 5 RuleLLM Investor types with explicit quantitative
# rules embedded in system prompts.
# =============================================================================

# -----------------------------------------------------------------------------
# Market (Coordinator) — rule-based, identical to Rule variant
# -----------------------------------------------------------------------------
market:
  archetype: stock-standard-price-impact  # -> masim/agents/defines/market/stock-standard-price-impact.md
  name: "Market"
  class: "examples.BlackMonday1987.RuleLLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/BlackMonday1987/RuleLLM/records"  # Source: infrastructure
      # Source: target §9 `fundamental value` row (normalization)
      fundamental_value: 250.0
      # Source: target §8.1 (initial index price, normalization)
      initial_price: 250.0
      # Source: target §9 `price impact` row (Kyle 1985; Brady 1988)
      price_impact: 0.05
      # Source: target §9 `mean reversion` row (Shleifer & Vishny 1997)
      mean_reversion: 0.01
      # Source: simulation-bases.md §3.1 σ row (Roll 1984)
      noise_std: 0.02
      custom_state_hot_limit: 3  # Source: infrastructure
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Portfolio Insurers — RuleLLM with explicit hedge rules
# Theory: Leland & Rubinstein (1976), Brady Commission (1988)
# -----------------------------------------------------------------------------
rulellm_portfolio_insurer:
  name: "Portfolio Insurer"
  class: "examples.BlackMonday1987.RuleLLM.players:RuleLLMPortfolioInsurer"
  # Expander → portfolio_insurer_1, portfolio_insurer_2
  num_instances: 2
  config:
    identity: "rulellm_portfolio_insurer"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/BlackMonday1987/RuleLLM/records"  # Source: infrastructure
      # Source: simulation-bases.md §4.x agent initial_cash spec
      initial_cash: 500000.0
      # Source: simulation-bases.md §4.x agent initial_position spec
      initial_position: 1000.0
      custom_state_hot_limit: 3  # Source: infrastructure
      # Rule parameters for RuleLLM
      # Source: target §9 `rebalance threshold` row (Leland 1980; Brady 1988)
      rebalance_threshold: 0.02
      # Source: target §9 `hedge ratio` row (Brady 1988)
      hedge_ratio: 0.5
      # Source: simulation-bases.md §4.x agent base_size spec
      base_size: 100.0
      llm:
        sys_message: "examples.BlackMonday1987.RuleLLM.prompts:RULELLM_PORTFOLIO_INSURER_SYS"
        user_message: "examples.BlackMonday1987.RuleLLM.prompts:RULELLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.3
          max_tokens: 512
  persona: !include persona.yml

