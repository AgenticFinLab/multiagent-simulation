# =============================================================================
# BlackMonday1987 LLM Topology - Star Pattern
# =============================================================================
# Market as hub, all investors communicate through market.
#
#    portfolio_insurer ──────────┐
#    index_arbitrageur ──────────┤
#    program_trader    ──────────┼──▶ market ──▶ all investors
#    value_investor    ──────────┤             (market data: price, return)
#    noise_trader      ──────────┘
#
# Execution flow per round:
#   Level 0: market executes (broadcasts price + dynamics data)
#   Level 1: all investors execute in parallel (LLM decisions)
# =============================================================================

type: "star"

sources:
  - market

connections:
  market:
    - portfolio_insurer
    - index_arbitrageur
    - program_trader
    - value_investor
    - noise_trader

  portfolio_insurer:
    - market

  index_arbitrageur:
    - market

  program_trader:
    - market

  value_investor:
    - market

  noise_trader:
    - market
