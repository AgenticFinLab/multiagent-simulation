# OverconfidenceBias Rule Agent Configuration

market:
  name: "Market"
  class: "examples.OverconfidenceBias.Rule.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/OverconfidenceBias/Rule/records"
      initial_price: 100.0
      fundamental_value: 100.0
      price_impact: 0.02
      mean_reversion: 0.01
      noise_std: 0.015
      custom_state_hot_limit: 3
  persona: !include persona.yml

overconfidenttrader:
  name: "OverconfidentTrader"
  class: "examples.OverconfidenceBias.Rule.players:OverconfidentTrader"
  num_instances: 2
  config:
    identity: "overconfidenttrader"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/OverconfidenceBias/Rule/records"
      initial_cash: 1000000.0
      initial_position: 500
      initial_price: 100.0
      fundamental_value: 100.0
      precision_overestimate: 2.0
      base_size: 400
      custom_state_hot_limit: 3
  persona: !include persona.yml

