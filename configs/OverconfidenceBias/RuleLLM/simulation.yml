# OverconfidenceBias RuleLLM Simulation Configuration
#
# Overconfidence bias causes traders to overestimate their precision, trade too much, and increase volatility
#
# Usage:
#   python examples/OverconfidenceBias/RuleLLM/run_overconfidencebias_rulellm.py \
#       -c configs/OverconfidenceBias/RuleLLM/simulation.yml

setting:
  name: "OverconfidenceBias-RuleLLM"
  description: "Overconfidence bias simulation showing how excessive self-confidence leads to excessive trading and market instability"
  total_rounds: 200
  
  record_path: "EXPERIMENT/OverconfidenceBias/RuleLLM/records"
  storage_path: "EXPERIMENT/OverconfidenceBias/RuleLLM/communication"
  
  log_level: "INFO"
  log_to_file: true
  log_path: "EXPERIMENT/OverconfidenceBias/RuleLLM/logs"

environment:
  dotenv_path: ".env"
  workspace: "."

llm:
  model: "doubao-pro-32k"
  temperature: 0.3
  max_tokens: 500
  timeout: 30

ray:
  namespace: "overconfidencebias_rulellm"
  ignore_reinit_error: true
  object_store_memory: 536870912
  num_cpus: 4

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/OverconfidenceBias/RuleLLM/communication"
  record_messages: true
  message_timeout_ms: 30000
  max_retries: 3
