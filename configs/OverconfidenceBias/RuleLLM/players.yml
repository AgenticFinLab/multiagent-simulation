# OverconfidenceBias RuleLLM Agent Configuration

market:
  name: "Market"
  class: "examples.OverconfidenceBias.RuleLLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/OverconfidenceBias/RuleLLM/records"
      initial_price: 100.0
      fundamental_value: 100.0
      price_impact: 0.02
      mean_reversion: 0.01
      noise_std: 0.015
      custom_state_hot_limit: 3
  persona: !include persona.yml

rulellm_overconfident_trader:
  name: "OverconfidentTrader"
  class: "examples.OverconfidenceBias.RuleLLM.players:RuleLLMOverconfidentTrader"
  num_instances: 2
  config:
    identity: "rulellm_overconfident_trader"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/OverconfidenceBias/RuleLLM/records"
      initial_cash: 1000000.0
      initial_position: 500
      initial_price: 100.0
      fundamental_value: 100.0
      precision_overestimate: 2.0
      base_size: 400
      custom_state_hot_limit: 3
      llm:
        sys_message: "examples.OverconfidenceBias.RuleLLM.prompts:RULELLM_OVERCONFIDENT_TRADER_SYS"
        user_message: "examples.OverconfidenceBias.RuleLLM.prompts:RULELLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.8
          max_tokens: 512
  persona: !include persona.yml

