# MentalAccounting LLM Communication Topology

graph:
  type: star
  center: market

connections:
  - from: market
    to:
      - mental_accountant_1_1
      - mental_accountant_1_2
      - house_money_trader_2_1
      - house_money_trader_2_2
      - rational_portfolio_manager_3_1
      - sunk_cost_holder_4_1
      - sunk_cost_holder_4_2
      - noise_trader_5_1
      - noise_trader_5_2
    bidirectional: false
    message_type: market_update

  - from: mental_accountant_1_1
    to: market
    bidirectional: false
    message_type: order
  - from: mental_accountant_1_2
    to: market
    bidirectional: false
    message_type: order
  - from: house_money_trader_2_1
    to: market
    bidirectional: false
    message_type: order
  - from: house_money_trader_2_2
    to: market
    bidirectional: false
    message_type: order
  - from: rational_portfolio_manager_3_1
    to: market
    bidirectional: false
    message_type: order
  - from: sunk_cost_holder_4_1
    to: market
    bidirectional: false
    message_type: order
  - from: sunk_cost_holder_4_2
    to: market
    bidirectional: false
    message_type: order
  - from: noise_trader_5_1
    to: market
    bidirectional: false
    message_type: order
  - from: noise_trader_5_2
    to: market
    bidirectional: false
    message_type: order

broadcast:
  enabled: true
  from: market
  to: all_players
  message_type: market_update

execution:
  order:
    - market
    - mental_accountant_1_1
    - mental_accountant_1_2
    - house_money_trader_2_1
    - house_money_trader_2_2
    - rational_portfolio_manager_3_1
    - sunk_cost_holder_4_1
    - sunk_cost_holder_4_2
    - noise_trader_5_1
    - noise_trader_5_2
