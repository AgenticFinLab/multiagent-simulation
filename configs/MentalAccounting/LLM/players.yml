# MentalAccounting LLM Agent Configuration

market:
  name: "Market"
  class: "examples.MentalAccounting.LLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/MentalAccounting/LLM/records"
      initial_price: 100.0
      fundamental_value: 100.0
      price_impact: 0.02
      mean_reversion: 0.01
      noise_std: 0.012
      custom_state_hot_limit: 3
  persona: !include persona.yml

llm_mental_accountant:
  name: "MentalAccountant"
  class: "examples.MentalAccounting.LLM.players:LLMMentalAccountant"
  num_instances: 2
  config:
    identity: "llm_mental_accountant"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/MentalAccounting/LLM/records"
      initial_cash: 1000000.0
      initial_position: 500
      initial_price: 100.0
      fundamental_value: 100.0
      loss_aversion_per_account: 2.25
      num_accounts: 3
      base_size: 400
      custom_state_hot_limit: 3
      llm:
        sys_message: "examples.MentalAccounting.LLM.prompts:LLM_MENTAL_ACCOUNTANT_PROMPT"
        user_message: "examples.MentalAccounting.LLM.prompts:LLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.5
          max_tokens: 512
  persona: !include persona.yml

llm_house_money_trader:
  name: "HouseMoneyTrader"
  class: "examples.MentalAccounting.LLM.players:LLMHouseMoneyTrader"
  num_instances: 2
  config:
    identity: "llm_house_money_trader"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/MentalAccounting/LLM/records"
      initial_cash: 1200000.0
      initial_position: 500
      initial_price: 100.0
      fundamental_value: 100.0
      gain_risk_multiplier: 2.0
      loss_risk_multiplier: 0.5
      deviation_threshold: 0.02
      base_size: 400
      custom_state_hot_limit: 3
      llm:
        sys_message: "examples.MentalAccounting.LLM.prompts:LLM_HOUSE_MONEY_PROMPT"
        user_message: "examples.MentalAccounting.LLM.prompts:LLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.7
          max_tokens: 512
  persona: !include persona.yml

llm_rational_portfolio_manager:
