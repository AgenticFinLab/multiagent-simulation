# MentalAccounting LLM Agent Configuration

market:
  name: "Market"
  class: "examples.MentalAccounting.LLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/MentalAccounting/LLM/records"
      initial_price: 100.0
      fundamental_value: 100.0
      price_impact: 0.02
      mean_reversion: 0.01
      noise_std: 0.012
      custom_state_hot_limit: 3
  persona: !include persona.yml

mentalaccountant:
  name: "MentalAccountant"
  class: "examples.MentalAccounting.LLM.players:LLMMentalAccountant"
  num_instances: 2
  config:
    identity: "mentalaccountant"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/MentalAccounting/LLM/records"
      initial_cash: 1000000.0
      initial_position: 500
      initial_price: 100.0
      fundamental_value: 100.0
      loss_aversion_per_account: 2.25
      num_accounts: 3
      base_size: 400
      custom_state_hot_limit: 3
      llm:
        sys_message: "examples.MentalAccounting.LLM.prompts:LLM_MENTAL_ACCOUNTANT_SYS"
        user_message: "examples.MentalAccounting.LLM.prompts:LLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-1-6-251015"
        generation_config:
          temperature: 0.5
          max_tokens: 512
  persona: !include persona.yml

housemoneytrader:
  name: "HouseMoneyTrader"
  class: "examples.MentalAccounting.LLM.players:LLMHouseMoneyTrader"
  num_instances: 2
  config:
    identity: "housemoneytrader"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/MentalAccounting/LLM/records"
      initial_cash: 1200000.0
      initial_position: 500
      initial_price: 100.0
      fundamental_value: 100.0
      gain_risk_multiplier: 2.0
      loss_risk_multiplier: 0.5
      base_size: 400
      custom_state_hot_limit: 3
      llm:
        sys_message: "examples.MentalAccounting.LLM.prompts:LLM_HOUSE_MONEY_TRADER_SYS"
        user_message: "examples.MentalAccounting.LLM.prompts:LLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-1-6-251015"
        generation_config:
          temperature: 0.7
          max_tokens: 512
  persona: !include persona.yml

