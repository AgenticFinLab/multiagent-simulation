# MentalAccounting RuleLLM Simulation Configuration
#
# Mental accounting causes investors to treat money differently based on its source or intended use
#
# Usage:
#   python examples/MentalAccounting/RuleLLM/run_mentalaccounting_rulellm.py \
#       -c configs/MentalAccounting/RuleLLM/simulation.yml

setting:
  name: "MentalAccounting-RuleLLM"
  description: "Mental accounting simulation showing how portfolio segregation leads to suboptimal decisions"
  total_rounds: 200
  
  record_path: "EXPERIMENT/MentalAccounting/RuleLLM/records"
  storage_path: "EXPERIMENT/MentalAccounting/RuleLLM/communication"
  
  log_level: "INFO"
  log_to_file: true
  log_path: "EXPERIMENT/MentalAccounting/RuleLLM/logs"

environment:
  dotenv_path: ".env"
  workspace: "."

llm:
  model: "doubao-pro-32k"
  temperature: 0.3
  max_tokens: 500
  timeout: 30

ray:
  namespace: "mentalaccounting_rulellm"
  ignore_reinit_error: true
  object_store_memory: 536870912
  num_cpus: 4

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/MentalAccounting/RuleLLM/communication"
  record_messages: true
  message_timeout_ms: 30000
  max_retries: 3
