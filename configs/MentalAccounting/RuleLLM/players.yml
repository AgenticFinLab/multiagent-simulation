# MentalAccounting RuleLLM Agent Configuration

market:
  name: "Market"
  class: "examples.MentalAccounting.RuleLLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    extras:
      initial_price: 100.0
      fundamental_value: 100.0
      price_impact: 0.04
      mean_reversion: 0.02
      noise_std: 0.02

mental_accountant_1:
  name: "MentalAccountant 1"
  class: "examples.MentalAccounting.RuleLLM.players:LLMMentalAccountant"
  num_instances: 2
  config:
    identity: "mental_accountant_1"
    role: player
    extras:
      initial_cash: 1000000.00
      initial_position: 0
      agent_type: "mental_accountant"
      llm:
        model: "doubao-pro-32k"


