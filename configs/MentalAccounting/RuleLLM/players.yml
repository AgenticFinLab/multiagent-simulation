      llm:
        sys_message: "examples.MentalAccounting.RuleLLM.prompts:RULELLM_HOUSE_MONEY_SYS"
        user_message: "examples.MentalAccounting.RuleLLM.prompts:RULELLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.7
          max_tokens: 512
  persona: !include persona.yml

