# MentalAccounting Rule Agent Configuration

market:
  archetype: stock-standard-price-impact  # -> masim/agents/defines/market/stock-standard-price-impact.md
  name: "Market"
  class: "examples.MentalAccounting.Rule.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/MentalAccounting/Rule/records"  # Source: framework infrastructure
      initial_price: 100.0  # Source: simulation-bases.md §6
      fundamental_value: 100.0  # Source: simulation-bases.md §6
      price_impact: 0.02  # Source: simulation-bases.md §6
      mean_reversion: 0.01  # Source: simulation-bases.md §6
      noise_std: 0.012  # Source: simulation-bases.md §6
      custom_state_hot_limit: 3  # Source: framework infrastructure
  persona: !include persona.yml

rule_mental_accountant:
  name: "MentalAccountant"
  class: "examples.MentalAccounting.Rule.players:MentalAccountant"
  num_instances: 2
  config:
    identity: "rule_mental_accountant"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/MentalAccounting/Rule/records"  # Source: framework infrastructure
      initial_cash: 1000000.0  # Source: simulation-bases.md §6
      initial_position: 500  # Source: simulation-bases.md §6
      initial_price: 100.0  # Source: simulation-bases.md §6
      fundamental_value: 100.0  # Source: simulation-bases.md §6
      loss_aversion_per_account: 2.25  # Source: simulation-bases.md §4.1.7
      num_accounts: 3  # Source: simulation-bases.md §4.1.7
      base_size: 400  # Source: simulation-bases.md §4.1.7
      custom_state_hot_limit: 3  # Source: framework infrastructure
  persona: !include persona.yml

