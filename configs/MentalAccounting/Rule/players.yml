# MentalAccounting Rule Agent Configuration

market:
  name: "Market"
  class: "examples.MentalAccounting.Rule.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/MentalAccounting/Rule/records"
      initial_price: 100.0
      fundamental_value: 100.0
      price_impact: 0.02
      mean_reversion: 0.01
      noise_std: 0.012
      custom_state_hot_limit: 3
  persona: !include persona.yml

rule_mental_accountant:
  name: "MentalAccountant"
  class: "examples.MentalAccounting.Rule.players:MentalAccountant"
  num_instances: 2
  config:
    identity: "rule_mental_accountant"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/MentalAccounting/Rule/records"
      initial_cash: 1000000.0
      initial_position: 500
      initial_price: 100.0
      fundamental_value: 100.0
      loss_aversion_per_account: 2.25
      num_accounts: 3
      base_size: 400
      custom_state_hot_limit: 3
  persona: !include persona.yml

rule_house_money_trader:
  name: "HouseMoneyTrader"
  class: "examples.MentalAccounting.Rule.players:HouseMoneyTrader"
  num_instances: 2
  config:
    identity: "rule_house_money_trader"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/MentalAccounting/Rule/records"
      initial_cash: 1200000.0
      initial_position: 500
      initial_price: 100.0
      fundamental_value: 100.0
      gain_risk_multiplier: 2.0
      loss_risk_multiplier: 0.5
      deviation_threshold: 0.02
      base_size: 400
      custom_state_hot_limit: 3
  persona: !include persona.yml

rule_rational_portfolio_manager:
  name: "RationalPortfolioManager"
  class: "examples.MentalAccounting.Rule.players:RationalPortfolioManager"
  num_instances: 1
  config:
    identity: "rule_rational_portfolio_manager"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/MentalAccounting/Rule/records"
      initial_cash: 1500000.0
      initial_position: 500
      initial_price: 100.0
      fundamental_value: 100.0
      risk_aversion: 0.7
      deviation_threshold: 0.02
      quantity_scale: 3000
      base_size: 300
      custom_state_hot_limit: 3
  persona: !include persona.yml

rule_sunk_cost_holder:
  name: "SunkCostHolder"
  class: "examples.MentalAccounting.Rule.players:SunkCostHolder"
  num_instances: 2
  config:
    identity: "rule_sunk_cost_holder"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/MentalAccounting/Rule/records"
      initial_cash: 1000000.0
      initial_position: 500
      initial_price: 100.0
      fundamental_value: 100.0
      sunk_cost_weight: 0.6
      base_size: 350
      custom_state_hot_limit: 3
  persona: !include persona.yml

rule_noise_trader:
  name: "NoiseTrader"
  class: "examples.MentalAccounting.Rule.players:NoiseTrader"
  num_instances: 2
  config:
    identity: "rule_noise_trader"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/MentalAccounting/Rule/records"
      initial_cash: 500000.0
      initial_position: 200
      initial_price: 100.0
      fundamental_value: 100.0
      trade_probability: 0.3
      noise_size: 150
      custom_state_hot_limit: 3
  persona: !include persona.yml
