# HerdingInformation LLM Agent Configuration

market:
  name: "Market"
  class: "examples.HerdingInformation.LLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    extras:
      initial_price: 100.0
      fundamental_value: 100.0
      price_impact: 0.05
      mean_reversion: 0.02
      noise_std: 0.02

cascade_follower_1:
  name: "CascadeFollower 1"
  class: "examples.HerdingInformation.LLM.players:LLMCascadeFollower"
  num_instances: 2
  config:
    identity: "cascade_follower_1"
    role: player
    extras:
      initial_cash: 1000000.00
      initial_position: 0
      agent_type: "cascade_follower"
      llm:
        model: "doubao-pro-32k"


