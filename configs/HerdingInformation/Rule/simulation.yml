# HerdingInformation Rule Simulation Configuration
#
# Information cascade occurs when individuals ignore private signals and follow the crowd
#
# Usage:
#   python examples/HerdingInformation/Rule/run_herdinginformation.py \
#       -c configs/HerdingInformation/Rule/simulation.yml

setting:
  name: "HerdingInformation-Rule"
  description: "Informational herding simulation showing how sequential decision-making leads to information cascades"
  total_rounds: 200
  
  record_path: "EXPERIMENT/HerdingInformation/Rule/records"
  storage_path: "EXPERIMENT/HerdingInformation/Rule/communication"
  
  log_level: "INFO"
  log_to_file: true
  log_path: "EXPERIMENT/HerdingInformation/Rule/logs"

environment:
  dotenv_path: ".env"
  workspace: "."

ray:
  namespace: "herdinginformation_rule"
  ignore_reinit_error: true
  object_store_memory: 536870912
  num_cpus: 4

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/HerdingInformation/Rule/communication"
  record_messages: true
  message_timeout_ms: 5000
  max_retries: 3
