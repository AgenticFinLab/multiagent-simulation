# SVBBankRun Rule Simulation Configuration
#
# March 2023 SVB collapse - $42B deposit outflow in one day triggered by social media panic
#
# Usage:
#   python examples/SVBBankRun/Rule/run_svbbankrun.py \
#       -c configs/SVBBankRun/Rule/simulation.yml

setting:
  name: "SVBBankRun-Rule"
  description: "Silicon Valley Bank run simulation with social media-accelerated deposit flight and duration risk"
  total_rounds: 200
  
  record_path: "EXPERIMENT/SVBBankRun/Rule/records"
  storage_path: "EXPERIMENT/SVBBankRun/Rule/communication"
  
  log_level: "INFO"
  log_to_file: true
  log_path: "EXPERIMENT/SVBBankRun/Rule/logs"

environment:
  dotenv_path: ".env"
  workspace: "."

ray:
  namespace: "svbbankrun_rule"
  ignore_reinit_error: true
  object_store_memory: 536870912
  num_cpus: 4

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/SVBBankRun/Rule/communication"
  record_messages: true
  message_timeout_ms: 5000
  max_retries: 3
