market:
  archetype: deposit-bank-run-diamond-dybvig  # -> masim/agents/defines/market/deposit-bank-run-diamond-dybvig.md
  name: "Market"
  class: "examples.SVBBankRun.Rule.players:Market"
  num_instances: 1
  persona: !include persona.yml
  config:
    identity: "market"
    role: market
    steps_per_turn: 1
    group_tags: [market]
    extras:
      initial_price: 100.0  # Source: target §9 market.extras.initial_price row; normalization (simulation-bases.md §6)
      fundamental_value: 100.0  # Source: target §9 market.extras.fundamental_value row; normalization; equal to initial_price so starting deviation is zero (simulation-bases.md §6)
      price_impact: 0.025  # Source: target §9 market.extras.price_impact row; Diamond and Dybvig (1983), 10.1086/261155
      mean_reversion: 0.01  # Source: target §9 market.extras.mean_reversion row; Bagehot (1873) via Freixas et al. (2000), 10.1023/A:1026527607455
      noise_std: 0.015  # Source: target §9 market.extras.noise_std row; Rule/players.py Market.perceive

rule_depositor:
  name: "Depositor"
  class: "examples.SVBBankRun.Rule.players:Depositor"
  num_instances: 4  # Source: target §9 depositor.num_instances row
  persona: !include persona.yml
  config:
    identity: "rule_depositor"
    role: player
    steps_per_turn: 1
    group_tags: [investors]
    extras:
      initial_cash: 1000000.0  # Source: target §9 depositor.extras.initial_cash row
      initial_position: 600  # Source: target §9 depositor.extras.initial_position row
      initial_price: 100.0  # Source: target §9 market.extras.initial_price row (broadcast copy)
      fundamental_value: 100.0  # Source: target §9 market.extras.fundamental_value row (broadcast copy)
      withdrawal_threshold: 0.1  # Source: target §9 depositor.extras.withdrawal_threshold row; Diamond and Dybvig (1983), 10.1086/261155
      social_influence: 0.5  # Source: target §9 legacy descriptive extras (not consumed by current Rule formula)
      base_size: 300  # Source: target §9 legacy descriptive extras (not consumed by current Rule formula)
      custom_state_hot_limit: 3  # Source: target §9 custom_state_hot_limit row (runtime plumbing)

rule_social_media_influencer:
  name: "SocialMediaInfluencer"
  class: "examples.SVBBankRun.Rule.players:SocialMediaInfluencer"
  num_instances: 2  # Source: target §9 socialmediainfluencer.num_instances row
  persona: !include persona.yml
  config:
    identity: "rule_social_media_influencer"
    role: player
    steps_per_turn: 1
    group_tags: [investors]
    extras:
      initial_cash: 800000.0  # Source: target §9 socialmediainfluencer.extras.initial_cash row
      initial_position: 500  # Source: target §9 socialmediainfluencer.extras.initial_position row
      initial_price: 100.0  # Source: target §9 market.extras.initial_price row (broadcast copy)
      fundamental_value: 100.0  # Source: target §9 market.extras.fundamental_value row (broadcast copy)
      amplification_factor: 2.0  # Source: target §9 socialmediainfluencer.extras.amplification_factor row; Bikhchandani et al. (1992), 10.1086/261849
      base_size: 500  # Source: target §9 legacy descriptive extras (not consumed by current Rule formula)
      custom_state_hot_limit: 3  # Source: target §9 custom_state_hot_limit row (runtime plumbing)

