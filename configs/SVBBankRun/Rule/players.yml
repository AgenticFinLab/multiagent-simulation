rule_regulator:
  name: "Regulator"
  class: "examples.SVBBankRun.Rule.players:Regulator"
  num_instances: 1  # Source: target §9 regulator.num_instances row
  persona: !include persona.yml
  config:
    identity: "rule_regulator"
    role: player
    steps_per_turn: 1
    group_tags: [investors]
    extras:
      initial_cash: 10000000.0  # Source: target §9 regulator.extras.initial_cash row
      initial_position: 0  # Source: target §9 regulator.extras.initial_position row
      initial_price: 100.0  # Source: target §9 market.extras.initial_price row (broadcast copy)
      fundamental_value: 100.0  # Source: target §9 market.extras.fundamental_value row (broadcast copy)
      intervention_threshold: 0.5  # Source: target §9 regulator.extras.intervention_threshold row; Bagehot (1873)
      guarantee_probability: 0.4  # Source: target §9 regulator.extras.guarantee_probability row; Freixas et al. (2000), 10.1023/A:1026527607455
      intervention_size: 2000  # Source: target §9 regulator.extras.intervention_size row (config extra; runtime code uses literal 2000)
      custom_state_hot_limit: 3  # Source: target §9 custom_state_hot_limit row (runtime plumbing)

