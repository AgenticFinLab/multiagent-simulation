# SVBBankRun LLM Agent Configuration

market:
  name: "Market"
  class: "examples.SVBBankRun.LLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    extras:
      initial_price: 100.0
      fundamental_value: 100.0
      price_impact: 0.04
      mean_reversion: 0.01
      noise_std: 0.02

depositor_1:
  name: "Depositor 1"
  class: "examples.SVBBankRun.LLM.players:LLMDepositor"
  num_instances: 2
  config:
    identity: "depositor_1"
    role: player
    extras:
      initial_cash: 1000000.00
      initial_position: 0
      agent_type: "depositor"
      llm:
        model: "doubao-pro-32k"


