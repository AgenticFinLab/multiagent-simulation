market:
  name: "Market"
  class: "examples.SVBBankRun.Rule.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: market
    steps_per_turn: 1
    group_tags: [market]
    record_path: "EXPERIMENT/SVBBankRun/RuleLLM/records/market"
    persona: !include ../RuleLLM/persona.yml
    extras:
      initial_price: 100.0
      fundamental_value: 100.0
      price_impact: 0.025
      mean_reversion: 0.01
      noise_std: 0.015

depositor:
  name: "Depositor"
  class: "examples.SVBBankRun.RuleLLM.players:RuleLLMDepositor"
  num_instances: 4
  config:
    identity: "depositor"
    role: player
    steps_per_turn: 1
    group_tags: [investors]
    record_path: "EXPERIMENT/SVBBankRun/RuleLLM/records/depositor"
    persona: !include ../RuleLLM/persona.yml
    extras:
      initial_cash: 1000000.0
      initial_position: 600
      initial_price: 100.0
      fundamental_value: 100.0
      withdrawal_threshold: 0.1
      social_influence: 0.5
      base_size: 300
      custom_state_hot_limit: 3
      llm:
        sys_message: "examples.SVBBankRun.RuleLLM.prompts:RULELLM_DEPOSITOR_SYS"
        user_message: "examples.SVBBankRun.RuleLLM.prompts:RULELLM_USER_TEMPLATE"
        lm_name: "ark/doubao-seed-1-6-251015"
        generation_config:
          temperature: 0.7
          max_tokens: 512

