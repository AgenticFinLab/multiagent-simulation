# =============================================================================
# AvailabilityBias LLM Players Configuration
# =============================================================================
# 1 Market (rule-based) + 5 LLM Availability Bias Investors
# =============================================================================

# -----------------------------------------------------------------------------
# Market (rule-based, identical to Rule variant)
# -----------------------------------------------------------------------------
market:
  name: "Market"
  class: "examples.AvailabilityBias.LLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/AvailabilityBias/LLM/records"
      fundamental_value: 100.0
      initial_price: 100.0
      price_impact: 0.02
      mean_reversion: 0.03
      noise_std: 0.5
      custom_state_hot_limit: 3
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# LLM Recent Event Overweighter
# -----------------------------------------------------------------------------
llm_recent_event_overweighter:
  name: "LLM Recent Event Overweighter"
  class: "examples.AvailabilityBias.LLM.players:LLMRecentEventOverweighter"
  num_instances: 2
  config:
    identity: "llm_recent_event_overweighter"
    role: player
    steps_per_turn: 1
    group_tags:
      - llm_investors
    extras:
      record_path: "EXPERIMENT/AvailabilityBias/LLM/records"
      initial_cash: 10000.0
      initial_position: 0.0
      custom_state_hot_limit: 3
      llm:
        sys_message: "examples.AvailabilityBias.LLM.prompts:LLM_RECENT_EVENT_OVERWEIGHTER_SYS"
        user_message: "examples.AvailabilityBias.LLM.prompts:LLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.4
          max_new_tokens: 500
  persona: !include persona.yml

