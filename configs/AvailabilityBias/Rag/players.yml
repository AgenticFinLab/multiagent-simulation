# =============================================================================
# AvailabilityBias Rag Players Configuration
# =============================================================================
# 1 Market (rule-based) + 5 RAG-augmented LLM Investors
#
# Knowledge Architecture:
#   The shared knowledge: block is defined at the TOP of this file, before the
#   market definition. The config loader automatically detects "knowledge" inside
#   the players dict and promotes it to config top-level.
#
#   Each agent has private_knowledge for agent-specific RAG configuration.
# =============================================================================

# =============================================================================
# Shared Knowledge Configuration (processed once, accessible by all agents)
# =============================================================================
knowledge:
  backend: "local"
  global_uri: "examples/document-sources"
  resource_csv:
    - "examples/document-sources/books.csv"
    - "examples/document-sources/source"
  preprocessing:
    parser: "mineru"
    timeout_per_page: 30
    max_pages: 250
    output_position: "MinerU_processed"
  rag:
    output_position: "rag_index"
    embed_type: "litellm"
    embed_model: "openai/hunyuan-embedding"
    embed_api_key: "{{ HUNYUAN_API_KEY }}"
    embed_api_base: "https://api.hunyuan.cloud.tencent.com/v1"
    chunk_size: 512
    chunk_overlap: 64

# =============================================================================
# Market (rule-based, identical to Rule variant)
# =============================================================================
market:
  name: "Market"
  class: "examples.AvailabilityBias.Rag.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/AvailabilityBias/Rag/records"
      fundamental_value: 100.0
      initial_price: 100.0
      price_impact: 0.02
      mean_reversion: 0.03
      noise_std: 0.5
      custom_state_hot_limit: 3
  persona: !include persona.yml

# =============================================================================
# RAG Recent Event Overweighter
# =============================================================================
ragllm_recent_event_overweighter:
  name: "RAG Recent Event Overweighter"
  class: "examples.AvailabilityBias.Rag.players:RagLLMRecentEventOverweighter"
  num_instances: 2
  config:
    identity: "ragllm_recent_event_overweighter"
    role: player
    steps_per_turn: 1
    group_tags:
      - ragllm_investors
    extras:
      record_path: "EXPERIMENT/AvailabilityBias/Rag/records"
      initial_cash: 10000.0
      initial_position: 0.0
      custom_state_hot_limit: 3
      recency_weight: 0.70
      salience_threshold: 0.02
      private_knowledge:
        from_global_resources:
          - "MinerU_processed"
        local_resources:
          local_uri: ""
          local_resources: []
        rag:
          from_global_index_dir:
            - "rag_index"
          local_index_dir: ""
          embed_type: "litellm"
          embed_model: "openai/hunyuan-embedding"
          embed_api_key: "{{ HUNYUAN_API_KEY }}"
          embed_api_base: "https://api.hunyuan.cloud.tencent.com/v1"
          chunk_size: 512
          chunk_overlap: 64
          top_k: 5
      llm:
        sys_message: "examples.AvailabilityBias.Rag.prompts:RAG_RECENT_EVENT_OVERWEIGHTER_SYS"
        user_message: "examples.AvailabilityBias.Rag.prompts:RAG_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-1-6-lite-251015"
        generation_config:
          temperature: 0.4
          max_new_tokens: 600
  persona: !include persona.yml

