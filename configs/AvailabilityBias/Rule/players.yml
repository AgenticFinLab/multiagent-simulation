# AvailabilityBias Rule Agent Configuration

market:
  name: "Market"
  class: "examples.AvailabilityBias.Rule.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    extras:
      initial_price: 100.0
      fundamental_value: 100.0
      price_impact: 0.05
      mean_reversion: 0.02
      noise_std: 0.02

recenteventoverweighter_1:
  name: "RecentEventOverweighter 1"
  class: "examples.AvailabilityBias.Rule.players:RecentEventOverweighter"
  num_instances: 2
  config:
    identity: "recenteventoverweighter_1"
    role: player
    extras:
      initial_cash: 1000000.0
      initial_position: 0


