# =============================================================================
# AvailabilityBias Topology - Star Pattern
# =============================================================================
# Market as hub, all investors communicate through market.
#
#   recent_event_overweighter ────┐
#   media_influenced_trader ──────┤
#   systematic_analyst ───────────┼──▶ market ──▶ all investors
#   value_trader ─────────────────┤
#   noise_trader ─────────────────┘
#
# Execution flow per round:
#   Level 0: market executes (broadcasts price, fundamental, deviation data)
#   Level 1: all investors execute in parallel (submit P,Q orders)
# =============================================================================

type: "star"

sources:
  - market

connections:
  # Market → All investors (price + market data broadcast)
  market:
    - recent_event_overweighter
    - media_influenced_trader
    - systematic_analyst
    - value_trader
    - noise_trader

  # Each investor → Market only (order submission)
  recent_event_overweighter:
    - market

  media_influenced_trader:
    - market

  systematic_analyst:
    - market

  value_trader:
    - market

  noise_trader:
    - market
