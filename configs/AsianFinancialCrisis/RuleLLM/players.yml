# =============================================================================
# AsianFinancialCrisis RuleLLM Players Configuration
# =============================================================================
# 1 Market (rule-based coordinator) + 5 Rule+LLM hybrid agent types
#
# System prompts embed BOTH rich persona AND explicit quantitative rules.
# Enables direct comparison with Rule (pure rules) and LLM (persona only).
# =============================================================================

# -----------------------------------------------------------------------------
# Market (Coordinator) — rule-based, identical to Rule variant
# -----------------------------------------------------------------------------
market:
  name: "Market"
  class: "examples.AsianFinancialCrisis.RuleLLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/AsianFinancialCrisis/RuleLLM/records"
      fundamental_value: 100.0
      initial_price: 100.0
      price_impact: 0.04
      mean_reversion: 0.02
      noise_std: 0.02
      custom_state_hot_limit: 3
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# RuleLLM HotMoneyFunder — persona + reversal threshold rules embedded
# Theory: Radelet & Sachs (1998): hot money reversal mechanics
# -----------------------------------------------------------------------------
hot_money_funder:
  name: "Hot Money Funder"
  class: "examples.AsianFinancialCrisis.RuleLLM.players:RuleLLMHotMoneyFunder"
  # Expander → hot_money_funder_1, hot_money_funder_2
  num_instances: 2
  config:
    identity: "hot_money_funder"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/AsianFinancialCrisis/RuleLLM/records"
      initial_cash: 800000.0
      initial_position: 3000.0
      initial_price: 100.0
      fundamental_value: 100.0
      custom_state_hot_limit: 3
      llm:
        sys_message: "examples.AsianFinancialCrisis.RuleLLM.prompts:RULELLM_HOT_MONEY_FUNDER_SYS"
        user_message: "examples.AsianFinancialCrisis.RuleLLM.prompts:RULELLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.4
          max_tokens: 512
  persona: !include persona.yml

