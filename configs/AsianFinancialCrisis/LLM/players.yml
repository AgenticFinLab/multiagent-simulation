  # Expander → llm_value_contrarian_1, llm_value_contrarian_2
  num_instances: 2
  config:
    identity: "llm_value_contrarian"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/AsianFinancialCrisis/LLM/records"  # Source: implementation infrastructure (record path)
      initial_cash: 1000000.0       # Source: target §7 value-contrarian Intent line + §2.4 (patient capital scale, distressed-asset investor)
      initial_position: 500.0     # Source: target §7 value-contrarian Intent line (small pre-crisis holding as anchor position)
      initial_price: 100.0       # Source: target §9 P(0); Radelet & Sachs (1998), https://doi.org/10.1353/eca.1998.0009 (pre-crisis level normalisation; mirrors Market block)
      fundamental_value: 100.0   # Source: target §9 F (normalization; mirrors Market block for agent-side deviation calc)
      custom_state_hot_limit: 3  # Source: implementation infrastructure (hot-state ring buffer)
      llm:
        sys_message: "examples.AsianFinancialCrisis.LLM.prompts:LLM_VALUE_CONTRARIAN_SYS"
        user_message: "examples.AsianFinancialCrisis.LLM.prompts:LLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.4
