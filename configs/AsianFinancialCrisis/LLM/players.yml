# =============================================================================
# AsianFinancialCrisis LLM Players Configuration
# =============================================================================
# 1 Market (rule-based coordinator) + 5 LLM-driven agent types
#
# Each LLM agent uses a rich persona prompt matching their 1997 crisis role.
# Market dynamics are rule-based (same as Rule variant).
# =============================================================================

# -----------------------------------------------------------------------------
# Market (Coordinator) — rule-based, identical to Rule variant
# -----------------------------------------------------------------------------
market:
  name: "Market"
  class: "examples.AsianFinancialCrisis.LLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/AsianFinancialCrisis/LLM/records"  # Source: implementation infrastructure (record path convention per 07-step3-config.md §3.7)
      fundamental_value: 100.0   # Source: target §9 F (normalization, 100-scale crisis index)
      initial_price: 100.0       # Source: target §9 P(0); Radelet & Sachs (1998), https://doi.org/10.1353/eca.1998.0009 (pre-crisis level normalisation)
      price_impact: 0.04         # Source: target §9 lambda; Radelet & Sachs (1998), https://doi.org/10.1353/eca.1998.0009 (crisis thin-liquidity calibration)
      mean_reversion: 0.02       # Source: target §9 gamma; Brunnermeier & Pedersen (2009), https://doi.org/10.1093/rfs/hhn098
      noise_std: 0.02            # Source: target §9 sigma; Black (1986), https://doi.org/10.1111/j.1540-6261.1986.tb04513.x
      custom_state_hot_limit: 3  # Source: implementation infrastructure (hot-state ring-buffer per masim.core state contract)
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# LLM HotMoneyFunder — short-term capital reversal
# Theory: Radelet & Sachs (1998): hot money reversal mechanics
# -----------------------------------------------------------------------------
llm_hot_money_funder:
  name: "Hot Money Funder"
  class: "examples.AsianFinancialCrisis.LLM.players:LLMHotMoneyFunder"
  # Expander → llm_hot_money_funder_1, llm_hot_money_funder_2
  num_instances: 2
  config:
    identity: "llm_hot_money_funder"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/AsianFinancialCrisis/LLM/records"  # Source: implementation infrastructure (record path)
      initial_cash: 800000.0       # Source: target §7 hot-money-funder Intent line + §6.1 quantitative arc (leveraged foreign creditor scale)
      initial_position: 3000.0     # Source: target §7 hot-money-funder Intent line (carries a short-term-loan funded position at simulation start)
      initial_price: 100.0       # Source: target §9 P(0); Radelet & Sachs (1998), https://doi.org/10.1353/eca.1998.0009 (pre-crisis level normalisation; mirrors Market block)
      fundamental_value: 100.0   # Source: target §9 F (normalization; mirrors Market block for agent-side deviation calc)
      custom_state_hot_limit: 3  # Source: implementation infrastructure (hot-state ring buffer)
      llm:
        sys_message: "examples.AsianFinancialCrisis.LLM.prompts:LLM_HOT_MONEY_FUNDER_SYS"
        user_message: "examples.AsianFinancialCrisis.LLM.prompts:LLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.7
          max_tokens: 512
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# LLM ContagionTrader — cross-border correlated seller
# Theory: Kaminsky & Reinhart (1999): contagion mechanics
# -----------------------------------------------------------------------------
llm_contagion_trader:
  name: "Contagion Trader"
  class: "examples.AsianFinancialCrisis.LLM.players:LLMContagionTrader"
  # Expander → llm_contagion_trader_1, llm_contagion_trader_2
  num_instances: 2
  config:
    identity: "llm_contagion_trader"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/AsianFinancialCrisis/LLM/records"  # Source: implementation infrastructure (record path)
      initial_cash: 600000.0       # Source: target §7 contagion-trader Intent line + §6.1 quantitative arc (cross-border fund scale)
      initial_position: 4000.0     # Source: target §7 contagion-trader Intent line (carries a large cross-border position at simulation start)
      initial_price: 100.0       # Source: target §9 P(0); Radelet & Sachs (1998), https://doi.org/10.1353/eca.1998.0009 (pre-crisis level normalisation; mirrors Market block)
      fundamental_value: 100.0   # Source: target §9 F (normalization; mirrors Market block for agent-side deviation calc)
      custom_state_hot_limit: 3  # Source: implementation infrastructure (hot-state ring buffer)
      llm:
        sys_message: "examples.AsianFinancialCrisis.LLM.prompts:LLM_CONTAGION_TRADER_SYS"
        user_message: "examples.AsianFinancialCrisis.LLM.prompts:LLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.6
          max_tokens: 512
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# LLM IMFRescuer — conditional emergency liquidity provider
# Theory: Corsetti, Pesenti & Roubini (1999): IMF conditionality
# -----------------------------------------------------------------------------
llm_imf_rescuer:
  name: "IMF Rescuer"
  class: "examples.AsianFinancialCrisis.LLM.players:LLMIMFRescuer"
  num_instances: 1
  config:
    identity: "llm_imf_rescuer"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/AsianFinancialCrisis/LLM/records"  # Source: implementation infrastructure (record path)
      initial_cash: 5000000.0       # Source: target §7 imf-rescuer Intent line + §6.1 quantitative arc (official-sector deep pockets, >100bn USD IMF package scale)
      initial_position: 0.0     # Source: target §7 imf-rescuer Intent line (official rescuer starts with zero market exposure)
      initial_price: 100.0       # Source: target §9 P(0); Radelet & Sachs (1998), https://doi.org/10.1353/eca.1998.0009 (pre-crisis level normalisation; mirrors Market block)
      fundamental_value: 100.0   # Source: target §9 F (normalization; mirrors Market block for agent-side deviation calc)
      custom_state_hot_limit: 3  # Source: implementation infrastructure (hot-state ring buffer)
      llm:
        sys_message: "examples.AsianFinancialCrisis.LLM.prompts:LLM_IMF_RESCUER_SYS"
        user_message: "examples.AsianFinancialCrisis.LLM.prompts:LLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.3
          max_tokens: 512
  persona: !include persona.yml

# -----------------------------------------------------------------------------
