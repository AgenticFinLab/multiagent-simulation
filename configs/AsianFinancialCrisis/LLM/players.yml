      initial_position: 4000.0
      initial_price: 100.0
      fundamental_value: 100.0
      custom_state_hot_limit: 3
      llm:
        sys_message: "examples.AsianFinancialCrisis.LLM.prompts:LLM_CONTAGION_TRADER_SYS"
