# =============================================================================
# AsianFinancialCrisis LLM Players Configuration
# =============================================================================
# 1 Market (rule-based coordinator) + 5 LLM-driven agent types
#
# Each LLM agent uses a rich persona prompt matching their 1997 crisis role.
# Market dynamics are rule-based (same as Rule variant).
# =============================================================================

# -----------------------------------------------------------------------------
# Market (Coordinator) — rule-based, identical to Rule variant
# -----------------------------------------------------------------------------
market:
  name: "Market"
  class: "examples.AsianFinancialCrisis.LLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/AsianFinancialCrisis/LLM/records"
      fundamental_value: 100.0
      initial_price: 100.0
      price_impact: 0.04
      mean_reversion: 0.02
      noise_std: 0.02
      custom_state_hot_limit: 3
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# LLM HotMoneyFunder — short-term capital reversal
# Theory: Radelet & Sachs (1998): hot money reversal mechanics
# -----------------------------------------------------------------------------
hot_money_funder:
  name: "Hot Money Funder"
  class: "examples.AsianFinancialCrisis.LLM.players:LLMHotMoneyFunder"
  # Expander → hot_money_funder_1, hot_money_funder_2
  num_instances: 2
  config:
    identity: "hot_money_funder"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/AsianFinancialCrisis/LLM/records"
      initial_cash: 800000.0
      initial_position: 3000.0
      initial_price: 100.0
      fundamental_value: 100.0
      custom_state_hot_limit: 3
      llm:
        sys_message: "examples.AsianFinancialCrisis.LLM.prompts:LLM_HOT_MONEY_FUNDER_SYS"
        user_message: "examples.AsianFinancialCrisis.LLM.prompts:LLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-1-6-lite-250115"
        generation_config:
          temperature: 0.7
          max_tokens: 512
  persona: !include persona.yml

# -----------------------------------------------------------------------------
