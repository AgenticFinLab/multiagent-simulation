# =============================================================================
# AsianFinancialCrisis Rag Players Configuration
# =============================================================================
# 1 Market (rule-based coordinator) + 5 RAG-augmented LLM agent types
#
# Knowledge Architecture:
#   The shared knowledge: block is promoted to config top-level by the loader.
#   Each agent has private_knowledge for agent-specific RAG configuration.
# =============================================================================

# =============================================================================
# Shared Knowledge Configuration
# =============================================================================
knowledge:
  backend: "local"
  global_uri: "examples/document-sources"
  resource_csv:
    - "examples/document-sources/books.csv"
    - "examples/document-sources/source"
  preprocessing:
    parser: "mineru"
    output_position: "MinerU_processed"
  rag:
    output_position: "rag_index"
    embed_type: "litellm"
    embed_model: "openai/hunyuan-embedding"
    embed_api_key: "{{ HUNYUAN_API_KEY }}"
    embed_api_base: "https://api.hunyuan.cloud.tencent.com/v1"
    chunk_size: 512
    chunk_overlap: 64
    top_k: 5

# -----------------------------------------------------------------------------
# Market (Coordinator) — rule-based, identical to Rule variant
# -----------------------------------------------------------------------------
market:
  archetype: fx-currency-peg-and-attack  # -> masim/agents/defines/market/fx-currency-peg-and-attack.md
  name: "Market"
  class: "examples.AsianFinancialCrisis.Rag.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/AsianFinancialCrisis/Rag/records"  # Source: implementation infrastructure (record path convention per 07-step3-config.md §3.7)
      fundamental_value: 100.0   # Source: target §9 F (normalization, 100-scale crisis index)
      initial_price: 100.0       # Source: target §9 P(0); Radelet & Sachs (1998), https://doi.org/10.1353/eca.1998.0009 (pre-crisis level normalisation)
      price_impact: 0.04         # Source: target §9 lambda; Radelet & Sachs (1998), https://doi.org/10.1353/eca.1998.0009 (crisis thin-liquidity calibration)
      mean_reversion: 0.02       # Source: target §9 gamma; Brunnermeier & Pedersen (2009), https://doi.org/10.1093/rfs/hhn098
      noise_std: 0.02            # Source: target §9 sigma; Black (1986), https://doi.org/10.1111/j.1540-6261.1986.tb04513.x
      custom_state_hot_limit: 3  # Source: implementation infrastructure (hot-state ring-buffer per masim.core state contract)
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# RAG HotMoneyFunder — short-term capital reversal + domain knowledge
# Theory: Radelet & Sachs (1998): hot money reversal mechanics
# -----------------------------------------------------------------------------
ragllm_hot_money_funder:
  name: "RAG Hot Money Funder"
  class: "examples.AsianFinancialCrisis.Rag.players:RagLLMHotMoneyFunder"
  # Expander → ragllm_hot_money_funder_1, ragllm_hot_money_funder_2
  num_instances: 2
  config:
    identity: "ragllm_hot_money_funder"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/AsianFinancialCrisis/Rag/records"  # Source: implementation infrastructure (record path)
      initial_cash: 800000.0       # Source: target §7 hot-money-funder Intent line + §6.1 quantitative arc (leveraged foreign creditor scale)
      initial_position: 3000.0     # Source: target §7 hot-money-funder Intent line (carries a short-term-loan funded position at simulation start)
      initial_price: 100.0       # Source: target §9 P(0); Radelet & Sachs (1998), https://doi.org/10.1353/eca.1998.0009 (pre-crisis level normalisation; mirrors Market block)
      fundamental_value: 100.0   # Source: target §9 F (normalization; mirrors Market block for agent-side deviation calc)
      custom_state_hot_limit: 3  # Source: implementation infrastructure (hot-state ring buffer)
      private_knowledge:
        from_global_resources:
          - "MinerU_processed"
        local_resources:
          local_uri: ""
          local_resources: []
        rag:
          from_global_index_dir:
            - "rag_index"
          local_index_dir: ""
          embed_type: "litellm"
          embed_model: "openai/hunyuan-embedding"
          embed_api_key: "{{ HUNYUAN_API_KEY }}"
          embed_api_base: "https://api.hunyuan.cloud.tencent.com/v1"
          chunk_size: 512
          chunk_overlap: 64
          top_k: 5
      llm:
        sys_message: "examples.AsianFinancialCrisis.Rag.prompts:RAG_HOT_MONEY_FUNDER_SYS"
        user_message: "examples.AsianFinancialCrisis.Rag.prompts:RAG_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.5
          max_new_tokens: 600
  persona: !include persona.yml

