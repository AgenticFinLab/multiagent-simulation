# =============================================================================
# AsianFinancialCrisis Rule Simulation Configuration
# =============================================================================
# Rule-based simulation of the 1997 Asian Financial Crisis.
# Hot money reversals + contagion trading drive currency/asset price collapse.
# IMF rescue packages and value contrarians provide partial stabilization.
#
# Usage:
#   python examples/AsianFinancialCrisis/Rule/run_asianfinancialcrisis.py \
#       -c configs/AsianFinancialCrisis/Rule/simulation.yml
# =============================================================================

setting:
  name: "asianfinancialcrisis_rule_simulation"
  description: "1997 Asian Financial Crisis: hot money reversal, contagion cascade, IMF intervention"
  total_rounds: 200
  round_history_limit: 3
  record_path: "EXPERIMENT/AsianFinancialCrisis/Rule/records"
  save_diagram_interval: 50

environment:
  dotenv_path: .env
  workspace: "."

ray:
  address: null
  namespace: "asianfinancialcrisis_rule"
  actor_prefix: null
  num_cpus: null
  num_gpus: null
  object_store_memory: 268435456
  include_dashboard: false
  logging_level: "warning"
  log_to_driver: false
  actor_options:
    max_restarts: 3
    max_task_retries: 1
    max_concurrency: 10
  runtime_env:
    working_dir: null
    pip: []
    env_vars: {}
  serialization:
    use_arrow: true
    register_custom_serializers: true

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/AsianFinancialCrisis/Rule/communication"
  record_messages: true
  message_block_size: 500
