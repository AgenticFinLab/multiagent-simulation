# AsianFinancialCrisis Rule Agent Configuration

market:
  name: "Market"
  class: "examples.AsianFinancialCrisis.Rule.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    extras:
      initial_price: 100.0
      fundamental_value: 100.0
      price_impact: 0.05
      mean_reversion: 0.02
      noise_std: 0.02

hotmoneyfunder_1:
  name: "HotMoneyFunder 1"
  class: "examples.AsianFinancialCrisis.Rule.players:HotMoneyFunder"
  num_instances: 2
  config:
    identity: "hotmoneyfunder_1"
    role: player
    extras:
      initial_cash: 1000000.0
      initial_position: 0

contagiontrader_2:
  name: "ContagionTrader 2"
  class: "examples.AsianFinancialCrisis.Rule.players:ContagionTrader"
