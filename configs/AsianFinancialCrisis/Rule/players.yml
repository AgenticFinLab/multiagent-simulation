# =============================================================================
# AsianFinancialCrisis Rule Players Configuration
# =============================================================================
# 1 Market (rule-based coordinator) + 5 rule-based agent types
#
# Scenario: 1997 Asian Financial Crisis — currency collapses spread from Thailand
# Agents: HotMoneyFunder (reversal) + ContagionTrader (cross-border seller)
#         + IMFRescuer (stabilizer) + ValueContrarian (contrarian buyer)
#         + NoiseTrader (background liquidity)
# =============================================================================

# -----------------------------------------------------------------------------
# Market (Coordinator) — rule-based price formation
# -----------------------------------------------------------------------------
market:
  archetype: fx-currency-peg-and-attack  # -> masim/agents/defines/market/fx-currency-peg-and-attack.md
  name: "Market"
  class: "examples.AsianFinancialCrisis.Rule.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/AsianFinancialCrisis/Rule/records"  # Source: implementation infrastructure (record path convention per 07-step3-config.md §3.7)
      # Price formation: P(t+1) = P(t) + λ×NetDemand + γ×(F-P(t)) + ε
      fundamental_value: 100.0   # Source: target §9 F (normalization, 100-scale crisis index; Source: normalization row)
      initial_price: 100.0       # Source: target §9 P(0); Radelet & Sachs (1998), https://doi.org/10.1353/eca.1998.0009 (pre-crisis level normalisation)
      price_impact: 0.04         # Source: target §9 lambda; Radelet & Sachs (1998), https://doi.org/10.1353/eca.1998.0009 (crisis thin-liquidity calibration)
      mean_reversion: 0.02       # Source: target §9 gamma; Brunnermeier & Pedersen (2009), https://doi.org/10.1093/rfs/hhn098
      noise_std: 0.02            # Source: target §9 sigma; Black (1986), https://doi.org/10.1111/j.1540-6261.1986.tb04513.x
      custom_state_hot_limit: 3  # Source: implementation infrastructure (hot-state ring-buffer per masim.core state contract)
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# HotMoneyFunder — short-term capital reversal
# Theory: Radelet & Sachs (1998): hot money reversal mechanics
# -----------------------------------------------------------------------------
rule_hot_money_funder:
  name: "Hot Money Funder"
  class: "examples.AsianFinancialCrisis.Rule.players:HotMoneyFunder"
  # Expander → rule_hot_money_funder_1, rule_hot_money_funder_2
  num_instances: 2
  config:
    identity: "rule_hot_money_funder"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/AsianFinancialCrisis/Rule/records"  # Source: implementation infrastructure (record path)
      initial_cash: 800000.0       # Source: target §7 hot-money-funder Intent line + §6.1 quantitative arc (leveraged foreign creditor scale)
      initial_position: 3000.0     # Source: target §7 hot-money-funder Intent line (carries a short-term-loan funded position at simulation start)
      # Rule parameters
      reversal_threshold: 0.02     # Source: target §9 theta_reversal; Radelet & Sachs (1998), https://doi.org/10.1353/eca.1998.0009
      sell_ratio: 0.60             # Source: target §9 phi_hm_sell; Radelet & Sachs (1998), https://doi.org/10.1353/eca.1998.0009
      buy_ratio: 0.30              # Source: target §9 phi_hm_buy; Calvo (1998), https://www.ucema.edu.ar/publicaciones/download/volume1/calvo.pdf
      custom_state_hot_limit: 3    # Source: implementation infrastructure (hot-state ring buffer)
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# ContagionTrader — cross-border correlated seller
# Theory: Kaminsky & Reinhart (1999): contagion transmission across markets
# -----------------------------------------------------------------------------
rule_contagion_trader:
  name: "Contagion Trader"
  class: "examples.AsianFinancialCrisis.Rule.players:ContagionTrader"
  # Expander → rule_contagion_trader_1, rule_contagion_trader_2
  num_instances: 2
  config:
    identity: "rule_contagion_trader"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/AsianFinancialCrisis/Rule/records"  # Source: implementation infrastructure (record path)
      initial_cash: 600000.0       # Source: target §7 contagion-trader Intent line + §6.1 quantitative arc (cross-border fund scale)
      initial_position: 4000.0     # Source: target §7 contagion-trader Intent line (carries a large cross-border position at simulation start)
      # Rule parameters
      contagion_weight: 0.60       # Source: target §9 w_dev; Kaminsky & Reinhart (1999), https://doi.org/10.1257/aer.89.3.473
      cross_border_sensitivity: 0.40  # Source: target §9 w_ret; Kaminsky & Reinhart (1999), https://doi.org/10.1257/aer.89.3.473
      contagion_threshold: -0.025  # Source: target §9 theta_contagion; Kaminsky & Reinhart (1999), https://doi.org/10.1257/aer.89.3.473
      sell_ratio: 0.50             # Source: target §9 phi_ct_sell; Kaminsky & Reinhart (1999), https://doi.org/10.1257/aer.89.3.473
      custom_state_hot_limit: 3    # Source: implementation infrastructure (hot-state ring buffer)
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# IMFRescuer — conditional emergency liquidity provider
# Theory: Corsetti, Pesenti & Roubini (1999): IMF conditionality effects
# -----------------------------------------------------------------------------
rule_imf_rescuer:
  name: "IMF Rescuer"
  class: "examples.AsianFinancialCrisis.Rule.players:IMFRescuer"
  num_instances: 1
  config:
    identity: "rule_imf_rescuer"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/AsianFinancialCrisis/Rule/records"  # Source: implementation infrastructure (record path)
      initial_cash: 5000000.0      # Source: target §7 imf-rescuer Intent line + §6.1 quantitative arc (official-sector deep pockets, >100bn USD IMF package scale)
      initial_position: 0.0        # Source: target §7 imf-rescuer Intent line (official rescuer starts with zero market exposure)
      # Rule parameters
      rescue_threshold: -0.05      # Source: target §9 theta_rescue; Corsetti, Pesenti & Roubini (1999), https://doi.org/10.1016/S0014-2921(98)00111-0
      buy_ratio: 0.25              # Source: target §9 phi_rescue; Corsetti, Pesenti & Roubini (1999), https://doi.org/10.1016/S0014-2921(98)00111-0
      custom_state_hot_limit: 3    # Source: implementation infrastructure (hot-state ring buffer)
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# ValueContrarian — crisis-driven mispricing buyer
# Theory: Fundamental value investing; long-run mean reversion
# -----------------------------------------------------------------------------
rule_value_contrarian:
  name: "Value Contrarian"
  class: "examples.AsianFinancialCrisis.Rule.players:ValueContrarian"
  # Expander → rule_value_contrarian_1, rule_value_contrarian_2
  num_instances: 2
  config:
    identity: "rule_value_contrarian"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/AsianFinancialCrisis/Rule/records"  # Source: implementation infrastructure (record path)
      initial_cash: 1000000.0      # Source: target §7 value-contrarian Intent line + §2.4 (patient capital scale, distressed-asset investor)
      initial_position: 500.0      # Source: target §7 value-contrarian Intent line (small pre-crisis holding as anchor position)
      # Rule parameters
      oversold_threshold: -0.08    # Source: target §9 theta_value; Brunnermeier & Pedersen (2009), https://doi.org/10.1093/rfs/hhn098
      overbought_threshold: 0.10   # Source: simulation-bases.md §4.4.4.3 (theta_recovery, recovery-side symmetric exit; implementation extension of target §4.4 key equation)
      buy_ratio: 0.20              # Source: target §9 phi_value_buy; Brunnermeier & Pedersen (2009), https://doi.org/10.1093/rfs/hhn098
      sell_ratio: 0.20             # Source: target §9 phi_value_sell; Brunnermeier & Pedersen (2009), https://doi.org/10.1093/rfs/hhn098
      custom_state_hot_limit: 3    # Source: implementation infrastructure (hot-state ring buffer)
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# NoiseTrader — background liquidity provider
# Theory: Noise trader model (Black, 1986)
# -----------------------------------------------------------------------------
rule_noise_trader:
  name: "Noise Trader"
  class: "examples.AsianFinancialCrisis.Rule.players:NoiseTrader"
  # Expander → rule_noise_trader_1, rule_noise_trader_2, rule_noise_trader_3
  num_instances: 3
  config:
    identity: "rule_noise_trader"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/AsianFinancialCrisis/Rule/records"  # Source: implementation infrastructure (record path)
      initial_cash: 200000.0       # Source: target §7 noise-trader Intent line + §4.5 (retail/liquidity-motivated scale, small vs. crisis-driver agents)
      initial_position: 1000.0     # Source: target §7 noise-trader Intent line (small background inventory)
      # Rule parameters
      trade_probability: 0.30      # Source: target §9 p_noise; Black (1986), https://doi.org/10.1111/j.1540-6261.1986.tb04513.x
      custom_state_hot_limit: 3    # Source: implementation infrastructure (hot-state ring buffer)
  persona: !include persona.yml
