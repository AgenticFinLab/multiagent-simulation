# FramingEffect Rag Simulation Configuration

setting:
  name: "FramingEffect-Rag"
  description: "FramingEffect simulation - Rag agents"
  total_rounds: 200
  record_path: "EXPERIMENT/FramingEffect/Rag/records"
  storage_path: "EXPERIMENT/FramingEffect/Rag/communication"
  log_level: "INFO"
  log_to_file: true
  log_path: "EXPERIMENT/FramingEffect/Rag/logs"

environment:
  dotenv_path: ".env"
  workspace: "."

ray:
  namespace: "framingeffect_rag"
  ignore_reinit_error: true
  object_store_memory: 536870912
  num_cpus: 4

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/FramingEffect/Rag/communication"
  record_messages: true
  message_timeout_ms: 5000
  max_retries: 3
