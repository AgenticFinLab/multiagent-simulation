# FramingEffect Rag Agent Configuration

knowledge:
  backend: "local"
  global_uri: "examples/document-sources"
  resource_csv:
    - "examples/document-sources/books.csv"
    - "examples/document-sources/source"
  preprocessing:
    parser: "mineru"
    output_position: "MinerU_processed"
  rag:
    output_position: "rag_index"
    embed_type: "litellm"
    embed_model: "openai/hunyuan-embedding"
    embed_api_key: "{{ HUNYUAN_API_KEY }}"
    embed_api_base: "https://api.hunyuan.cloud.tencent.com/v1"
    chunk_size: 512
    chunk_overlap: 64
    top_k: 5

market:
  archetype: stock-standard-price-impact  # -> masim/agents/defines/market/stock-standard-price-impact.md
  name: "Market"
  class: "examples.FramingEffect.Rag.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/FramingEffect/Rag/records"  # Source: infrastructure
      initial_price: 100.0  # Source: target §9 row 1 — normalization
      fundamental_value: 100.0  # Source: target §9 row 2 — normalization
      price_impact: 0.05  # Source: target §9 row 3 — LeBaron (2006) ABM calibration
      mean_reversion: 0.02  # Source: target §9 row 4 — Summers (1986) variance bounds
      noise_std: 0.01  # Source: target §9 row 5 — Shiller (1981) excess volatility
      custom_state_hot_limit: 3  # Source: infrastructure
  persona: !include persona.yml

ragllm_gain_frame_follower:
  name: "GainFrameFollower"
  class: "examples.FramingEffect.Rag.players:RagLLMGainFrameFollower"
  num_instances: 2
  config:
    identity: "ragllm_gain_frame_follower"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/FramingEffect/Rag/records"  # Source: infrastructure
      initial_cash: 1000000.0  # Source: target §9 row 6 — normalization
      initial_position: 0  # Source: target §9 row 7 — normalization
      initial_price: 100.0  # Source: target §9 row 1 — normalization
      fundamental_value: 100.0  # Source: target §9 row 2 — normalization
      custom_state_hot_limit: 3  # Source: infrastructure
      llm:  # Source: LLM-wiring infrastructure
        sys_message: "examples.FramingEffect.Rag.prompts:RAGLLM_GAIN_FRAME_FOLLOWER_SYS"
        user_message: "examples.FramingEffect.Rag.prompts:RAG_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.7
          max_tokens: 512
      private_knowledge:
        from_global_resources:
          - "MinerU_processed"
        local_resources:
          local_uri: ""
          local_resources: []
        rag:
          from_global_index_dir:
            - "rag_index"
          local_index_dir: ""
          embed_type: "litellm"
          embed_model: "openai/hunyuan-embedding"
          embed_api_key: "{{ HUNYUAN_API_KEY }}"
          embed_api_base: "https://api.hunyuan.cloud.tencent.com/v1"
          chunk_size: 512
          chunk_overlap: 64
          top_k: 5
  persona: !include persona.yml

