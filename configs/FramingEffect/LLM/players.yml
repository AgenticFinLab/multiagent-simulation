# FramingEffect LLM Agent Configuration

market:
  name: "Market"
  class: "examples.FramingEffect.LLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/FramingEffect/LLM/records"  # Source: infrastructure
      initial_price: 100.0  # Source: target §9 row 1 — normalization
      fundamental_value: 100.0  # Source: target §9 row 2 — normalization
      price_impact: 0.05  # Source: target §9 row 3 — LeBaron (2006) ABM calibration
      mean_reversion: 0.02  # Source: target §9 row 4 — Summers (1986) variance bounds
      noise_std: 0.01  # Source: target §9 row 5 — Shiller (1981) excess volatility
      custom_state_hot_limit: 3  # Source: infrastructure
  persona: !include persona.yml

llm_gain_frame_follower:
  name: "GainFrameFollower"
  class: "examples.FramingEffect.LLM.players:LLMGainFrameFollower"
  num_instances: 2
  config:
    identity: "llm_gain_frame_follower"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/FramingEffect/LLM/records"  # Source: infrastructure
      initial_cash: 1000000.0  # Source: target §9 row 6 — normalization
      initial_position: 0  # Source: target §9 row 7 — normalization
      initial_price: 100.0  # Source: target §9 row 1 — normalization
      fundamental_value: 100.0  # Source: target §9 row 2 — normalization
      custom_state_hot_limit: 3  # Source: infrastructure
      llm:  # Source: LLM-wiring infrastructure
        sys_message: "examples.FramingEffect.LLM.prompts:LLM_GAIN_FRAME_FOLLOWER_SYS"
        user_message: "examples.FramingEffect.LLM.prompts:LLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.7
          max_tokens: 512
  persona: !include persona.yml

