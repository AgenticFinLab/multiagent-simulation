# FramingEffect Rule Agent Configuration

market:
  name: "Market"
  class: "examples.FramingEffect.Rule.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    extras:
      initial_price: 100.0
      fundamental_value: 100.0
      price_impact: 0.05
      mean_reversion: 0.02
      noise_std: 0.02

gainframefollower_1:
  name: "GainFrameFollower 1"
  class: "examples.FramingEffect.Rule.players:GainFrameFollower"
  num_instances: 2
  config:
    identity: "gainframefollower_1"
    role: player
    extras:
      initial_cash: 1000000.0
      initial_position: 0

lossframereactor_2:
  name: "LossFrameReactor 2"
  class: "examples.FramingEffect.Rule.players:LossFrameReactor"
  num_instances: 2
  config:
    identity: "lossframereactor_2"
    role: player
    extras:
      initial_cash: 1000000.0
      initial_position: 0

frameinvarianttrader_3:
  name: "FrameInvariantTrader 3"
  class: "examples.FramingEffect.Rule.players:FrameInvariantTrader"
  num_instances: 1
  config:
    identity: "frameinvarianttrader_3"
    role: player
    extras:
      initial_cash: 1000000.0
      initial_position: 0

arbitrageframer_4:
  name: "ArbitrageFramer 4"
  class: "examples.FramingEffect.Rule.players:ArbitrageFramer"
  num_instances: 1
  config:
    identity: "arbitrageframer_4"
    role: player
    extras:
      initial_cash: 1000000.0
      initial_position: 0

noisetrader_5:
  name: "NoiseTrader 5"
  class: "examples.FramingEffect.Rule.players:NoiseTrader"
  num_instances: 1
  config:
    identity: "noisetrader_5"
    role: player
    extras:
      initial_cash: 1000000.0
      initial_position: 0
