# FramingEffect Rule Agent Configuration

market:
  archetype: stock-standard-price-impact  # -> masim/agents/defines/market/stock-standard-price-impact.md
  name: "Market"
  class: "examples.FramingEffect.Rule.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/FramingEffect/Rule/records"  # Source: infrastructure
      initial_price: 100.0  # Source: target §9 row 1 — normalization
      fundamental_value: 100.0  # Source: target §9 row 2 — normalization
      price_impact: 0.05  # Source: target §9 row 3 — LeBaron (2006) ABM calibration
      mean_reversion: 0.02  # Source: target §9 row 4 — Summers (1986) variance bounds
      noise_std: 0.01  # Source: target §9 row 5 — Shiller (1981) excess volatility
      custom_state_hot_limit: 3  # Source: infrastructure
  persona: !include persona.yml

rule_gain_frame_follower:
  name: "GainFrameFollower"
  class: "examples.FramingEffect.Rule.players:GainFrameFollower"
  num_instances: 2
  config:
    identity: "rule_gain_frame_follower"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/FramingEffect/Rule/records"  # Source: infrastructure
      initial_cash: 1000000.0  # Source: target §9 row 6 — normalization
      initial_position: 0  # Source: target §9 row 7 — normalization
      initial_price: 100.0  # Source: target §9 row 1 — normalization
      fundamental_value: 100.0  # Source: target §9 row 2 — normalization
      gain_weight: 1.5  # Source: simulation-bases.md §4.1 — Prospect Theory λ≈2.25 calibration
      base_size: 400  # Source: simulation-bases.md §4.1 — framing_scale proportional
      custom_state_hot_limit: 3  # Source: infrastructure
  persona: !include persona.yml

