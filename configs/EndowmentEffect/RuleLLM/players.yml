# EndowmentEffect RuleLLM Agent Configuration

market:
  name: "Market"
  class: "examples.EndowmentEffect.RuleLLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/EndowmentEffect/RuleLLM/records"
      initial_price: 100.0
      fundamental_value: 100.0
      price_impact: 0.02
      mean_reversion: 0.05
      noise_std: 0.01
      custom_state_hot_limit: 3
  persona: !include persona.yml

rulellm_endowed_holder:
  name: "EndowedHolder"
  class: "examples.EndowmentEffect.RuleLLM.players:RuleLLMEndowedHolder"
  num_instances: 2
  config:
    identity: "rulellm_endowed_holder"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/EndowmentEffect/RuleLLM/records"
      initial_cash: 800000.0
      initial_position: 500
      endowment_premium: 0.15
      base_size: 300
      custom_state_hot_limit: 3
      llm:
        sys_message: "examples.EndowmentEffect.RuleLLM.prompts:RULELLM_ENDOWED_HOLDER_SYS"
        user_message: "examples.EndowmentEffect.RuleLLM.prompts:RULELLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.5
          max_tokens: 512
  persona: !include persona.yml

