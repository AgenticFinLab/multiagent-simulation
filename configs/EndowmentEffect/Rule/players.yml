# EndowmentEffect Rule Agent Configuration

market:
  archetype: stock-standard-price-impact  # -> masim/agents/defines/market/stock-standard-price-impact.md
  name: "Market"
  class: "examples.EndowmentEffect.Rule.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/EndowmentEffect/Rule/records"  # Source: infrastructure
      initial_price: 100.0        # Source: simulation-bases.md §6 — normalized fundamental
      fundamental_value: 100.0    # Source: simulation-bases.md §6 — Muth (1961) normalization
      price_impact: 0.02          # Source: simulation-bases.md §6 — calibration
      mean_reversion: 0.05        # Source: simulation-bases.md §6 — calibration
      noise_std: 0.01             # Source: simulation-bases.md §6 — calibration
      custom_state_hot_limit: 3   # Source: infrastructure
  persona: !include persona.yml

rule_endowed_holder:
  name: "EndowedHolder"
  class: "examples.EndowmentEffect.Rule.players:EndowedHolder"
  num_instances: 2
  config:
    identity: "rule_endowed_holder"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/EndowmentEffect/Rule/records"  # Source: infrastructure
      initial_cash: 800000.0      # Source: simulation-bases.md §4.1 — endowed holder capitalization
      initial_position: 500       # Source: simulation-bases.md §4.1 — initial endowment
      endowment_premium: 0.15     # Source: simulation-bases.md §6 — Kahneman et al. (1990) WTA/WTP gap
      sell_reluctance: 0.30       # Source: simulation-bases.md §6 — Shefrin & Statman (1985) disposition reluctance
      base_size: 300              # Source: simulation-bases.md §4.1 — order size cap
      custom_state_hot_limit: 3   # Source: infrastructure
  persona: !include persona.yml

rule_status_quo_seller:
  name: "StatusQuoSeller"
  class: "examples.EndowmentEffect.Rule.players:StatusQuoSeller"
  num_instances: 2
  config:
    identity: "rule_status_quo_seller"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/EndowmentEffect/Rule/records"  # Source: infrastructure
      initial_cash: 800000.0      # Source: simulation-bases.md §4.2 — status quo seller capitalization
      initial_position: 500       # Source: simulation-bases.md §4.2 — initial endowment
      status_quo_threshold: 0.20  # Source: simulation-bases.md §6 — Samuelson & Zeckhauser (1988) switching cost
      base_size: 300              # Source: simulation-bases.md §4.2 — order size cap
      custom_state_hot_limit: 3   # Source: infrastructure
  persona: !include persona.yml

rule_rational_arbitrageur:
  name: "RationalArbitrageur"
  class: "examples.EndowmentEffect.Rule.players:RationalArbitrageur"
  num_instances: 2
  config:
    identity: "rule_rational_arbitrageur"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/EndowmentEffect/Rule/records"  # Source: infrastructure
      initial_cash: 1000000.0     # Source: simulation-bases.md §4.3 — arbitrageur capitalization
      initial_position: 0         # Source: simulation-bases.md §4.3 — enters unendowed
      arb_threshold: 0.05         # Source: simulation-bases.md §6 — Muth (1961) rational threshold
      base_size: 400              # Source: simulation-bases.md §4.3 — proportional order cap
      custom_state_hot_limit: 3   # Source: infrastructure
  persona: !include persona.yml

rule_new_buyer:
  name: "NewBuyer"
  class: "examples.EndowmentEffect.Rule.players:NewBuyer"
  num_instances: 2
  config:
    identity: "rule_new_buyer"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/EndowmentEffect/Rule/records"  # Source: infrastructure
      initial_cash: 1000000.0     # Source: simulation-bases.md §4.4 — new buyer capitalization
      initial_position: 0         # Source: simulation-bases.md §4.4 — enters unendowed
      buy_threshold: 0.03         # Source: simulation-bases.md §6 — Kahneman et al. (1990) WTP at fundamental
      base_size: 300              # Source: simulation-bases.md §4.4 — order size cap
