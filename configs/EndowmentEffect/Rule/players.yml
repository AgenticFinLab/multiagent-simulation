# EndowmentEffect Rule Agent Configuration

market:
  name: "Market"
  class: "examples.EndowmentEffect.Rule.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/EndowmentEffect/Rule/records"
      initial_price: 100.0
      fundamental_value: 100.0
      price_impact: 0.02
      mean_reversion: 0.05
      noise_std: 0.01
      custom_state_hot_limit: 3
  persona: !include persona.yml

rule_endowed_holder:
  name: "EndowedHolder"
  class: "examples.EndowmentEffect.Rule.players:EndowedHolder"
  num_instances: 2
  config:
    identity: "rule_endowed_holder"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/EndowmentEffect/Rule/records"
      initial_cash: 800000.0
      initial_position: 500
      endowment_premium: 0.15
      sell_reluctance: 0.30       # Fraction of position sold per trade (§4.1.6)
      base_size: 300
      custom_state_hot_limit: 3
  persona: !include persona.yml

rule_status_quo_seller:
  name: "StatusQuoSeller"
  class: "examples.EndowmentEffect.Rule.players:StatusQuoSeller"
  num_instances: 2
  config:
    identity: "rule_status_quo_seller"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/EndowmentEffect/Rule/records"
      initial_cash: 800000.0
      initial_position: 500
      status_quo_threshold: 0.20  # Deviation threshold to sell (§4.2.4)
      base_size: 300
      custom_state_hot_limit: 3
  persona: !include persona.yml

rule_rational_arbitrageur:
  name: "RationalArbitrageur"
  class: "examples.EndowmentEffect.Rule.players:RationalArbitrageur"
  num_instances: 2
  config:
    identity: "rule_rational_arbitrageur"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/EndowmentEffect/Rule/records"
      initial_cash: 1000000.0
      initial_position: 0
      arb_threshold: 0.05
      base_size: 400
      custom_state_hot_limit: 3
  persona: !include persona.yml

rule_new_buyer:
  name: "NewBuyer"
  class: "examples.EndowmentEffect.Rule.players:NewBuyer"
  num_instances: 2
  config:
    identity: "rule_new_buyer"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/EndowmentEffect/Rule/records"
      initial_cash: 1000000.0
      initial_position: 0
      buy_threshold: 0.03
      base_size: 300
      custom_state_hot_limit: 3
  persona: !include persona.yml

rule_noise_trader:
  name: "NoiseTrader"
  class: "examples.EndowmentEffect.Rule.players:NoiseTrader"
  num_instances: 1
  config:
    identity: "rule_noise_trader"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/EndowmentEffect/Rule/records"
      initial_cash: 500000.0
      initial_position: 0
      trade_probability: 0.3
      noise_size: 150
      custom_state_hot_limit: 3
  persona: !include persona.yml
