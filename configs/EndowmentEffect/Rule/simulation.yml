# EndowmentEffect Rule Simulation Configuration
#
# EndowmentEffect simulation
#
# Usage:
#   python examples/EndowmentEffect/Rule/run_endowmenteffect_rule.py \
#       -c configs/EndowmentEffect/Rule/simulation.yml

setting:
  name: "EndowmentEffect-Rule"
  description: "EndowmentEffect simulation - Rule agents"
  total_rounds: 200

  record_path: "EXPERIMENT/EndowmentEffect/Rule/records"
  storage_path: "EXPERIMENT/EndowmentEffect/Rule/communication"

  log_level: "INFO"
  log_to_file: true
  log_path: "EXPERIMENT/EndowmentEffect/Rule/logs"

environment:
  dotenv_path: ".env"
  workspace: "."

ray:
  namespace: "endowmenteffect_rule"
  ignore_reinit_error: true
  object_store_memory: 536870912
  num_cpus: 4

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/EndowmentEffect/Rule/communication"
  record_messages: true
  message_timeout_ms: 5000
  max_retries: 3
