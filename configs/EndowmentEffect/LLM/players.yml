llm_rational_arbitrageur:
  name: "RationalArbitrageur"
  class: "examples.EndowmentEffect.LLM.players:LLMRationalArbitrageur"
  num_instances: 2
  config:
    identity: "llm_rational_arbitrageur"
    role: player
    steps_per_turn: 1
