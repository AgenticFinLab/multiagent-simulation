llm_noise_trader:
  name: "NoiseTrader"
  class: "examples.EndowmentEffect.LLM.players:LLMNoiseTrader"
  num_instances: 1
  config:
    identity: "llm_noise_trader"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/EndowmentEffect/LLM/records"  # Source: infrastructure
      initial_cash: 500000.0      # Source: simulation-bases.md §4.5 — noise trader capitalization
      initial_position: 0         # Source: simulation-bases.md §4.5 — enters unendowed
      trade_probability: 0.3      # Source: simulation-bases.md §6 — Black (1986) 30% per-round
      noise_size: 150             # Source: simulation-bases.md §4.5 — random order size bound
      base_size: 150              # Source: simulation-bases.md §4.5 — order size cap
      custom_state_hot_limit: 3   # Source: infrastructure
      llm:                        # Source: LLM-wiring
        sys_message: "examples.EndowmentEffect.LLM.prompts:LLM_NOISE_TRADER_SYS"  # Source: LLM-wiring
        user_message: "examples.EndowmentEffect.LLM.prompts:LLM_USER_TEMPLATE"    # Source: LLM-wiring
        lm_type: "api"            # Source: LLM-wiring
        lm_name: "ark/doubao-seed-2-0-mini-260428"  # Source: LLM-wiring
        max_retries: 3            # Source: LLM-wiring
        generation_config:        # Source: LLM-wiring
          temperature: 0.9        # Source: LLM-wiring — high temp for random persona
          max_tokens: 512         # Source: LLM-wiring
  persona: !include persona.yml
