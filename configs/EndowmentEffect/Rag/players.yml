# EndowmentEffect Rag Agent Configuration

knowledge:
  backend: "local"
  global_uri: "examples/document-sources"
  resource_csv:
    - "examples/document-sources/books.csv"
    - "examples/document-sources/source"
  preprocessing:
    parser: "mineru"
    output_position: "MinerU_processed"
  rag:
    output_position: "rag_index"
    embed_type: "litellm"
    embed_model: "openai/hunyuan-embedding"
    embed_api_key: "{{ HUNYUAN_API_KEY }}"
    embed_api_base: "https://api.hunyuan.cloud.tencent.com/v1"
    chunk_size: 512  # Source: retrieval operational contract; Rag/explain.md §4
    chunk_overlap: 64  # Source: retrieval operational contract; Rag/explain.md §4
    top_k: 5  # Source: retrieval coverage contract; Rag/analysis.md §2

market:
  name: "Market"
  class: "examples.EndowmentEffect.Rag.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/EndowmentEffect/Rag/records"
      initial_price: 100.0  # Source: cross-variant calibration; simulation-bases.md §3.1
      fundamental_value: 100.0  # Source: simulation-bases.md §6
      price_impact: 0.02  # Source: cross-variant calibration; simulation-bases.md §3.1
      mean_reversion: 0.05  # Source: cross-variant calibration; simulation-bases.md §3.1
      noise_std: 0.01  # Source: cross-variant calibration; simulation-bases.md §3.1
      custom_state_hot_limit: 3  # Source: operational history window; analysis-bases.md §4
  persona: !include persona.yml

endowedholder:
  name: "EndowedHolder"
  class: "examples.EndowmentEffect.Rag.players:RagLLMEndowedHolder"
  num_instances: 2
  config:
    identity: "endowedholder"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/EndowmentEffect/Rag/records"
      initial_cash: 800000.0  # Source: initial portfolio calibration; simulation-bases.md §4.1
      initial_position: 500  # Source: endowed inventory; simulation-bases.md §4.1
      endowment_premium: 0.15  # Source: simulation-bases.md §4.1 and §6
      base_size: 300  # Source: order-size calibration; simulation-bases.md §4.1.7
      custom_state_hot_limit: 3  # Source: operational history window; analysis-bases.md §4
      llm:
        sys_message: "examples.EndowmentEffect.Rag.prompts:RAG_ENDOWED_HOLDER_SYS"
        user_message: "examples.EndowmentEffect.Rag.prompts:RAG_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        max_retries: 3  # Source: bounded inference retry policy; Rag/explain.md §4
        generation_config:
          temperature: 0.6  # Source: role deliberation setting; simulation-bases.md §4.1
          max_tokens: 512  # Source: tagged-response budget; Rag/explain.md §4
      private_knowledge:
        from_global_resources:
          - "MinerU_processed"
        local_resources:
          local_uri: ""
          local_resources: []
        rag:
          from_global_index_dir:
            - "rag_index"
          local_index_dir: ""
          embed_type: "litellm"
          embed_model: "openai/hunyuan-embedding"
          embed_api_key: "{{ HUNYUAN_API_KEY }}"
          embed_api_base: "https://api.hunyuan.cloud.tencent.com/v1"
          chunk_size: 512  # Source: retrieval operational contract; Rag/explain.md §4
          chunk_overlap: 64  # Source: retrieval operational contract; Rag/explain.md §4
          top_k: 5  # Source: retrieval coverage contract; Rag/analysis.md §2
  persona: !include persona.yml

