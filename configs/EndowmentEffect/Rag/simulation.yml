# EndowmentEffect Rag Simulation Configuration
#
# EndowmentEffect simulation
#
# Usage:
#   python examples/EndowmentEffect/Rag/run_endowmenteffect_rag.py \
#       -c configs/EndowmentEffect/Rag/simulation.yml

setting:
  name: "EndowmentEffect-Rag"
  description: "EndowmentEffect simulation - Rag agents"
  total_rounds: 200

  record_path: "EXPERIMENT/EndowmentEffect/Rag/records"
  storage_path: "EXPERIMENT/EndowmentEffect/Rag/communication"

  log_level: "INFO"
  log_to_file: true
  log_path: "EXPERIMENT/EndowmentEffect/Rag/logs"

environment:
  dotenv_path: ".env"
  workspace: "."

ray:
  namespace: "endowmenteffect_rag"
  ignore_reinit_error: true
  object_store_memory: 536870912
  num_cpus: 4

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/EndowmentEffect/Rag/communication"
  record_messages: true
  message_timeout_ms: 5000
  max_retries: 3
