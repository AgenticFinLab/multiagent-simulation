# =============================================================================
# Persona Configuration (LLM-Based)
# =============================================================================
# Shared persona settings for all players in LLM scenarios.
# Reference: AssetBubbleLLM/, HerdEffectLLM/
# =============================================================================

# Checkpoint settings
auto_checkpoint: false                        # Auto-save player state
debug_mode: true                              # Enable debug logging

# -----------------------------------------------------------------------------
# Proxy Configurations
# -----------------------------------------------------------------------------
proxy:
  # =================================
  # Storage Proxy
  # =================================
  storage:
    checkpoint_dir: "EXPERIMENT/[SCENARIO_NAME]LLM/checkpoints"
    record_path: "EXPERIMENT/[SCENARIO_NAME]LLM/records"
    record_rounds: true                       # Record data each round
  
  # =================================
  # Monitoring Proxy
  # =================================
  monitoring:
    record_path: "EXPERIMENT/[SCENARIO_NAME]LLM/monitoring"
    entry_limit: 10                           # Max monitoring entries
  
  # =================================
  # Communication Proxy
  # =================================
  communication:
    message_timeout_ms: 10000                 # Longer timeout for LLM responses
    enable_compression: true                  # Compress messages
  
  # =================================
  # Resource Proxy (for MCP servers, external APIs)
  # =================================
  resource:
    mcp_servers: []                           # MCP server configurations
    enable_caching: false                     # Cache resource responses
