# =============================================================================
# Persona Configuration (LLM-Based)
# =============================================================================
# Shared persona settings for all players in LLM scenarios.
# Reference: AssetBubbleLLM/, HerdEffectLLM/
# =============================================================================

# Checkpoint settings
# Auto-save player state each round
auto_checkpoint: false
# Enable debug logging
debug_mode: true

# -----------------------------------------------------------------------------
# Proxy Configurations
# -----------------------------------------------------------------------------
proxy:
  # =================================
  # Storage Proxy
  # =================================
  storage:
    checkpoint_dir: "EXPERIMENT/[SCENARIO_NAME]LLM/checkpoints"
    record_path: "EXPERIMENT/[SCENARIO_NAME]LLM/records"
    # Record turn data to disk each round
    record_rounds: true
    # Entries per block file written to disk (turns/ and messages/).
    # Older blocks are kept on disk; only the latest block stays in memory.
    turn_block_size: 3
  
  # =================================
  # Monitoring Proxy
  # =================================
  monitoring:
    record_path: "EXPERIMENT/[SCENARIO_NAME]LLM/monitoring"
    # Max monitoring entries (metrics/events) kept in hot RAM before spilling to disk
    monitor_hot_limit: 3
  
  # =================================
  # Communication Proxy
  # =================================
  communication:
    # Message send/receive timeout in milliseconds (longer for LLM inference latency)
    message_timeout_ms: 10000
    # Compress messages in transit
    enable_compression: true
  
  # =================================
  # Resource Proxy (for MCP servers, external APIs)
  # =================================
  resource:
    # MCP server configurations (list of {name, endpoint, capabilities})
    mcp_servers: []
    # Cache resource responses to reduce repeated API calls
    enable_caching: false
