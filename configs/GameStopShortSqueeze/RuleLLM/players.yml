# GameStopShortSqueeze RuleLLM Agent Configuration

market:
  name: "Market"
  class: "examples.GameStopShortSqueeze.RuleLLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/GameStopShortSqueeze/RuleLLM/records"
      initial_price: 20.0
      fundamental_value: 20.0
      price_impact: 0.04
      mean_reversion: 0.01
      noise_std: 0.02
      initial_short_interest: 1.5
      custom_state_hot_limit: 3
  persona: !include persona.yml

retailcoordinated:
  name: "RetailCoordinated"
  class: "examples.GameStopShortSqueeze.RuleLLM.players:RuleLLMRetailCoordinated"
  num_instances: 3
  config:
    identity: "retailcoordinated"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/GameStopShortSqueeze/RuleLLM/records"
      initial_cash: 500000.0
      initial_position: 100
      initial_price: 20.0
      fundamental_value: 20.0
      custom_state_hot_limit: 3
      llm:
        sys_message: "examples.GameStopShortSqueeze.RuleLLM.prompts:RULELLM_RETAIL_COORDINATED_SYS"
        user_message: "examples.GameStopShortSqueeze.RuleLLM.prompts:RULELLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.5
          max_tokens: 512
  persona: !include persona.yml

