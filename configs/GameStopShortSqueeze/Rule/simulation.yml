# GameStopShortSqueeze Rule Simulation Configuration
#
# January 2021 GameStop short squeeze - Reddit coordination drove 1,700% price increase
#
# Usage:
#   python examples/GameStopShortSqueeze/Rule/run_gamestopshortsqueeze.py \
#       -c configs/GameStopShortSqueeze/Rule/simulation.yml

setting:
  name: "GameStopShortSqueeze-Rule"
  description: "GameStop short squeeze simulation with retail coordination, gamma exposure, and social media-driven trading"
  total_rounds: 200
  
  record_path: "EXPERIMENT/GameStopShortSqueeze/Rule/records"
  storage_path: "EXPERIMENT/GameStopShortSqueeze/Rule/communication"
  
  log_level: "INFO"
  log_to_file: true
  log_path: "EXPERIMENT/GameStopShortSqueeze/Rule/logs"

environment:
  dotenv_path: ".env"
  workspace: "."

ray:
  namespace: "gamestopshortsqueeze_rule"
  ignore_reinit_error: true
  object_store_memory: 536870912
  num_cpus: 4

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/GameStopShortSqueeze/Rule/communication"
  record_messages: true
  message_timeout_ms: 5000
  max_retries: 3
