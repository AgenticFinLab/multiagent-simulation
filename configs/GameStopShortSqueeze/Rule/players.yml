# GameStopShortSqueeze Rule Agent Configuration

market:
  name: "Market"
  class: "examples.GameStopShortSqueeze.Rule.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    extras:
      initial_price: 20.0
      fundamental_value: 20.0
      price_impact: 0.03
      mean_reversion: 0.01
      noise_std: 0.03

retail_coordinated_1:
  name: "RetailCoordinated 1"
  class: "examples.GameStopShortSqueeze.Rule.players:RetailCoordinated"
  num_instances: 2
  config:
    identity: "retail_coordinated_1"
    role: player
    extras:
      initial_cash: 1000000.00
      initial_position: 0

short_seller_h_f_2:
  name: "ShortSellerHF 2"
