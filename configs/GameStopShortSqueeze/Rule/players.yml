# GameStopShortSqueeze Rule Agent Configuration

market:
  archetype: stock-standard-price-impact  # -> masim/agents/defines/market/stock-standard-price-impact.md
  name: "Market"
  class: "examples.GameStopShortSqueeze.Rule.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/GameStopShortSqueeze/Rule/records"  # Source: framework infrastructure
      initial_price: 20.0  # Source: simulation-bases.md §6
      fundamental_value: 20.0  # Source: simulation-bases.md §6
      price_impact: 0.04  # Source: simulation-bases.md §6
      mean_reversion: 0.01  # Source: simulation-bases.md §6
      noise_std: 0.02  # Source: simulation-bases.md §6
      initial_short_interest: 1.5  # Source: simulation-bases.md §6
      custom_state_hot_limit: 3  # Source: framework infrastructure
  persona: !include persona.yml

