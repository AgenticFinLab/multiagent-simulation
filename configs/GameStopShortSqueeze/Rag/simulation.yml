# GameStopShortSqueeze Rag Simulation Configuration
#
# January 2021 GameStop short squeeze - Reddit coordination drove 1,700% price increase
#
# Usage:
#   python examples/GameStopShortSqueeze/Rag/run_gamestopshortsqueeze_rag.py \
#       -c configs/GameStopShortSqueeze/Rag/simulation.yml

setting:
  name: "GameStopShortSqueeze-Rag"
  description: "GameStop short squeeze simulation with retail coordination, gamma exposure, and social media-driven trading"
  total_rounds: 200
  
  record_path: "EXPERIMENT/GameStopShortSqueeze/Rag/records"
  storage_path: "EXPERIMENT/GameStopShortSqueeze/Rag/communication"
  
  log_level: "INFO"
  log_to_file: true
  log_path: "EXPERIMENT/GameStopShortSqueeze/Rag/logs"

environment:
  dotenv_path: ".env"
  workspace: "."

llm:
  model: "doubao-pro-32k"
  temperature: 0.3
  max_tokens: 500
  timeout: 30

ray:
  namespace: "gamestopshortsqueeze_rag"
  ignore_reinit_error: true
  object_store_memory: 536870912
  num_cpus: 4

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/GameStopShortSqueeze/Rag/communication"
  record_messages: true
  message_timeout_ms: 30000
  max_retries: 3
