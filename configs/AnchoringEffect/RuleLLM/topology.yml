# =============================================================================
# AnchoringEffectRuleLLM Topology - Star Pattern
# =============================================================================
# Market as hub, all hybrid rule+LLM investors communicate through market.
#
# Note: player keys with num_instances > 1 use their base key here.
# The simulator expander resolves them to foo_1, foo_2, ... before building
# the TopologyGraph, so all edge rules apply to every instance automatically.
#
#         rulellm_anchored ─────────────┐
#         rulellm_historical ───────────┤
#         rulellm_rational ─────────────┼──▶ market ──▶ all investors
#         rulellm_momentum ─────────────┤             (market data: price, deviation)
#         rulellm_noise ────────────────┘
#
# Execution flow per round:
#   Level 0: market executes (broadcasts price + deviation metrics)
#   Level 1: all investors execute in parallel (submit P,Q orders)
# =============================================================================

type: "star"

sources:
  - market

connections:
  # Market → All investors (price + deviation data broadcast)
  market:
    - rulellm_anchored
    - rulellm_historical
    - rulellm_rational
    - rulellm_momentum
    - rulellm_noise

  # Each investor → Market only (order submission)
  rulellm_anchored:
    - market

  rulellm_historical:
    - market

  rulellm_rational:
    - market

  rulellm_momentum:
    - market

  rulellm_noise:
    - market
