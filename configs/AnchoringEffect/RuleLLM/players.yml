# -----------------------------------------------------------------------------
# Hybrid Disposition Traders (Prospect-Theory persona + asymmetric cost-basis rule)
# Theory: Shefrin & Statman (1985); Kahneman & Tversky (1979)
# Rule: gain_pct = (P - cost_basis) / cost_basis;
#       sell if gain_pct > 0.04, buy if gain_pct < -0.016;
#       quantity = min(15, abs(gain_pct) * 500)
# -----------------------------------------------------------------------------
rulellm_disposition:
  name: "RuleLLM Disposition Trader"
  class: "examples.AnchoringEffect.RuleLLM.players:RuleLLMDispositionTrader"
  # Expander → rulellm_disposition_1, rulellm_disposition_2
  num_instances: 2
  config:
    identity: "rulellm_disposition"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/AnchoringEffect/RuleLLM/records"
      initial_cash: 10000.0
      initial_position: 100.0
      custom_state_hot_limit: 3
      # Rule parameters (from AnchoringEffect DispositionTrader)
      gain_threshold: 0.04
      loss_aversion_mult: 2.5
      base_position_size: 15.0
      llm:
        sys_message: "examples.AnchoringEffect.RuleLLM.prompts:RULELLM_DISPOSITION_TRADER_SYS"
        user_message: "examples.AnchoringEffect.RuleLLM.prompts:RULELLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.7
          max_tokens: 512
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Hybrid Contrarian Trader (Mean-reversion persona + cumulative-return rule)
# Theory: De Bondt & Thaler (1985); Jegadeesh (1990)
# Rule: cum_return over 10-round lookback;
#       sell if cum_return > 0.05, buy if cum_return < -0.05;
#       quantity = min(20, abs(cum_return) * 400)
# -----------------------------------------------------------------------------
rulellm_contrarian:
  name: "RuleLLM Contrarian Trader"
  class: "examples.AnchoringEffect.RuleLLM.players:RuleLLMContrarianTrader"
  num_instances: 1
  config:
    identity: "rulellm_contrarian"
