      custom_state_hot_limit: 3
      # Rule parameters (from AnchoringEffect NoiseTrader)
      trade_probability: 0.05
      min_order: 100.0
      max_order: 500.0
      llm:
        sys_message: "examples.AnchoringEffect.RuleLLM.prompts:RULELLM_NOISE_SYS"
