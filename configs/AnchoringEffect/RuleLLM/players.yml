# AnchoringEffect RuleLLM Agent Configuration

market:
  name: "Market"
  class: "examples.AnchoringEffect.RuleLLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    extras:
      initial_price: 100.0
      fundamental_value: 100.0
      price_impact: 0.04
      mean_reversion: 0.02
      noise_std: 0.02

anchored_trader_1:
  name: "AnchoredTrader 1"
  class: "examples.AnchoringEffect.RuleLLM.players:LLMAnchoredTrader"
  num_instances: 2
  config:
    identity: "anchored_trader_1"
    role: player
    extras:
      initial_cash: 1000000.00
      initial_position: 0
      agent_type: "anchored_trader"
      llm:
        model: "doubao-pro-32k"


