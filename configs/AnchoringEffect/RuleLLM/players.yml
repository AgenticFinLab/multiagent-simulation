# =============================================================================
# AnchoringEffectRuleLLM Players Configuration
# =============================================================================
# 1 Market (rule-based) + 12 Hybrid Rule+LLM investor instances across 9 personas
# aligned with simulation-bases.md §4.1–§4.9.
# Each LLM agent's system prompt embeds:
#   - == PERSONA ==: identity, style, behavioral traits (from LLM variant)
#   - == DECISION RULES ==: exact quantitative formulas mirroring the Rule variant
# =============================================================================

# -----------------------------------------------------------------------------
# Market (Coordinator) — rule-based, identical to Rule variant
# -----------------------------------------------------------------------------
market:
  name: "Market"
  class: "examples.AnchoringEffect.RuleLLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/AnchoringEffect/RuleLLM/records"
      # Market dynamics parameters (identical to Rule variant)
      fundamental_value: 100.0
      initial_price: 105.0
      price_impact: 0.01        # Low: anchoring effect slows price discovery
      mean_reversion: 0.01      # Low: sustains anchoring persistence
      noise_std: 0.5            # Moderate price noise
      custom_state_hot_limit: 3
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Hybrid Anchored Traders (Anchor persona + explicit anchor formula)
# Theory: Tversky & Kahneman (1974) — Anchoring and Insufficient Adjustment
# Rule: perceived = anchor + (F - anchor) * 0.3
# -----------------------------------------------------------------------------
rulellm_anchored:
  name: "RuleLLM Anchored Trader"
  class: "examples.AnchoringEffect.RuleLLM.players:RuleLLMAnchoredTrader"
  # Expander → rulellm_anchored_1, rulellm_anchored_2
  num_instances: 2
  config:
    identity: "rulellm_anchored"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/AnchoringEffect/RuleLLM/records"
      initial_cash: 10000.0
      initial_position: 100.0
      custom_state_hot_limit: 3
      # Rule parameters (from AnchoringEffect AnchoredTrader)
      adjustment_factor: 0.3
      base_position_size: 20.0
      llm:
        sys_message: "examples.AnchoringEffect.RuleLLM.prompts:RULELLM_ANCHORED_TRADER_SYS"
        user_message: "examples.AnchoringEffect.RuleLLM.prompts:RULELLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.7
          max_tokens: 512
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Hybrid Historical Anchors (Historical anchor persona + historical avg formula)
# Theory: Northcraft & Neale (1987) — Experts anchor to past prices
# Rule: perceived_dev = (price - hist_avg) / hist_avg * (1 - 0.5)
# -----------------------------------------------------------------------------
rulellm_historical:
  name: "RuleLLM Historical Anchor"
  class: "examples.AnchoringEffect.RuleLLM.players:RuleLLMHistoricalAnchor"
  # Expander → rulellm_historical_1, rulellm_historical_2
  num_instances: 2
  config:
    identity: "rulellm_historical"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/AnchoringEffect/RuleLLM/records"
      initial_cash: 10000.0
      initial_position: 100.0
      custom_state_hot_limit: 3
      # Rule parameters (from AnchoringEffect HistoricalAnchor)
      anchor_weight: 0.5
      lookback: 60
      base_position_size: 20.0
      llm:
        sys_message: "examples.AnchoringEffect.RuleLLM.prompts:RULELLM_HISTORICAL_ANCHOR_SYS"
        user_message: "examples.AnchoringEffect.RuleLLM.prompts:RULELLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.7
          max_tokens: 512
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Hybrid Rational Updater (Rational persona + full Bayesian adjustment rule)
# Rule: deviation = (price - F) / F; trade when |dev| > 2%
# -----------------------------------------------------------------------------
rulellm_rational:
  name: "RuleLLM Rational Updater"
