      base_position_size: 20.0
      llm:
        sys_message: "examples.AnchoringEffect.RuleLLM.prompts:RULELLM_CONTRARIAN_TRADER_SYS"
        user_message: "examples.AnchoringEffect.RuleLLM.prompts:RULELLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.7
          max_tokens: 512
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Hybrid Fundamental Analyst (Conservatism persona + slow-updating belief rule)
# Theory: Barberis, Shleifer & Vishny (1998)
# Rule: belief_new = 0.95 * belief_prev + 0.05 * fundamental;
#       dev = (P - belief) / belief; trade when |dev| > 0.02;
#       quantity = min(25, abs(dev) * 1000)
# -----------------------------------------------------------------------------
rulellm_fundamental:
  name: "RuleLLM Fundamental Analyst"
  class: "examples.AnchoringEffect.RuleLLM.players:RuleLLMFundamentalAnalyst"
  num_instances: 1
  config:
    identity: "rulellm_fundamental"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/AnchoringEffect/RuleLLM/records"
      initial_cash: 10000.0
      initial_position: 100.0
      custom_state_hot_limit: 3
      # Rule parameters (from AnchoringEffect FundamentalAnalyst)
      learning_rate: 0.05
      base_position_size: 25.0
      llm:
        sys_message: "examples.AnchoringEffect.RuleLLM.prompts:RULELLM_FUNDAMENTAL_ANALYST_SYS"
        user_message: "examples.AnchoringEffect.RuleLLM.prompts:RULELLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.5
          max_tokens: 512
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Hybrid Liquidity Provider (Passive market-maker persona + EMA quoting rule)
# Theory: Glosten & Milgrom (1985); Hendershott et al. (2011)
# Rule: alpha = 2/21; ema_t = alpha*P + (1-alpha)*ema_{t-1};
#       fair_quote = 0.5*(P + ema); band = 0.015 * fair_quote;
#       quantity = min(30, dev * 2000)
# -----------------------------------------------------------------------------
rulellm_liquidity:
  name: "RuleLLM Liquidity Provider"
  class: "examples.AnchoringEffect.RuleLLM.players:RuleLLMLiquidityProvider"
  num_instances: 1
  config:
    identity: "rulellm_liquidity"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/AnchoringEffect/RuleLLM/records"
      initial_cash: 15000.0
      initial_position: 150.0
      custom_state_hot_limit: 3
      # Rule parameters (from AnchoringEffect LiquidityProvider)
      ema_window: 20
      half_spread: 0.015
      base_position_size: 30.0
      llm:
        sys_message: "examples.AnchoringEffect.RuleLLM.prompts:RULELLM_LIQUIDITY_PROVIDER_SYS"
        user_message: "examples.AnchoringEffect.RuleLLM.prompts:RULELLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.5
          max_tokens: 512
  persona: !include persona.yml
