# AnchoringEffect RuleLLM Simulation Configuration
#
# Anchoring causes traders to insufficiently adjust from reference prices, creating slow price discovery
#
# Usage:
#   python examples/AnchoringEffect/RuleLLM/run_anchoringeffect_rulellm.py \
#       -c configs/AnchoringEffect/RuleLLM/simulation.yml

setting:
  name: "AnchoringEffect-RuleLLM"
  description: "Anchoring effect simulation demonstrating how initial reference points bias subsequent judgments"
  total_rounds: 200
  
  record_path: "EXPERIMENT/AnchoringEffect/RuleLLM/records"
  storage_path: "EXPERIMENT/AnchoringEffect/RuleLLM/communication"
  
  log_level: "INFO"
  log_to_file: true
  log_path: "EXPERIMENT/AnchoringEffect/RuleLLM/logs"

environment:
  dotenv_path: ".env"
  workspace: "."

llm:
  model: "doubao-pro-32k"
  temperature: 0.3
  max_tokens: 500
  timeout: 30

ray:
  namespace: "anchoringeffect_rulellm"
  ignore_reinit_error: true
  object_store_memory: 536870912
  num_cpus: 4

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/AnchoringEffect/RuleLLM/communication"
  record_messages: true
  message_timeout_ms: 30000
  max_retries: 3
