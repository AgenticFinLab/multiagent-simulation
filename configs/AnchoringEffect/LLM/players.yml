# =============================================================================
# AnchoringEffectLLM Players Configuration
# =============================================================================
# 1 Market (rule-based) + 5 LLM Investor types with anchoring-bias personas.
# Each LLM agent uses a system prompt persona from prompts.py.
# =============================================================================

# -----------------------------------------------------------------------------
# Market (Coordinator) — rule-based, identical to Rule variant
# -----------------------------------------------------------------------------
market:
  name: "Market"
  class: "examples.AnchoringEffect.LLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/AnchoringEffect/LLM/records"
      # Market dynamics parameters (identical to Rule variant)
      fundamental_value: 100.0
      initial_price: 105.0
      price_impact: 0.01        # Low: anchoring effect slows price discovery
      mean_reversion: 0.01      # Low: sustains anchoring persistence
      noise_std: 0.5            # Moderate price noise
      custom_state_hot_limit: 3
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Anchored Traders — LLM with anchoring persona
# Theory: Tversky & Kahneman (1974) — Anchoring and Insufficient Adjustment
# -----------------------------------------------------------------------------
anchored_trader:
  name: "Anchored Trader"
  class: "examples.AnchoringEffect.LLM.players:LLMAnchoredTrader"
  # Expander → anchored_trader_1, anchored_trader_2
  num_instances: 2
  config:
    identity: "anchored_trader"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/AnchoringEffect/LLM/records"
      initial_cash: 10000.0
      initial_position: 0.0
      custom_state_hot_limit: 3
      llm:
        sys_message: "examples.AnchoringEffect.LLM.prompts:LLM_ANCHORED_TRADER_SYS"
        user_message: "examples.AnchoringEffect.LLM.prompts:LLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.7
          max_tokens: 512
  persona: !include persona.yml

