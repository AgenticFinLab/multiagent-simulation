# =============================================================================
# AnchoringEffectLLM Players Configuration
# =============================================================================
# 1 Market (rule-based) + 14 LLM investor instances across 9 personas
# aligned with simulation-bases.md §4.1–§4.9.
# Each LLM agent uses a system prompt persona from prompts.py.
# =============================================================================

# -----------------------------------------------------------------------------
# Market (Coordinator) — rule-based, identical to Rule variant
# -----------------------------------------------------------------------------
market:
  archetype: stock-standard-price-impact  # -> masim/agents/defines/market/stock-standard-price-impact.md
  name: "Market"
  class: "examples.AnchoringEffect.LLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/AnchoringEffect/LLM/records"  # Source: implementation infrastructure (record path convention per 07-step3-config.md §3.7)
      # Market dynamics parameters (identical to Rule variant)
      fundamental_value: 100.0  # Source: target §9 F; simulation-bases.md §3.1 (normalization, 100-scale index)
      initial_price: 105.0  # Source: target §9 P0; simulation-bases.md §3.1 (5% above F, IPO-anchor seed)
      price_impact: 0.01        # Low: anchoring effect slows price discovery
      mean_reversion: 0.01      # Low: sustains anchoring persistence
      noise_std: 0.5            # Moderate price noise
      custom_state_hot_limit: 3  # Source: implementation infrastructure (hot-state ring buffer per masim.core state contract)
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Anchored Traders — LLM with anchoring persona
# Theory: Tversky & Kahneman (1974) — Anchoring and Insufficient Adjustment
# -----------------------------------------------------------------------------
llm_anchored_trader:
  name: "Anchored Trader"
  class: "examples.AnchoringEffect.LLM.players:LLMAnchoredTrader"
  # Expander → llm_anchored_trader_1, llm_anchored_trader_2
  num_instances: 2
  config:
    identity: "llm_anchored_trader"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/AnchoringEffect/LLM/records"  # Source: implementation infrastructure (record path convention per 07-step3-config.md §3.7)
      initial_cash: 10000.0  # Source: target §9 C0; portfolio normalization (10000-scale)
      initial_position: 100.0  # Source: target §9 Q0; portfolio normalization (100-share seed)
      adjustment_factor: 0.3  # Source: target §9 alpha; Tversky & Kahneman (1974) https://doi.org/10.1126/science.185.4157.1124
      custom_state_hot_limit: 3  # Source: implementation infrastructure (hot-state ring buffer per masim.core state contract)
      llm:
        sys_message: "examples.AnchoringEffect.LLM.prompts:LLM_ANCHORED_TRADER_SYS"  # Source: LLM wiring — persona system prompt (prompts.py)
        user_message: "examples.AnchoringEffect.LLM.prompts:LLM_USER_TEMPLATE"  # Source: LLM wiring — user-message template (prompts.py)
        lm_type: "api"  # Source: LLM wiring — OpenAI-style API adapter (masim.utils.llm_utils)
        lm_name: "ark/doubao-seed-2-0-mini-260428"  # Source: LLM wiring — ByteDance Doubao mini model endpoint
        generation_config:
          temperature: 0.7  # Source: LLM wiring — sampling temperature (persona-dependent)
          max_tokens: 512  # Source: LLM wiring — max response tokens
  persona: !include persona.yml

