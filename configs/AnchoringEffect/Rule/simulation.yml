# AnchoringEffect Rule Simulation Configuration
#
# Anchoring causes traders to insufficiently adjust from reference prices, creating slow price discovery
#
# Usage:
#   python examples/AnchoringEffect/Rule/run_anchoringeffect.py \
#       -c configs/AnchoringEffect/Rule/simulation.yml

setting:
  name: "AnchoringEffect-Rule"
  description: "Anchoring effect simulation demonstrating how initial reference points bias subsequent judgments"
  total_rounds: 200
  
  record_path: "EXPERIMENT/AnchoringEffect/Rule/records"
  storage_path: "EXPERIMENT/AnchoringEffect/Rule/communication"
  
  log_level: "INFO"
  log_to_file: true
  log_path: "EXPERIMENT/AnchoringEffect/Rule/logs"

environment:
  dotenv_path: ".env"
  workspace: "."

ray:
  namespace: "anchoringeffect_rule"
  ignore_reinit_error: true
  object_store_memory: 536870912
  num_cpus: 4

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/AnchoringEffect/Rule/communication"
  record_messages: true
  message_timeout_ms: 5000
  max_retries: 3
