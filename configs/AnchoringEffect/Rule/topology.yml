# =============================================================================
# AnchoringEffect Topology - Star Pattern
# =============================================================================
# Market as hub, all investors communicate through market.
#
# Note: player keys with num_instances > 1 use their base key here.
# The simulator expander resolves them to foo_1, foo_2, ... before building
# the TopologyGraph, so all edge rules apply to every instance automatically.
#
#         anchored_trader ────────────┐
#         historical_anchor ──────────┤
#         rational_updater ───────────┤
#         momentum_trader ────────────┤
#         noise_trader ───────────────┼──▶ market ──▶ all investors
#         disposition_trader ──────────┤             (market data: price, deviation)
#         contrarian_trader ───────────┤
#         fundamental_analyst ─────────┤
#         liquidity_provider ──────────┘
#
# Execution flow per round:
#   Level 0: market executes (broadcasts price + deviation metrics)
#   Level 1: all investors execute in parallel (submit P,Q orders)
#
# Total: 14 investors + 1 market coordinator = 15 players
# =============================================================================

type: "star"

sources:
  - market

connections:
  # Market → All investors (price + deviation data broadcast)
  market:
    - anchored_trader
    - historical_anchor
    - rational_updater
    - momentum_trader
    - noise_trader
    - disposition_trader
    - contrarian_trader
    - fundamental_analyst
    - liquidity_provider

  # Each investor → Market only (order submission)
  anchored_trader:
    - market

  historical_anchor:
    - market

  rational_updater:
    - market

  momentum_trader:
    - market

  noise_trader:
    - market

  disposition_trader:
    - market

  contrarian_trader:
    - market

  fundamental_analyst:
    - market

  liquidity_provider:
    - market
