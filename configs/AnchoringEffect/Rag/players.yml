# -----------------------------------------------------------------------------
# RAG Liquidity Provider — passive two-sided EMA quoting + RAG
# Theory: Glosten & Milgrom (1985); Hendershott et al. (2011)
# Rule: alpha = 2/21; ema_t = alpha*P + (1-alpha)*ema_{t-1};
#       fair_quote = 0.5*(P + ema); band = 0.015 * fair_quote;
#       quantity = min(30, dev * 2000)
# -----------------------------------------------------------------------------
ragllm_liquidity_provider:
  name: "RAG Liquidity Provider"
  class: "examples.AnchoringEffect.Rag.players:RagLLMLiquidityProvider"
  num_instances: 1
  config:
    identity: "ragllm_liquidity_provider"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      initial_cash: 15000.0  # Source: simulation-bases.md §4.9.7 (LP inventory buffer, 1.5x normalization)
      initial_position: 150.0  # Source: simulation-bases.md §4.9.7 (LP inventory, 1.5x share-normalization)
      custom_state_hot_limit: 3  # Source: implementation infrastructure (hot-state ring buffer per masim.core state contract)
      # Rule parameters (from AnchoringEffect LiquidityProvider)
      ema_window: 20  # Source: target §9 L_EMA; Hendershott, Jones & Menkveld (2011) https://doi.org/10.1111/j.1540-6261.2010.01624.x
      half_spread: 0.015  # Source: target §9 h; Huang & Stoll (1997) https://doi.org/10.1093/rfs/10.4.995
      base_position_size: 30.0  # Source: target §9 b; simulation-bases.md §6 (base-size normalization, highest for LP)
      private_knowledge:
        from_global_resources:
          - "MinerU_processed"
        local_resources:
          local_uri: ""
          local_resources: []
        rag:
          from_global_index_dir:
            - "rag_index"
          local_index_dir: ""
          embed_type: "litellm"
          embed_model: "openai/hunyuan-embedding"
          embed_api_key: "{{ HUNYUAN_API_KEY }}"
          embed_api_base: "https://api.hunyuan.cloud.tencent.com/v1"
          chunk_size: 512
          chunk_overlap: 64
          top_k: 5
      llm:
        sys_message: "examples.AnchoringEffect.Rag.prompts:RAG_LIQUIDITY_PROVIDER_SYS"  # Source: LLM wiring — persona system prompt (prompts.py)
        user_message: "examples.AnchoringEffect.Rag.prompts:RAG_USER_TEMPLATE"  # Source: LLM wiring — user-message template (prompts.py)
        lm_type: "api"  # Source: LLM wiring — OpenAI-style API adapter (masim.utils.llm_utils)
        lm_name: "ark/doubao-seed-2-0-mini-260428"  # Source: LLM wiring — ByteDance Doubao mini model endpoint
        generation_config:
          temperature: 0.3  # Source: LLM wiring — sampling temperature (persona-dependent)
          max_new_tokens: 600
  persona: !include persona.yml
