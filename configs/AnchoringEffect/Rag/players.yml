# -----------------------------------------------------------------------------
# RAG Disposition Traders — Prospect-Theory asymmetric cost-basis + RAG
# Theory: Shefrin & Statman (1985); Kahneman & Tversky (1979)
# Rule: gain_pct = (P - cost_basis) / cost_basis;
#       sell if gain_pct > 0.04, buy if gain_pct < -0.016;
#       quantity = min(15, abs(gain_pct) * 500)
# -----------------------------------------------------------------------------
ragllm_disposition_trader:
  name: "RAG Disposition Trader"
  class: "examples.AnchoringEffect.Rag.players:RagLLMDispositionTrader"
  # Expander → ragllm_disposition_trader_1, ragllm_disposition_trader_2
  num_instances: 2
  config:
    identity: "ragllm_disposition_trader"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      initial_cash: 10000.0  # Source: target §9 C0; portfolio normalization (10000-scale)
      initial_position: 100.0  # Source: target §9 Q0; portfolio normalization (100-share seed)
      custom_state_hot_limit: 3  # Source: implementation infrastructure (hot-state ring buffer per masim.core state contract)
      # Rule parameters (from AnchoringEffect DispositionTrader)
      gain_threshold: 0.04  # Source: target §9 g; Odean (1998) https://doi.org/10.1111/0022-1082.00072
      loss_aversion_mult: 2.5  # Source: target §9 lambda_LA; Kahneman & Tversky (1979) https://doi.org/10.2307/1914185
      base_position_size: 15.0  # Source: target §9 b; simulation-bases.md §6 (base-size normalization, lower for asymmetric agent)
