# DotComBubble LLM Agent Configuration

market:
  name: "Market"
  class: "examples.DotComBubble.LLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      # Source: simulation-bases.md §7 (output contract)
      record_path: "EXPERIMENT/DotComBubble/LLM/records"
      # Source: simulation-bases.md §6
      initial_price: 100.0
      # Source: simulation-bases.md §6
      fundamental_value: 100.0
      # Source: simulation-bases.md §6
      price_impact: 0.01
      # Source: simulation-bases.md §6
      mean_reversion: 0.005
      # Source: simulation-bases.md §6
      noise_std: 1.0
      # Source: simulation-bases.md §7 (bounded persisted state)
      custom_state_hot_limit: 3
  persona: !include persona.yml

llm_new_economy_evangelist:
  name: "NewEconomyEvangelist"
  class: "examples.DotComBubble.LLM.players:LLMNewEconomyEvangelist"
  num_instances: 2
  config:
    identity: "llm_new_economy_evangelist"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      # Source: simulation-bases.md §7 (output contract)
      record_path: "EXPERIMENT/DotComBubble/LLM/records"
      # Source: simulation-bases.md §4.1 (solvency constraint)
      initial_cash: 1000000.0
      # Source: simulation-bases.md §4.1 (inventory constraint)
      initial_position: 0
      # Source: simulation-bases.md §6
      order_size: 600
      # Source: simulation-bases.md §7 (bounded persisted state)
      custom_state_hot_limit: 3
      llm:
        # Source: examples/DotComBubble/LLM/prompts.py
        sys_message: "examples.DotComBubble.LLM.prompts:LLM_NEW_ECONOMY_EVANGELIST_SYS"
        # Source: examples/DotComBubble/LLM/prompts.py
        user_message: "examples.DotComBubble.LLM.prompts:LLM_USER_TEMPLATE"
        # Source: implement-simulation-skill/08-step4-implement.md §4.2
        lm_type: "api"
        # Source: project-supported API model configuration
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        # Source: analysis-bases.md §2 AQR quality gate
        max_retries: 3
        generation_config:
          # Source: LLM variant stochastic-deliberation design
          temperature: 0.8
          # Source: canonical tagged decision output budget
          max_tokens: 512
  persona: !include persona.yml

