# DotComBubble LLM Agent Configuration

market:
  name: "Market"
  class: "examples.DotComBubble.LLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/DotComBubble/LLM/records"
      initial_price: 50.0
      fundamental_value: 50.0
      price_impact: 0.03
      mean_reversion: 0.01
      noise_std: 0.02
      custom_state_hot_limit: 3
  persona: !include persona.yml

neweconomyevangelist:
  name: "NewEconomyEvangelist"
  class: "examples.DotComBubble.LLM.players:LLMNewEconomyEvangelist"
  num_instances: 2
  config:
    identity: "neweconomyevangelist"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/DotComBubble/LLM/records"
      initial_cash: 1000000.0
      initial_position: 0
      max_pf_ratio: 10.0
      base_buy_size: 400
      narrative_strength: 0.8
      custom_state_hot_limit: 3
      llm:
        sys_message: "examples.DotComBubble.LLM.prompts:LLM_NEW_ECONOMY_EVANGELIST_SYS"
        user_message: "examples.DotComBubble.LLM.prompts:LLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-1-6-lite-250115"
        generation_config:
          temperature: 0.8
          max_tokens: 512
  persona: !include persona.yml

ipoflipper:
  name: "IPOFlipper"
  class: "examples.DotComBubble.LLM.players:LLMIPOFlipper"
  num_instances: 2
