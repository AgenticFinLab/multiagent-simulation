# DotComBubble Rag Agent Configuration

market:
  name: "Market"
  class: "examples.DotComBubble.Rag.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    extras:
      initial_price: 50.0
      fundamental_value: 50.0
      price_impact: 0.02
      mean_reversion: 0.01
      noise_std: 0.03

new_economy_evangelist_1:
  name: "NewEconomyEvangelist 1"
  class: "examples.DotComBubble.Rag.players:LLMNewEconomyEvangelist"
  num_instances: 2
  config:
    identity: "new_economy_evangelist_1"
    role: player
    extras:
      initial_cash: 1000000.00
      initial_position: 0
      agent_type: "new_economy_evangelist"
      llm:
        model: "doubao-pro-32k"


