# DotComBubble Rag Agent Configuration

knowledge:
  # Source: Rag/explain.md §4; analysis-bases.md §2 AQR
  backend: "local"
  # Source: infrastructure
  global_uri: "examples/document-sources"
  # Source: infrastructure
  resource_csv:
    - "examples/document-sources/books.csv"
    - "examples/document-sources/source"
  # Source: infrastructure
  preprocessing:
    # Source: infrastructure
    parser: "mineru"
    # Source: infrastructure
    output_position: "MinerU_processed"
  # Source: infrastructure
  rag:
    # Source: infrastructure
    output_position: "rag_index_ep_20260418161108_k2pxb"
    # Source: infrastructure
    embed_type: "ark_multimodal"
    # Source: infrastructure
    embed_model: "ep-20260418161108-k2pxb"
    # Source: infrastructure
    embed_api_key: "{{ ARK_API_KEY }}"
    # Source: infrastructure
    embed_api_base: "https://ark.cn-beijing.volces.com/api/v3"
    # Source: infrastructure
    chunk_size: 512
    # Source: infrastructure
    chunk_overlap: 64
    # Source: infrastructure
    top_k: 5

market:
  archetype: stock-standard-price-impact  # -> masim/agents/defines/market/stock-standard-price-impact.md
  name: "Market"
  class: "examples.DotComBubble.Rag.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      # Source: simulation-bases.md §7
      record_path: "EXPERIMENT/DotComBubble/Rag/records"
      # Source: simulation-bases.md §3 and §6
      initial_price: 100.0
      # Source: simulation-bases.md §3 and §6
      fundamental_value: 100.0
      # Source: simulation-bases.md §3 and §6
      price_impact: 0.01
      # Source: simulation-bases.md §3 and §6
      mean_reversion: 0.005
      # Source: simulation-bases.md §3 and §6
      noise_std: 1.0
      # Source: simulation-bases.md §7 (recording implementation)
      custom_state_hot_limit: 3
  persona: !include persona.yml

ragllm_new_economy_evangelist:
  name: "NewEconomyEvangelist"
  class: "examples.DotComBubble.Rag.players:RagLLMNewEconomyEvangelist"
  num_instances: 2
  config:
    identity: "ragllm_new_economy_evangelist"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      # Source: simulation-bases.md §7
      record_path: "EXPERIMENT/DotComBubble/Rag/records"
      # Source: analysis-bases.md §5 cross-variant control (matches Rule/LLM/RuleLLM)
      initial_cash: 1000000.0
      # Source: simulation-bases.md §4.1 inventory constraint
      initial_position: 0
      # Source: simulation-bases.md §7 (recording implementation)
      custom_state_hot_limit: 3
      # Source: Rag/prompts.py and Rag/explain.md §4
      llm:
        # Source: infrastructure
        sys_message: "examples.DotComBubble.Rag.prompts:RAG_NEW_ECONOMY_EVANGELIST_SYS"
        # Source: infrastructure
        user_message: "examples.DotComBubble.Rag.prompts:RAG_USER_TEMPLATE"
        # Source: infrastructure
        lm_type: "api"
        # Source: infrastructure
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        # Source: infrastructure
        generation_config:
          # Source: infrastructure
          temperature: 0.8
          # Source: infrastructure
          max_tokens: 512
      # Source: Rag/explain.md §4; analysis-bases.md §2 AQR
      private_knowledge:
        # Source: infrastructure
        from_global_resources:
          - "MinerU_processed"
        # Source: infrastructure
        local_resources:
          # Source: infrastructure
          local_uri: ""
          # Source: infrastructure
          local_resources: []
        # Source: infrastructure
        rag:
          # Source: infrastructure
          from_global_index_dir:
            - "rag_index_ep_20260418161108_k2pxb"
          # Source: infrastructure
          local_index_dir: "rag_index_ep_20260418161108_k2pxb"
          # Source: infrastructure
          embed_type: "ark_multimodal"
          # Source: infrastructure
          embed_model: "ep-20260418161108-k2pxb"
          # Source: infrastructure
          embed_api_key: "{{ ARK_API_KEY }}"
          # Source: infrastructure
          embed_api_base: "https://ark.cn-beijing.volces.com/api/v3"
          # Source: infrastructure
          chunk_size: 512
          # Source: infrastructure
          chunk_overlap: 64
          # Source: infrastructure
          top_k: 5
  persona: !include persona.yml

