# DotComBubble RuleLLM Agent Configuration

market:
  name: "Market"
  class: "examples.DotComBubble.RuleLLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      # Source: simulation-bases.md §3 market persistence contract
      record_path: "EXPERIMENT/DotComBubble/RuleLLM/records"
      # Source: simulation-bases.md §6 Parameter Table
      initial_price: 100.0
      # Source: simulation-bases.md §6 Parameter Table
      fundamental_value: 100.0
      # Source: simulation-bases.md §6 Parameter Table
      price_impact: 0.01
      # Source: simulation-bases.md §6 Parameter Table
      mean_reversion: 0.005
      # Source: simulation-bases.md §6 Parameter Table
      noise_std: 1.0
      # Source: simulation-bases.md §3 bounded history requirement
      custom_state_hot_limit: 3
  persona: !include persona.yml

rulellm_new_economy_evangelist:
  name: "NewEconomyEvangelist"
  class: "examples.DotComBubble.RuleLLM.players:RuleLLMNewEconomyEvangelist"
  num_instances: 2
  config:
    identity: "rulellm_new_economy_evangelist"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      # Source: simulation-bases.md §4.1.6 worked example, scaled run endowment
      initial_cash: 1000000.0
      # Source: simulation-bases.md §3 market persistence contract
      record_path: "EXPERIMENT/DotComBubble/RuleLLM/records"
      # Source: simulation-bases.md §4.1.4 narrative-buyer inventory state
      initial_position: 0
      # Source: simulation-bases.md §6 Parameter Table
      order_size: 600
      # Source: simulation-bases.md §3 bounded history requirement
      custom_state_hot_limit: 3
      # Source: simulation-bases.md §9 RuleLLM variant definition
      llm:
        sys_message: "examples.DotComBubble.RuleLLM.prompts:RULELLM_NEW_ECONOMY_EVANGELIST_SYS"
        user_message: "examples.DotComBubble.RuleLLM.prompts:RULELLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.6
          max_tokens: 512
  persona: !include persona.yml

