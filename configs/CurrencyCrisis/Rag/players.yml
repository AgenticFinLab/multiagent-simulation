# CurrencyCrisis Rag Agent Configuration

knowledge:
  backend: "local"
  global_uri: "examples/document-sources"
  resource_csv:
    - "examples/document-sources/books.csv"
    - "examples/document-sources/source"
  preprocessing:
    parser: "mineru"
    output_position: "MinerU_processed"
  rag:
    output_position: "rag_index"
    embed_type: "litellm"
    embed_model: "openai/hunyuan-embedding"
    embed_api_key: "{{ HUNYUAN_API_KEY }}"
    embed_api_base: "https://api.hunyuan.cloud.tencent.com/v1"
    chunk_size: 512
    chunk_overlap: 64
    top_k: 5

market:
  archetype: fx-currency-peg-and-attack  # -> AGENT_POOL/market/fx-currency-peg-and-attack.md
  name: "Market"
  class: "examples.CurrencyCrisis.Rag.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/CurrencyCrisis/Rag/records"  # Source: AGENT_POOL/finance/market.md §6
      initial_price: 100.0  # Source: AGENT_POOL/finance/market.md §6
      peg_rate: 100.0  # Source: AGENT_POOL/finance/market.md §6
      fundamental_value: 100.0  # Source: AGENT_POOL/finance/market.md §6
      reserve_level: 500000.0  # Source: AGENT_POOL/finance/market.md §6
      price_impact: 0.01  # Source: AGENT_POOL/finance/market.md §6
      mean_reversion: 0.02  # Source: AGENT_POOL/finance/market.md §6
      noise_std: 0.5  # Source: AGENT_POOL/finance/market.md §6
      custom_state_hot_limit: 3  # Source: AGENT_POOL/finance/market.md §6
  persona: !include persona.yml

ragllm_speculative_attacker:
  name: "SpeculativeAttacker"
  class: "examples.CurrencyCrisis.Rag.players:RagLLMSpeculativeAttacker"
  num_instances: 2
  config:
    identity: "ragllm_speculative_attacker"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/CurrencyCrisis/Rag/records"  # Source: AGENT_POOL/finance/ragllm-speculative-attacker.md §6
      initial_cash: 1000000.0  # Source: AGENT_POOL/finance/ragllm-speculative-attacker.md §6
      initial_position: 5000  # Source: AGENT_POOL/finance/ragllm-speculative-attacker.md §6
      attack_threshold: 0.03  # Source: AGENT_POOL/finance/ragllm-speculative-attacker.md §6
      position_size: 800  # Source: AGENT_POOL/finance/ragllm-speculative-attacker.md §6
      custom_state_hot_limit: 3  # Source: AGENT_POOL/finance/ragllm-speculative-attacker.md §6
      private_knowledge:
        from_global_resources:
          - "MinerU_processed"
        local_resources:
          local_uri: ""
          local_resources: []
        rag:
          from_global_index_dir:
            - "rag_index"
          local_index_dir: ""
          embed_type: "litellm"
          embed_model: "openai/hunyuan-embedding"
          embed_api_key: "{{ HUNYUAN_API_KEY }}"
          embed_api_base: "https://api.hunyuan.cloud.tencent.com/v1"
          chunk_size: 512
          chunk_overlap: 64
          top_k: 5
      llm:
        sys_message: "examples.CurrencyCrisis.Rag.prompts:RAG_SPECULATIVE_ATTACKER_SYS"
        user_message: "examples.CurrencyCrisis.Rag.prompts:RAG_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.4
          max_tokens: 600
  persona: !include persona.yml

