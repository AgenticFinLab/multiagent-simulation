# CurrencyCrisis LLM Agent Configuration

market:
  name: "Market"
  class: "examples.CurrencyCrisis.LLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/CurrencyCrisis/LLM/records"
      initial_price: 100.0
      peg_rate: 100.0
      fundamental_value: 95.0
      reserve_level: 500000.0
      price_impact: 0.04
      mean_reversion: 0.01
      noise_std: 0.015
      custom_state_hot_limit: 3
  persona: !include persona.yml

speculativeattacker:
  name: "SpeculativeAttacker"
  class: "examples.CurrencyCrisis.LLM.players:LLMSpeculativeAttacker"
  num_instances: 2
  config:
    identity: "speculativeattacker"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/CurrencyCrisis/LLM/records"
      initial_cash: 1000000.0
      initial_position: 0
      attack_threshold: 0.05
      position_size: 800
      custom_state_hot_limit: 3
      llm:
        sys_message: "examples.CurrencyCrisis.LLM.prompts:LLM_SPECULATIVE_ATTACKER_SYS"
        user_message: "examples.CurrencyCrisis.LLM.prompts:LLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-1-6-lite-250115"
        generation_config:
          temperature: 0.7
          max_tokens: 512
  persona: !include persona.yml

