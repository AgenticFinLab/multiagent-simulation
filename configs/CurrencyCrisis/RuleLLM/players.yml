# CurrencyCrisis RuleLLM Agent Configuration

market:
  name: "Market"
  class: "examples.CurrencyCrisis.RuleLLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/CurrencyCrisis/RuleLLM/records"
      initial_price: 100.0
      peg_rate: 100.0
      fundamental_value: 100.0
      reserve_level: 500000.0
      price_impact: 0.01
      mean_reversion: 0.02
      noise_std: 0.5
      custom_state_hot_limit: 3
  persona: !include persona.yml

rulellm_speculative_attacker:
  name: "SpeculativeAttacker"
  class: "examples.CurrencyCrisis.RuleLLM.players:RuleLLMSpeculativeAttacker"
  num_instances: 2
  config:
    identity: "rulellm_speculative_attacker"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/CurrencyCrisis/RuleLLM/records"
      initial_cash: 1000000.0
      initial_position: 5000
      attack_threshold: 0.03
      position_size: 800
      custom_state_hot_limit: 3
      llm:
        sys_message: "examples.CurrencyCrisis.RuleLLM.prompts:RULELLM_SPECULATIVE_ATTACKER_SYS"
        user_message: "examples.CurrencyCrisis.RuleLLM.prompts:RULELLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.4
          max_tokens: 512
  persona: !include persona.yml

