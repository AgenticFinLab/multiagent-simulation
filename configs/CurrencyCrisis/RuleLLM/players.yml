# CurrencyCrisis RuleLLM Agent Configuration

market:
  archetype: fx-currency-peg-and-attack  # -> masim/agents/defines/market/fx-currency-peg-and-attack.md
  name: "Market"
  class: "examples.CurrencyCrisis.RuleLLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/CurrencyCrisis/RuleLLM/records"  # Source: masim/agents/defines/finance/market.md §6
      initial_price: 100.0  # Source: masim/agents/defines/finance/market.md §6
      peg_rate: 100.0  # Source: masim/agents/defines/finance/market.md §6
      fundamental_value: 100.0  # Source: masim/agents/defines/finance/market.md §6
      reserve_level: 500000.0  # Source: masim/agents/defines/finance/market.md §6
      price_impact: 0.01  # Source: masim/agents/defines/finance/market.md §6
      mean_reversion: 0.02  # Source: masim/agents/defines/finance/market.md §6
      noise_std: 0.5  # Source: masim/agents/defines/finance/market.md §6
      custom_state_hot_limit: 3  # Source: masim/agents/defines/finance/market.md §6
  persona: !include persona.yml

rulellm_speculative_attacker:
  name: "SpeculativeAttacker"
  class: "examples.CurrencyCrisis.RuleLLM.players:RuleLLMSpeculativeAttacker"
  num_instances: 2
  config:
    identity: "rulellm_speculative_attacker"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/CurrencyCrisis/RuleLLM/records"  # Source: masim/agents/defines/finance/rulellm-speculative-attacker.md §6
      initial_cash: 1000000.0  # Source: masim/agents/defines/finance/rulellm-speculative-attacker.md §6
      initial_position: 5000  # Source: masim/agents/defines/finance/rulellm-speculative-attacker.md §6
      attack_threshold: 0.03  # Source: masim/agents/defines/finance/rulellm-speculative-attacker.md §6
      position_size: 800  # Source: masim/agents/defines/finance/rulellm-speculative-attacker.md §6
      custom_state_hot_limit: 3  # Source: masim/agents/defines/finance/rulellm-speculative-attacker.md §6
      llm:
        sys_message: "examples.CurrencyCrisis.RuleLLM.prompts:RULELLM_SPECULATIVE_ATTACKER_SYS"
        user_message: "examples.CurrencyCrisis.RuleLLM.prompts:RULELLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.4
          max_tokens: 512
  persona: !include persona.yml

