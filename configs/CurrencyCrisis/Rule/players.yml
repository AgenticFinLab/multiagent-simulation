# CurrencyCrisis Rule Agent Configuration

market:
  name: "Market"
  class: "examples.CurrencyCrisis.Rule.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/CurrencyCrisis/Rule/records"
      initial_price: 100.0
      peg_rate: 100.0
      fundamental_value: 100.0
      reserve_level: 500000.0
      price_impact: 0.01
      mean_reversion: 0.02
      noise_std: 0.5
      custom_state_hot_limit: 3
  persona: !include persona.yml

rule_speculative_attacker:
  name: "SpeculativeAttacker"
  class: "examples.CurrencyCrisis.Rule.players:SpeculativeAttacker"
  num_instances: 2
  config:
    identity: "rule_speculative_attacker"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/CurrencyCrisis/Rule/records"
      initial_cash: 1000000.0
      initial_position: 5000
      attack_threshold: 0.03
      position_size: 800
      custom_state_hot_limit: 3
      order_size: 600
  persona: !include persona.yml

rule_self_fulfilling_trader:
  name: "SelfFulfillingTrader"
  class: "examples.CurrencyCrisis.Rule.players:SelfFulfillingTrader"
  num_instances: 2
  config:
    identity: "rule_self_fulfilling_trader"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/CurrencyCrisis/Rule/records"
      initial_cash: 800000.0
      initial_position: 5000
      contagion_sensitivity: 0.01
      exit_threshold: 0.03
      position_size: 500
      custom_state_hot_limit: 3
      order_size: 700
  persona: !include persona.yml

rule_central_bank_defender:
  name: "CentralBankDefender"
  class: "examples.CurrencyCrisis.Rule.players:CentralBankDefender"
  num_instances: 1
  config:
    identity: "rule_central_bank_defender"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/CurrencyCrisis/Rule/records"
      initial_cash: 5000000.0
      initial_position: 3000
      defense_size: 600
      defense_threshold: 0.05
      custom_state_hot_limit: 3
      order_size: 500
  persona: !include persona.yml

rule_fundamental_hedger:
  name: "FundamentalHedger"
  class: "examples.CurrencyCrisis.Rule.players:FundamentalHedger"
  num_instances: 1
  config:
    identity: "rule_fundamental_hedger"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/CurrencyCrisis/Rule/records"
      initial_cash: 1000000.0
      initial_position: 2000
      hedge_ratio: 0.05
      position_size: 400
      custom_state_hot_limit: 3
      order_size: 400
  persona: !include persona.yml

rule_noise_trader:
  name: "NoiseTrader"
  class: "examples.CurrencyCrisis.Rule.players:NoiseTrader"
  num_instances: 1
  config:
    identity: "rule_noise_trader"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/CurrencyCrisis/Rule/records"
      initial_cash: 500000.0
      initial_position: 500
      trade_probability: 0.3
      noise_size: 100
      custom_state_hot_limit: 3
  persona: !include persona.yml
