# CurrencyCrisis Rule Agent Configuration

market:
  name: "Market"
  class: "examples.CurrencyCrisis.Rule.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/CurrencyCrisis/Rule/records"
      initial_price: 100.0
      peg_rate: 100.0
      fundamental_value: 95.0
      reserve_level: 500000.0
      price_impact: 0.04
      mean_reversion: 0.01
      noise_std: 0.015
      custom_state_hot_limit: 3
  persona: !include persona.yml

speculativeattacker:
  name: "SpeculativeAttacker"
  class: "examples.CurrencyCrisis.Rule.players:SpeculativeAttacker"
  num_instances: 2
  config:
    identity: "speculativeattacker"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/CurrencyCrisis/Rule/records"
      initial_cash: 1000000.0
      initial_position: 0
      attack_threshold: 0.05
      position_size: 800
      custom_state_hot_limit: 3
  persona: !include persona.yml

selffulfillingtrader:
  name: "SelfFulfillingTrader"
  class: "examples.CurrencyCrisis.Rule.players:SelfFulfillingTrader"
  num_instances: 2
  config:
    identity: "selffulfillingtrader"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/CurrencyCrisis/Rule/records"
      initial_cash: 800000.0
      initial_position: 0
      contagion_sensitivity: 0.7
      exit_threshold: 0.03
      position_size: 500
      custom_state_hot_limit: 3
  persona: !include persona.yml

centralbankdefender:
  name: "CentralBankDefender"
  class: "examples.CurrencyCrisis.Rule.players:CentralBankDefender"
  num_instances: 1
  config:
    identity: "centralbankdefender"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/CurrencyCrisis/Rule/records"
      initial_cash: 5000000.0
      initial_position: 0
      defense_size: 600
      defense_threshold: 0.02
      custom_state_hot_limit: 3
  persona: !include persona.yml

fundamentalhedger:
  name: "FundamentalHedger"
  class: "examples.CurrencyCrisis.Rule.players:FundamentalHedger"
  num_instances: 1
  config:
    identity: "fundamentalhedger"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/CurrencyCrisis/Rule/records"
      initial_cash: 1000000.0
      initial_position: 0
      hedge_ratio: 0.3
      position_size: 400
      custom_state_hot_limit: 3
  persona: !include persona.yml

noisetrader:
  name: "NoiseTrader"
  class: "examples.CurrencyCrisis.Rule.players:NoiseTrader"
  num_instances: 1
  config:
    identity: "noisetrader"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/CurrencyCrisis/Rule/records"
      initial_cash: 500000.0
      initial_position: 0
      trade_probability: 0.3
      noise_size: 100
      custom_state_hot_limit: 3
  persona: !include persona.yml
