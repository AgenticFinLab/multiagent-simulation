# =============================================================================
# HerdEffectLLM Players Configuration
# =============================================================================
# 1 Market (rule-based) + 5 LLM Investors
#
# LLM Provider: ByteDance Doubao (via lmbase)
# Environment Variable: ARK_API_KEY
#
# LLM Investor Strategies (defined via system prompts):
#   - LLMMomentum:   Trend following, buys rising prices (destabilizing)
#   - LLMContrarian: Value investing, mean reversion (stabilizing)
#   - LLMRiskAverse: Volatility sensitive, early exit (crash trigger)
#   - LLMAggressive: Leveraged momentum, acceleration (extreme amplifier)
#   - LLMNoise:      Random/uninformed trading (liquidity/trigger)
#
# Output format: {"action": "buy"|"sell"|"hold", "bid_price": float, "quantity": float, "reasoning": string}
# =============================================================================

# -----------------------------------------------------------------------------
# Market (rule-based, NOT LLM)
# -----------------------------------------------------------------------------
market:
  name: "Market"
  class: "examples.HerdEffectLLM.players:Market"
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras: {}
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# LLM Investors (5 types with different personalities)
# Using lmbase with ByteDance Doubao
# -----------------------------------------------------------------------------

llm_momentum:
  name: "LLM Momentum Investor"
  class: "examples.HerdEffectLLM.players:LLMMomentumInvestor"
  config:
    identity: "llm_momentum"
    role: player
    steps_per_turn: 1
    group_tags:
      - llm_investors
    extras:
      strategy: momentum
      llm:
        sys_message: "examples.HerdEffectLLM.prompts:LLM_MOMENTUM_SYS"
        user_message: "examples.HerdEffectLLM.prompts:LLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-1-6-lite-251015"
        generation_config:
          temperature: 0.3
          max_new_tokens: 500
  persona: !include persona.yml

