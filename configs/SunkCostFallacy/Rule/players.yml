market:
  archetype: stock-standard-price-impact  # -> AGENT_POOL/market/stock-standard-price-impact.md
  name: "Market"
  class: "examples.SunkCostFallacy.Rule.players:Market"
  num_instances: 1
  persona: !include persona.yml
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags: [market]
    extras:
      initial_price: 100.0  # Source: target §9 market.extras.initial_price row; normalization (simulation-bases.md §6)
      fundamental_value: 100.0  # Source: target §9 market.extras.fundamental_value row; normalization; equal to initial_price so starting deviation is zero (simulation-bases.md §6)
      price_impact: 0.02  # Source: target §9 market.extras.price_impact row; simulation-bases.md §3.1
      mean_reversion: 0.015  # Source: target §9 market.extras.mean_reversion row; simulation-bases.md §3.1
      noise_std: 0.01  # Source: target §9 market.extras.noise_std row; simulation-bases.md §3.1

rule_sunk_cost_holder:
  name: "SunkCostHolder"
  class: "examples.SunkCostFallacy.Rule.players:SunkCostHolder"
  num_instances: 3  # Source: target §9 sunkcostholder.num_instances row
  persona: !include persona.yml
  config:
    identity: "rule_sunk_cost_holder"
    role: player
    steps_per_turn: 1
    group_tags: [investors]
    extras:
      initial_cash: 1000000.0  # Source: target §9 sunkcostholder.extras.initial_cash row
      initial_position: 500  # Source: target §9 sunkcostholder.extras.initial_position row
      initial_price: 100.0  # Source: target §9 market.extras.initial_price row (broadcast copy)
      fundamental_value: 100.0  # Source: target §9 market.extras.fundamental_value row (broadcast copy)
      hold_threshold: 0.1  # Source: target §9 sunkcostholder.extras.hold_threshold row; Arkes and Blumer (1985), 10.1016/0749-5978(85)90049-4
      base_size: 200  # Source: target §9 sunkcostholder.extras.base_size row
      custom_state_hot_limit: 3  # Source: target §9 custom_state_hot_limit row (runtime plumbing)

rule_commitment_escalator:
  name: "CommitmentEscalator"
  class: "examples.SunkCostFallacy.Rule.players:CommitmentEscalator"
  num_instances: 3  # Source: target §9 commitmentescalator.num_instances row
  persona: !include persona.yml
  config:
    identity: "rule_commitment_escalator"
    role: player
    steps_per_turn: 1
    group_tags: [investors]
    extras:
      initial_cash: 1200000.0  # Source: target §9 commitmentescalator.extras.initial_cash row
      initial_position: 400  # Source: target §9 commitmentescalator.extras.initial_position row
      initial_price: 100.0  # Source: target §9 market.extras.initial_price row (broadcast copy)
      fundamental_value: 100.0  # Source: target §9 market.extras.fundamental_value row (broadcast copy)
      escalation_threshold: 0.05  # Source: target §9 commitmentescalator.extras.escalation_threshold row; Staw (1976), 10.1016/0030-5073(76)90005-2
      escalation_size: 400  # Source: target §9 commitmentescalator.extras.escalation_size row
      custom_state_hot_limit: 3  # Source: target §9 custom_state_hot_limit row (runtime plumbing)

rule_rational_cutter:
  name: "RationalCutter"
  class: "examples.SunkCostFallacy.Rule.players:RationalCutter"
  num_instances: 2  # Source: target §9 rationalcutter.num_instances row
  persona: !include persona.yml
  config:
    identity: "rule_rational_cutter"
    role: player
    steps_per_turn: 1
    group_tags: [investors]
    extras:
      initial_cash: 1500000.0  # Source: target §9 rationalcutter.extras.initial_cash row
      initial_position: 600  # Source: target §9 rationalcutter.extras.initial_position row
      initial_price: 100.0  # Source: target §9 market.extras.initial_price row (broadcast copy)
      fundamental_value: 100.0  # Source: target §9 market.extras.fundamental_value row (broadcast copy)
      cut_threshold: 0.05  # Source: target §9 rationalcutter.extras.cut_threshold row; Odean (1998), 10.1111/0022-1082.00072
      position_size: 350  # Source: target §9 rationalcutter.extras.position_size row
      custom_state_hot_limit: 3  # Source: target §9 custom_state_hot_limit row (runtime plumbing)

rule_opportunity_cost_trader:
  name: "OpportunityCostTrader"
  class: "examples.SunkCostFallacy.Rule.players:OpportunityCostTrader"
  num_instances: 2  # Source: target §9 opportunitycosttrader.num_instances row
  persona: !include persona.yml
  config:
    identity: "rule_opportunity_cost_trader"
    role: player
    steps_per_turn: 1
    group_tags: [investors]
    extras:
      initial_cash: 1300000.0  # Source: target §9 opportunitycosttrader.extras.initial_cash row
      initial_position: 500  # Source: target §9 opportunitycosttrader.extras.initial_position row
      initial_price: 100.0  # Source: target §9 market.extras.initial_price row (broadcast copy)
      fundamental_value: 100.0  # Source: target §9 market.extras.fundamental_value row (broadcast copy)
      realloc_threshold: 0.08  # Source: target §9 opportunitycosttrader.extras.realloc_threshold row; Barber and Odean (2000), 10.1111/0022-1082.00226
      position_size: 300  # Source: target §9 opportunitycosttrader.extras.position_size row
      custom_state_hot_limit: 3  # Source: target §9 custom_state_hot_limit row (runtime plumbing)

rule_noise_trader:
  name: "NoiseTrader"
  class: "examples.SunkCostFallacy.Rule.players:NoiseTrader"
  num_instances: 2  # Source: target §9 noisetrader.num_instances row
  persona: !include persona.yml
  config:
    identity: "rule_noise_trader"
    role: player
    steps_per_turn: 1
    group_tags: [investors]
    extras:
      initial_cash: 500000.0  # Source: target §9 noisetrader.extras.initial_cash row
      initial_position: 200  # Source: target §9 noisetrader.extras.initial_position row
      initial_price: 100.0  # Source: target §9 market.extras.initial_price row (broadcast copy)
      fundamental_value: 100.0  # Source: target §9 market.extras.fundamental_value row (broadcast copy)
      trade_probability: 0.3  # Source: target §9 noisetrader.extras.trade_probability row; Black (1986), 10.1111/j.1540-6261.1986.tb04513.x
      noise_size: 100  # Source: target §9 noisetrader.extras.noise_size row
      custom_state_hot_limit: 3  # Source: target §9 custom_state_hot_limit row (runtime plumbing)
