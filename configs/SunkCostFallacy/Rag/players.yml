knowledge:
  global_resources:
    MinerU_processed:
      path: "examples/document-sources/processed"
  global_index_dir:
    rag_index:
      path: "examples/document-sources/rag_index"

market:
  archetype: stock-standard-price-impact  # -> masim/agents/defines/market/stock-standard-price-impact.md
  name: "Market"
  class: "examples.SunkCostFallacy.Rule.players:Market"
  num_instances: 1
  persona: !include ../Rag/persona.yml
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags: [market]
    extras:
      record_path: "EXPERIMENT/SunkCostFallacy/Rag/records/market"
      initial_price: 100.0            # Source: target §9 initial_price row; normalized entry/cost base
      fundamental_value: 100.0        # Source: target §9 fundamental_value row; normalized fundamental anchor
      price_impact: 0.02              # Source: target §9 price_impact row; Kyle (1985) demand-impact coefficient
      mean_reversion: 0.015           # Source: target §9 mean_reversion row; slow correction preserves behavioral persistence
      noise_std: 0.01                 # Source: target §9 noise_std row; Black (1986) low background volatility

ragllm_sunk_cost_holder:
  name: "SunkCostHolder"
  class: "examples.SunkCostFallacy.Rag.players:RagLLMSunkCostHolder"
  num_instances: 3                    # Source: target §7 SunkCostHolder row; 3 instances represent core sunk-cost inertia mass
  persona: !include ../Rag/persona.yml
  config:
    identity: "ragllm_sunk_cost_holder"
    role: player
    steps_per_turn: 1
    group_tags: [investors]
    extras:
      record_path: "EXPERIMENT/SunkCostFallacy/Rag/records/sunkcostholder"
      agent_type: "SunkCostHolder"    # Source: agent-design-skill §3.6.0 I/O Contract; required for LLM/Rag variant identity in logs
      initial_cash: 1000000.0         # Source: target §9 initial_cash (SunkCostHolder) row; retail-holder budget
      initial_position: 500           # Source: target §9 initial_position (SunkCostHolder) row; embedded historical stake
      initial_price: 100.0            # Source: target §9 initial_price row; normalized cost basis
      fundamental_value: 100.0        # Source: target §9 fundamental_value row; forward-looking anchor
      hold_threshold: 0.10            # Source: target §9 hold_threshold row; Arkes & Blumer (1985) reinforcement gate
      base_size: 200                  # Source: target §9 base_size row; small reinforcement order magnitude
      custom_state_hot_limit: 3       # Source: target §9 custom_state_hot_limit row; hot-state ring buffer per §11 masim/utils
      private_knowledge:
        from_global_resources: ["MinerU_processed"]
        rag:
          from_global_index_dir: ["rag_index"]
          embed_type: "litellm"
          embed_model: "openai/hunyuan-embedding"
          embed_api_base: "https://api.hunyuan.cloud.tencent.com/v1"
          embed_api_key: "{{ HUNYUAN_API_KEY }}"
          chunk_size: 512
          chunk_overlap: 64
          top_k: 3
      llm:
        sys_message: "examples.SunkCostFallacy.Rag.prompts:RAGLLM_SUNK_COST_HOLDER_SYS"
        user_message: "examples.SunkCostFallacy.Rag.prompts:RAG_USER_TEMPLATE"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.7
          max_tokens: 600

ragllm_commitment_escalator:
  name: "CommitmentEscalator"
  class: "examples.SunkCostFallacy.Rag.players:RagLLMCommitmentEscalator"
  num_instances: 3                    # Source: target §7 CommitmentEscalator row; 3 instances amplify escalation pressure
  persona: !include ../Rag/persona.yml
  config:
    identity: "ragllm_commitment_escalator"
    role: player
    steps_per_turn: 1
    group_tags: [investors]
    extras:
      record_path: "EXPERIMENT/SunkCostFallacy/Rag/records/commitmentescalator"
      agent_type: "CommitmentEscalator"   # Source: agent-design-skill §3.6.0 I/O Contract
      initial_cash: 1200000.0         # Source: target §9 initial_cash (CommitmentEscalator) row; larger budget enables averaging down
      initial_position: 400           # Source: target §9 initial_position (CommitmentEscalator) row; moderate committed stake
      initial_price: 100.0            # Source: target §9 initial_price row
      fundamental_value: 100.0        # Source: target §9 fundamental_value row
      escalation_threshold: 0.05      # Source: target §9 escalation_threshold row; Staw (1976) rapid-activation gate
      escalation_size: 400            # Source: target §9 escalation_size row; larger than passive holder to represent doubling down
      custom_state_hot_limit: 3       # Source: target §9 custom_state_hot_limit row
      private_knowledge:
        from_global_resources: ["MinerU_processed"]
        rag:
          from_global_index_dir: ["rag_index"]
          embed_type: "litellm"
          embed_model: "openai/hunyuan-embedding"
          embed_api_base: "https://api.hunyuan.cloud.tencent.com/v1"
          embed_api_key: "{{ HUNYUAN_API_KEY }}"
          chunk_size: 512
          chunk_overlap: 64
          top_k: 3
      llm:
        sys_message: "examples.SunkCostFallacy.Rag.prompts:RAGLLM_COMMITMENT_ESCALATOR_SYS"
        user_message: "examples.SunkCostFallacy.Rag.prompts:RAG_USER_TEMPLATE"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.7
          max_tokens: 600

