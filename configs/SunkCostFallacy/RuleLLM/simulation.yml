# SunkCostFallacy RuleLLM Simulation Configuration

setting:
  name: "SunkCostFallacy-RuleLLM"
  description: "SunkCostFallacy simulation - RuleLLM agents"
  total_rounds: 200
  record_path: "EXPERIMENT/SunkCostFallacy/RuleLLM/records"
  storage_path: "EXPERIMENT/SunkCostFallacy/RuleLLM/communication"
  log_level: "INFO"
  log_to_file: true
  log_path: "EXPERIMENT/SunkCostFallacy/RuleLLM/logs"

environment:
  dotenv_path: ".env"
  workspace: "."

ray:
  namespace: "sunkcostfallacy_rulellm"
  ignore_reinit_error: true
  object_store_memory: 536870912
  num_cpus: 4

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/SunkCostFallacy/RuleLLM/communication"
  record_messages: true
  message_timeout_ms: 5000
  max_retries: 3
