# SunkCostFallacy RuleLLM Agent Configuration

market:
  name: "Market"
  class: "examples.SunkCostFallacy.Rule.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    extras:
      initial_price: 100.0
      fundamental_value: 100.0
      price_impact: 0.05
      mean_reversion: 0.02
      noise_std: 0.02

sunkcostholder_1:
  name: "SunkCostHolder 1"
  class: "examples.SunkCostFallacy.RuleLLM.players:SunkCostHolder"
  num_instances: 2
  config:
    identity: "sunkcostholder_1"
    role: player
    extras:
      initial_cash: 1000000.0
      initial_position: 0
      llm: {'model': 'doubao-pro-32k', 'api_key': '${LLM_API_KEY}', 'base_url': '${LLM_BASE_URL}'}
      agent_type: sunkcostholder

commitmentescalator_2:
  name: "CommitmentEscalator 2"
