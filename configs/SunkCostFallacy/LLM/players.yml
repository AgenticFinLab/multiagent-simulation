market:
  archetype: stock-standard-price-impact  # -> masim/agents/defines/market/stock-standard-price-impact.md
  name: "Market"
  class: "examples.SunkCostFallacy.Rule.players:Market"
  num_instances: 1
  persona: !include ../LLM/persona.yml
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags: [market]
    extras:
      record_path: "EXPERIMENT/SunkCostFallacy/LLM/records/market"  # Source: variant runtime plumbing
      initial_price: 100.0  # Source: target §9 market.extras.initial_price row; normalization (simulation-bases.md §6)
      fundamental_value: 100.0  # Source: target §9 market.extras.fundamental_value row; normalization; equal to initial_price so starting deviation is zero (simulation-bases.md §6)
      price_impact: 0.02  # Source: target §9 market.extras.price_impact row; simulation-bases.md §3.1
      mean_reversion: 0.015  # Source: target §9 market.extras.mean_reversion row; simulation-bases.md §3.1
      noise_std: 0.01  # Source: target §9 market.extras.noise_std row; simulation-bases.md §3.1

llm_sunk_cost_holder:
  name: "SunkCostHolder"
  class: "examples.SunkCostFallacy.LLM.players:LLMSunkCostHolder"
  num_instances: 3  # Source: target §9 sunkcostholder.num_instances row
  persona: !include ../LLM/persona.yml
  config:
    identity: "llm_sunk_cost_holder"
    role: player
    steps_per_turn: 1
    group_tags: [investors]
    extras:
      agent_type: "sunkcostholder"  # Source: agent-design-skill §3.6.0 I/O Contract (LLM/RuleLLM/Rag variants)
      record_path: "EXPERIMENT/SunkCostFallacy/LLM/records/sunkcostholder"  # Source: variant runtime plumbing
      initial_cash: 1000000.0  # Source: target §9 sunkcostholder.extras.initial_cash row
      initial_position: 500  # Source: target §9 sunkcostholder.extras.initial_position row
      initial_price: 100.0  # Source: target §9 market.extras.initial_price row (broadcast copy)
      fundamental_value: 100.0  # Source: target §9 market.extras.fundamental_value row (broadcast copy)
      hold_threshold: 0.1  # Source: target §9 sunkcostholder.extras.hold_threshold row; Arkes and Blumer (1985), 10.1016/0749-5978(85)90049-4
      base_size: 200  # Source: target §9 sunkcostholder.extras.base_size row
      custom_state_hot_limit: 3  # Source: target §9 custom_state_hot_limit row (runtime plumbing)
      llm:
        sys_message: "examples.SunkCostFallacy.LLM.prompts:LLM_SUNK_COST_HOLDER_SYS"
        user_message: "examples.SunkCostFallacy.LLM.prompts:LLM_USER_TEMPLATE"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.7
          max_tokens: 512

