# =============================================================================
# DispositionEffect Rag Players Configuration
# =============================================================================
# RAG-augmented investors with knowledge retrieval capabilities.
# Uses RuleLLM prompts + runtime RAG context injection.
# =============================================================================

market:
  name: "Market"
  class: "examples.DispositionEffect.Rag.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/DispositionEffect/Rag/records"
      fundamental_value: 100.0
      initial_price: 100.0
      price_impact: 0.1
      mean_reversion: 0.01
      noise_std: 1.0
      news_probability: 0.05
      news_impact_range: 3.0
      custom_state_hot_limit: 3
  persona: !include persona.yml

# RAG Disposition Investor
rag_disposition:
  name: "RAG Disposition Investor"
  class: "examples.DispositionEffect.Rag.players:RagDispositionInvestor"
  num_instances: 3
  config:
    identity: "rag_disposition"
    role: player
    steps_per_turn: 1
    group_tags:
      - rag_investors
    extras:
      record_path: "EXPERIMENT/DispositionEffect/Rag/records"
      initial_cash: 10000.0
      initial_position: 50.0
      initial_purchase_price: 100.0
      max_position: 200.0
      custom_state_hot_limit: 3
      llm:
        sys_message: "examples.DispositionEffect.Rag.prompts:RULELLM_DISPOSITION_BIASED_SYS"
        user_message: "examples.DispositionEffect.Rag.prompts:LLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-1-6-251015"
        generation_config:
          temperature: 0.3
          max_new_tokens: 500
      rag:
        # ===================================================================
        # RAG Knowledge Configuration
        # ===================================================================
        # Index persistence directory (for resume support)
        persist_dir: "EXPERIMENT/DispositionEffect/Rag/rag_index/rag_disposition"
        
        # -------------------------------------------------------------------
        # Knowledge Source Options (priority order: first available wins)
        # -------------------------------------------------------------------
        
        # Option 1: Local directory with PDF/Markdown files
        docs_dir: &docs_dir_disposition "examples/document-sources/files"
        
        # Option 2: CSV file with URLs (columns: source_type, url, book_title)
        url_csv: "examples/document-sources/finance_books.csv"
        
        # Option 3: Explicit list of URLs to fetch (public platforms)
        urls:
          - "https://en.wikipedia.org/wiki/Disposition_effect"
          - "https://en.wikipedia.org/wiki/Prospect_theory"
          - "https://www.investopedia.com/terms/d/disposition-effect.asp"
        
        # Option 4: Agent-autonomous selection (uses agent identity to select docs)
        agent_autonomous: false
        catalog_path: "examples/document-sources/finance_books.csv"
        
        # Option 5: LLM-suggested document discovery
        llm_suggested: false
        llm_suggested_n_urls: 5
        
        # Directory to cache downloaded documents (reference docs_dir anchor)
        docs_save_dir: *docs_dir_disposition
        
        # -------------------------------------------------------------------
        # Retrieval Configuration
        # -------------------------------------------------------------------
        top_k: 5  # Number of chunks to retrieve per query
        
        # -------------------------------------------------------------------
        # Embedding Configuration
        # -------------------------------------------------------------------
        # Using Doubao embedding via ARK API
        embed_type: "openai"
        embed_model: "doubao-embedding-text-24071"
        embed_api_base: "https://ark.cn-beijing.volces.com/api/v3"
        
        # Chunking parameters
        chunk_size: 512
        chunk_overlap: 64
        
        # Legacy: simple list of sources (backward compatibility)
        knowledge_sources: []
  persona: !include persona.yml

