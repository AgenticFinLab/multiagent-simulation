# =============================================================================
# DispositionEffect Players Configuration
# =============================================================================
# Prospect Theory Trading Simulation
#
# Phenomenon: Disposition Effect (Shefrin & Statman 1985)
#   - Investors sell winners too early (realize gains prematurely)
#   - Investors hold losers too long (reluctant to realize losses)
#
# Investor Types:
#   - DispositionInvestor: Exhibits disposition effect (behavioral)
#   - RationalInvestor: Expected utility maximizer (rational baseline)
#   - TaxAwareInvestor: Tax loss harvesting (opposite of disposition)
#   - IndexHolder: Passive buy-and-hold
#   - InstitutionalInvestor: Professional, less prone to disposition
# =============================================================================

market:
  name: "Market"
  class: "examples.DispositionEffect.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/DispositionEffect/records"
      # Market parameters
      initial_price: 100.0
      fundamental_value: 100.0
      price_impact: 0.08
      mean_reversion: 0.05
      noise_std: 0.6
      # News shock parameters
      news_probability: 0.15
      news_impact_range: 4.0
      custom_state_hot_limit: 3
  persona: !include persona.yml

disposition_investor:
  name: "Disposition Investor"
  class: "examples.DispositionEffect.players:DispositionInvestor"
  # Expander → disposition_investor_1, disposition_investor_2
  num_instances: 50
  config:
    identity: "disposition_investor"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/DispositionEffect/records"
      # Base investor parameters
      initial_cash: 10000.0
      initial_position: 30.0
      initial_purchase_price: 100.0
      custom_state_hot_limit: 3
      # DispositionInvestor specific (Prospect Theory)
      # Sell at 3% gain (quicker realization of winners)
      gain_threshold: 0.03
      # Sell at 10% loss (strong but not extreme threshold)
      loss_threshold: -0.10
      # λ parameter (Kahneman-Tversky 1979)
      loss_aversion: 2.25
      # Sell 50% of position on gain realization
      sell_fraction_gain: 0.5
      # Very reluctantly sell only 15% at loss
      sell_fraction_loss: 0.15
      # Ceiling = initial_position
      max_position: 30.0
      # Buy 15% of deficit only when ±1% of reference point
      buy_fraction: 0.15
  persona: !include persona.yml

rational_investor:
  name: "Rational Investor"
  class: "examples.DispositionEffect.players:RationalInvestor"
  # Expander → rational_investor_1, rational_investor_2
  num_instances: 2
  config:
    identity: "rational_investor"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/DispositionEffect/records"
      # Base investor parameters
      initial_cash: 10000.0
      initial_position: 30.0
      initial_purchase_price: 100.0
      custom_state_hot_limit: 3
      # RationalInvestor specific
      target_allocation: 0.5
      rebalance_threshold: 0.1
  persona: !include persona.yml

tax_aware_investor:
  name: "Tax Aware Investor"
  class: "examples.DispositionEffect.players:TaxAwareInvestor"
  # Expander → tax_aware_investor_1, tax_aware_investor_2
  num_instances: 2
  config:
    identity: "tax_aware_investor"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/DispositionEffect/records"
      # Base investor parameters
      initial_cash: 10000.0
      initial_position: 30.0
      initial_purchase_price: 100.0
      custom_state_hot_limit: 3
      # TaxAwareInvestor specific
      # Sell at 5% loss for tax benefit
      tax_loss_threshold: -0.05
      # Hold until 20% gain (deferral benefit)
      capital_gains_hold: 0.20
      # Sell 50% when harvesting
      tax_harvest_fraction: 0.5
  persona: !include persona.yml

index_holder:
  name: "Index Holder"
  class: "examples.DispositionEffect.players:IndexHolder"
  num_instances: 1
  config:
    identity: "index_holder"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/DispositionEffect/records"
      # Base investor parameters
      initial_cash: 10000.0
      # Larger position for passive holder
      initial_position: 50.0
      initial_purchase_price: 100.0
      custom_state_hot_limit: 3
  persona: !include persona.yml

institutional_investor:
  name: "Institutional Investor"
  class: "examples.DispositionEffect.players:InstitutionalInvestor"
  num_instances: 1
  config:
    identity: "institutional_investor"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/DispositionEffect/records"
      # Base investor parameters
      initial_cash: 10000.0
      initial_position: 30.0
      initial_purchase_price: 100.0
      custom_state_hot_limit: 3
      # InstitutionalInvestor specific (weaker disposition)
      # Hold longer than retail
      gain_threshold: 0.25
      # Cut losses earlier than retail
      loss_threshold: -0.15
      sell_fraction: 0.4
  persona: !include persona.yml
