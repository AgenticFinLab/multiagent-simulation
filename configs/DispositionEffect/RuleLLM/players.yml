# =============================================================================
# DispositionEffectRuleLLM Players Configuration
# =============================================================================
# 1 Market (rule-based) + 5 Hybrid Rule+LLM Investors
# Each LLM agent's system prompt embeds:
#   - Personal profile: identity, style, risk attitude
#   - Quantitative rules: exact financial/mathematical principles
# =============================================================================

# Market (rule-based, identical to DispositionEffect)
market:
  archetype: stock-standard-price-impact  # -> masim/agents/defines/market/stock-standard-price-impact.md
  name: "Market"
  class: "examples.DispositionEffect.RuleLLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/DispositionEffect/RuleLLM/records"  # Source: simulation.yml setting.record_path
      fundamental_value: 100.0  # Source: simulation-bases.md §6
      initial_price: 100.0  # Source: simulation-bases.md §6
      price_impact: 0.08  # Source: simulation-bases.md §6
      mean_reversion: 0.05  # Source: simulation-bases.md §6
      noise_std: 0.6  # Source: simulation-bases.md §6
      minimum_price: 1.0  # Source: simulation-bases.md §3 positivity constraint
      news_probability: 0.15  # Source: simulation-bases.md §6
      news_impact_range: 4.0  # Source: simulation-bases.md §6
      custom_state_hot_limit: 3  # Source: simulation.yml round_history_limit
  persona: !include persona.yml

# RuleLLM Disposition Biased (Prospect Theory)
rulellm_disposition_investor:
  name: "RuleLLM Disposition Biased"
  class: "examples.DispositionEffect.RuleLLM.players:RuleLLMDispositionBiased"
  num_instances: 3
  config:
    identity: "rulellm_disposition_investor"
    role: player
    steps_per_turn: 1
    group_tags:
      - rulellm_investors
    extras:
      record_path: "EXPERIMENT/DispositionEffect/RuleLLM/records"  # Source: simulation.yml setting.record_path
      initial_cash: 10000.0  # Source: simulation-bases.md §4.1.6
      initial_position: 30.0  # Source: simulation-bases.md §4.1.6
      initial_purchase_price: 100.0  # Source: simulation-bases.md §6
      max_position: 30.0  # Source: simulation-bases.md §4.1.4
      custom_state_hot_limit: 3  # Source: simulation.yml round_history_limit
      gain_threshold: 0.03  # Source: simulation-bases.md §6
      loss_threshold: -0.10  # Source: simulation-bases.md §6
      loss_aversion: 2.25  # Source: simulation-bases.md §6
      sell_fraction_gain: 0.5  # Source: simulation-bases.md §6
      sell_fraction_loss: 0.15  # Source: simulation-bases.md §6
      buy_fraction: 0.15  # Source: simulation-bases.md §4.1.4
      reference_buy_band: 0.01  # Source: simulation-bases.md §4.1.3
      cash_deployment_fraction: 0.15  # Source: simulation-bases.md §4.1.4
      minimum_trade_quantity: 0.5  # Source: implementation granularity constraint
      llm:
        sys_message: "examples.DispositionEffect.RuleLLM.prompts:RULELLM_DISPOSITION_BIASED_SYS"
        user_message: "examples.DispositionEffect.RuleLLM.prompts:RULELLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        max_retries: 3  # Source: implementation reliability constraint
        generation_config:
          temperature: 0.3  # Source: RuleLLM low-variance execution requirement
          max_new_tokens: 500  # Source: canonical response budget
  persona: !include persona.yml

