# =============================================================================
# DispositionEffectLLM Players Configuration
# =============================================================================
# LLM-based Prospect Theory Trading Simulation
# =============================================================================

market:
  archetype: stock-standard-price-impact  # -> masim/agents/defines/market/stock-standard-price-impact.md
  name: "Market with News Shocks"
  class: "examples.DispositionEffect.LLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "${DISPOSITION_LLM_OUTPUT_DIR:-EXPERIMENT/DispositionEffect/LLM}/records"  # Source: implementation infrastructure
      # Market parameters
      initial_price: 100.0  # Source: simulation-bases.md §6
      fundamental_value: 100.0  # Source: simulation-bases.md §6
      price_impact: 0.08  # Source: simulation-bases.md §6
      mean_reversion: 0.05  # Source: simulation-bases.md §6
      noise_std: 0.6  # Source: simulation-bases.md §6
      news_probability: 0.15  # Source: simulation-bases.md §6
      news_impact_range: 4.0  # Source: simulation-bases.md §6
      custom_state_hot_limit: 3  # Source: simulation.yml round_history_limit
  persona: !include persona.yml

llm_disposition_investor:
  name: "LLM Disposition Biased"
  class: "examples.DispositionEffect.LLM.players:LLMDispositionBiased"
  # Expander → llm_disposition_investor_1, llm_disposition_investor_2, llm_disposition_investor_3
  num_instances: 3
  config:
    identity: "llm_disposition_investor"
    role: player
    steps_per_turn: 1
    group_tags:
      - llm_investors
    extras:
      record_path: "${DISPOSITION_LLM_OUTPUT_DIR:-EXPERIMENT/DispositionEffect/LLM}/records"  # Source: implementation infrastructure
      initial_cash: 10000.0  # Source: simulation-bases.md §4.1.6 normalized endowment
      initial_position: 30.0  # Source: simulation-bases.md §4.1.6
      initial_purchase_price: 100.0  # Source: simulation-bases.md §6
      max_position: 60.0  # Source: simulation-bases.md §4.1.4 scaled for LLM
      max_order_quantity: 15.0  # Source: implementation constraint
      custom_state_hot_limit: 3  # Source: simulation.yml round_history_limit
      llm:
        sys_message: "examples.DispositionEffect.LLM.prompts:LLM_DISPOSITION_BIASED_SYS"  # Source: LLM-wiring
        user_message: "examples.DispositionEffect.LLM.prompts:LLM_USER_TEMPLATE"  # Source: LLM-wiring
        lm_type: "api"  # Source: LLM-wiring
        lm_name: "ark/doubao-seed-2-0-mini-260428"  # Source: LLM-wiring
        max_retries: 3  # Source: LLM-wiring
        generation_config:
          temperature: 0.4  # Source: LLM-wiring
          max_new_tokens: 500  # Source: LLM-wiring
  persona: !include persona.yml

