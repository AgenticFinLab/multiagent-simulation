# =============================================================================
# DispositionEffect Simulation Configuration
# =============================================================================

setting:
  name: "disposition_effect_simulation"
  description: "Prospect theory disposition effect demonstration"
  total_rounds: 200
  round_history_limit: 3
  record_path: "EXPERIMENT/DispositionEffect/records"
  save_diagram_interval: 50

environment:
  dotenv_path: .env
  workspace: "."

ray:
  address: null
  namespace: "disposition_effect"
  actor_prefix: null
  # null = Ray auto-detects from machine; actors use num_cpus=0 (async, I/O-bound)
  num_cpus: null
  num_gpus: null
  # Derived: 57 players, star topology -> 112 msgs/round
  #   57 TurnResult + 57 pending_info + 112 Message = 226 Ray objects
  #   226 obj x 64 KB min-alloc = 14464 KB (14.1 MB)
  #   10x headroom = 141 MB; 256 MB floor -> 268435456 bytes
  object_store_memory: 268435456
  include_dashboard: false
  logging_level: "warning"
  log_to_driver: false
  actor_options:
    max_restarts: 3
    max_task_retries: 1
    max_concurrency: 4
  runtime_env:
    working_dir: null
    pip: []
    env_vars: {}
  serialization:
    use_arrow: true
    register_custom_serializers: true

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/DispositionEffect/communication"
  record_messages: true
  message_block_size: 500
