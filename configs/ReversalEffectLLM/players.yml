market:
  name: "Market with Mean Reversion"
  class: "examples.ReversalEffectLLM.players:Market"
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      price_model: "mean_reversion"
  persona: !include persona.yml

llm_contrarian:
  name: "LLM Contrarian Investor"
  class: "examples.ReversalEffectLLM.players:LLMContrarianInvestor"
  config:
    identity: "llm_contrarian"
    role: player
    steps_per_turn: 1
    group_tags:
      - llm_investors
    extras:
      strategy: contrarian
      llm:
        sys_message: "examples.ReversalEffectLLM.prompts:LLM_CONTRARIAN_SYS"
        user_message: "examples.ReversalEffectLLM.prompts:LLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-1-6-lite-251015"
        generation_config:
          temperature: 0.3
          max_new_tokens: 500
  persona: !include persona.yml

