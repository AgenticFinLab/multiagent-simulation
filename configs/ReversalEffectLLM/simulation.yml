# =============================================================================
# ReversalEffectLLM Simulation Configuration
# =============================================================================
# LLM-based Reversal Effect simulation - De Bondt & Thaler (1985)
# Tests: Overreaction, long-term mean reversion, contrarian profits
#
# Usage:
#   python examples/ReversalEffectLLM/run_reversal_llm.py -c configs/ReversalEffectLLM/simulation.yml
# =============================================================================

setting:
  name: "reversal_effect_llm_simulation"
  description: "LLM-based reversal effect with overreaction dynamics"
  total_rounds: 100
  round_history_limit: 3
  record_path: "EXPERIMENT/ReversalEffectLLM/records"
  save_diagram_interval: 100

environment:
  dotenv_path: .env
  workspace: "."

ray:
  address: null
  namespace: "reversal_effect_llm"
  actor_prefix: null
  # null = Ray auto-detects from machine; actors use num_cpus=0 (async, I/O-bound)
  num_cpus: null
  num_gpus: null
  # Derived: 14 players, star topology -> 26 msgs/round
  #   14 TurnResult + 14 pending_info + 26 Message = 54 Ray objects
  #   54 obj x 64 KB min-alloc = 3456 KB (3.38 MB) base peak
  #   LLM TurnResult also carries prompt+response strings (~4-8 KB each) -> extra overhead
  #   Minimum 512 MB floor for LLM simulations -> 536870912 bytes
  object_store_memory: 536870912
  include_dashboard: false
  logging_level: "warning"
  log_to_driver: false
  actor_options:
    max_restarts: 3
    max_task_retries: 1
    max_concurrency: 10
  runtime_env:
    working_dir: null
    pip: []
    env_vars: {}
  serialization:
    use_arrow: true
    register_custom_serializers: true

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/ReversalEffectLLM/communication"
  record_messages: true
  message_block_size: 500
