# =============================================================================
# ReversalEffectLLM Simulation Configuration
# =============================================================================
# LLM-based Reversal Effect simulation - De Bondt & Thaler (1985)
# Tests: Overreaction, long-term mean reversion, contrarian profits
#
# Usage:
#   python examples/ReversalEffectLLM/run_reversal_llm.py -c configs/ReversalEffectLLM/simulation.yml
# =============================================================================

setting:
  name: "reversal_effect_llm_simulation"
  description: "LLM-based reversal effect with overreaction dynamics"
  total_rounds: 50
  round_history_limit: 3
  record_path: "EXPERIMENT/ReversalEffectLLM/records"
  save_diagram_interval: 25

environment:
  dotenv_path: .env
  workspace: "."

ray:
  address: null
  namespace: "reversal_effect_llm"
  actor_prefix: null
  num_cpus: 4
  num_gpus: null
  object_store_memory: null
  include_dashboard: false
  logging_level: "warning"
  log_to_driver: true
  actor_options:
    max_restarts: 3
    max_task_retries: 1
    max_concurrency: 10
  runtime_env:
    working_dir: null
    pip: []
    env_vars: {}
  serialization:
    use_arrow: true
    register_custom_serializers: true

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/ReversalEffectLLM/communication"
