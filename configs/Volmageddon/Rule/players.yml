# Volmageddon Rule Agent Configuration

market:
  name: "Market"
  class: "examples.Volmageddon.Rule.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    extras:
      initial_price: 15.0
      fundamental_value: 15.0
      price_impact: 0.04
      mean_reversion: 0.03
      noise_std: 0.05

short_vol_trader_1:
  name: "ShortVolTrader 1"
  class: "examples.Volmageddon.Rule.players:ShortVolTrader"
  num_instances: 2
  config:
    identity: "short_vol_trader_1"
    role: player
    extras:
      initial_cash: 1000000.00
      initial_position: 0
      initial_price: 15.0
      fundamental_value: 15.0

      stop_loss: 0.15
vol_e_t_n_manager_2:
  name: "VolETNManager 2"
  class: "examples.Volmageddon.Rule.players:VolETNManager"
  num_instances: 2
  config:
    identity: "vol_e_t_n_manager_2"
    role: player
    extras:
      initial_cash: 1000000.00
      initial_position: 0
      initial_price: 15.0
      fundamental_value: 15.0

      rebalance_size: 10000
      rebalance_threshold: 0.05
long_vol_hedger_3:
  name: "LongVolHedger 3"
  class: "examples.Volmageddon.Rule.players:LongVolHedger"
  num_instances: 1
  config:
    identity: "long_vol_hedger_3"
    role: player
    extras:
      initial_cash: 1000000.00
      initial_position: 0
      initial_price: 15.0
      fundamental_value: 15.0

      hedge_ratio: 0.1
vol_arbitrageur_4:
  name: "VolArbitrageur 4"
  class: "examples.Volmageddon.Rule.players:VolArbitrageur"
  num_instances: 2
  config:
    identity: "vol_arbitrageur_4"
    role: player
    extras:
      initial_cash: 1000000.00
      initial_position: 0
      initial_price: 15.0
      fundamental_value: 15.0

      entry_threshold: 0.05
equity_trader_5:
  name: "EquityTrader 5"
  class: "examples.Volmageddon.Rule.players:EquityTrader"
  num_instances: 2
  config:
    identity: "equity_trader_5"
    role: player
    extras:
      initial_cash: 1000000.00
      initial_position: 0
      initial_price: 15.0
      fundamental_value: 15.0

      risk_limit: 0.1
