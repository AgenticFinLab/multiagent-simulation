      initial_price: 15.0        # Source: target §6 initial_price row; normalization (scale-only)
      fundamental_value: 15.0    # Source: target §6 fundamental_value row; normalization (scale-only)
      rebalance_size: 10000      # Source: target §6 rebalance_size row; Culp, Nozawa & Veronesi (2018) 10.3905/jai.2018.21.2.001
      rebalance_threshold: 0.05  # Source: target §6 rebalance_threshold row; Brunnermeier & Pedersen (2009) 10.1093/rfs/hhn098

