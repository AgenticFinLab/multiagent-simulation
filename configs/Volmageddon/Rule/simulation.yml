# Volmageddon Rule Simulation Configuration
#
# February 5, 2018 - VIX spiked 115%, XIV ETN lost 90%+ in after-hours trading
#
# Usage:
#   python examples/Volmageddon/Rule/run_volmageddon.py \
#       -c configs/Volmageddon/Rule/simulation.yml

setting:
  name: "Volmageddon-Rule"
  description: "Volmageddon simulation with VIX ETN blowup, short volatility crowd, and reverse feedback loop"
  total_rounds: 200
  
  record_path: "EXPERIMENT/Volmageddon/Rule/records"
  storage_path: "EXPERIMENT/Volmageddon/Rule/communication"
  
  log_level: "INFO"
  log_to_file: true
  log_path: "EXPERIMENT/Volmageddon/Rule/logs"

environment:
  dotenv_path: ".env"
  workspace: "."

ray:
  namespace: "volmageddon_rule"
  ignore_reinit_error: true
  object_store_memory: 536870912
  num_cpus: 4

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/Volmageddon/Rule/communication"
  record_messages: true
  message_timeout_ms: 5000
  max_retries: 3
