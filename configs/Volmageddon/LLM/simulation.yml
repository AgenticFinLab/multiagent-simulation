# Volmageddon LLM Simulation Configuration
#
# February 5, 2018 - VIX spiked 115%, XIV ETN lost 90%+ in after-hours trading
#
# Usage:
#   python examples/Volmageddon/LLM/run_volmageddon_llm.py \
#       -c configs/Volmageddon/LLM/simulation.yml

setting:
  name: "Volmageddon-LLM"
  description: "Volmageddon simulation with VIX ETN blowup, short volatility crowd, and reverse feedback loop"
  total_rounds: 200
  
  record_path: "EXPERIMENT/Volmageddon/LLM/records"
  storage_path: "EXPERIMENT/Volmageddon/LLM/communication"
  
  log_level: "INFO"
  log_to_file: true
  log_path: "EXPERIMENT/Volmageddon/LLM/logs"

environment:
  dotenv_path: ".env"
  workspace: "."

llm:
  model: "doubao-pro-32k"
  temperature: 0.3
  max_tokens: 500
  timeout: 30

ray:
  namespace: "volmageddon_llm"
  ignore_reinit_error: true
  object_store_memory: 536870912
  num_cpus: 4

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/Volmageddon/LLM/communication"
  record_messages: true
  message_timeout_ms: 30000
  max_retries: 3
