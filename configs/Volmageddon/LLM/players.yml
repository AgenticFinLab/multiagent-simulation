# Volmageddon LLM Agent Configuration

market:
  name: "Market"
  class: "examples.Volmageddon.LLM.players:Market"
  num_instances: 1
  persona: !include persona.yml
  config:
    identity: "market"
    role: coordinator
    extras:
      initial_price: 15.0
      fundamental_value: 15.0
      price_impact: 0.04
      mean_reversion: 0.03
      noise_std: 0.05

short_vol_trader_1:
  name: "ShortVolTrader 1"
  class: "examples.Volmageddon.LLM.players:LLMShortVolTrader"
  num_instances: 2
  persona: !include persona.yml
  config:
    identity: "short_vol_trader_1"
    role: player
    extras:
      initial_cash: 1000000.00
      initial_position: 0
      initial_price: 15.0
      fundamental_value: 15.0
      agent_type: "short_vol_trader"
      llm: &volmageddon_llm_config
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.3
          max_new_tokens: 600


