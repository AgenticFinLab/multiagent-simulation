# Volmageddon Rag Agent Configuration

knowledge: &volmageddon_knowledge
  backend: "local"
  global_uri: "examples/document-sources"
  resource_csv:
    - "examples/document-sources/books.csv"
    - "examples/document-sources/source"
  preprocessing:
    parser: "mineru"
    timeout_per_page: 30
    max_pages: 250
    output_position: "MinerU_processed"
  rag:
    output_position: "rag_index"
    embed_type: "litellm"
    embed_model: "openai/hunyuan-embedding"
    embed_api_key: "{{ HUNYUAN_API_KEY }}"
    embed_api_base: "https://api.hunyuan.cloud.tencent.com/v1"
    chunk_size: 512
    chunk_overlap: 64
    top_k: 5

market:
  name: "Market"
  class: "examples.Volmageddon.Rag.players:Market"
  num_instances: 1
  persona: !include persona.yml
  config:
    identity: "market"
    role: coordinator
    extras:
      initial_price: 15.0
      fundamental_value: 15.0
      price_impact: 0.04
      mean_reversion: 0.03
      noise_std: 0.05

short_vol_trader_1:
  name: "ShortVolTrader 1"
  class: "examples.Volmageddon.Rag.players:RagLLMShortVolTrader"
  num_instances: 2
  persona: !include persona.yml
  config:
    identity: "short_vol_trader_1"
    role: player
    extras:
      record_path: "EXPERIMENT/Volmageddon/Rag/records"
      initial_cash: 1000000.00
      initial_position: 0
      initial_price: 15.0
      fundamental_value: 15.0
      agent_type: "short_vol_trader"
      knowledge: *volmageddon_knowledge
      private_knowledge: &volmageddon_private_knowledge
        from_global_resources:
          - "MinerU_processed"
        local_resources:
          local_uri: ""
          local_resources: []
        rag:
          from_global_index_dir:
            - "rag_index"
          local_index_dir: ""
          embed_type: "litellm"
          embed_model: "openai/hunyuan-embedding"
          embed_api_key: "{{ HUNYUAN_API_KEY }}"
          embed_api_base: "https://api.hunyuan.cloud.tencent.com/v1"
          chunk_size: 512
          chunk_overlap: 64
          top_k: 5
      llm: &volmageddon_rag_llm_config
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.3
          max_new_tokens: 600


