# Volmageddon RuleLLM Agent Configuration

market:
  name: "Market"
  class: "examples.Volmageddon.RuleLLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    extras:
      initial_price: 15.0
      fundamental_value: 15.0
      price_impact: 0.04
      mean_reversion: 0.03
      noise_std: 0.05

short_vol_trader_1:
  name: "ShortVolTrader 1"
  class: "examples.Volmageddon.RuleLLM.players:LLMShortVolTrader"
  num_instances: 2
  config:
    identity: "short_vol_trader_1"
    role: player
    extras:
      initial_cash: 1000000.00
      initial_position: 0
      agent_type: "short_vol_trader"
      llm:
        model: "doubao-pro-32k"


