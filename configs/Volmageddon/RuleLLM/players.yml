# Volmageddon RuleLLM Agent Configuration

market:
  archetype: derivatives-vol-feedback  # -> masim/agents/defines/market/derivatives-vol-feedback.md
  name: "Market"
  class: "examples.Volmageddon.RuleLLM.players:Market"
  num_instances: 1
  persona: !include persona.yml
  config:
    identity: "market"
    role: coordinator
    extras:
      initial_price: 15.0        # Source: target §6 initial_price row; normalization (scale-only)
      fundamental_value: 15.0    # Source: target §6 fundamental_value row; normalization (scale-only)
      price_impact: 0.04         # Source: target §6 price_impact row; Brunnermeier & Pedersen (2009) 10.1093/rfs/hhn098
      mean_reversion: 0.03       # Source: target §6 mean_reversion row; Culp, Nozawa & Veronesi (2018) 10.3905/jai.2018.21.2.001
      noise_std: 0.05            # Source: target §6 noise_std row; Engle (1982) 10.2307/1912773

rulellm_short_vol_trader:
  name: "ShortVolTrader 1"
  class: "examples.Volmageddon.RuleLLM.players:RuleLLMShortVolTrader"
  num_instances: 2
  persona: !include persona.yml
  config:
    identity: "rulellm_short_vol_trader"
    role: player
    extras:
      initial_cash: 1000000.00   # Source: target §4.1.6 scenario normalization
      initial_position: 0        # Source: target §4.1.6 scenario normalization
      initial_price: 15.0        # Source: target §6 initial_price row; normalization (scale-only)
      fundamental_value: 15.0    # Source: target §6 fundamental_value row; normalization (scale-only)
      agent_type: "short_vol_trader"   # Source: target §4.1.5.0 I/O Contract agent_type field
      llm: &volmageddon_rulellm_config # Source: target §10.1 RuleLLM variant declaration
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.3
          max_new_tokens: 600


