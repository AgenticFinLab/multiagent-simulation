# Volmageddon RuleLLM Simulation Configuration
#
# February 5, 2018 - VIX spiked 115%, XIV ETN lost 90%+ in after-hours trading
#
# Usage:
#   python examples/Volmageddon/RuleLLM/run_volmageddon_rulellm.py \
#       -c configs/Volmageddon/RuleLLM/simulation.yml

setting:
  name: "Volmageddon-RuleLLM"
  description: "Volmageddon simulation with VIX ETN blowup, short volatility crowd, and reverse feedback loop"
  total_rounds: 200
  round_history_limit: 3
  save_diagram_interval: 50
  
  record_path: "EXPERIMENT/Volmageddon/RuleLLM/records"
  storage_path: "EXPERIMENT/Volmageddon/RuleLLM/communication"
  
  log_level: "INFO"
  log_to_file: true
  log_path: "EXPERIMENT/Volmageddon/RuleLLM/logs"

environment:
  dotenv_path: ".env"
  workspace: "."

llm:
  model: "doubao-pro-32k"
  temperature: 0.3
  max_tokens: 500
  timeout: 30

ray:
  namespace: "volmageddon_rulellm"
  ignore_reinit_error: true
  object_store_memory: 536870912
  num_cpus: 4

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/Volmageddon/RuleLLM/communication"
  record_messages: true
  message_block_size: 500
