# LUNACollapse RuleLLM Agent Configuration

market:
  name: "Market"
  class: "examples.LUNACollapse.RuleLLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/LUNACollapse/RuleLLM/records"
      initial_price: 100.0
      fundamental_value: 100.0
      price_impact: 0.04
      mean_reversion: 0.005
      noise_std: 0.015
      custom_state_hot_limit: 3
  persona: !include persona.yml

stablecoinholder:
  name: "StablecoinHolder"
  class: "examples.LUNACollapse.RuleLLM.players:RuleLLMStablecoinHolder"
  num_instances: 3
  config:
    identity: "stablecoinholder"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/LUNACollapse/RuleLLM/records"
      initial_cash: 1000000.0
      initial_position: 1000
      initial_price: 100.0
      fundamental_value: 100.0
      redemption_threshold: 0.05
      base_size: 500
      custom_state_hot_limit: 3
      llm:
        sys_message: "examples.LUNACollapse.RuleLLM.prompts:RULELLM_STABLECOINHOLDER_PROMPT"
        user_message: "examples.LUNACollapse.RuleLLM.prompts:RULELLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.3
          max_tokens: 600
  persona: !include persona.yml

