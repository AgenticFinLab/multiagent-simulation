# LUNACollapse Rule Agent Configuration

market:
  archetype: crypto-algostable-depeg  # -> masim/agents/defines/market/crypto-algostable-depeg.md
  name: "Market"
  class: "examples.LUNACollapse.Rule.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/LUNACollapse/Rule/records"  # Source: framework infrastructure
      initial_price: 100.0  # Source: simulation-bases.md §6
      fundamental_value: 100.0  # Source: simulation-bases.md §6
      price_impact: 0.04  # Source: simulation-bases.md §6
      mean_reversion: 0.005  # Source: simulation-bases.md §6
      noise_std: 0.015  # Source: simulation-bases.md §6
      market_depth: 100.0  # Source: target §9 / simulation-bases.md §3.1
      random_seed: 20260720  # Source: target §9 reproducibility invariant
      price_floor: 0.01  # Source: target §9 positive-price invariant
      shock_schedule:  # Source: target §6.1 / §9 controlled May 2022 depeg stimulus
        20: -0.06
        21: -0.05
        22: -0.04
        23: -0.03
      custom_state_hot_limit: 3  # Source: framework infrastructure
  persona: !include persona.yml

