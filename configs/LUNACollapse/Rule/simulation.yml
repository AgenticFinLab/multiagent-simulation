# LUNACollapse Rule Simulation Configuration
#
# May 2022 Terra/LUNA crash - $40B wiped out in algorithmic stablecoin death spiral
#
# Usage:
#   python examples/LUNACollapse/Rule/run_lunacollapse.py \
#       -c configs/LUNACollapse/Rule/simulation.yml

setting:
  name: "LUNACollapse-Rule"
  description: "Terra/LUNA collapse simulation with algorithmic stablecoin death spiral and DeFi contagion"
  total_rounds: 200
  
  record_path: "EXPERIMENT/LUNACollapse/Rule/records"
  storage_path: "EXPERIMENT/LUNACollapse/Rule/communication"
  
  log_level: "INFO"
  log_to_file: true
  log_path: "EXPERIMENT/LUNACollapse/Rule/logs"

environment:
  dotenv_path: ".env"
  workspace: "."

ray:
  namespace: "lunacollapse_rule"
  ignore_reinit_error: true
  object_store_memory: 536870912
  num_cpus: 4

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/LUNACollapse/Rule/communication"
  record_messages: true
  message_timeout_ms: 5000
  max_retries: 3
