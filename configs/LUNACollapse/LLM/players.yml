# LUNACollapse LLM Agent Configuration

market:
  name: "Market"
  class: "examples.LUNACollapse.LLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    extras:
      initial_price: 100.0
      fundamental_value: 100.0
      price_impact: 0.05
      mean_reversion: 0.005
      noise_std: 0.02

stablecoin_holder_1:
  name: "StablecoinHolder 1"
  class: "examples.LUNACollapse.LLM.players:LLMStablecoinHolder"
  num_instances: 2
  config:
    identity: "stablecoin_holder_1"
    role: player
    extras:
      initial_cash: 1000000.00
      initial_position: 0
      agent_type: "stablecoin_holder"
      llm:
        model: "doubao-pro-32k"


