# =============================================================================
# VolatilityClusteringLLM Simulation Configuration
# =============================================================================
# LLM-powered GARCH-like volatility clustering simulation.
#
# Usage:
#   python examples/VolatilityClusteringLLM/run_volatility_llm.py -c configs/VolatilityClusteringLLM/simulation.yml
# =============================================================================

setting:
  name: "volatility_clustering_llm_simulation"
  description: "LLM-based GARCH volatility dynamics through heterogeneous agents"
  total_rounds: 50
  entry_limit: 10
  record_path: "EXPERIMENT/VolatilityClusteringLLM/records"
  save_diagram_interval: 25

environment:
  dotenv_path: .env
  workspace: "."

ray:
  address: null
  namespace: "volatility_clustering_llm"
  actor_prefix: null
  num_cpus: 4
  num_gpus: null
  object_store_memory: null
  include_dashboard: false
  logging_level: "warning"
  log_to_driver: true
  actor_options:
    max_restarts: 3
    max_task_retries: 1
    max_concurrency: 10
  runtime_env:
    working_dir: null
    pip: []
    env_vars: {}
  serialization:
    use_arrow: true
    register_custom_serializers: true

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/VolatilityClusteringLLM/communication"
