# =============================================================================
# VolatilityClusteringLLM Simulation Configuration
# =============================================================================
# LLM-powered GARCH-like volatility clustering simulation.
#
# Usage:
#   python examples/VolatilityClusteringLLM/run_volatility_llm.py -c configs/VolatilityClusteringLLM/simulation.yml
# =============================================================================

setting:
  name: "volatility_clustering_llm_simulation"
  description: "LLM-based GARCH volatility dynamics through heterogeneous agents"
  total_rounds: 50
  round_history_limit: 3
  record_path: "EXPERIMENT/VolatilityClusteringLLM/records"
  save_diagram_interval: 25

environment:
  dotenv_path: .env
  workspace: "."

ray:
  address: null
  namespace: "volatility_clustering_llm"
  actor_prefix: null
  # null = Ray auto-detects from machine; actors use num_cpus=0 (async, I/O-bound)
  num_cpus: null
  num_gpus: null
  # Derived: 7 players, star topology -> 12 msgs/round
  #   7 TurnResult + 7 pending_info + 12 Message = 26 Ray objects
  #   26 obj x 64 KB min-alloc = 1664 KB (1.62 MB) base peak
  #   LLM TurnResult also carries prompt+response strings (~4-8 KB each) -> extra overhead
  #   Minimum 512 MB floor for LLM simulations -> 536870912 bytes
  object_store_memory: 536870912
  include_dashboard: false
  logging_level: "warning"
  log_to_driver: false
  actor_options:
    max_restarts: 3
    max_task_retries: 1
    max_concurrency: 10
  runtime_env:
    working_dir: null
    pip: []
    env_vars: {}
  serialization:
    use_arrow: true
    register_custom_serializers: true

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/VolatilityClusteringLLM/communication"
  record_messages: true
  message_block_size: 500
