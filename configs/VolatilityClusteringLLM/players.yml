# =============================================================================
# VolatilityClusteringLLM Players Configuration
# =============================================================================
# LLM-powered Heterogeneous Agent Model for GARCH-like Volatility Clustering
#
# LLM Investor Types:
#   - Market:               Rule-based coordinator with GARCH volatility
#   - LLMFundamentalist:    Slow mean reversion (stabilizing, delayed)
#   - LLMTrendFollower:     Fast momentum, vol-sensitive (destabilizing)
#   - LLMNoiseTrader:       Random liquidity (neutral)
#   - LLMSlowAdapter:       Conservative, delayed (weak stabilizing)
#   - LLMVolatilityTrader:  Trades vol regime (weak stabilizing)
# =============================================================================

# -----------------------------------------------------------------------------
# Market (Coordinator) - Rule-Based with GARCH Volatility
# -----------------------------------------------------------------------------
market:
  name: "Market"
  class: "examples.VolatilityClusteringLLM.players:Market"
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/VolatilityClusteringLLM/records"
      fundamental_value: 100.0
      initial_price: 100.0
      price_impact: 0.05
      mean_reversion: 0.02
      garch_omega: 0.0001
      garch_alpha: 0.15
      garch_beta: 0.80
      min_volatility: 0.5
      max_volatility: 10.0
      history_limit: 200
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# LLM Fundamentalist - Slow Mean Reversion
# -----------------------------------------------------------------------------
llm_fundamentalist:
  name: "LLM Fundamentalist"
  class: "examples.VolatilityClusteringLLM.players:LLMFundamentalist"
  config:
    identity: "llm_fundamentalist"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/VolatilityClusteringLLM/records"
      initial_cash: 10000.0
      initial_position: 0.0
      history_limit: 100
      llm:
        sys_message: "examples.VolatilityClusteringLLM.prompts:LLM_FUNDAMENTALIST_SYS"
        user_message: "examples.VolatilityClusteringLLM.prompts:LLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-1-6-lite-251015"
        generation_config:
          temperature: 0.3
          max_new_tokens: 500
  persona: !include persona.yml

