# =============================================================================
# LiquidityDryupLLM Players Configuration
# =============================================================================

market:
  name: "Market with Liquidity Dynamics"
  class: "examples.LiquidityDryupLLM.players:Market"
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/LiquidityDryupLLM/records"
      fundamental_value: 100.0
      initial_price: 100.0
      price_impact: 0.08
      mean_reversion: 0.015
      noise_std: 0.4
      history_limit: 200
  persona: !include persona.yml

llm_market_maker:
  name: "LLM Market Maker"
  class: "examples.LiquidityDryupLLM.players:LLMMarketMaker"
  config:
    identity: "llm_market_maker"
    role: player
    steps_per_turn: 1
    group_tags:
      - llm_investors
    extras:
      record_path: "EXPERIMENT/LiquidityDryupLLM/records"
      initial_cash: 10000.0
      initial_position: 50.0
      history_limit: 100
      llm:
        sys_message: "examples.LiquidityDryupLLM.prompts:LLM_MARKET_MAKER_SYS"
        user_message: "examples.LiquidityDryupLLM.prompts:LLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-1-6-lite-251015"
        generation_config:
          temperature: 0.3
          max_new_tokens: 500
  persona: !include persona.yml

