market:
  name: "Market with Liquidity Dynamics"
  class: "examples.LiquidityDryupLLM.players:Market"
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      price_model: "liquidity_dependent"
  persona: !include persona.yml

llm_market_maker:
  name: "LLM Market Maker"
  class: "examples.LiquidityDryupLLM.players:LLMMarketMaker"
  config:
    identity: "llm_market_maker"
    role: player
    steps_per_turn: 1
    group_tags:
      - llm_investors
    extras:
      strategy: market_maker
      llm:
        sys_message: "examples.LiquidityDryupLLM.prompts:LLM_MARKET_MAKER_SYS"
        user_message: "examples.LiquidityDryupLLM.prompts:LLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-1-6-lite-251015"
        generation_config:
          temperature: 0.3
          max_new_tokens: 500
  persona: !include persona.yml

