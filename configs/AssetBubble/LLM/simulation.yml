# =============================================================================
# AssetBubbleLLM Simulation Configuration
# =============================================================================
# LLM-based Asset Bubble simulation
# Tests: Greater Fool Theory, Limits to Arbitrage, Noise Trader Risk
#
# Usage:
#   python examples/AssetBubble/LLM/run_bubble_llm.py -c configs/AssetBubble/LLM/simulation.yml
# =============================================================================

setting:
  name: "asset_bubble_llm_simulation"
  description: "LLM-based asset bubble formation with heterogeneous investors"
  total_rounds: 200
  round_history_limit: 3
  record_path: "EXPERIMENT/AssetBubble/LLM/records"
  save_diagram_interval: 50

environment:
  dotenv_path: .env
  workspace: "."

ray:
  address: null
  namespace: "asset_bubble_llm"
  actor_prefix: null
  # null = Ray auto-detects from machine; actors use num_cpus=0 (async, I/O-bound)
  num_cpus: null
  num_gpus: null
  # Derived: 18 players, star topology -> 34 msgs/round
  #   18 TurnResult + 18 pending_info + 34 Message = 70 Ray objects
  #   70 obj x 64 KB min-alloc = 4480 KB (4.38 MB) base peak
  #   LLM TurnResult also carries prompt+response strings (~4-8 KB each) -> extra overhead
  #   Minimum 512 MB floor for LLM simulations -> 536870912 bytes
  object_store_memory: 536870912
  include_dashboard: false
  logging_level: "warning"
  log_to_driver: false
  actor_options:
    max_restarts: 3
    max_task_retries: 1
    max_concurrency: 10
  runtime_env:
    working_dir: null
    pip: []
    env_vars: {}
  serialization:
    use_arrow: true
    register_custom_serializers: true

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/AssetBubble/LLM/communication"
  record_messages: true
  message_block_size: 500
