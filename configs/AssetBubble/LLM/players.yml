# =============================================================================
# AssetBubbleLLM Players Configuration
# =============================================================================
# 1 Market (rule-based) + 6 LLM Bubble Investors
# =============================================================================

# Market (rule-based)
market:
  name: "Market"
  class: "examples.AssetBubble.LLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/AssetBubble/LLM/records"
      # Market parameters
      fundamental_value: 100.0
      initial_price: 100.0
      price_impact: 0.15
      mean_reversion: 0.005
      fundamental_growth: 0.001
      noise_std: 0.3
      short_cost_rate: 0.02
      custom_state_hot_limit: 3
  persona: !include persona.yml

# LLM Greater Fool Speculator
llm_momentum_speculator:
  name: "LLM Greater Fool Speculator"
  class: "examples.AssetBubble.LLM.players:LLMMomentumSpeculator"
  # Expander → llm_greater_fool_1 .. llm_greater_fool_5
  num_instances: 5
  config:
    identity: "llm_momentum_speculator"
    role: player
    steps_per_turn: 1
    group_tags:
      - llm_investors
    extras:
      record_path: "EXPERIMENT/AssetBubble/LLM/records"
      initial_cash: 10000.0
      initial_position: 0.0
      custom_state_hot_limit: 3
      llm:
        sys_message: "examples.AssetBubble.LLM.prompts:LLM_GREATER_FOOL_SYS"
        user_message: "examples.AssetBubble.LLM.prompts:LLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.3
          max_new_tokens: 500
  persona: !include persona.yml

