# =============================================================================
# AssetBubbleLLM Players Configuration
# =============================================================================
# 1 Market (rule-based) + 6 LLM Bubble Investors
# =============================================================================

# Market (rule-based)
market:
  archetype: stock-standard-price-impact  # -> masim/agents/defines/market/stock-standard-price-impact.md
  name: "Market"
  class: "examples.AssetBubble.LLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/AssetBubble/LLM/records"  # Source: implementation infrastructure (record path convention per 07-step3-config.md §3.7)
      # Market parameters (price formula P(t+1) = P(t) + λ·D(t) + γ·[F(t)-P(t)] + ε)
      fundamental_value: 100.0    # Source: target §9 / simulation-bases.md §3.1 (normalization, 100-scale index)
      initial_price: 100.0        # Source: target §9 / simulation-bases.md §3.1 (normalization, starts at fair value)
      price_impact: 0.15          # Source: target §9 lambda; De Long et al. (1990) https://doi.org/10.1086/261703
      mean_reversion: 0.005       # Source: target §9 gamma; Abreu & Brunnermeier (2003) https://doi.org/10.1111/1468-0262.00393
      fundamental_growth: 0.001   # Source: target §9 g; Shiller (2000) Irrational Exuberance
      noise_std: 0.3              # Source: target §9 sigma; De Long et al. (1990) https://doi.org/10.1086/261703
      short_cost_rate: 0.02       # Source: target §9 c_short; D'Avolio (2002) https://doi.org/10.1016/S0304-405X(02)00257-4
      custom_state_hot_limit: 3   # Source: implementation infrastructure (hot-state ring buffer)
  persona: !include persona.yml

# LLM Momentum Speculator (§4.1 anchor: Jegadeesh & Titman 1993)
llm_momentum_speculator:
  name: "LLM Momentum Speculator"
  class: "examples.AssetBubble.LLM.players:LLMMomentumSpeculator"
  # Expander → llm_momentum_speculator_1 .. llm_momentum_speculator_5
  num_instances: 5
  config:
    identity: "llm_momentum_speculator"
    role: player
    steps_per_turn: 1
    group_tags:
      - llm_investors
    extras:
      record_path: "EXPERIMENT/AssetBubble/LLM/records"  # Source: implementation infrastructure (record path)
      initial_cash: 10000.0        # Source: target §9 initial_equity (portfolio normalization)
      initial_position: 0.0        # Source: target §7 momentum-speculator Intent line (zero-position start)
      custom_state_hot_limit: 3    # Source: implementation infrastructure (hot-state ring buffer)
      llm:
        sys_message: "examples.AssetBubble.LLM.prompts:LLM_GREATER_FOOL_SYS"  # Source: LLM wiring — persona prompt for momentum-speculator archetype
        user_message: "examples.AssetBubble.LLM.prompts:LLM_USER_TEMPLATE"    # Source: LLM wiring — shared user prompt template
        lm_type: "api"                             # Source: LLM wiring — inference mode (remote API)
        lm_name: "ark/doubao-seed-2-0-mini-260428" # Source: LLM wiring — model identifier (ARK Doubao Seed-2 mini)
        generation_config:
          temperature: 0.3         # Source: LLM wiring — sampling temperature (low for structured decisions)
          max_new_tokens: 500      # Source: LLM wiring — response length cap
  persona: !include persona.yml

