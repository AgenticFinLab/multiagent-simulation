# =============================================================================
# AssetBubbleLLM - Topology Configuration
# =============================================================================
# Star topology: Market broadcasts to all LLM investors
# =============================================================================

type: "star"

sources:
  - market

connections:
  market:
    - llm_greater_fool
    - llm_arbitrageur
    - llm_sentiment
    - llm_value
    - llm_leveraged

  llm_greater_fool:
    - market

  llm_arbitrageur:
    - market

  llm_sentiment:
    - market

  llm_value:
    - market

  llm_leveraged:
    - market
