# =============================================================================
# AssetBubble Players Configuration
# =============================================================================
# Heterogeneous agents for asset bubble simulation
#
# Investor Types (with market impact):
#   - Market: Rule-based coordinator (bubble-prone dynamics)
#   - MomentumSpeculator: Aggressive trend chaser (DESTABILIZING)
#   - RationalArbitrageur: Limited short seller (WEAK STABILIZING)
#   - NoiseTrader: Sentiment/herd follower (DESTABILIZING)
#   - FundamentalInvestor: Slow value anchor (WEAK STABILIZING)
#   - LeveragedBuyer: Margin-amplified (STRONGLY DESTABILIZING)
#   - ConservativeHolder: Long-term stable (VERY WEAK STABILIZING)
# =============================================================================

# -----------------------------------------------------------------------------
# Market (Coordinator)
# -----------------------------------------------------------------------------
market:
  name: "Market"
  class: "examples.AssetBubble.players:Market"
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/AssetBubble/records"
      # Market dynamics parameters
      fundamental_value: 100.0
      initial_price: 100.0
      price_impact: 0.15        # High: demand strongly affects price
      mean_reversion: 0.005     # Low: slow correction to fundamental
      fundamental_growth: 0.001 # Slow fundamental appreciation
      noise_std: 0.3
      short_cost_rate: 0.02     # Cost of borrowing shares to short
      custom_state_hot_limit: 3
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Momentum Speculators (Primary Bubble Drivers)
# -----------------------------------------------------------------------------
momentum_speculator_1:
  name: "Momentum Speculator 1"
  class: "examples.AssetBubble.players:MomentumSpeculator"
  config:
    identity: "momentum_speculator_1"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/AssetBubble/records"
      # Investor base parameters
      initial_cash: 10000.0
      initial_position: 0.0
      custom_state_hot_limit: 3
      # MomentumSpeculator specific parameters
      lookback_short: 3
      aggressiveness: 2.0       # High: amplifies momentum signals
      base_position_size: 50.0  # Large positions
      leverage_multiplier: 1.5  # Uses leverage
  persona: !include persona.yml

momentum_speculator_2:
  name: "Momentum Speculator 2"
  class: "examples.AssetBubble.players:MomentumSpeculator"
  config:
    identity: "momentum_speculator_2"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/AssetBubble/records"
      # Investor base parameters
      initial_cash: 10000.0
      initial_position: 0.0
      custom_state_hot_limit: 3
      # MomentumSpeculator specific parameters
      lookback_short: 3
      aggressiveness: 2.0
      base_position_size: 50.0
      leverage_multiplier: 1.5
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Rational Arbitrageur (Limited Corrective Force)
# -----------------------------------------------------------------------------
rational_arbitrageur:
  name: "Rational Arbitrageur"
  class: "examples.AssetBubble.players:RationalArbitrageur"
  config:
    identity: "rational_arbitrageur"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/AssetBubble/records"
      # Investor base parameters
      initial_cash: 10000.0
      initial_position: 0.0
      custom_state_hot_limit: 3
      # RationalArbitrageur specific parameters
      deviation_threshold: 0.10     # Only act on >10% deviation
      base_position_size: 25.0      # Moderate size (limited capital)
      max_short_position: 40.0      # Limited short capacity
      short_cost_sensitivity: 0.5   # How much short cost affects decision
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Noise Traders (Herd Followers)
# -----------------------------------------------------------------------------
noise_trader_1:
  name: "Noise Trader 1"
  class: "examples.AssetBubble.players:NoiseTrader"
  config:
    identity: "noise_trader_1"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/AssetBubble/records"
      # Investor base parameters
      initial_cash: 10000.0
      initial_position: 0.0
      custom_state_hot_limit: 3
      # NoiseTrader specific parameters
      sentiment_volatility: 0.3
      herding_weight: 0.6       # How much to follow recent returns
      base_position_size: 20.0
  persona: !include persona.yml

noise_trader_2:
  name: "Noise Trader 2"
  class: "examples.AssetBubble.players:NoiseTrader"
  config:
    identity: "noise_trader_2"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/AssetBubble/records"
      # Investor base parameters
      initial_cash: 10000.0
      initial_position: 0.0
      custom_state_hot_limit: 3
      # NoiseTrader specific parameters
      sentiment_volatility: 0.3
      herding_weight: 0.6
      base_position_size: 20.0
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Fundamental Investor (Weak Anchor)
# -----------------------------------------------------------------------------
fundamental_investor:
  name: "Fundamental Investor"
  class: "examples.AssetBubble.players:FundamentalInvestor"
  config:
    identity: "fundamental_investor"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/AssetBubble/records"
      # Investor base parameters
      initial_cash: 10000.0
      initial_position: 0.0
      custom_state_hot_limit: 3
      # FundamentalInvestor specific parameters
      trade_frequency: 5        # Trade every N rounds
      value_sensitivity: 0.3
      base_position_size: 15.0
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Leveraged Buyer (Amplifier)
# -----------------------------------------------------------------------------
leveraged_buyer:
  name: "Leveraged Buyer"
  class: "examples.AssetBubble.players:LeveragedBuyer"
  config:
    identity: "leveraged_buyer"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/AssetBubble/records"
      # Investor base parameters
      initial_cash: 10000.0
      initial_position: 0.0
      custom_state_hot_limit: 3
      # LeveragedBuyer specific parameters
      leverage_ratio: 2.0           # 2x leverage
      margin_call_threshold: 0.3    # Forced sell if equity drops 30%
      base_position_size: 40.0
      initial_equity: 10000.0
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Conservative Holder (Stability)
# -----------------------------------------------------------------------------
conservative_holder:
