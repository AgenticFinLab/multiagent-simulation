# =============================================================================
# AssetBubble Topology - Star Pattern
# =============================================================================
# Market as hub, all investors communicate through market.
#
# Note: player keys with num_instances > 1 use their base key here.
# The simulator expander resolves them to foo_1, foo_2, ... before building
# the TopologyGraph, so all edge rules apply to every instance automatically.
#
#         rule_momentum_speculator ─────────┐
#         rule_rational_arbitrageur ────────┤
#         rule_noise_trader ────────────────┼──▶ market ──▶ all investors
#         rule_fundamental_investor ────────┤             (market data: price, bubble_ratio)
#         rule_leveraged_buyer ─────────────┤
#         rule_conservative_holder ─────────┘
#
# Execution flow per round:
#   Level 0: market executes (broadcasts price + bubble metrics)
#   Level 1: all investors execute in parallel (submit P,Q orders)
# =============================================================================

type: "star"

sources:
  - market

connections:
  # Market → All investors (price + bubble data broadcast)
  # num_instances: 2 → momentum_speculator_1/2, noise_trader_1/2
  market:
    - rule_momentum_speculator
    - rule_rational_arbitrageur
    - rule_noise_trader
    - rule_fundamental_investor
    - rule_leveraged_buyer
    - rule_conservative_holder

  # Each investor → Market only (order submission)
  # num_instances: 2 → expands to momentum_speculator_1/2 → market
  rule_momentum_speculator:
    - market

  rule_rational_arbitrageur:
    - market

  # num_instances: 2 → expands to noise_trader_1/2 → market
  rule_noise_trader:
    - market

  rule_fundamental_investor:
    - market

  rule_leveraged_buyer:
    - market

  rule_conservative_holder:
    - market
