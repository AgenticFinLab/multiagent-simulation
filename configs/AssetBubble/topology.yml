# =============================================================================
# AssetBubble Topology - Star Pattern
# =============================================================================
# Market as hub, all investors communicate through market.
#
#         momentum_speculator_1 ───┐
#         momentum_speculator_2 ───┤
#         rational_arbitrageur ────┼──▶ market ──┬──▶ momentum_speculator_1
#         noise_trader_1 ─────────┤             ├──▶ momentum_speculator_2
#         noise_trader_2 ─────────┤             ├──▶ rational_arbitrageur
#         fundamental_investor ────┤             ├──▶ noise_trader_1
#         leveraged_buyer ────────┤             ├──▶ noise_trader_2
#         conservative_holder ────┘             ├──▶ fundamental_investor
#                                               ├──▶ leveraged_buyer
#                    (orders: P,Q)              └──▶ conservative_holder
#                                                    (market data: price, bubble_ratio)
#
# Execution flow per round:
#   Level 0: market executes (broadcasts price + bubble metrics)
#   Level 1: all investors execute in parallel (submit P,Q orders)
# =============================================================================

type: "star"

sources:
  - market

connections:
  # Market → All investors (price + bubble data broadcast)
  market:
    - momentum_speculator_1
    - momentum_speculator_2
    - rational_arbitrageur
    - noise_trader_1
    - noise_trader_2
    - fundamental_investor
    - leveraged_buyer
    - conservative_holder

  # Each investor → Market only (order submission)
  momentum_speculator_1:
    - market

  momentum_speculator_2:
    - market

  rational_arbitrageur:
    - market

  noise_trader_1:
    - market

  noise_trader_2:
    - market

  fundamental_investor:
    - market

  leveraged_buyer:
    - market

  conservative_holder:
    - market
