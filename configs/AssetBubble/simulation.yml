# =============================================================================
# AssetBubble Simulation Configuration
# =============================================================================
# Demonstrates asset bubble formation through heterogeneous agents.
#
# Usage:
#   python examples/AssetBubble/run_bubble.py -c configs/AssetBubble/simulation.yml
# =============================================================================

setting:
  name: "asset_bubble_simulation"
  description: "Asset bubble formation through speculative momentum and limited arbitrage"
  total_rounds: 300
  entry_limit: 100
  record_path: "EXPERIMENT/AssetBubble/records"
  save_diagram_interval: 50

environment:
  dotenv_path: .env
  workspace: "."

ray:
  address: null
  namespace: "asset_bubble"
  actor_prefix: null
  num_cpus: 4
  num_gpus: null
  object_store_memory: null
  include_dashboard: false
  logging_level: "warning"
  log_to_driver: true
  actor_options:
    max_restarts: 3
    max_task_retries: 1
    max_concurrency: 10
  runtime_env:
    working_dir: null
    pip: []
    env_vars: {}
  serialization:
    use_arrow: true
    register_custom_serializers: true

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/AssetBubble/communication"
