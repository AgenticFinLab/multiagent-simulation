# =============================================================================
# AssetBubbleRuleLLM Players Configuration
# =============================================================================
# 1 Market (rule-based) + 5 Hybrid Rule+LLM Investors
# Each LLM agent's system prompt embeds:
#   - Personal profile: identity, style, risk attitude (from LLM variant)
#   - Quantitative rules: exact financial/mathematical principles (from rule-based)
# =============================================================================

# Market (rule-based, identical to AssetBubble)
market:
  name: "Market"
  class: "examples.AssetBubble.RuleLLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/AssetBubble/RuleLLM/records"
      # Market parameters (aligned with AssetBubble rule-based)
      fundamental_value: 100.0
      initial_price: 100.0
      price_impact: 0.15
      mean_reversion: 0.005
      fundamental_growth: 0.001
      noise_std: 0.3
      short_cost_rate: 0.02
      custom_state_hot_limit: 3
  persona: !include persona.yml

# Hybrid Momentum Speculator (Greater Fool Theory + LLM reasoning)
rulellm_momentum_speculator:
  name: "RuleLLM Momentum Speculator"
  class: "examples.AssetBubble.RuleLLM.players:RuleLLMMomentumSpeculator"
  # Expander → rulellm_momentum_1 .. rulellm_momentum_5
  num_instances: 5
  config:
    identity: "rulellm_momentum_speculator"
    role: player
    steps_per_turn: 1
    group_tags:
      - rulellm_investors
    extras:
      record_path: "EXPERIMENT/AssetBubble/RuleLLM/records"
      initial_cash: 10000.0
      initial_position: 0.0
      custom_state_hot_limit: 3
      # Rule parameters (from AssetBubble MomentumSpeculator)
      lookback_short: 5
      aggressiveness: 2.0
      base_position_size: 20.0
      leverage_multiplier: 2.0
      llm:
        sys_message: "examples.AssetBubble.RuleLLM.prompts:RULELLM_MOMENTUM_SYS"
        user_message: "examples.AssetBubble.RuleLLM.prompts:RULELLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.3
          max_new_tokens: 500
  persona: !include persona.yml

# Hybrid Rational Arbitrageur (Limits to Arbitrage + LLM reasoning)
rulellm_rational_arbitrageur:
  name: "RuleLLM Rational Arbitrageur"
  class: "examples.AssetBubble.RuleLLM.players:RuleLLMRationalArbitrageur"
  # Expander → rulellm_arbitrageur_1, rulellm_arbitrageur_2, rulellm_arbitrageur_3
  num_instances: 3
  config:
    identity: "rulellm_rational_arbitrageur"
    role: player
    steps_per_turn: 1
    group_tags:
      - rulellm_investors
    extras:
      record_path: "EXPERIMENT/AssetBubble/RuleLLM/records"
      initial_cash: 10000.0
      initial_position: 0.0
      custom_state_hot_limit: 3
      # Rule parameters (from AssetBubble RationalArbitrageur)
      deviation_threshold: 0.05
      base_position_size: 20.0
      max_short_position: 30.0
      short_cost_sensitivity: 2.0
      llm:
        sys_message: "examples.AssetBubble.RuleLLM.prompts:RULELLM_ARBITRAGEUR_SYS"
        user_message: "examples.AssetBubble.RuleLLM.prompts:RULELLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.3
          max_new_tokens: 500
  persona: !include persona.yml

