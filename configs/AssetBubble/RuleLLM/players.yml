# =============================================================================
# AssetBubbleRuleLLM Players Configuration
# =============================================================================
# 1 Market (rule-based) + 6 Hybrid Rule+LLM Investors
# Each LLM agent's system prompt embeds:
#   - Personal profile: identity, style, risk attitude (from LLM variant)
#   - Quantitative rules: exact financial/mathematical principles (from rule-based)
# =============================================================================

# Market (rule-based, identical to AssetBubble)
market:
  archetype: stock-standard-price-impact  # -> masim/agents/defines/market/stock-standard-price-impact.md
  name: "Market"
  class: "examples.AssetBubble.RuleLLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/AssetBubble/RuleLLM/records"  # Source: implementation infrastructure (record path)
      # Market parameters (aligned with AssetBubble rule-based)
      fundamental_value: 100.0    # Source: target §9 / simulation-bases.md §3.1 (normalization, 100-scale index)
      initial_price: 100.0        # Source: target §9 / simulation-bases.md §3.1 (normalization, starts at fair value)
      price_impact: 0.15          # Source: target §9 lambda; De Long et al. (1990) https://doi.org/10.1086/261703
      mean_reversion: 0.005       # Source: target §9 gamma; Abreu & Brunnermeier (2003) https://doi.org/10.1111/1468-0262.00393
      fundamental_growth: 0.001   # Source: target §9 g; Shiller (2000) Irrational Exuberance
      noise_std: 0.3              # Source: target §9 sigma; De Long et al. (1990) https://doi.org/10.1086/261703
      short_cost_rate: 0.02       # Source: target §9 c_short; D'Avolio (2002) https://doi.org/10.1016/S0304-405X(02)00257-4
      custom_state_hot_limit: 3   # Source: implementation infrastructure (hot-state ring buffer)
  persona: !include persona.yml

# Hybrid Momentum Speculator (§4.1 anchor: Jegadeesh & Titman 1993) + LLM reasoning
rulellm_momentum_speculator:
  name: "RuleLLM Momentum Speculator"
  class: "examples.AssetBubble.RuleLLM.players:RuleLLMMomentumSpeculator"
  # Expander → rulellm_momentum_speculator_1 .. rulellm_momentum_speculator_5
  num_instances: 5
  config:
    identity: "rulellm_momentum_speculator"
    role: player
    steps_per_turn: 1
    group_tags:
      - rulellm_investors
    extras:
      record_path: "EXPERIMENT/AssetBubble/RuleLLM/records"  # Source: implementation infrastructure (record path)
      initial_cash: 10000.0        # Source: target §9 initial_equity (portfolio normalization)
      initial_position: 0.0        # Source: target §7 momentum-speculator Intent line
      custom_state_hot_limit: 3    # Source: implementation infrastructure (hot-state ring buffer)
      # Rule parameters (from AssetBubble MomentumSpeculator)
      lookback_short: 5            # Source: target §9 k (3-12 rounds); Jegadeesh & Titman (1993) https://doi.org/10.1111/j.1540-6261.1993.tb04702.x
      aggressiveness: 2.0          # Source: target §9 alpha; De Long et al. (1990) https://doi.org/10.1111/j.1540-6261.1990.tb03695.x
      base_position_size: 20.0     # Source: target §9 q0; Chordia et al. (2002) https://doi.org/10.1016/S0304-405X(02)00136-8
      leverage_multiplier: 2.0     # Source: target §9 ell_m; Adrian & Shin (2010) https://doi.org/10.1016/j.jfineco.2009.12.002
      llm:
        sys_message: "examples.AssetBubble.RuleLLM.prompts:RULELLM_MOMENTUM_SYS"  # Source: RuleLLM wiring — dual persona+rule prompt for momentum-speculator
        user_message: "examples.AssetBubble.RuleLLM.prompts:RULELLM_USER_TEMPLATE" # Source: RuleLLM wiring — shared user prompt template
        lm_type: "api"                             # Source: LLM wiring — inference mode
        lm_name: "ark/doubao-seed-2-0-mini-260428" # Source: LLM wiring — model identifier
        generation_config:
          temperature: 0.3         # Source: LLM wiring — sampling temperature
          max_new_tokens: 500      # Source: LLM wiring — response length cap
  persona: !include persona.yml

# Hybrid Rational Arbitrageur (§4.2 anchor: Shleifer & Vishny 1997) + LLM reasoning
rulellm_rational_arbitrageur:
  name: "RuleLLM Rational Arbitrageur"
  class: "examples.AssetBubble.RuleLLM.players:RuleLLMRationalArbitrageur"
  num_instances: 3
  config:
    identity: "rulellm_rational_arbitrageur"
    role: player
    steps_per_turn: 1
    group_tags:
      - rulellm_investors
    extras:
      record_path: "EXPERIMENT/AssetBubble/RuleLLM/records"  # Source: implementation infrastructure (record path)
      initial_cash: 10000.0        # Source: target §9 initial_equity (portfolio normalization)
      initial_position: 0.0        # Source: target §7 rational-arbitrageur Intent line
      custom_state_hot_limit: 3    # Source: implementation infrastructure (hot-state ring buffer)
      # Rule parameters (from AssetBubble RationalArbitrageur)
      deviation_threshold: 0.05    # Source: target §9 theta_dev; Shleifer & Vishny (1997) https://doi.org/10.1111/j.1540-6261.1997.tb03807.x
      base_position_size: 20.0     # Source: target §9 q0; Chordia et al. (2002) https://doi.org/10.1016/S0304-405X(02)00136-8
      max_short_position: 30.0     # Source: target §9 q_short_max; D'Avolio (2002) https://doi.org/10.1016/S0304-405X(02)00257-4
      short_cost_sensitivity: 2.0  # Source: target §9 c_s; Shleifer & Vishny (1997) https://doi.org/10.1111/j.1540-6261.1997.tb03807.x
      llm:
        sys_message: "examples.AssetBubble.RuleLLM.prompts:RULELLM_ARBITRAGEUR_SYS" # Source: RuleLLM wiring — dual persona+rule prompt for arbitrageur
        user_message: "examples.AssetBubble.RuleLLM.prompts:RULELLM_USER_TEMPLATE"  # Source: RuleLLM wiring — shared user prompt template
        lm_type: "api"                             # Source: LLM wiring — inference mode
        lm_name: "ark/doubao-seed-2-0-mini-260428" # Source: LLM wiring — model identifier
        generation_config:
          temperature: 0.3         # Source: LLM wiring — sampling temperature
          max_new_tokens: 500      # Source: LLM wiring — response length cap
  persona: !include persona.yml

# Hybrid Noise Trader (§4.3 anchor: De Long et al. 1990) + LLM reasoning
rulellm_noise_trader:
  name: "RuleLLM Noise Trader"
  class: "examples.AssetBubble.RuleLLM.players:RuleLLMNoiseTrader"
  num_instances: 2
  config:
    identity: "rulellm_noise_trader"
    role: player
    steps_per_turn: 1
    group_tags:
      - rulellm_investors
    extras:
      record_path: "EXPERIMENT/AssetBubble/RuleLLM/records"  # Source: implementation infrastructure (record path)
      initial_cash: 10000.0        # Source: target §9 initial_equity (portfolio normalization)
      initial_position: 0.0        # Source: target §7 noise-trader Intent line
      custom_state_hot_limit: 3    # Source: implementation infrastructure (hot-state ring buffer)
      # Rule parameters (from AssetBubble NoiseTrader)
      sentiment_volatility: 0.3    # Source: target §9 sigma_s; De Long et al. (1990) https://doi.org/10.1086/261703
      herding_weight: 0.7          # Source: target §9 h; Barber & Odean (2008) https://doi.org/10.1093/rfs/hhm079
      base_position_size: 15.0     # Source: target §9 q0; Chordia et al. (2002) https://doi.org/10.1016/S0304-405X(02)00136-8
      llm:
        sys_message: "examples.AssetBubble.RuleLLM.prompts:RULELLM_NOISE_SYS"      # Source: RuleLLM wiring — dual persona+rule prompt for noise-trader
        user_message: "examples.AssetBubble.RuleLLM.prompts:RULELLM_USER_TEMPLATE" # Source: RuleLLM wiring — shared user prompt template
        lm_type: "api"                             # Source: LLM wiring — inference mode
        lm_name: "ark/doubao-seed-2-0-mini-260428" # Source: LLM wiring — model identifier
        generation_config:
          temperature: 0.5         # Source: LLM wiring — sampling temperature (higher for sentiment/herd variability)
          max_new_tokens: 500      # Source: LLM wiring — response length cap
  persona: !include persona.yml

