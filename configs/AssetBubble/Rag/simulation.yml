# =============================================================================
# AssetBubbleRag Simulation Configuration
# =============================================================================
# RAG variant: LLM agents guided by explicit rules (in system prompt) AND
# real-time knowledge retrieval from a personal RAG library built at init.
# Each agent downloads/caches reference documents and queries its RAG index
# to inject relevant context into every trading decision prompt.
#
# Usage:
#   python examples/AssetBubble/Rag/run_bubble_ragllm.py -c configs/AssetBubble/Rag/simulation.yml
# =============================================================================

setting:
  name: "asset_bubble_rag_simulation"
  description: "RAG-augmented asset bubble: agents retrieve knowledge from personal RAG libraries per decision"
  total_rounds: 200
  round_history_limit: 3
  record_path: "EXPERIMENT/AssetBubble/Rag/records"
  save_diagram_interval: 50

environment:
  dotenv_path: .env
  workspace: "."

ray:
  address: null
  namespace: "asset_bubble_rag"
  actor_prefix: null
  # null = Ray auto-detects from machine; actors use num_cpus=0 (async, I/O-bound)
  num_cpus: null
  num_gpus: null
  # Derived: 18 players, star topology -> 34 msgs/round
  #   18 TurnResult + 18 pending_info + 34 Message = 70 Ray objects
  #   LLM TurnResult carries prompt+response+rag_context strings (~8-16 KB each)
  #   Minimum 1 GB floor for RAG simulations -> 1073741824 bytes
  object_store_memory: 1073741824
  include_dashboard: false
  logging_level: "warning"
  log_to_driver: false
  actor_options:
    max_restarts: 3
    max_task_retries: 1
    max_concurrency: 10
  runtime_env:
    working_dir: null
    pip: []
    env_vars: {}
  serialization:
    use_arrow: true
    register_custom_serializers: true

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/AssetBubble/Rag/communication"
  record_messages: true
  message_block_size: 500
