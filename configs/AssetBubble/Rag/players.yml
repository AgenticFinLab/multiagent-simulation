# =============================================================================
# AssetBubbleRag Players Configuration
# =============================================================================
# 1 Market (rule-based) + 5 RAG-augmented LLM Investors
#
# Knowledge Architecture:
#   The shared knowledge: block is defined at the TOP of this file, before the
#   market definition. The config loader (expand_player_instances in
#   masim/utils/config.py) automatically detects "knowledge" inside the players
#   dict and promotes it to config top-level, making it accessible as
#   config["knowledge"] / SimulationConfig.knowledge.
#
#   This co-location keeps all player-related config discoverable in one file
#   while maintaining clean code access patterns.
#
#   Each agent has private_knowledge for agent-specific resources:
#     - from_global_resources: List of global resource sub-dirs to inherit
#     - local_resources:
#         local_uri:       Per-agent local directory
#                          Auto-generated if empty: EXPERIMENT/<scenario>/agents/<agent_id>/
#         local_resources: Agent-specific local resource paths
#     - rag: Per-agent RAG configuration (MUST be nested inside private_knowledge)
#         from_global_index_dir: Shared index directories to reference/copy from
#                                 Paths relative to global_uri/
#         local_index_dir: Per-agent local index directory
#                          Auto-generated if empty: <local_uri>/rag_index/
#         Inherits knowledge.rag defaults; overrides specified here take precedence
# =============================================================================

# =============================================================================
# Shared Knowledge Configuration (processed once, accessible by all agents)
# =============================================================================
# This block is co-located with players for discoverability. The config loader
# automatically promotes it to config top-level. It is NOT a player definition.
# =============================================================================
knowledge:
  # Backend type: "local" = local filesystem, "shared" = network mount, "remote" = cloud
  backend: "local"
  # Base directory for all shared documents (PDFs, MinerU output, RAG index, etc.)
  global_uri: "examples/document-sources"
  # List of resource descriptors shared globally across all agents
  # - CSV files: each has an agent_type column; code filters rows by agent identity at runtime
  # - Directories: code auto-discovers PDF files inside for preprocessing
  resource_csv:
    # CSV file listing books/URLs per agent_type
    - "examples/document-sources/books.csv"
    # Directory containing raw PDF files to be processed by MinerU
    - "examples/document-sources/source"
  preprocessing:
    # PDF parser engine; currently only "mineru" is supported
    parser: "mineru"
    # Seconds allowed per page for MinerU API call (adjusts dynamically for large PDFs)
    timeout_per_page: 30
    # Maximum page count per PDF; PDFs exceeding this are split before parsing
    max_pages: 250
    # Subdirectory name for MinerU output, relative to global_uri/
    output_position: "MinerU_processed"
  # -----------------------------------------------------------------
  # RAG Configuration (shared defaults for all agents)
  # -----------------------------------------------------------------
  # All output_position paths are relative to global_uri.
  # Agents inherit these defaults unless overridden in their private_knowledge.rag block.
  # -----------------------------------------------------------------
  rag:
    # Subdirectory for shared RAG index storage, relative to global_uri/
    # All agents share this index; each agent also has a local copy
    # at <local_uri>/rag_index/ for read/write isolation
    output_position: "rag_index"
    # Embedding provider type: "litellm" for LiteLLM-based embedding
    embed_type: "litellm"
    # Embedding model name; "openai/hunyuan-embedding" = Hunyuan via OpenAI-compatible API
    embed_model: "openai/hunyuan-embedding"
    # API key for embedding service; resolved from environment variable
    embed_api_key: "{{ HUNYUAN_API_KEY }}"
    # API base URL for Hunyuan embedding (OpenAI-compatible endpoint)
    embed_api_base: "https://api.hunyuan.cloud.tencent.com/v1"
    # Chunk size in tokens for document splitting
    chunk_size: 512
    # Overlap in tokens between consecutive chunks
    chunk_overlap: 64

# =============================================================================
# Market (rule-based, identical to AssetBubble)
# =============================================================================
# The market agent is rule-based (no LLM, no RAG). It coordinates the order
# book, computes price updates, and manages trading mechanics.
# =============================================================================
market:
  name: "Market"
  class: "examples.AssetBubble.Rag.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      # Output directory for experiment records
      record_path: "EXPERIMENT/AssetBubble/Rag/records"
      # Fundamental value of the asset (baseline for price mean-reversion)
      fundamental_value: 100.0
      # Starting price at the beginning of the simulation
      initial_price: 100.0
      # Price impact coefficient: how much a unit of net demand moves price
      price_impact: 0.15
      # Mean-reversion strength: rate at which price reverts to fundamental
      mean_reversion: 0.005
      # Fundamental value growth rate per period
      fundamental_growth: 0.001
      # Standard deviation of exogenous noise added to price each period
      noise_std: 0.3
      # Annualized cost rate for holding short positions
      short_cost_rate: 0.02
      # Maximum number of consecutive periods a state variable is "hot"
      custom_state_hot_limit: 3
  persona: !include persona.yml

# =============================================================================
# RAG Momentum Speculator (Greater Fool Theory + LLM + RAG)
# =============================================================================
# Trading style: Chases price trends, believes in Greater Fool Theory
# RAG knowledge: Momentum investing, speculation, Keynesian beauty contest
# =============================================================================
ragllm_momentum:
  name: "RAG Momentum Speculator"
  class: "examples.AssetBubble.Rag.players:RagLLMMomentumSpeculator"
  # Number of agent instances (expanded to ragllm_momentum_1 .. ragllm_momentum_5)
  num_instances: 5
  config:
    identity: "ragllm_momentum"
    role: player
    steps_per_turn: 1
    group_tags:
      - ragllm_investors
    extras:
      # Output directory for experiment records
      record_path: "EXPERIMENT/AssetBubble/Rag/records"
      # Starting cash endowment
      initial_cash: 10000.0
      # Starting position (shares held); 0 = flat
      initial_position: 0.0
      # Maximum number of consecutive periods a state variable is "hot"
      custom_state_hot_limit: 3
      # -----------------------------------------------------------------
      # Rule parameters (from AssetBubble MomentumSpeculator)
      # -----------------------------------------------------------------
      # Lookback window for short-term momentum signal (in periods)
      lookback_short: 5
      # Aggressiveness multiplier for position sizing on momentum signals
      aggressiveness: 2.0
      # Base number of shares per trade order
      base_position_size: 20.0
      # Leverage multiplier applied to position size when momentum is strong
      leverage_multiplier: 2.0
      # -----------------------------------------------------------------
      # Private Knowledge: agent-specific resources and RAG configuration
      # -----------------------------------------------------------------
      # from_global_resources: CSV/resource files to inherit from global;
      #   code filters rows by agent identity (ragllm_momentum)
      # local_resources.local_uri: Per-agent local directory
      #   Auto-generated if empty: EXPERIMENT/<scenario>/agents/<agent_id>/
      # local_resources.local_resources: Agent-specific local resource paths
      # rag: Per-agent RAG config; inherits knowledge.rag defaults,
      #      overrides specified here take precedence
      # -----------------------------------------------------------------
      private_knowledge:
        # List of global resource files to inherit; code filters by identity=ragllm_momentum
        # By default using the global_uri as the base path
        # Using all MinerU_processed and rag_index if necessary
        from_global_resources:
          - "MinerU_processed"
        local_resources:
          # Per-agent local directory; auto-generated if empty
          local_uri: ""
          # Agent-specific local resource paths (files, URLs not in global CSV)
          local_resources: []
        # -----------------------------------------------------------------
        # RAG Configuration (per-agent, overrides knowledge.rag defaults)
        # -----------------------------------------------------------------
        # from_global_index_dir: Shared index dirs to reference, relative to global_uri/
        # local_index_dir: Per-agent local index dir; auto-generated if empty
        # -----------------------------------------------------------------
        rag:
          # Shared index directories to reference/copy from, relative to global_uri/
          from_global_index_dir:
            - "rag_index"
          # Per-agent local index directory; auto-generated if empty: <local_uri>/rag_index/
          local_index_dir: ""
          # Embedding provider type: "litellm" for LiteLLM-based embedding
          embed_type: "litellm"
          # Embedding model name; "openai/hunyuan-embedding" = Hunyuan via OpenAI-compatible API
          embed_model: "openai/hunyuan-embedding"
          # API key for embedding service; resolved from environment variable
          embed_api_key: "{{ HUNYUAN_API_KEY }}"
          # API base URL for Hunyuan embedding (OpenAI-compatible endpoint)
          embed_api_base: "https://api.hunyuan.cloud.tencent.com/v1"
          # Chunk size in tokens for document splitting
          chunk_size: 512
          # Overlap in tokens between consecutive chunks
          chunk_overlap: 64
          # Number of top-k chunks to retrieve per query
          top_k: 5
      # -----------------------------------------------------------------
      # LLM Configuration: inference model for agent decision-making
      # -----------------------------------------------------------------
      llm:
        # System prompt module:path:variable
        sys_message: "examples.AssetBubble.Rag.prompts:RAGLLM_MOMENTUM_SYS"
        # User message template module:path:variable
        user_message: "examples.AssetBubble.Rag.prompts:RAGLLM_USER_TEMPLATE"
        # Language model type: "api" = remote API call
        lm_type: "api"
        # Model identifier for Doubao via ARK (VolcEngine)
        lm_name: "ark/doubao-seed-1-6-lite-251015"
        generation_config:
          # Sampling temperature; lower = more deterministic
          temperature: 0.3
          # Maximum number of new tokens in generated response
          max_new_tokens: 600
  persona: !include persona.yml

