# =============================================================================
# EchoChamberRag Players Configuration
# =============================================================================
# 1 OpinionEnvironment (rule-based) + 5 RAG-augmented LLM Social Agent Types.
# =============================================================================

knowledge: &shared_knowledge
  backend: "local"
  global_uri: "examples/document-sources"
  resource_csv:
    - "examples/document-sources/books.csv"
    - "examples/document-sources/source"
  preprocessing:
    parser: "mineru"
    timeout_per_page: 30
    max_pages: 250
    output_position: "MinerU_processed"
  rag:
    output_position: "rag_index"
    embed_type: "litellm"
    embed_model: "openai/hunyuan-embedding"
    embed_api_key: "{{ HUNYUAN_API_KEY }}"
    embed_api_base: "https://api.hunyuan.cloud.tencent.com/v1"
    chunk_size: 512
    chunk_overlap: 64
    top_k: 5

environment:
  name: "OpinionEnvironment"
  class: "examples.EchoChamber.Rag.players:OpinionEnvironment"
  num_instances: 1
  config:
    identity: "environment"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - environment
    extras:
      record_path: "EXPERIMENT/EchoChamber/Rag/records"
      initial_polarization: 0.15
      polarization_impact: 0.12
      centripetal_force: 0.01
      noise_std: 0.02
      custom_state_hot_limit: 3
  persona: !include persona.yml

ragllm_ideologue:
  name: "RAG-LLM Ideologue"
  class: "examples.EchoChamber.Rag.players:RagLLMIdeologue"
  num_instances: 6
  config:
    identity: "ragllm_ideologue"
    role: player
    steps_per_turn: 1
    group_tags:
      - ragllm_agents
    extras:
      record_path: "EXPERIMENT/EchoChamber/Rag/records"
      initial_opinion: 0.4
      custom_state_hot_limit: 3
      in_group_weight: 0.6
      extremity_boost: 1.3
      out_group_discount: 0.05
      spread_eagerness: 0.9
      knowledge: *shared_knowledge
      private_knowledge:
        from_global_resources:
          - "MinerU_processed"
        local_resources:
          local_uri: ""
          local_resources: []
        rag:
          from_global_index_dir:
            - "rag_index"
          local_index_dir: ""
          embed_type: "litellm"
          embed_model: "openai/hunyuan-embedding"
          embed_api_key: "{{ HUNYUAN_API_KEY }}"
          embed_api_base: "https://api.hunyuan.cloud.tencent.com/v1"
          chunk_size: 512
          chunk_overlap: 64
          top_k: 5
      llm:
        sys_message: "examples.EchoChamber.Rag.prompts:RAG_IDEOLOGUE_SYS"
        user_message: "examples.EchoChamber.Rag.prompts:RAG_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-1-6-251015"
        generation_config:
          temperature: 0.3
          max_new_tokens: 500
  persona: !include persona.yml

