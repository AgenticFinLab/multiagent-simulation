# =============================================================================
# EchoChamberRag Players Configuration
# =============================================================================
# 1 OpinionEnvironment (rule-based) + 5 RAG-augmented LLM Social Agent Types.
# =============================================================================

knowledge: &shared_knowledge
  backend: "local"
  global_uri: "examples/document-sources"
  resource_csv:
    - "examples/document-sources/books.csv"
    - "examples/document-sources/source"
  preprocessing:
    parser: "mineru"
    timeout_per_page: 30  # Source: operational parser limit; simulation-bases.md §6
    max_pages: 250  # Source: bounded corpus preprocessing; simulation-bases.md §6
    output_position: "MinerU_processed"
  rag:
    output_position: "rag_index_ep_20260418161108_k2pxb"
    embed_type: "ark_multimodal"
    embed_model: "ep-20260418161108-k2pxb"
    embed_api_key: "{{ ARK_API_KEY }}"
    embed_api_base: "https://ark.cn-beijing.volces.com/api/v3"
    chunk_size: 512  # Source: retrieval configuration; analysis-bases.md §2.7
    chunk_overlap: 64  # Source: retrieval configuration; analysis-bases.md §2.7
    top_k: 5  # Source: retrieval coverage design; analysis-bases.md §2.7

ragllm_opinion_environment:
  archetype: opinion-echo-chamber-clustering  # -> AGENT_POOL/market/opinion-echo-chamber-clustering.md
  name: "OpinionEnvironment"
  class: "examples.EchoChamber.Rag.players:OpinionEnvironment"
  num_instances: 1
  config:
    identity: "ragllm_opinion_environment"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - environment
    extras:
      # Source: infrastructure
      record_path: "EXPERIMENT/EchoChamber/Rag/records"
      initial_polarization: 0.15  # Source: simulation-bases.md §6
      initial_mean_opinion: 0.0  # Source: simulation-bases.md §3
      initial_cluster_separation: 0.0  # Source: simulation-bases.md §3
      initial_cross_cutting_exposure: 0.5  # Source: simulation-bases.md §3
      polarization_impact: 0.12  # Source: simulation-bases.md §3 and §6
      centripetal_force: 0.01  # Source: simulation-bases.md §3 and §6
      polarization_equilibrium: 0.3  # Source: simulation-bases.md §3 center-pull target
      noise_std: 0.02  # Source: simulation-bases.md §3
      moderate_opinion_threshold: 0.3  # Source: simulation-bases.md §3
      custom_state_hot_limit: 3  # Source: operational history window; analysis-bases.md §4
  persona: !include persona.yml

ragllm_ideologue:
  name: "RAG-LLM Ideologue"
  class: "examples.EchoChamber.Rag.players:RagLLMIdeologue"
  num_instances: 6
  config:
    identity: "ragllm_ideologue"
    role: player
    steps_per_turn: 1
    group_tags:
      - ragllm_agents
    extras:
      # Source: infrastructure
      record_path: "EXPERIMENT/EchoChamber/Rag/records"
      initial_opinion: 0.4  # Source: simulation-bases.md §4.1
      custom_state_hot_limit: 3  # Source: operational history window; analysis-bases.md §4
      polarize_opinion_step: 0.05  # Source: simulation-bases.md §4.1 decision process
      depolarize_opinion_step: 0.05  # Source: cross-variant action-state parity; simulation-bases.md §7
      in_group_weight: 0.6  # Source: simulation-bases.md §4.1 and §6
      extremity_boost: 1.3  # Source: simulation-bases.md §4.1
      out_group_discount: 0.05  # Source: simulation-bases.md §4.1
      spread_eagerness: 0.9  # Source: simulation-bases.md §4.1 and §6
      knowledge: *shared_knowledge
      private_knowledge:
        from_global_resources:
          - "MinerU_processed"
        local_resources:
          local_uri: ""
          local_resources: []
        rag:
          from_global_index_dir:
            - "rag_index_ep_20260418161108_k2pxb"
          local_index_dir: "rag_index_ep_20260418161108_k2pxb"
          embed_type: "ark_multimodal"
          embed_model: "ep-20260418161108-k2pxb"
          embed_api_key: "{{ ARK_API_KEY }}"
          embed_api_base: "https://ark.cn-beijing.volces.com/api/v3"
          chunk_size: 512  # Source: analysis-bases.md §2.7
          chunk_overlap: 64  # Source: analysis-bases.md §2.7
          top_k: 5  # Source: analysis-bases.md §2.7
      llm:
        # Source: simulation-bases.md §4.1 Ideologue
        sys_message: "examples.EchoChamber.Rag.prompts:RAG_IDEOLOGUE_SYS"
        # Source: simulation-bases.md §7 Communication And Round Structure
        user_message: "examples.EchoChamber.Rag.prompts:RAG_USER_TEMPLATE"
        # Source: simulation-bases.md §9 Variant Comparison Preview
        lm_type: "api"
        # Source: simulation-bases.md §9 Variant Comparison Preview
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.3  # Source: low-variance role deliberation; simulation-bases.md §4.1
          max_new_tokens: 500  # Source: canonical tagged response budget; analysis-bases.md §2.7
        max_retries: 3  # Source: bounded API retry policy; analysis-bases.md §2.7
  persona: !include persona.yml

