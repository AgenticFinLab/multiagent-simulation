# =============================================================================
# EchoChamberRag Simulation Configuration
# =============================================================================
# RAG-augmented LLM echo chamber simulation.
#
# Usage:
#   python examples/EchoChamber/Rag/run_echochamber_rag.py -c configs/EchoChamber/Rag/simulation.yml
# =============================================================================

setting:
  name: "echo_chamber_rag_simulation"
  description: "RAG-augmented LLM echo chamber: social agents reason with retrieved polarization literature"
  total_rounds: 200
  round_history_limit: 3
  record_path: "EXPERIMENT/EchoChamber/Rag/records"
  save_diagram_interval: 50

environment:
  dotenv_path: .env
  workspace: "."

ray:
  address: null
  namespace: "echo_chamber_rag"
  actor_prefix: null
  num_cpus: null
  num_gpus: null
  object_store_memory: 536870912
  include_dashboard: false
  logging_level: "warning"
  log_to_driver: false
  actor_options:
    max_restarts: 3
    max_task_retries: 1
    # Each persona is driven sequentially by the simulator.  A value of 10
    # only multiplies queued actor work and memory pressure on Windows.
    max_concurrency: 1
  runtime_env:
    working_dir: null
    pip: []
    env_vars: {}
  serialization:
    use_arrow: true
    register_custom_serializers: true

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/EchoChamber/Rag/communication"
  record_messages: true
  message_block_size: 500
