# =============================================================================
# EchoChamber Players Configuration
# =============================================================================
# Heterogeneous agents for echo chamber polarization simulation
#
# Agent Types (with opinion impact):
#   - OpinionEnvironment: Rule-based coordinator (polarization dynamics)
#   - Ideologue: Strong views amplifier (DESTABILIZING)
#   - Conformist: Group opinion adopter (DESTABILIZING)
#   - CriticalThinker: Evidence evaluator (STABILIZING)
#   - BridgeBuilder: Cross-group engager (STRONGLY STABILIZING)
#   - PassiveFollower: Low-engagement drifter (NEUTRAL)
# =============================================================================

# -----------------------------------------------------------------------------
# OpinionEnvironment (Coordinator)
# -----------------------------------------------------------------------------
environment:
  name: "OpinionEnvironment"
  class: "examples.EchoChamber.Rule.players:OpinionEnvironment"
  num_instances: 1
  config:
    identity: "environment"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - environment
    extras:
      # Source: simulation-bases.md §7 Communication And Round Structure
      record_path: "EXPERIMENT/EchoChamber/Rule/records"
      # Source: simulation-bases.md §6 Parameter Table
      initial_polarization: 0.15
      # Source: simulation-bases.md §3 Environment Mechanism
      initial_mean_opinion: 0.0
      # Source: simulation-bases.md §3 Environment Mechanism
      initial_cluster_separation: 0.0
      # Source: simulation-bases.md §3 Environment Mechanism
      initial_cross_cutting_exposure: 0.5
      # Source: simulation-bases.md §6 Parameter Table
      polarization_impact: 0.12
      # Source: simulation-bases.md §6 Parameter Table
      centripetal_force: 0.01
      # Source: simulation-bases.md §3 Environment Mechanism (center-pull target)
      polarization_equilibrium: 0.3
      # Source: simulation-bases.md §3 Environment Mechanism (noise term)
      noise_std: 0.02
      # Source: simulation-bases.md §3 Environment Mechanism (center proximity)
      moderate_opinion_threshold: 0.3
      # Source: simulation-bases.md §7 Communication And Round Structure
      custom_state_hot_limit: 3
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Ideologues (Primary Polarization Drivers)
# Split: 3 left-leaning, 3 right-leaning (initial_opinion sign determines lean)
# -----------------------------------------------------------------------------
ideologue:
  name: "Ideologue"
  class: "examples.EchoChamber.Rule.players:Ideologue"
  num_instances: 6
  config:
    identity: "ideologue"
    role: player
    steps_per_turn: 1
    group_tags:
      - agents
    extras:
      # Source: simulation-bases.md §7 Communication And Round Structure
      record_path: "EXPERIMENT/EchoChamber/Rule/records"
      # Source: simulation-bases.md §4.1 Ideologue
      initial_opinion: 0.4
      # Source: simulation-bases.md §4.1 Ideologue (balanced left/right clusters)
      alternate_initial_sign: true
      # Source: simulation-bases.md §7 Communication And Round Structure
      custom_state_hot_limit: 3
      # Source: simulation-bases.md §4.1 Decision Process
      in_group_weight: 0.6
      # Source: simulation-bases.md §4.1 Decision Process
      extremity_boost: 1.3
      # Source: simulation-bases.md §4.1 Decision Process
      out_group_discount: 0.05
      # Source: simulation-bases.md §4.1 Decision Process
      spread_eagerness: 0.9
      # Source: simulation-bases.md §4.1 Decision Process
      polarize_opinion_threshold: 0.3
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Conformists (Homophily Reinforcers)
# -----------------------------------------------------------------------------
conformist:
  name: "Conformist"
  class: "examples.EchoChamber.Rule.players:Conformist"
  num_instances: 5
  config:
    identity: "conformist"
    role: player
    steps_per_turn: 1
    group_tags:
      - agents
    extras:
      # Source: simulation-bases.md §7 Communication And Round Structure
      record_path: "EXPERIMENT/EchoChamber/Rule/records"
      # Source: simulation-bases.md §4.2 Conformist
      initial_opinion: 0.0
      # Source: simulation-bases.md §4.2 Conformist
      alternate_initial_sign: false
      # Source: simulation-bases.md §7 Communication And Round Structure
      custom_state_hot_limit: 3
      # Source: simulation-bases.md §4.2 Decision Process
      conformity: 0.7
      # Source: simulation-bases.md §4.2 Decision Process
      conformity_eagerness: 0.6
      # Source: simulation-bases.md §4.2 Decision Process
      group_proximity_threshold: 0.3
      # Source: simulation-bases.md §4.2 Behavioral Framework
      opposing_cluster_discount: 0.5
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Critical Thinkers (Evidence Evaluators)
# -----------------------------------------------------------------------------
critical_thinker:
  name: "Critical Thinker"
  class: "examples.EchoChamber.Rule.players:CriticalThinker"
  num_instances: 3
  config:
    identity: "critical_thinker"
    role: player
    steps_per_turn: 1
    group_tags:
      - agents
    extras:
      # Source: simulation-bases.md §7 Communication And Round Structure
      record_path: "EXPERIMENT/EchoChamber/Rule/records"
      # Source: simulation-bases.md §4.3 CriticalThinker
      initial_opinion: 0.0
      # Source: simulation-bases.md §4.3 CriticalThinker
      alternate_initial_sign: false
      # Source: simulation-bases.md §7 Communication And Round Structure
      custom_state_hot_limit: 3
      # Source: simulation-bases.md §4.3 Decision Process
      critical_weight: 0.5
      # Source: simulation-bases.md §4.3 Decision Process
      critical_eagerness: 0.7
      # Source: simulation-bases.md §4.3 Decision Process
      evidence_sensitivity: 0.6
      # Source: simulation-bases.md §4.3 Decision Process (slow update)
      update_damping: 0.3
      # Source: simulation-bases.md §4.3 Decision Process
      high_polarization_threshold: 0.3
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Bridge Builders (Cross-Group Engagers)
# -----------------------------------------------------------------------------
bridge_builder:
  name: "Bridge Builder"
  class: "examples.EchoChamber.Rule.players:BridgeBuilder"
  num_instances: 2
  config:
    identity: "bridge_builder"
    role: player
    steps_per_turn: 1
    group_tags:
      - agents
    extras:
      # Source: simulation-bases.md §7 Communication And Round Structure
      record_path: "EXPERIMENT/EchoChamber/Rule/records"
      # Source: simulation-bases.md §4.4 BridgeBuilder
      initial_opinion: 0.0
      # Source: simulation-bases.md §4.4 BridgeBuilder
      alternate_initial_sign: false
      # Source: simulation-bases.md §7 Communication And Round Structure
      custom_state_hot_limit: 3
      # Source: simulation-bases.md §4.4 Decision Process
      bridge_weight: 0.4
      # Source: simulation-bases.md §4.4 Decision Process
      bridge_strength: 0.8
      # Source: simulation-bases.md §4.4 Decision Process
      centering_tendency: 0.5
      # Source: simulation-bases.md §4.4 Decision Process
      high_cluster_separation_threshold: 0.5
      # Source: simulation-bases.md §4.4 Decision Process
      elevated_cluster_separation_threshold: 0.2
      # Source: simulation-bases.md §4.4 Decision Process (weaker response)
      elevated_bridge_multiplier: 0.5
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Passive Followers (Baseline)
# -----------------------------------------------------------------------------
passive_follower:
  name: "Passive Follower"
  class: "examples.EchoChamber.Rule.players:PassiveFollower"
  num_instances: 4
  config:
    identity: "passive_follower"
    role: player
    steps_per_turn: 1
    group_tags:
      - agents
    extras:
      # Source: simulation-bases.md §7 Communication And Round Structure
      record_path: "EXPERIMENT/EchoChamber/Rule/records"
      # Source: simulation-bases.md §4.5 PassiveFollower
      initial_opinion: 0.0
      # Source: simulation-bases.md §4.5 PassiveFollower
      alternate_initial_sign: false
      # Source: simulation-bases.md §7 Communication And Round Structure
      custom_state_hot_limit: 3
      # Source: simulation-bases.md §4.5 Decision Process
      engagement_probability: 0.3
      # Source: simulation-bases.md §4.5 Decision Process
      drift_rate: 0.1
      # Source: simulation-bases.md §4.5 Decision Process
      alignment_strength: 0.4
      # Source: simulation-bases.md §4.5 Decision Process
      polarize_opinion_threshold: 0.3
      # Source: simulation-bases.md §4.5 Decision Process (weak neutral action)
      neutral_intensity_min: 0.05
      # Source: simulation-bases.md §4.5 Decision Process (weak neutral action)
      neutral_intensity_max: 0.2
  persona: !include persona.yml
