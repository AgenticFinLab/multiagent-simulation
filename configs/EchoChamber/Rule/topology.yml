# =============================================================================
# EchoChamber Topology - Star Pattern
# =============================================================================
# OpinionEnvironment as hub, all agents communicate through rule_opinion_environment.
#
#         rule_ideologue ────────────────┐
#         rule_conformist ──────────────┤
#         rule_critical_thinker ────────┼──▶ rule_opinion_environment ──▶ all agents
#         rule_bridge_builder ──────────┤             (polarization, opinion, cluster data)
#         rule_passive_follower ────────┘
#
# Execution flow per round:
#   Level 0: rule_opinion_environment executes (broadcasts polarization + opinion metrics)
#   Level 1: all agents execute in parallel (submit polarize/depolarize/neutral actions)
# =============================================================================

type: "star"

sources:
  - rule_opinion_environment

connections:
  # Environment → All agents (polarization + opinion data broadcast)
  rule_opinion_environment:
    - rule_ideologue
    - rule_conformist
    - rule_critical_thinker
    - rule_bridge_builder
    - rule_passive_follower

  # Each agent → Environment only (action submission)
  rule_ideologue:
    - rule_opinion_environment

  rule_conformist:
    - rule_opinion_environment

  rule_critical_thinker:
    - rule_opinion_environment

  rule_bridge_builder:
    - rule_opinion_environment

  rule_passive_follower:
    - rule_opinion_environment
