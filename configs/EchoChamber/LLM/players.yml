# =============================================================================
# EchoChamberLLM Players Configuration
# =============================================================================
# 1 OpinionEnvironment (rule-based) + 5 LLM Social Agent Types
#
# Agent Types:
#   - OpinionEnvironment: Rule-based coordinator (polarization dynamics)
#   - LLMIdeologue: Strong opinion holder (DESTABILIZING)
#   - LLMConformist: Group opinion adopter (DESTABILIZING)
#   - LLMCriticalThinker: Evidence evaluator (STABILIZING)
#   - LLMBridgeBuilder: Cross-group engager (STRONGLY STABILIZING)
#   - LLMPassiveBystander: Low-engagement participant (NEUTRAL)
# =============================================================================

# -----------------------------------------------------------------------------
# OpinionEnvironment (Coordinator) — identical to Rule variant
# -----------------------------------------------------------------------------
environment:
  name: "OpinionEnvironment"
  class: "examples.EchoChamber.LLM.players:OpinionEnvironment"
  num_instances: 1
  config:
    identity: "environment"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - environment
    extras:
      # Source: simulation-bases.md §7 Communication And Round Structure
      record_path: "EXPERIMENT/EchoChamber/LLM/records"
      # Source: simulation-bases.md §6 Parameter Table
      initial_polarization: 0.15
      # Source: simulation-bases.md §6 Parameter Table
      polarization_impact: 0.12
      # Source: simulation-bases.md §6 Parameter Table
      centripetal_force: 0.01
      # Source: simulation-bases.md §3 Environment Mechanism (noise term)
      noise_std: 0.02
      # Source: simulation-bases.md §7 Communication And Round Structure
      custom_state_hot_limit: 3
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# LLM Ideologues
# -----------------------------------------------------------------------------
llm_ideologue:
  name: "LLM Ideologue"
  class: "examples.EchoChamber.LLM.players:LLMIdeologue"
  num_instances: 6
  config:
    identity: "llm_ideologue"
    role: player
    steps_per_turn: 1
    group_tags:
      - llm_agents
    extras:
      # Source: simulation-bases.md §7 Communication And Round Structure
      record_path: "EXPERIMENT/EchoChamber/LLM/records"
      # Source: simulation-bases.md §4.1 Ideologue
      initial_opinion: 0.4
      # Source: simulation-bases.md §4.1 Decision Process (opinion extremization)
      polarize_opinion_step: 0.05
      # Source: simulation-bases.md §4.1 Behavioral Framework (moderation response)
      depolarize_opinion_step: 0.05
      # Source: simulation-bases.md §7 Communication And Round Structure
      custom_state_hot_limit: 3
      llm:
        # Source: simulation-bases.md §4.1 Ideologue
        sys_message: "examples.EchoChamber.LLM.prompts:LLM_IDEOLOGUE_SYS"
        # Source: simulation-bases.md §7 Communication And Round Structure
        user_message: "examples.EchoChamber.LLM.prompts:LLM_USER_TEMPLATE"
        # Source: simulation-bases.md §9 Variant Comparison Preview
        lm_type: "api"
        # Source: simulation-bases.md §9 Variant Comparison Preview
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        # Source: implementation reliability policy; retries do not alter behavior
        max_retries: 3
        generation_config:
          # Source: simulation-bases.md §9 Variant Comparison Preview
          temperature: 0.3
          # Source: simulation-bases.md §9 Variant Comparison Preview
          max_new_tokens: 500
  persona: !include persona.yml

