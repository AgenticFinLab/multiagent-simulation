# =============================================================================
# EchoChamberLLM Players Configuration
# =============================================================================
# 1 OpinionEnvironment (rule-based) + 5 LLM Social Agent Types
#
# Agent Types:
#   - OpinionEnvironment: Rule-based coordinator (polarization dynamics)
#   - LLMIdeologue: Strong opinion holder (DESTABILIZING)
#   - LLMConformist: Group opinion adopter (DESTABILIZING)
#   - LLMCriticalThinker: Evidence evaluator (STABILIZING)
#   - LLMBridgeBuilder: Cross-group engager (STRONGLY STABILIZING)
#   - LLMPassiveBystander: Low-engagement participant (NEUTRAL)
# =============================================================================

# -----------------------------------------------------------------------------
# OpinionEnvironment (Coordinator) — identical to Rule variant
# -----------------------------------------------------------------------------
environment:
  name: "OpinionEnvironment"
  class: "examples.EchoChamber.LLM.players:OpinionEnvironment"
  num_instances: 1
  config:
    identity: "environment"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - environment
    extras:
      record_path: "EXPERIMENT/EchoChamber/LLM/records"
      initial_polarization: 0.15
      polarization_impact: 0.12
      centripetal_force: 0.01
      noise_std: 0.02
      custom_state_hot_limit: 3
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# LLM Ideologues
# -----------------------------------------------------------------------------
llm_ideologue:
  name: "LLM Ideologue"
  class: "examples.EchoChamber.LLM.players:LLMIdeologue"
  num_instances: 6
  config:
    identity: "llm_ideologue"
    role: player
    steps_per_turn: 1
    group_tags:
      - llm_agents
    extras:
      record_path: "EXPERIMENT/EchoChamber/LLM/records"
      initial_opinion: 0.4
      custom_state_hot_limit: 3
      llm:
        sys_message: "examples.EchoChamber.LLM.prompts:LLM_IDEOLOGUE_SYS"
        user_message: "examples.EchoChamber.LLM.prompts:LLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.3
          max_new_tokens: 500
  persona: !include persona.yml

