market:
  name: "Market with Momentum Dynamics"
  class: "examples.MomentumEffectLLM.players:Market"
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      price_model: "momentum_aware"
  persona: !include persona.yml

llm_momentum_trader:
  name: "LLM Momentum Trader"
  class: "examples.MomentumEffectLLM.players:LLMMomentumTrader"
  config:
    identity: "llm_momentum_trader"
    role: player
    steps_per_turn: 1
    group_tags:
      - llm_investors
    extras:
      strategy: momentum_trader
      llm:
        sys_message: "examples.MomentumEffectLLM.prompts:LLM_MOMENTUM_TRADER_SYS"
        user_message: "examples.MomentumEffectLLM.prompts:LLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-1-6-lite-251015"
        generation_config:
          temperature: 0.3
          max_new_tokens: 500
  persona: !include persona.yml

