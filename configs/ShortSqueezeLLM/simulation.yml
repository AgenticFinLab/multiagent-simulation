# =============================================================================
# ShortSqueezeLLM Simulation Configuration
# =============================================================================
# LLM-based Short Squeeze simulation - GameStop Style
# Tests: Supply-demand imbalance, forced covering, retail coordination
#
# Usage:
#   python examples/ShortSqueezeLLM/run_squeeze_llm.py -c configs/ShortSqueezeLLM/simulation.yml
# =============================================================================

setting:
  name: "short_squeeze_llm_simulation"
  description: "LLM-based short squeeze with supply-demand dynamics"
  total_rounds: 50
  round_history_limit: 3
  record_path: "EXPERIMENT/ShortSqueezeLLM/records"
  save_diagram_interval: 25

environment:
  dotenv_path: .env
  workspace: "."

ray:
  address: null
  namespace: "short_squeeze_llm"
  actor_prefix: null
  # Derived: 5 investors run parallel at level 1; +1 for OS/driver = 6
  num_cpus: 6
  num_gpus: null
  # Derived: 6 players, star topology -> 10 msgs/round
  #   6 TurnResult + 6 pending_info + 10 Message = 22 Ray objects
  #   22 obj x 64 KB min-alloc = 1408 KB (1.38 MB) base peak
  #   LLM TurnResult also carries prompt+response strings (~4-8 KB each) -> extra overhead
  #   Minimum 512 MB floor for LLM simulations -> 536870912 bytes
  object_store_memory: 536870912
  include_dashboard: false
  logging_level: "warning"
  log_to_driver: false
  actor_options:
    max_restarts: 3
    max_task_retries: 1
    max_concurrency: 10
  runtime_env:
    working_dir: null
    pip: []
    env_vars: {}
  serialization:
    use_arrow: true
    register_custom_serializers: true

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/ShortSqueezeLLM/communication"
  record_messages: true
  message_block_size: 500
