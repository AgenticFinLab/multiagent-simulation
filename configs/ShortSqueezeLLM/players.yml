market:
  name: "Market with Short Interest Tracking"
  class: "examples.ShortSqueezeLLM.players:Market"
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      price_model: "short_squeeze"
  persona: !include persona.yml

llm_short_seller:
  name: "LLM Short Seller"
  class: "examples.ShortSqueezeLLM.players:LLMShortSeller"
  config:
    identity: "llm_short_seller"
    role: player
    steps_per_turn: 1
    group_tags:
      - llm_investors
    extras:
      strategy: short_seller
      llm:
        sys_message: "examples.ShortSqueezeLLM.prompts:LLM_SHORT_SELLER_SYS"
        user_message: "examples.ShortSqueezeLLM.prompts:LLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-1-6-lite-251015"
        generation_config:
          temperature: 0.3
          max_new_tokens: 500
  persona: !include persona.yml

