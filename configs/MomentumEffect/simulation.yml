# =============================================================================
# MomentumEffect Simulation Configuration
# =============================================================================
# Demonstrates momentum trading strategies (Jegadeesh & Titman 1993)
#
# Usage:
#   python examples/MomentumEffect/run_momentum.py -c configs/MomentumEffect/simulation.yml
# =============================================================================

setting:
  name: "momentum_effect_simulation"
  description: "Momentum trading vs contrarian strategies"
  total_rounds: 200
  entry_limit: 100
  record_path: "EXPERIMENT/MomentumEffect/records"
  save_diagram_interval: 50

environment:
  dotenv_path: .env
  workspace: "."

ray:
  address: null
  namespace: "momentum_effect"
  actor_prefix: null
  num_cpus: 4
  num_gpus: null
  object_store_memory: null
  include_dashboard: false
  logging_level: "warning"
  log_to_driver: true
  actor_options:
    max_restarts: 3
    max_task_retries: 1
    max_concurrency: 10
  runtime_env:
    working_dir: null
    pip: []
    env_vars: {}
  serialization:
    use_arrow: true
    register_custom_serializers: true

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/MomentumEffect/communication"
