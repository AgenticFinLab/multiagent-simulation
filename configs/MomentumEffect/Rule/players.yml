      record_path: "EXPERIMENT/MomentumEffect/Rule/records"  # Source: framework infrastructure
      # Base investor parameters
      initial_cash: 10000.0  # Source: simulation-bases.md §6
      initial_position: 0.0  # Source: simulation-bases.md §6
      custom_state_hot_limit: 3  # Source: framework infrastructure
      # MarketMaker specific
      inventory_target: 0.0  # Source: simulation-bases.md §4.4.7
      reversion_speed: 0.2  # Source: simulation-bases.md §4.4.7
  persona: !include persona.yml

rule_technical_trader:
  name: "Technical Trader"
  class: "examples.MomentumEffect.Rule.players:TechnicalTrader"
  # Expander → technical_trader_1, technical_trader_2
  num_instances: 2
  config:
    identity: "rule_technical_trader"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/MomentumEffect/Rule/records"  # Source: framework infrastructure
      # Base investor parameters
      initial_cash: 10000.0  # Source: simulation-bases.md §6
      # Start with some position
      initial_position: 20.0  # Source: simulation-bases.md §6
      custom_state_hot_limit: 3  # Source: framework infrastructure
      # TechnicalTrader specific (MA crossover)
      short_window: 3  # Source: simulation-bases.md §4.5.7
      long_window: 10  # Source: simulation-bases.md §4.5.7
      scale: 2.0  # Source: simulation-bases.md §4.5.7
      max_position: 60.0  # Source: simulation-bases.md §4.5.7
  persona: !include persona.yml

rule_fundamental_trader:
  name: "Fundamental Trader"
  class: "examples.MomentumEffect.Rule.players:FundamentalTrader"
  # Expander → fundamental_trader_1, fundamental_trader_2
  num_instances: 2
  config:
    identity: "rule_fundamental_trader"
    role: player
    steps_per_turn: 1
    group_tags:
