    extras:
      record_path: "EXPERIMENT/MomentumEffect/Rule/records"  # Source: framework infrastructure
      # Base investor parameters
      initial_cash: 10000.0  # Source: simulation-bases.md §6
      initial_position: 0.0  # Source: simulation-bases.md §6
      custom_state_hot_limit: 3  # Source: framework infrastructure
      # IndexFund specific
      # 60% equity
      target_allocation: 0.6  # Source: simulation-bases.md §4.3.7
      # 5% deviation triggers rebalance
      rebalance_threshold: 0.05  # Source: simulation-bases.md §4.3.7
  persona: !include persona.yml

