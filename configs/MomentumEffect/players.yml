# =============================================================================
# MomentumEffect Players Configuration
# =============================================================================

market:
  name: "Market"
  class: "examples.MomentumEffect.players:Market"
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/MomentumEffect/records"
  persona: !include persona.yml

momentum_trader_1:
  name: "Momentum Trader 1"
  class: "examples.MomentumEffect.players:MomentumTrader"
  config:
    identity: "momentum_trader_1"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
