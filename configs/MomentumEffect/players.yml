# =============================================================================
# MomentumEffect Players Configuration
# =============================================================================
# All parameters explicitly defined - no defaults in code.
#
# Investor Types:
#   - MomentumTrader: Buys past winners, sells past losers (Jegadeesh & Titman 1993)
#   - ContrarianTrader: Mean reversion - buys losers, sells winners
#   - IndexFund: Passive baseline - fixed allocation
#   - MarketMaker: Liquidity provision - inventory mean reversion
#   - TechnicalTrader: Moving average crossover (golden/death cross)
#   - FundamentalTrader: Value-based anchor toward intrinsic value
# =============================================================================

market:
  name: "Market"
  class: "examples.MomentumEffect.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/MomentumEffect/records"
      # Market parameters
      initial_price: 100.0
      initial_fundamental: 100.0
      price_impact: 0.08
      # Slow - allows momentum to persist
      mean_reversion: 0.01
      noise_std: 0.3
      # Fundamental drift (creates momentum opportunities)
      # Autocorrelated drift
      drift_persistence: 0.95
      drift_volatility: 0.5
      custom_state_hot_limit: 3
  persona: !include persona.yml

momentum_trader:
  name: "Momentum Trader"
  class: "examples.MomentumEffect.players:MomentumTrader"
  # Expander → momentum_trader_1, momentum_trader_2, momentum_trader_3
  num_instances: 3
  config:
    identity: "momentum_trader"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/MomentumEffect/records"
      # Base investor parameters
      initial_cash: 10000.0
      initial_position: 0.0
      custom_state_hot_limit: 3
      # MomentumTrader specific
      lookback_window: 5
      # 2% threshold
      momentum_threshold: 0.02
      # Aggressiveness
      scale: 3.0
      max_position: 100.0
  persona: !include persona.yml

contrarian_trader:
  name: "Contrarian Trader"
  class: "examples.MomentumEffect.players:ContrarianTrader"
  # Expander → contrarian_trader_1, contrarian_trader_2
  num_instances: 2
  config:
    identity: "contrarian_trader"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/MomentumEffect/records"
      # Base investor parameters
      initial_cash: 10000.0
      initial_position: 0.0
      custom_state_hot_limit: 3
      # ContrarianTrader specific
      # 3% deviation
      reversion_threshold: 0.03
      scale: 2.0
      max_position: 80.0
  persona: !include persona.yml

index_fund:
  name: "Index Fund"
  class: "examples.MomentumEffect.players:IndexFund"
  num_instances: 1
  config:
    identity: "index_fund"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/MomentumEffect/records"
      # Base investor parameters
      initial_cash: 10000.0
      initial_position: 0.0
      custom_state_hot_limit: 3
      # IndexFund specific
      # 60% equity
      target_allocation: 0.6
      # 5% deviation triggers rebalance
      rebalance_threshold: 0.05
  persona: !include persona.yml

market_maker:
  name: "Market Maker"
  class: "examples.MomentumEffect.players:MarketMaker"
  num_instances: 1
  config:
    identity: "market_maker"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/MomentumEffect/records"
      # Base investor parameters
      initial_cash: 10000.0
      initial_position: 0.0
      custom_state_hot_limit: 3
      # MarketMaker specific
      inventory_target: 0.0
      reversion_speed: 0.2
  persona: !include persona.yml

technical_trader:
  name: "Technical Trader"
  class: "examples.MomentumEffect.players:TechnicalTrader"
  # Expander → technical_trader_1, technical_trader_2
  num_instances: 2
  config:
    identity: "technical_trader"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/MomentumEffect/records"
      # Base investor parameters
      initial_cash: 10000.0
      # Start with some position
      initial_position: 20.0
      custom_state_hot_limit: 3
      # TechnicalTrader specific (MA crossover)
      short_window: 3
      long_window: 10
      scale: 2.0
      max_position: 60.0
  persona: !include persona.yml

fundamental_trader:
  name: "Fundamental Trader"
  class: "examples.MomentumEffect.players:FundamentalTrader"
  # Expander → fundamental_trader_1, fundamental_trader_2
  num_instances: 2
  config:
    identity: "fundamental_trader"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/MomentumEffect/records"
      # Base investor parameters
      initial_cash: 10000.0
      initial_position: 0.0
      custom_state_hot_limit: 3
      # FundamentalTrader specific
      # 5% mispricing
      value_threshold: 0.05
      scale: 1.5
      max_position: 50.0
  persona: !include persona.yml
