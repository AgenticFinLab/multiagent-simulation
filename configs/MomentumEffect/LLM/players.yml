# =============================================================================
# MomentumEffectLLM Players Configuration
# =============================================================================

market:
  name: "Market with Momentum Dynamics"
  class: "examples.MomentumEffect.LLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/MomentumEffect/LLM/records"
      initial_price: 100.0
      initial_fundamental: 100.0
      price_impact: 0.08
      mean_reversion: 0.01
      noise_std: 0.3
      drift_persistence: 0.95
      drift_volatility: 0.5
      custom_state_hot_limit: 3
  persona: !include persona.yml

llm_momentum_trader:
  name: "LLM Momentum Trader"
  class: "examples.MomentumEffect.LLM.players:LLMMomentumTrader"
  # Expander → llm_momentum_trader_1 .. llm_momentum_trader_3
  num_instances: 3
  config:
    identity: "llm_momentum_trader"
    role: player
    steps_per_turn: 1
    group_tags:
      - llm_investors
    extras:
      record_path: "EXPERIMENT/MomentumEffect/LLM/records"
      initial_cash: 10000.0
      initial_position: 50.0
      custom_state_hot_limit: 3
      llm:
        sys_message: "examples.MomentumEffect.LLM.prompts:LLM_MOMENTUM_TRADER_SYS"
        user_message: "examples.MomentumEffect.LLM.prompts:LLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-1-6-lite-251015"
        generation_config:
          temperature: 0.3
          max_new_tokens: 500
  persona: !include persona.yml

