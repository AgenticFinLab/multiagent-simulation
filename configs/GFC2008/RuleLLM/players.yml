# GFC2008 RuleLLM Agent Configuration

market:
  name: "Market"
  class: "examples.GFC2008.RuleLLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    extras:
      initial_price: 100.0
      fundamental_value: 100.0
      price_impact: 0.03
      mean_reversion: 0.005
      noise_std: 0.02

m_b_s_originator_1:
  name: "MBSOriginator 1"
  class: "examples.GFC2008.RuleLLM.players:LLMMBSOriginator"
  num_instances: 2
  config:
    identity: "m_b_s_originator_1"
    role: player
    extras:
      initial_cash: 1000000.00
      initial_position: 0
      agent_type: "m_b_s_originator"
      llm:
        model: "doubao-pro-32k"


rating_agency_2:
  name: "RatingAgency 2"
