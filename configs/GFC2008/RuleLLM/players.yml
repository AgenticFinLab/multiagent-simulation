# GFC2008 RuleLLM Agent Configuration

market:
  archetype: credit-minsky-cycle  # -> masim/agents/defines/market/credit-minsky-cycle.md
  name: "Market"
  class: "examples.GFC2008.RuleLLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/GFC2008/RuleLLM/records"  # Source: framework infrastructure
      initial_price: 100.0  # Source: simulation-bases.md §6
      fundamental_value: 100.0  # Source: simulation-bases.md §6
      price_impact: 0.04  # Source: simulation-bases.md §6
      mean_reversion: 0.005  # Source: simulation-bases.md §6
      noise_std: 0.015  # Source: simulation-bases.md §6
      custom_state_hot_limit: 3  # Source: framework infrastructure
  persona: !include persona.yml

rulellm_mbs_originator:
  name: "MBSOriginator"
  class: "examples.GFC2008.RuleLLM.players:RuleLLMMBSOriginator"
  num_instances: 2
  config:
    identity: "rulellm_mbs_originator"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/GFC2008/RuleLLM/records"  # Source: framework infrastructure
      initial_cash: 500000.0  # Source: simulation-bases.md §6
      initial_position: 3000  # Source: simulation-bases.md §6
      initial_price: 100.0  # Source: simulation-bases.md §6
      fundamental_value: 100.0  # Source: simulation-bases.md §6
      origination_rate: 0.08  # Source: simulation-bases.md §4.1.7
      base_size: 300  # Source: simulation-bases.md §4.1.7
      custom_state_hot_limit: 3  # Source: framework infrastructure
      llm:
        sys_message: "examples.GFC2008.RuleLLM.prompts:RULELLM_MBS_ORIGINATOR_SYS"
        user_message: "examples.GFC2008.RuleLLM.prompts:RULELLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.5
          max_tokens: 512
  persona: !include persona.yml

