# GFC2008 LLM Simulation Configuration
#
# 2007-2009 financial crisis - Housing bubble burst triggered global recession
#
# Usage:
#   python examples/GFC2008/LLM/run_gfc2008_llm.py \
#       -c configs/GFC2008/LLM/simulation.yml

setting:
  name: "GFC2008-LLM"
  description: "2008 Global Financial Crisis simulation with mortgage-backed securities, rating agency failures, and systemic contagion"
  total_rounds: 200
  
  record_path: "EXPERIMENT/GFC2008/LLM/records"
  storage_path: "EXPERIMENT/GFC2008/LLM/communication"
  
  log_level: "INFO"
  log_to_file: true
  log_path: "EXPERIMENT/GFC2008/LLM/logs"

environment:
  dotenv_path: ".env"
  workspace: "."

llm:
  model: "doubao-pro-32k"
  temperature: 0.3
  max_tokens: 500
  timeout: 30

ray:
  namespace: "gfc2008_llm"
  ignore_reinit_error: true
  object_store_memory: 536870912
  num_cpus: 4

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/GFC2008/LLM/communication"
  record_messages: true
  message_timeout_ms: 30000
  max_retries: 3
