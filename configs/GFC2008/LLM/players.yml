# GFC2008 LLM Agent Configuration

market:
  name: "Market"
  class: "examples.GFC2008.LLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/GFC2008/LLM/records"
      initial_price: 100.0
      fundamental_value: 100.0
      price_impact: 0.04
      mean_reversion: 0.005
      noise_std: 0.015
      custom_state_hot_limit: 3
  persona: !include persona.yml

mbsoriginator:
  name: "MBSOriginator"
  class: "examples.GFC2008.LLM.players:LLMMBSOriginator"
  num_instances: 2
  config:
    identity: "mbsoriginator"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/GFC2008/LLM/records"
      initial_cash: 500000.0
      initial_position: 3000
      initial_price: 100.0
      fundamental_value: 100.0
      origination_rate: 0.08
      base_size: 300
      custom_state_hot_limit: 3
      llm:
        sys_message: "examples.GFC2008.LLM.prompts:LLM_MBS_ORIGINATOR_SYS"
        user_message: "examples.GFC2008.LLM.prompts:LLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.7
          max_tokens: 512
  persona: !include persona.yml

leveragedinvestor:
  name: "LeveragedInvestor"
  class: "examples.GFC2008.LLM.players:LLMLeveragedInvestor"
  num_instances: 2
  config:
    identity: "leveragedinvestor"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/GFC2008/LLM/records"
      initial_cash: 2000000.0
      initial_position: 1500
      initial_price: 100.0
      fundamental_value: 100.0
      margin_trigger: 0.30
      fire_sale_fraction: 0.25
      buy_threshold: -0.03
      base_size: 350
      custom_state_hot_limit: 3
      llm:
        sys_message: "examples.GFC2008.LLM.prompts:LLM_LEVERAGED_INVESTOR_SYS"
        user_message: "examples.GFC2008.LLM.prompts:LLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.5
          max_tokens: 512
  persona: !include persona.yml

