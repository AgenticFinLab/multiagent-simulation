# GFC2008 Rule Simulation Configuration
#
# 2007-2009 financial crisis - Housing bubble burst triggered global recession
#
# Usage:
#   python examples/GFC2008/Rule/run_gfc2008.py \
#       -c configs/GFC2008/Rule/simulation.yml

setting:
  name: "GFC2008-Rule"
  description: "2008 Global Financial Crisis simulation with mortgage-backed securities, rating agency failures, and systemic contagion"
  total_rounds: 200
  
  record_path: "EXPERIMENT/GFC2008/Rule/records"
  storage_path: "EXPERIMENT/GFC2008/Rule/communication"
  
  log_level: "INFO"
  log_to_file: true
  log_path: "EXPERIMENT/GFC2008/Rule/logs"

environment:
  dotenv_path: ".env"
  workspace: "."

ray:
  namespace: "gfc2008_rule"
  ignore_reinit_error: true
  object_store_memory: 536870912
  num_cpus: 4

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/GFC2008/Rule/communication"
  record_messages: true
  message_timeout_ms: 5000
  max_retries: 3
