# =============================================================================
# ShortSqueeze LLM Players Configuration
# =============================================================================
# Traceability: every extras leaf below carries a `# Source: target §9 <param>
# row; <citation>` comment referencing examples/ShortSqueeze/finance-shortsqueeze.md.
# Order-contract note: this scenario uses `{bid_price, quantity, strategy,
# is_short_cover}` where `strategy` is derived at runtime from
# `self.__class__.__name__` inside the player class, so no `agent_type` field
# is added to extras (see target §8.2).
# =============================================================================

market:
  name: "Market with Short Interest Tracking"
  class: "examples.ShortSqueeze.LLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/ShortSqueeze/LLM/records"
      fundamental_value: 50.0  # Source: target §9 fundamental_value row.
      initial_price: 30.0  # Source: target §9 initial_price row.
      price_impact: 0.1  # Source: target §9 price_impact row.
      mean_reversion: 0.005  # Source: target §9 mean_reversion row.
      noise_std: 0.5  # Source: target §9 noise_std row.
      initial_short_interest: 80.0  # Source: target §9 initial_short_interest row; §4.5 float-scarcity signal.
      custom_state_hot_limit: 3  # Source: target §9 custom_state_hot_limit row.
  persona: !include persona.yml

llm_short_seller:
  name: "LLM Short Seller"
  class: "examples.ShortSqueeze.LLM.players:LLMShortSeller"
  # Expander → llm_short_seller_1, llm_short_seller_2, llm_short_seller_3
  num_instances: 3
  config:
    identity: "llm_short_seller"
    role: player
    steps_per_turn: 1
    group_tags:
      - llm_investors
    extras:
      record_path: "EXPERIMENT/ShortSqueeze/LLM/records"
      initial_cash: 10000.0  # Source: target §9 initial_cash row.
      initial_position: -50.0  # Source: target §9 initial_position (ShortSeller LLM/RuleLLM/Rag) row; §4.1 short book.
      custom_state_hot_limit: 3  # Source: target §9 custom_state_hot_limit row.
      llm:
        sys_message: "examples.ShortSqueeze.LLM.prompts:LLM_SHORT_SELLER_SYS"
        user_message: "examples.ShortSqueeze.LLM.prompts:LLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.3
          max_new_tokens: 500
  persona: !include persona.yml

