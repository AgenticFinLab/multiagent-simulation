# =============================================================================
# ShortSqueezeLLM Players Configuration
# =============================================================================

market:
  name: "Market with Short Interest Tracking"
  class: "examples.ShortSqueeze.RuleLLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/ShortSqueeze/RuleLLM/records"
      fundamental_value: 50.0
      initial_price: 30.0
      price_impact: 0.1
      mean_reversion: 0.005
      noise_std: 0.5
      initial_short_interest: 80.0
      custom_state_hot_limit: 3
  persona: !include persona.yml

rulellm_short_seller:
  name: "RuleLLM Short Seller"
  class: "examples.ShortSqueeze.RuleLLM.players:RuleLLMShortSeller"
  # Expander → rulellm_short_seller_1, rulellm_short_seller_2, rulellm_short_seller_3
  num_instances: 3
  config:
    identity: "rulellm_short_seller"
    role: player
    steps_per_turn: 1
    group_tags:
      - rulellm_investors
    extras:
      record_path: "EXPERIMENT/ShortSqueeze/RuleLLM/records"
      initial_cash: 10000.0
      initial_position: -50.0
      custom_state_hot_limit: 3
      llm:
        sys_message: "examples.ShortSqueeze.RuleLLM.prompts:RULELLM_SHORT_SELLER_SYS"
        user_message: "examples.ShortSqueeze.RuleLLM.prompts:RULELLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-1-6-lite-251015"
        generation_config:
          temperature: 0.3
          max_new_tokens: 500
  persona: !include persona.yml

