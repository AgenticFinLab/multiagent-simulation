# =============================================================================
# ShortSqueeze RuleLLM Players Configuration
# =============================================================================
# Traceability: every extras leaf below carries a `# Source: target §9 <param>
# row; <citation>` comment referencing examples/ShortSqueeze/finance-shortsqueeze.md.
# Liquidity-aware market extension (target §8.1): P(t+1) = max(1, P(t) +
# lambda × LiquidityFactor × net_demand + gamma × (F − P) + epsilon) with
# base_liquidity, high_impact_multiplier, low_liquidity_threshold.
# Order-contract note: this scenario uses `{bid_price, quantity, strategy,
# is_short_cover, provides_liquidity}` in the RuleLLM variant; `strategy` is
# derived at runtime from `self.__class__.__name__` inside the player class.
# =============================================================================

market:
  archetype: stock-standard-price-impact  # -> AGENT_POOL/market/stock-standard-price-impact.md
  name: "Market with Short Interest Tracking"
  class: "examples.ShortSqueeze.RuleLLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/ShortSqueeze/RuleLLM/records"
      fundamental_value: 50.0  # Source: target §9 fundamental_value row.
      initial_price: 30.0  # Source: target §9 initial_price row.
      base_price_impact: 0.1  # Source: target §9 price_impact / base_price_impact row; RuleLLM/Rag alias.
      mean_reversion: 0.005  # Source: target §9 mean_reversion row.
      noise_std: 0.5  # Source: target §9 noise_std row.
      initial_short_interest: 80.0  # Source: target §9 initial_short_interest row.
      custom_state_hot_limit: 3  # Source: target §9 custom_state_hot_limit row.
      base_liquidity: 50.0  # Source: target §9 base_liquidity row; RuleLLM/Rag liquidity-aware market.
      high_impact_multiplier: 3.0  # Source: target §9 high_impact_multiplier row; liquidity-thin amplification.
      low_liquidity_threshold: 30.0  # Source: target §9 low_liquidity_threshold row; liquidity amplification switch.
  persona: !include persona.yml

rulellm_short_seller:
  name: "RuleLLM Short Seller"
  class: "examples.ShortSqueeze.RuleLLM.players:RuleLLMShortSeller"
  # Expander → rulellm_short_seller_1, rulellm_short_seller_2, rulellm_short_seller_3
  num_instances: 3
  config:
    identity: "rulellm_short_seller"
    role: player
    steps_per_turn: 1
    group_tags:
      - rulellm_investors
    extras:
      record_path: "EXPERIMENT/ShortSqueeze/RuleLLM/records"
      initial_cash: 10000.0  # Source: target §9 initial_cash row.
      initial_position: -50.0  # Source: target §9 initial_position (ShortSeller LLM/RuleLLM/Rag) row; §4.1.
      custom_state_hot_limit: 3  # Source: target §9 custom_state_hot_limit row.
      llm:
        sys_message: "examples.ShortSqueeze.RuleLLM.prompts:RULELLM_SHORT_SELLER_SYS"
        user_message: "examples.ShortSqueeze.RuleLLM.prompts:RULELLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.3
          max_new_tokens: 500
  persona: !include persona.yml

