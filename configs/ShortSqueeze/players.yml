# =============================================================================
# ShortSqueeze Players Configuration
# =============================================================================
# Supply-Demand Imbalance Simulation - GameStop 2021 style
#
# Investor Types:
#   - ShortSeller: Borrows and sells, must cover when losses mount
#   - MomentumBuyer: Buys on upward momentum
#   - RetailTrader: Can trigger initial squeeze (bullish bias + noise)
#   - ValueInvestor: Buys when undervalued relative to fundamental
#   - InstitutionalHolder: Large passive holder
# =============================================================================

market:
  name: "Market"
  class: "examples.ShortSqueeze.players:Market"
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/ShortSqueeze/records"
      # Market parameters
      fundamental_value: 50.0      # Low fundamental - typical for shorted stocks
      initial_price: 30.0          # Trading below fundamental
      price_impact: 0.1
      mean_reversion: 0.005        # Weak - allows squeeze to develop
      noise_std: 0.5
      custom_state_hot_limit: 3
  persona: !include persona.yml

short_seller_1:
  name: "Short Seller 1"
  class: "examples.ShortSqueeze.players:ShortSeller"
  config:
    identity: "short_seller_1"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/ShortSqueeze/records"
      # Base investor parameters
      initial_cash: 10000.0
      initial_position: 0.0        # Will be overridden to -50
      custom_state_hot_limit: 3
      # ShortSeller specific
      short_initial_position: -50.0
      short_entry_price: 30.0      # Shorted at initial price
      cover_threshold: 0.20        # Cover at 20% loss
  persona: !include persona.yml

short_seller_2:
  name: "Short Seller 2"
  class: "examples.ShortSqueeze.players:ShortSeller"
