# =============================================================================
# ShortSqueeze Topology - Star Pattern
# =============================================================================
# Note: player keys with num_instances > 1 use their base key here.
# The simulator expander resolves them to foo_1, foo_2, ... before building
# the TopologyGraph, so all edge rules apply to every instance automatically.
# =============================================================================

type: "star"

sources:
  - market

connections:
  # Market → All investors
  # num_instances: 2 → short_seller_1/2, momentum_buyer_1/2, retail_1/2
  market:
    - rule_short_seller
    - rule_momentum_buyer
    - rule_retail_trader
    - rule_value_investor
    - rule_institutional_holder

  # num_instances: 2 → expands to short_seller_1/2 → market
  rule_short_seller:
    - market

  # num_instances: 2 → expands to momentum_buyer_1/2 → market
  rule_momentum_buyer:
    - market

  # num_instances: 2 → expands to retail_1/2 → market
  rule_retail_trader:
    - market

  rule_value_investor:
    - market

  rule_institutional_holder:
    - market
