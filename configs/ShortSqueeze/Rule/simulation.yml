setting:
  name: "short_squeeze_simulation"
  description: "Short squeeze supply-demand imbalance simulation"
  total_rounds: 200
  round_history_limit: 3
  record_path: "EXPERIMENT/ShortSqueeze/Rule/records"
  save_diagram_interval: 50

environment: {dotenv_path: .env, workspace: "."}

ray:
  address: null
  namespace: "short_squeeze"
  actor_prefix: null
  # null = Ray auto-detects from machine; actors use num_cpus=0 (async, I/O-bound)
  num_cpus: null
  num_gpus: null
  # Derived: 13 players, star topology -> 24 msgs/round
  #   13 TurnResult + 13 pending_info + 24 Message = 50 Ray objects
  #   50 obj x 64 KB min-alloc = 3200 KB (3.13 MB)
  #   10x headroom = 31.3 MB; 128 MB minimum floor -> 134217728 bytes
  object_store_memory: 134217728
  include_dashboard: false
  logging_level: "warning"
  log_to_driver: false
  actor_options: {max_restarts: 3, max_task_retries: 1, max_concurrency: 4}
  runtime_env: {working_dir: null, pip: [], env_vars: {}}
  serialization: {use_arrow: true, register_custom_serializers: true}

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/ShortSqueeze/Rule/communication"
  record_messages: true
  message_block_size: 500
