# =============================================================================
# ShortSqueeze Players Configuration (Rule variant)
# =============================================================================
# Traceability: every extras leaf below carries a `# Source: target §9 <param>
# row; <citation>` comment referencing examples/ShortSqueeze/finance-shortsqueeze.md.
#
# Investor Types:
#   - ShortSeller (§4.1 Miller 1977 / Duffie-Garleanu-Pedersen 2002)
#   - MomentumBuyer (§4.2 De Long 1990 / Jegadeesh-Titman 1993)
#   - RetailTrader (§4.3 Barber-Odean 2008)
#   - ValueInvestor (§4.4 Shleifer-Vishny 1997)
#   - InstitutionalHolder (§4.5 Duffie-Garleanu-Pedersen 2002)
# =============================================================================

market:
  name: "Market"
  class: "examples.ShortSqueeze.Rule.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/ShortSqueeze/Rule/records"
      fundamental_value: 50.0  # Source: target §9 fundamental_value row; §2.1, §4.4; simulation-bases.md §6.
      initial_price: 30.0  # Source: target §9 initial_price row; §2.1, §8.1; simulation-bases.md §6.
      price_impact: 0.1  # Source: target §9 price_impact row; §8.1; simulation-bases.md §6.
      mean_reversion: 0.005  # Source: target §9 mean_reversion row; §2.4, §8.1; simulation-bases.md §6.
      noise_std: 0.5  # Source: target §9 noise_std row; §8.1 Gaussian market noise.
      custom_state_hot_limit: 3  # Source: target §9 custom_state_hot_limit row; runtime hot-state cap.
  persona: !include persona.yml

rule_short_seller:
  name: "Short Seller"
  class: "examples.ShortSqueeze.Rule.players:ShortSeller"
  # Expander → short_seller_1, short_seller_2, short_seller_3
  num_instances: 3
  config:
    identity: "rule_short_seller"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/ShortSqueeze/Rule/records"
      initial_cash: 10000.0  # Source: target §9 initial_cash row; §7 base cash budget.
      initial_position: 0.0  # Source: target §9 initial_position row; overridden inside ShortSeller.perceive using short_initial_position.
      custom_state_hot_limit: 3  # Source: target §9 custom_state_hot_limit row.
      short_initial_position: -50.0  # Source: target §9 short_initial_position row; §4.1 initial short exposure applied inside perceive.
      short_entry_price: 30.0  # Source: target §9 short_entry_price row; §4.1 loss-reference price.
      cover_threshold: 0.20  # Source: target §9 cover_threshold row; §4.1 forced-cover trigger (Miller 1977, DOI 10.1111/j.1540-6261.1977.tb03317.x).
  persona: !include persona.yml

rule_momentum_buyer:
  name: "Momentum Buyer"
  class: "examples.ShortSqueeze.Rule.players:MomentumBuyer"
  # Expander → momentum_buyer_1, momentum_buyer_2, momentum_buyer_3
  num_instances: 3
  config:
    identity: "rule_momentum_buyer"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/ShortSqueeze/Rule/records"
      initial_cash: 10000.0  # Source: target §9 initial_cash row.
      initial_position: 0.0  # Source: target §9 initial_position row; §7 flat starting inventory.
      custom_state_hot_limit: 3  # Source: target §9 custom_state_hot_limit row.
      lookback: 3  # Source: target §9 lookback row; §4.2 momentum window (De Long 1990, DOI 10.1111/j.1540-6261.1990.tb03695.x).
      base_size: 25.0  # Source: target §9 base_size (momentum) row.
      momentum_threshold: 0.02  # Source: target §9 momentum_threshold row; §4.2 momentum activation.
      momentum_multiplier: 15  # Source: target §9 momentum_multiplier row; §4.2 scaling factor.
      max_quantity: 40.0  # Source: target §9 max_quantity (momentum) row; §4.2 order cap.
  persona: !include persona.yml

rule_retail_trader:
  name: "Retail Trader"
  class: "examples.ShortSqueeze.Rule.players:RetailTrader"
  # Expander → retail_1, retail_2, retail_3
  num_instances: 3
  config:
    identity: "rule_retail_trader"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/ShortSqueeze/Rule/records"
      initial_cash: 10000.0  # Source: target §9 initial_cash row.
      initial_position: 0.0  # Source: target §9 initial_position row.
      custom_state_hot_limit: 3  # Source: target §9 custom_state_hot_limit row.
      noise_std: 12.0  # Source: target §9 noise_std (retail) row; §4.3 retail Gaussian scale (Barber-Odean 2008, DOI 10.1093/rfs/hhm079).
      bullish_bias: 5.0  # Source: target §9 bullish_bias row; §4.3 retail demand tilt.
      min_quantity: -15.0  # Source: target §9 min_quantity (retail) row; §4.3 lower clamp.
      max_quantity: 25.0  # Source: target §9 max_quantity (retail) row; §4.3 upper clamp.
  persona: !include persona.yml

rule_value_investor:
  name: "Value Investor"
  class: "examples.ShortSqueeze.Rule.players:ValueInvestor"
  # Expander → value_investor_1, value_investor_2
  num_instances: 2
  config:
    identity: "rule_value_investor"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/ShortSqueeze/Rule/records"
      initial_cash: 10000.0  # Source: target §9 initial_cash row.
      initial_position: 0.0  # Source: target §9 initial_position row.
      custom_state_hot_limit: 3  # Source: target §9 custom_state_hot_limit row.
      value_threshold: 0.15  # Source: target §9 value_threshold row; §4.4 value activation (Shleifer-Vishny 1997, DOI 10.1111/j.1540-6261.1997.tb03807.x).
      base_size: 20.0  # Source: target §9 base_size (value) row.
      value_multiplier: 5  # Source: target §9 value_multiplier row.
      max_quantity: 30.0  # Source: target §9 max_quantity (value) row.
  persona: !include persona.yml

rule_institutional_holder:
  name: "Institutional Holder"
  class: "examples.ShortSqueeze.Rule.players:InstitutionalHolder"
  num_instances: 1
  config:
    identity: "rule_institutional_holder"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/ShortSqueeze/Rule/records"
      initial_cash: 10000.0  # Source: target §9 initial_cash row.
      initial_position: 100.0  # Source: target §9 initial_position (InstitutionalHolder) row; §4.5 float scarcity.
      custom_state_hot_limit: 3  # Source: target §9 custom_state_hot_limit row.
  persona: !include persona.yml
