# =============================================================================
# ShortSqueezeRag Persona Configuration
# =============================================================================

auto_checkpoint: false
debug_mode: true

proxy:
  storage:
    checkpoint_dir: "EXPERIMENT/ShortSqueeze/Rag/checkpoints"
    record_path: "EXPERIMENT/ShortSqueeze/Rag/records"
    record_rounds: true
    turn_block_size: 3
  
  monitoring:
    record_path: "EXPERIMENT/ShortSqueeze/Rag/monitoring"
    monitor_hot_limit: 3
  
  communication:
    message_timeout_ms: 60000
    enable_compression: true
  
  resource:
    mcp_servers: []
    enable_caching: false
