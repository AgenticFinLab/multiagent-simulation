# =============================================================================
# ShortSqueeze Rag Players Configuration
# =============================================================================
# Traceability: every extras leaf below carries a `# Source: target §9 <param>
# row; <citation>` comment referencing examples/ShortSqueeze/finance-shortsqueeze.md.
# Liquidity-aware market extension (target §8.1) with base_liquidity,
# high_impact_multiplier, low_liquidity_threshold. Order-contract:
# `{bid_price, quantity, strategy, is_short_cover, provides_liquidity}` plus
# `reasoning` and `rag_context`; `strategy` is derived from
# `self.__class__.__name__`. Rag also writes rag_stats.json.
# =============================================================================

# =============================================================================
# Shared Knowledge Configuration
# =============================================================================
knowledge:
  backend: "local"
  global_uri: "examples/document-sources"
  resource_csv:
    - "examples/document-sources/books.csv"
    - "examples/document-sources/source"
  preprocessing:
    parser: "mineru"
    timeout_per_page: 30
    max_pages: 250
    output_position: "MinerU_processed"
  rag:
    output_position: "rag_index"
    embed_type: "litellm"
    embed_model: "openai/hunyuan-embedding"
    embed_api_key: "{{ HUNYUAN_API_KEY }}"
    embed_api_base: "https://api.hunyuan.cloud.tencent.com/v1"
    chunk_size: 512
    chunk_overlap: 64

market:
  name: "Market with Short Interest Tracking"
  class: "examples.ShortSqueeze.Rag.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/ShortSqueeze/Rag/records"
      fundamental_value: 50.0  # Source: target §9 fundamental_value row.
      initial_price: 30.0  # Source: target §9 initial_price row.
      base_price_impact: 0.1  # Source: target §9 price_impact / base_price_impact row; RuleLLM/Rag alias.
      mean_reversion: 0.005  # Source: target §9 mean_reversion row.
      noise_std: 0.5  # Source: target §9 noise_std row.
      initial_short_interest: 80.0  # Source: target §9 initial_short_interest row.
      custom_state_hot_limit: 3  # Source: target §9 custom_state_hot_limit row.
      base_liquidity: 50.0  # Source: target §9 base_liquidity row; RuleLLM/Rag liquidity-aware market.
      high_impact_multiplier: 3.0  # Source: target §9 high_impact_multiplier row.
      low_liquidity_threshold: 30.0  # Source: target §9 low_liquidity_threshold row.
  persona: !include persona.yml

ragllm_short_seller:
  name: "RAG Short Seller"
  class: "examples.ShortSqueeze.Rag.players:RagLLMShortSeller"
  # Expander → ragllm_short_seller_1, ragllm_short_seller_2, ragllm_short_seller_3
  num_instances: 3
  config:
    identity: "ragllm_short_seller"
    role: player
    steps_per_turn: 1
    group_tags:
      - ragllm_investors
    extras:
      record_path: "EXPERIMENT/ShortSqueeze/Rag/records"
      initial_cash: 10000.0  # Source: target §9 initial_cash row.
      initial_position: -50.0  # Source: target §9 initial_position (ShortSeller LLM/RuleLLM/Rag) row; §4.1.
      custom_state_hot_limit: 3  # Source: target §9 custom_state_hot_limit row.
      private_knowledge:
        from_global_resources:
          - "MinerU_processed"
        local_resources:
          local_uri: ""
          local_resources: []
        rag:
          from_global_index_dir:
            - "rag_index"
          local_index_dir: ""
          embed_type: "litellm"
          embed_model: "openai/hunyuan-embedding"
          embed_api_key: "{{ HUNYUAN_API_KEY }}"
          embed_api_base: "https://api.hunyuan.cloud.tencent.com/v1"
          chunk_size: 512
          chunk_overlap: 64
          top_k: 5
      llm:
        sys_message: "examples.ShortSqueeze.Rag.prompts:RAGLLM_SHORT_SELLER_SYS"
        user_message: "examples.ShortSqueeze.Rag.prompts:RAGLLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.3
          max_new_tokens: 600
  persona: !include persona.yml

