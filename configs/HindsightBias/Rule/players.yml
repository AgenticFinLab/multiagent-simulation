# HindsightBias Rule Agent Configuration

market:
  name: "Market"
  class: "examples.HindsightBias.Rule.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/HindsightBias/Rule/records"
      initial_price: 100.0
      fundamental_value: 100.0
      price_impact: 0.03
      mean_reversion: 0.01
      noise_std: 0.015
      custom_state_hot_limit: 3
  persona: !include persona.yml

rule_hindsight_overconfident:
  name: "HindsightOverconfident"
  class: "examples.HindsightBias.Rule.players:HindsightOverconfident"
  num_instances: 3
  config:
    identity: "rule_hindsight_overconfident"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/HindsightBias/Rule/records"
      initial_cash: 1000000.0
      initial_position: 500
      initial_price: 100.0
      fundamental_value: 100.0
      hindsight_inflation: 1.5
      activation_threshold: 0.02
      quantity_scale: 5000
      max_order: 800
      custom_state_hot_limit: 3
      prediction_overweight: 1.0
  persona: !include persona.yml

rule_outcome_learner:
  name: "OutcomeLearner"
  class: "examples.HindsightBias.Rule.players:OutcomeLearner"
  num_instances: 3
  config:
    identity: "rule_outcome_learner"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/HindsightBias/Rule/records"
      initial_cash: 1200000.0
      initial_position: 500
      initial_price: 100.0
      fundamental_value: 100.0
      success_attribution: 1.3
      activation_threshold: 0.02
      quantity_scale: 5000
      max_order: 800
      custom_state_hot_limit: 3
      failure_discount: 1.0
  persona: !include persona.yml

rule_process_evaluator:
  name: "ProcessEvaluator"
  class: "examples.HindsightBias.Rule.players:ProcessEvaluator"
  num_instances: 2
  config:
    identity: "rule_process_evaluator"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/HindsightBias/Rule/records"
      initial_cash: 1500000.0
      initial_position: 500
      initial_price: 100.0
      fundamental_value: 100.0
      process_weight: 0.8
      activation_threshold: 0.05
      quantity_scale: 3000
      max_order: 500
      custom_state_hot_limit: 3
      outcome_weight: 1.0
  persona: !include persona.yml

rule_contrarian_skeptic:
  name: "ContrarianSkeptic"
  class: "examples.HindsightBias.Rule.players:ContrarianSkeptic"
  num_instances: 1
  config:
    identity: "rule_contrarian_skeptic"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/HindsightBias/Rule/records"
      initial_cash: 2000000.0
      initial_position: 0
      initial_price: 100.0
      fundamental_value: 100.0
      skepticism_level: 0.6
      activation_threshold: 0.05
      quantity_scale: 3000
      max_order: 500
      custom_state_hot_limit: 3
  persona: !include persona.yml

rule_noise_trader:
  name: "NoiseTrader"
  class: "examples.HindsightBias.Rule.players:NoiseTrader"
  num_instances: 2
  config:
    identity: "rule_noise_trader"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/HindsightBias/Rule/records"
      initial_cash: 500000.0
      initial_position: 200
      initial_price: 100.0
      fundamental_value: 100.0
      trade_probability: 0.3
      min_order: 100
      max_order: 500
      custom_state_hot_limit: 3
  persona: !include persona.yml
