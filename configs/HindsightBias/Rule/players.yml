  class: "examples.HindsightBias.Rule.players:ProcessEvaluator"
  num_instances: 1
  config:
    identity: "processevaluator_3"
    role: player
    extras:
      initial_cash: 1000000.0
      initial_position: 0

contrarianskeptic_4:
  name: "ContrarianSkeptic 4"
  class: "examples.HindsightBias.Rule.players:ContrarianSkeptic"
  num_instances: 1
  config:
    identity: "contrarianskeptic_4"
    role: player
    extras:
      initial_cash: 1000000.0
      initial_position: 0

noisetrader_5:
  name: "NoiseTrader 5"
  class: "examples.HindsightBias.Rule.players:NoiseTrader"
  num_instances: 1
  config:
    identity: "noisetrader_5"
    role: player
    extras:
      initial_cash: 1000000.0
      initial_position: 0
