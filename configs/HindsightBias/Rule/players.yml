# HindsightBias Rule Agent Configuration

market:
  archetype: stock-standard-price-impact  # -> masim/agents/defines/market/stock-standard-price-impact.md
  name: "Market"
  class: "examples.HindsightBias.Rule.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/HindsightBias/Rule/records"  # Source: framework infrastructure
      initial_price: 100.0  # Source: simulation-bases.md §6
      fundamental_value: 100.0  # Source: simulation-bases.md §6
      price_impact: 0.03  # Source: simulation-bases.md §6
      mean_reversion: 0.01  # Source: simulation-bases.md §6
      noise_std: 0.015  # Source: simulation-bases.md §6
      custom_state_hot_limit: 3  # Source: framework infrastructure
  persona: !include persona.yml

rule_hindsight_overconfident:
  name: "HindsightOverconfident"
  class: "examples.HindsightBias.Rule.players:HindsightOverconfident"
  num_instances: 3
  config:
    identity: "rule_hindsight_overconfident"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/HindsightBias/Rule/records"  # Source: framework infrastructure
      initial_cash: 1000000.0  # Source: simulation-bases.md §6
      initial_position: 500  # Source: simulation-bases.md §6
      initial_price: 100.0  # Source: simulation-bases.md §6
      fundamental_value: 100.0  # Source: simulation-bases.md §6
      hindsight_inflation: 1.5  # Source: simulation-bases.md §4.1.7
      activation_threshold: 0.02  # Source: simulation-bases.md §4.1.7
      quantity_scale: 5000  # Source: simulation-bases.md §4.1.7
      max_order: 800  # Source: simulation-bases.md §4.1.7
      custom_state_hot_limit: 3  # Source: framework infrastructure
      prediction_overweight: 1.0  # Source: simulation-bases.md §4.1.7
  persona: !include persona.yml

