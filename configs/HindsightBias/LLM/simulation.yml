# HindsightBias LLM Simulation Configuration

setting:
  name: "HindsightBias-LLM"
  description: "HindsightBias simulation - LLM agents"
  total_rounds: 200
  record_path: "EXPERIMENT/HindsightBias/LLM/records"
  storage_path: "EXPERIMENT/HindsightBias/LLM/communication"
  log_level: "INFO"
  log_to_file: true
  log_path: "EXPERIMENT/HindsightBias/LLM/logs"

environment:
  dotenv_path: ".env"
  workspace: "."

ray:
  namespace: "hindsightbias_llm"
  ignore_reinit_error: true
  object_store_memory: 536870912
  num_cpus: 4

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/HindsightBias/LLM/communication"
  record_messages: true
  message_timeout_ms: 5000
  max_retries: 3
