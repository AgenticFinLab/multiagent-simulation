# HindsightBias LLM Agent Configuration

market:
  name: "Market"
  class: "examples.HindsightBias.LLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/HindsightBias/LLM/records"
      initial_price: 100.0
      fundamental_value: 100.0
      price_impact: 0.03
      mean_reversion: 0.01
      noise_std: 0.015
      custom_state_hot_limit: 3
  persona: !include persona.yml

hindsightoverconfident:
  name: "HindsightOverconfident"
  class: "examples.HindsightBias.LLM.players:LLMHindsightOverconfident"
  num_instances: 3
  config:
    identity: "hindsightoverconfident"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/HindsightBias/LLM/records"
      initial_cash: 1000000.0
      initial_position: 500
      initial_price: 100.0
      fundamental_value: 100.0
      hindsight_inflation: 1.5
      base_size: 400
      custom_state_hot_limit: 3
      llm:
        sys_message: "examples.HindsightBias.LLM.prompts:LLM_HINDSIGHT_OVERCONFIDENT_SYS"
        user_message: "examples.HindsightBias.LLM.prompts:LLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-1-6-lite-250115"
        generation_config:
          temperature: 0.9
          max_tokens: 600
  persona: !include persona.yml

