# HindsightBias LLM Agent Configuration

market:
  name: "Market"
  class: "examples.HindsightBias.LLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/HindsightBias/LLM/records"  # Source: framework infrastructure
      initial_price: 100.0  # Source: simulation-bases.md §6
      fundamental_value: 100.0  # Source: simulation-bases.md §6
      price_impact: 0.03  # Source: simulation-bases.md §6
      mean_reversion: 0.01  # Source: simulation-bases.md §6
      noise_std: 0.015  # Source: simulation-bases.md §6
      custom_state_hot_limit: 3  # Source: framework infrastructure
  persona: !include persona.yml

llm_hindsight_overconfident:
  name: "HindsightOverconfident"
  class: "examples.HindsightBias.LLM.players:LLMHindsightOverconfident"
  num_instances: 3
  config:
    identity: "llm_hindsight_overconfident"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/HindsightBias/LLM/records"  # Source: framework infrastructure
      initial_cash: 1000000.0  # Source: simulation-bases.md §6
      initial_position: 500  # Source: simulation-bases.md §6
      initial_price: 100.0  # Source: simulation-bases.md §6
      fundamental_value: 100.0  # Source: simulation-bases.md §6
      hindsight_inflation: 1.5  # Source: simulation-bases.md §4.1.7
      max_order: 800  # Source: simulation-bases.md §4.1.7
      custom_state_hot_limit: 3  # Source: framework infrastructure
      llm:
        sys_message: "examples.HindsightBias.LLM.prompts:LLM_HINDSIGHTOVERCONFIDENT_PROMPT"
        user_message: "examples.HindsightBias.LLM.prompts:LLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.9
          max_tokens: 600
  persona: !include persona.yml

