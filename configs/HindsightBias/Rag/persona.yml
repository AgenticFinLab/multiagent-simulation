# HindsightBias Rag Persona Configuration

auto_checkpoint: false
debug_mode: true

proxy:
  storage:
    checkpoint_dir: "EXPERIMENT/HindsightBias/Rag/checkpoints"
    record_path: "EXPERIMENT/HindsightBias/Rag/records"
    record_rounds: true
    turn_block_size: 3

  monitoring:
    record_path: "EXPERIMENT/HindsightBias/Rag/monitoring"
    monitor_hot_limit: 3

  communication:
    message_timeout_ms: 5000
    enable_compression: true

  resource:
    mcp_servers: []
    enable_caching: false
