# RepresentativenessBias RuleLLM Agent Configuration

market:
  name: "Market"
  class: "examples.RepresentativenessBias.Rule.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    extras:
      initial_price: 100.0
      fundamental_value: 100.0
      price_impact: 0.05
      mean_reversion: 0.02
      noise_std: 0.02

patternmatcher_1:
  name: "PatternMatcher 1"
  class: "examples.RepresentativenessBias.RuleLLM.players:PatternMatcher"
  num_instances: 2
  config:
    identity: "patternmatcher_1"
    role: player
    extras:
      initial_cash: 1000000.0
      initial_position: 0
      llm: {'model': 'doubao-pro-32k', 'api_key': '${LLM_API_KEY}', 'base_url': '${LLM_BASE_URL}'}
      agent_type: patternmatcher

