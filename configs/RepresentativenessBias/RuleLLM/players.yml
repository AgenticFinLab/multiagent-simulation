# RepresentativenessBias RuleLLM Agent Configuration

market:
  name: "Market"
  class: "examples.RepresentativenessBias.RuleLLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/RepresentativenessBias/RuleLLM/records"
      initial_price: 100.0
      fundamental_value: 100.0
      price_impact: 0.02
      mean_reversion: 0.01
      noise_std: 0.012
      custom_state_hot_limit: 3
  persona: !include persona.yml

patternmatcher:
  name: "PatternMatcher"
  class: "examples.RepresentativenessBias.RuleLLM.players:RuleLLMPatternMatcher"
  num_instances: 2
  config:
    identity: "patternmatcher"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/RepresentativenessBias/RuleLLM/records"
      initial_cash: 1000000.0
      initial_position: 500
      initial_price: 100.0
      fundamental_value: 100.0
      streak_sensitivity: 2.0
      base_size: 400
      custom_state_hot_limit: 3
      llm:
        sys_message: "examples.RepresentativenessBias.RuleLLM.prompts:RULELLM_PATTERN_MATCHER_SYS"
        user_message: "examples.RepresentativenessBias.RuleLLM.prompts:RULELLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-1-6-251015"
        generation_config:
          temperature: 0.8
          max_tokens: 512
  persona: !include persona.yml

