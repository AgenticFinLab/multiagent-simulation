# RepresentativenessBias RuleLLM Simulation Configuration

setting:
  name: "representativeness_bias_rulellm_simulation"
  description: "Representativeness bias: hybrid rule+LLM agents with representativeness index tracking"
  total_rounds: 200
  round_history_limit: 3
  record_path: "EXPERIMENT/RepresentativenessBias/RuleLLM/records"
  save_diagram_interval: 50

environment:
  dotenv_path: .env
  workspace: "."

ray:
  address: null
  namespace: "representativeness_bias_rulellm"
  actor_prefix: null
  num_cpus: null
  num_gpus: null
  object_store_memory: 134217728
  include_dashboard: false
  logging_level: "warning"
  log_to_driver: false
  actor_options:
    max_restarts: 3
    max_task_retries: 1
    max_concurrency: 4
  runtime_env:
    working_dir: null
    pip: []
    env_vars: {}
  serialization:
    use_arrow: true
    register_custom_serializers: true

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/RepresentativenessBias/RuleLLM/communication"
  record_messages: true
  message_block_size: 500
