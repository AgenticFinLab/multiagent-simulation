  name: "PatternMatcher"
  class: "examples.RepresentativenessBias.Rule.players:PatternMatcher"
  num_instances: 2
  config:
    identity: "rule_pattern_matcher"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/RepresentativenessBias/Rule/records"  # Source: AGENT_POOL/finance/pattern-matcher.md §6
      initial_cash: 1000000.0  # Source: AGENT_POOL/finance/pattern-matcher.md §6
      initial_position: 500  # Source: AGENT_POOL/finance/pattern-matcher.md §6
      initial_price: 100.0  # Source: AGENT_POOL/finance/pattern-matcher.md §6
      fundamental_value: 100.0  # Source: AGENT_POOL/finance/pattern-matcher.md §6
