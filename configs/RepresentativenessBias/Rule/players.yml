# RepresentativenessBias Rule Agent Configuration

market:
  name: "Market"
  class: "examples.RepresentativenessBias.Rule.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/RepresentativenessBias/Rule/records"
      initial_price: 100.0
      fundamental_value: 100.0
      price_impact: 0.02
      mean_reversion: 0.01
      noise_std: 0.012
      custom_state_hot_limit: 3
  persona: !include persona.yml

