# CarryTradeUnwind Rag Simulation Configuration
#
# CarryTradeUnwind simulation
#
# Usage:
#   python examples/CarryTradeUnwind/Rag/run_carrytradeunwind_rag.py \
#       -c configs/CarryTradeUnwind/Rag/simulation.yml

setting:
  name: "CarryTradeUnwind-Rag"
  description: "CarryTradeUnwind simulation - Rag agents"
  total_rounds: 200

  record_path: "EXPERIMENT/CarryTradeUnwind/Rag/records"
  storage_path: "EXPERIMENT/CarryTradeUnwind/Rag/communication"

  log_level: "INFO"
  log_to_file: true
  log_path: "EXPERIMENT/CarryTradeUnwind/Rag/logs"

environment:
  dotenv_path: ".env"
  workspace: "."

ray:
  namespace: "carrytradeunwind_rag"
  ignore_reinit_error: true
  object_store_memory: 536870912
  num_cpus: 4

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/CarryTradeUnwind/Rag/communication"
  record_messages: true
  message_timeout_ms: 5000
  max_retries: 3
