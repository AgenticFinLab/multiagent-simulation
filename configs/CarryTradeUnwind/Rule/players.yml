# =============================================================================
# CarryTradeUnwind Rule Players Configuration
# =============================================================================
# Heterogeneous agents for carry trade unwind simulation
#
# Price = funding currency exchange rate (normalized, fundamental = 1.0)
# Price > 1.0 = funding currency appreciated (carry unwind in progress)
# Price < 1.0 = carry trade open (target currency strong)
#
# Agent Types:
#   - Market: Rule-based FX rate coordinator
#   - CarryTrader: UIP deviation trader, forced unwind (DESTABILIZING)
#     Theory: Brunnermeier, Nagel & Pedersen (2009)
#   - LeveragedCarryFund: High leverage with stop-loss (DESTABILIZING)
#     Theory: Plantin & Shin (2018)
#   - FundingCurrencyBuyer: Safe-haven demand and partial stabilization (STABILIZING)
#     Theory: Ranaldo & Söderlind (2010) / Menkhoff et al. (2012)
#   - HedgedCarryTrader: Volatility-adjusted carry (STABILIZING)
#     Theory: Menkhoff et al. (2012), Burnside et al. (2011)
#   - NoiseTrader: Random background liquidity (NEUTRAL)
#     Theory: Black (1986)
# =============================================================================

# -----------------------------------------------------------------------------
# Market (Coordinator)
# -----------------------------------------------------------------------------
market:
  archetype: fx-currency-peg-and-attack  # -> masim/agents/defines/market/fx-currency-peg-and-attack.md
  name: "Market"
  class: "examples.CarryTradeUnwind.Rule.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/CarryTradeUnwind/Rule/records"  # Source: implementation infrastructure (record path convention per polish-simulation-pipeline.md §6.4)
      # FX market dynamics (funding currency rate, normalized fundamental = 1.0)
      fundamental_value: 1.0      # Source: target §9 F; PPP normalization anchor (bases §3.1)
      initial_price: 1.0          # Source: target §9 / simulation-bases.md §3 (starts at fundamental)
      price_impact: 0.003         # Source: target §9 lambda; Brunnermeier & Pedersen (2009) https://doi.org/10.1093/rfs/hhn098 (FX-market-depth calibration)
      mean_reversion: 0.02        # Source: target §9 gamma; Rogoff (1996) PPP-reversion https://www.jstor.org/stable/2729217
      noise_std: 0.005            # Source: simulation-bases.md §3.1 (low-noise FX environment)
      custom_state_hot_limit: 3   # Source: implementation infrastructure (hot-state ring buffer)
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Carry Traders (Primary Destabilizers)
# Theory: Brunnermeier, Nagel & Pedersen (2009) — UIP deviation / carry crash
# -----------------------------------------------------------------------------
rule_carry_trader:
  name: "Carry Trader"
  class: "examples.CarryTradeUnwind.Rule.players:CarryTrader"
  # Expander → carry_trader_1, carry_trader_2
  num_instances: 2
  config:
    identity: "rule_carry_trader"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/CarryTradeUnwind/Rule/records"  # Source: implementation infrastructure (record path)
      initial_cash: 500000.0      # Source: target §7 carry-trader Intent line; simulation-bases.md §4.1
      initial_position: 500.0     # Source: target §7 carry-trader Intent line (starts with open carry position, short funding currency)
      custom_state_hot_limit: 3   # Source: implementation infrastructure (hot-state ring buffer)
      # CarryTrader specific parameters (Brunnermeier et al., 2009)
      unwind_threshold: 0.02      # Source: target §9 theta_unwind; Brunnermeier, Nagel & Pedersen (2009) https://doi.org/10.1086/593088 (carry-crash trigger)
      carry_size: 800.0           # Source: target §9 q_carry / simulation-bases.md §4.1; base carry units before leverage cap
      deviation_scale: 5000.0     # Source: target §9 s_dev / simulation-bases.md §4.1; deviation-proportional sizing scale
      leverage: 5.0               # Source: target §9 L_c; Brunnermeier, Nagel & Pedersen (2009) https://doi.org/10.1086/593088 (leverage multiplier)
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Leveraged Carry Funds (High-Leverage Destabilizers)
# Theory: Plantin & Shin (2018) — Leverage and forced liquidation
# -----------------------------------------------------------------------------
rule_leveraged_carry_fund:
  name: "Leveraged Carry Fund"
  class: "examples.CarryTradeUnwind.Rule.players:LeveragedCarryFund"
  # Expander → leveraged_carry_fund_1, leveraged_carry_fund_2
  num_instances: 2
  config:
    identity: "rule_leveraged_carry_fund"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/CarryTradeUnwind/Rule/records"  # Source: implementation infrastructure (record path)
      initial_cash: 500000.0      # Source: target §7 leveraged-carry-fund Intent line; simulation-bases.md §4.2
      initial_position: 800.0     # Source: target §7 leveraged-carry-fund Intent line (large open carry position)
      custom_state_hot_limit: 3   # Source: implementation infrastructure (hot-state ring buffer)
      # LeveragedCarryFund parameters (Plantin & Shin, 2018)
      stop_loss: 0.03             # Source: target §9 theta_stop; Brunnermeier & Pedersen (2009) https://doi.org/10.1093/rfs/hhn098 (funding-liquidity stop trigger)
      leverage: 5.0               # Source: target §9 L_c; Plantin & Shin (2018) forced-liquidation leverage
      base_size: 800.0            # Source: target §9 q_lcf / simulation-bases.md §4.2; base forced-unwind units before leverage cap
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Funding Currency Buyers (Safe-Haven Amplifiers)
# Theory: Ranaldo & Söderlind (2010) / Menkhoff et al. (2012) — Safe-haven demand during FX volatility
# -----------------------------------------------------------------------------
rule_funding_currency_buyer:
  name: "Funding Currency Buyer"
  class: "examples.CarryTradeUnwind.Rule.players:FundingCurrencyBuyer"
  # Expander → funding_currency_buyer_1, funding_currency_buyer_2
  num_instances: 2
  config:
    identity: "rule_funding_currency_buyer"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/CarryTradeUnwind/Rule/records"  # Source: implementation infrastructure (record path)
      initial_cash: 300000.0      # Source: target §7 funding-currency-buyer Intent line; simulation-bases.md §4.3
      initial_position: 0.0       # Source: target §7 funding-currency-buyer Intent line (safe-haven starts flat)
      custom_state_hot_limit: 3   # Source: implementation infrastructure (hot-state ring buffer)
      # FundingCurrencyBuyer parameters (Ranaldo & Söderlind, 2010; Menkhoff et al., 2012)
      risk_threshold: 0.05        # Source: target §9 theta_safe / simulation-bases.md §4.3; Ranaldo & Söderlind (2010) https://doi.org/10.1093/rof/rfq007 (safe-haven trigger at 5% funding stress)
      position_size: 500.0        # Source: target §9 q_safe / simulation-bases.md §4.3; bounded safe-haven buy units
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Hedged Carry Trader (Volatility-Aware)
# Theory: Menkhoff et al. (2012) — Volatility-adjusted carry
#         Burnside et al. (2011) — Hedged carry trade strategies
# -----------------------------------------------------------------------------
rule_hedged_carry_trader:
  name: "Hedged Carry Trader"
  class: "examples.CarryTradeUnwind.Rule.players:HedgedCarryTrader"
  num_instances: 1
  config:
    identity: "rule_hedged_carry_trader"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/CarryTradeUnwind/Rule/records"  # Source: implementation infrastructure (record path)
      initial_cash: 2000000.0     # Source: target §7 hedged-carry-trader Intent line; simulation-bases.md §4.4
      initial_position: 0.0       # Source: target §7 hedged-carry-trader Intent line (starts flat, hedge-aware entry)
      custom_state_hot_limit: 3   # Source: implementation infrastructure (hot-state ring buffer)
      # HedgedCarryTrader parameters (Menkhoff et al., 2012; Burnside et al., 2011)
      hedge_ratio: 0.30           # Source: target §9 h; Menkhoff et al. (2012) https://doi.org/10.1111/j.1540-6261.2012.01728.x (30% hedge fraction)
      vol_threshold: 0.05         # Source: target §9 theta_vol; Menkhoff et al. (2012) FX-volatility trigger
      base_size: 500.0            # Source: target §9 / simulation-bases.md §4.4; base hedged carry units
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Noise Traders (Background Liquidity — Black 1986)
# -----------------------------------------------------------------------------
rule_noise_trader:
  name: "Noise Trader"
  class: "examples.CarryTradeUnwind.Rule.players:NoiseTrader"
  # Expander → noise_trader_1, noise_trader_2
  num_instances: 2
  config:
    identity: "rule_noise_trader"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/CarryTradeUnwind/Rule/records"  # Source: implementation infrastructure (record path)
      initial_cash: 100000.0      # Source: target §7 noise-trader Intent line; simulation-bases.md §4.5
      initial_position: 0.0       # Source: target §7 noise-trader Intent line (background flow starts flat)
      custom_state_hot_limit: 3   # Source: implementation infrastructure (hot-state ring buffer)
      # NoiseTrader parameters (Black, 1986)
      trade_probability: 0.30     # Source: target §9 p_n / simulation-bases.md §4.5; Black (1986) https://doi.org/10.1111/j.1540-6261.1986.tb04513.x (bounded FX background flow)
      min_order: 20.0             # Source: simulation-bases.md §4.5; bounded stochastic order size (lower)
      max_order: 100.0            # Source: simulation-bases.md §4.5; bounded stochastic order size (upper)
  persona: !include persona.yml
