# =============================================================================
# CarryTradeUnwind LLM Players Configuration
# =============================================================================
# 1 Market (rule-based) + 5 LLM Investor types with carry-trade personas.
# Each LLM agent uses a system prompt persona from prompts.py.
# =============================================================================

# -----------------------------------------------------------------------------
# Market (Coordinator) — rule-based, identical to Rule variant
# -----------------------------------------------------------------------------
market:
  archetype: fx-currency-peg-and-attack  # -> AGENT_POOL/market/fx-currency-peg-and-attack.md
  name: "Market"
  class: "examples.CarryTradeUnwind.LLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/CarryTradeUnwind/LLM/records"  # Source: implementation infrastructure (record path convention per polish-simulation-pipeline.md §6.4)
      fundamental_value: 1.0      # Source: target §9 F; PPP normalization anchor
      initial_price: 1.0          # Source: target §9 / simulation-bases.md §3 (starts at fundamental)
      price_impact: 0.003         # Source: target §9 lambda; Brunnermeier & Pedersen (2009) https://doi.org/10.1093/rfs/hhn098
      mean_reversion: 0.02        # Source: target §9 gamma; Rogoff (1996) PPP-reversion https://www.jstor.org/stable/2729217
      noise_std: 0.005            # Source: simulation-bases.md §3.1 (low-noise FX environment)
      custom_state_hot_limit: 3   # Source: implementation infrastructure (hot-state ring buffer)
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Carry Traders — LLM with carry-trade unwind persona
# Theory: Brunnermeier, Nagel & Pedersen (2009) — carry crash / UIP deviation
# -----------------------------------------------------------------------------
llm_carry_trader:
  name: "LLM Carry Trader"
  class: "examples.CarryTradeUnwind.LLM.players:LLMCarryTrader"
  # Expander → llm_carry_trader_1, llm_carry_trader_2
  num_instances: 2
  config:
    identity: "llm_carry_trader"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/CarryTradeUnwind/LLM/records"  # Source: implementation infrastructure (record path)
      initial_cash: 500000.0                                  # Source: target §7 carry-trader Intent line; simulation-bases.md §4.1
      initial_position: 500.0                                 # Source: target §7 carry-trader Intent line (starts with open carry position)
      custom_state_hot_limit: 3                               # Source: implementation infrastructure (hot-state ring buffer)
      llm:
        sys_message: "examples.CarryTradeUnwind.LLM.prompts:LLM_CARRY_TRADER_SYS"  # Source: LLM wiring — persona prompt for carry-trader archetype
        user_message: "examples.CarryTradeUnwind.LLM.prompts:LLM_USER_TEMPLATE"    # Source: LLM wiring — shared user prompt template
        lm_type: "api"                             # Source: LLM wiring — inference mode (remote API)
        lm_name: "ark/doubao-seed-2-0-mini-260428" # Source: LLM wiring — model identifier (ARK Doubao Seed-2 mini)
        generation_config:
          temperature: 0.7                         # Source: LLM wiring — persona-driven exploration
          max_tokens: 512                          # Source: LLM wiring — response length cap
  persona: !include persona.yml

