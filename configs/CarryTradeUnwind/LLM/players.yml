# =============================================================================
# CarryTradeUnwind LLM Players Configuration
# =============================================================================
# 1 Market (rule-based) + 5 LLM Investor types with carry-trade personas.
# Each LLM agent uses a system prompt persona from prompts.py.
# =============================================================================

# -----------------------------------------------------------------------------
# Market (Coordinator) — rule-based, identical to Rule variant
# -----------------------------------------------------------------------------
market:
  name: "Market"
  class: "examples.CarryTradeUnwind.LLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/CarryTradeUnwind/LLM/records"
      fundamental_value: 1.0
      initial_price: 1.0
      price_impact: 0.003
      mean_reversion: 0.02
      noise_std: 0.005
      custom_state_hot_limit: 3
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Carry Traders — LLM with carry-trade unwind persona
# Theory: Brunnermeier, Nagel & Pedersen (2009) — carry crash / UIP deviation
# -----------------------------------------------------------------------------
llm_carry_trader:
  name: "LLM Carry Trader"
  class: "examples.CarryTradeUnwind.LLM.players:LLMCarryTrader"
  # Expander → llm_carry_trader_1, llm_carry_trader_2
  num_instances: 2
  config:
    identity: "llm_carry_trader"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/CarryTradeUnwind/LLM/records"
      initial_cash: 500000.0
      initial_position: 500.0
      custom_state_hot_limit: 3
      llm:
        sys_message: "examples.CarryTradeUnwind.LLM.prompts:LLM_CARRY_TRADER_SYS"
        user_message: "examples.CarryTradeUnwind.LLM.prompts:LLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-1-6-251015"
        generation_config:
          temperature: 0.7
          max_tokens: 512
  persona: !include persona.yml

