  config:
    identity: "llm_funding_currency_buyer"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/CarryTradeUnwind/LLM/records"  # Source: implementation infrastructure (record path)
      initial_cash: 300000.0                                  # Source: target §7 funding-currency-buyer Intent line; simulation-bases.md §4.3
      initial_position: 0.0                                   # Source: target §7 funding-currency-buyer Intent line (safe-haven starts flat)
      custom_state_hot_limit: 3                               # Source: implementation infrastructure (hot-state ring buffer)
      llm:
        sys_message: "examples.CarryTradeUnwind.LLM.prompts:LLM_FUNDING_CURRENCY_BUYER_SYS"  # Source: LLM wiring — persona prompt for funding-currency-buyer archetype
        user_message: "examples.CarryTradeUnwind.LLM.prompts:LLM_USER_TEMPLATE"              # Source: LLM wiring — shared user prompt template
