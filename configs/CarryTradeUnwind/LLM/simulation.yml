# CarryTradeUnwind LLM Simulation Configuration
#
# CarryTradeUnwind simulation
#
# Usage:
#   python examples/CarryTradeUnwind/LLM/run_carrytradeunwind_llm.py \
#       -c configs/CarryTradeUnwind/LLM/simulation.yml

setting:
  name: "CarryTradeUnwind-LLM"
  description: "CarryTradeUnwind simulation - LLM agents"
  total_rounds: 200

  record_path: "EXPERIMENT/CarryTradeUnwind/LLM/records"
  storage_path: "EXPERIMENT/CarryTradeUnwind/LLM/communication"

  log_level: "INFO"
  log_to_file: true
  log_path: "EXPERIMENT/CarryTradeUnwind/LLM/logs"

environment:
  dotenv_path: ".env"
  workspace: "."

ray:
  namespace: "carrytradeunwind_llm"
  ignore_reinit_error: true
  object_store_memory: 536870912
  num_cpus: 4

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/CarryTradeUnwind/LLM/communication"
  record_messages: true
  message_timeout_ms: 5000
  max_retries: 3
