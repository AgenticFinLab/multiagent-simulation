# =============================================================================
# CarryTradeUnwind RuleLLM Players Configuration
# =============================================================================
# 1 Market (rule-based) + 5 RuleLLM Investor types with rule-embedded prompts.
# Each agent has quantitative rules embedded in its system prompt.
# =============================================================================

# -----------------------------------------------------------------------------
# Market (Coordinator) — rule-based, identical to Rule variant
# -----------------------------------------------------------------------------
market:
  archetype: fx-currency-peg-and-attack  # -> AGENT_POOL/market/fx-currency-peg-and-attack.md
  name: "Market"
  class: "examples.CarryTradeUnwind.RuleLLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/CarryTradeUnwind/RuleLLM/records"  # Source: implementation infrastructure (record path convention per polish-simulation-pipeline.md §6.4)
      fundamental_value: 1.0      # Source: target §9 F; PPP normalization anchor
      initial_price: 1.0          # Source: target §9 / simulation-bases.md §3 (starts at fundamental)
      price_impact: 0.003         # Source: target §9 lambda; Brunnermeier & Pedersen (2009) https://doi.org/10.1093/rfs/hhn098
      mean_reversion: 0.02        # Source: target §9 gamma; Rogoff (1996) PPP-reversion https://www.jstor.org/stable/2729217
      noise_std: 0.005            # Source: simulation-bases.md §3.1 (low-noise FX environment)
      custom_state_hot_limit: 3   # Source: implementation infrastructure (hot-state ring buffer)
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Carry Traders — RuleLLM with embedded unwind rules
# Theory: Brunnermeier, Nagel & Pedersen (2009)
# -----------------------------------------------------------------------------
rulellm_carry_trader:
  name: "RuleLLM Carry Trader"
  class: "examples.CarryTradeUnwind.RuleLLM.players:RuleLLMCarryTrader"
  # Expander → rulellm_carry_trader_1, rulellm_carry_trader_2
  num_instances: 2
  config:
    identity: "rulellm_carry_trader"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/CarryTradeUnwind/RuleLLM/records"  # Source: implementation infrastructure (record path)
      initial_cash: 500000.0                                      # Source: target §7 carry-trader Intent line; simulation-bases.md §4.1
      initial_position: 500.0                                     # Source: target §7 carry-trader Intent line (starts with open carry position)
      custom_state_hot_limit: 3                                   # Source: implementation infrastructure (hot-state ring buffer)
      llm:
        sys_message: "examples.CarryTradeUnwind.RuleLLM.prompts:RULELLM_CARRY_TRADER_SYS"  # Source: RuleLLM wiring — dual-section (persona + numerical rules) prompt
        user_message: "examples.CarryTradeUnwind.RuleLLM.prompts:RULELLM_USER_TEMPLATE"    # Source: RuleLLM wiring — shared user prompt template
        lm_type: "api"                             # Source: LLM wiring — inference mode
        lm_name: "ark/doubao-seed-2-0-mini-260428" # Source: LLM wiring — model identifier
        generation_config:
          temperature: 0.3                         # Source: RuleLLM wiring — low temperature for rule adherence
          max_tokens: 512                          # Source: LLM wiring — response length cap
  persona: !include persona.yml

