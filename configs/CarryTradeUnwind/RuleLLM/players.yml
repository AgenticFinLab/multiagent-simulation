# =============================================================================
# CarryTradeUnwind RuleLLM Players Configuration
# =============================================================================
# 1 Market (rule-based) + 5 RuleLLM Investor types with rule-embedded prompts.
# Each agent has quantitative rules embedded in its system prompt.
# =============================================================================

# -----------------------------------------------------------------------------
# Market (Coordinator) — rule-based, identical to Rule variant
# -----------------------------------------------------------------------------
market:
  name: "Market"
  class: "examples.CarryTradeUnwind.RuleLLM.players:Market"
  num_instances: 1
  config:
    identity: "market"
    role: coordinator
    steps_per_turn: 1
    group_tags:
      - market
    extras:
      record_path: "EXPERIMENT/CarryTradeUnwind/RuleLLM/records"
      fundamental_value: 1.0
      initial_price: 1.0
      price_impact: 0.003
      mean_reversion: 0.02
      noise_std: 0.005
      custom_state_hot_limit: 3
  persona: !include persona.yml

# -----------------------------------------------------------------------------
# Carry Traders — RuleLLM with embedded unwind rules
# Theory: Brunnermeier, Nagel & Pedersen (2009)
# -----------------------------------------------------------------------------
rulellm_carry_trader:
  name: "RuleLLM Carry Trader"
  class: "examples.CarryTradeUnwind.RuleLLM.players:RuleLLMCarryTrader"
  # Expander → rulellm_carry_trader_1, rulellm_carry_trader_2
  num_instances: 2
  config:
    identity: "rulellm_carry_trader"
    role: player
    steps_per_turn: 1
    group_tags:
      - investors
    extras:
      record_path: "EXPERIMENT/CarryTradeUnwind/RuleLLM/records"
      initial_cash: 500000.0
      initial_position: 500.0
      custom_state_hot_limit: 3
      llm:
        sys_message: "examples.CarryTradeUnwind.RuleLLM.prompts:RULELLM_CARRY_TRADER_SYS"
        user_message: "examples.CarryTradeUnwind.RuleLLM.prompts:RULELLM_USER_TEMPLATE"
        lm_type: "api"
        lm_name: "ark/doubao-seed-2-0-mini-260428"
        generation_config:
          temperature: 0.3
          max_tokens: 512
  persona: !include persona.yml

