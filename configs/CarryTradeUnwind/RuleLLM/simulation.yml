# CarryTradeUnwind RuleLLM Simulation Configuration
#
# CarryTradeUnwind simulation
#
# Usage:
#   python examples/CarryTradeUnwind/RuleLLM/run_carrytradeunwind_rulellm.py \
#       -c configs/CarryTradeUnwind/RuleLLM/simulation.yml

setting:
  name: "CarryTradeUnwind-RuleLLM"
  description: "CarryTradeUnwind simulation - RuleLLM agents"
  total_rounds: 200

  record_path: "EXPERIMENT/CarryTradeUnwind/RuleLLM/records"
  storage_path: "EXPERIMENT/CarryTradeUnwind/RuleLLM/communication"

  log_level: "INFO"
  log_to_file: true
  log_path: "EXPERIMENT/CarryTradeUnwind/RuleLLM/logs"

environment:
  dotenv_path: ".env"
  workspace: "."

ray:
  namespace: "carrytradeunwind_rulellm"
  ignore_reinit_error: true
  object_store_memory: 536870912
  num_cpus: 4

players: !include players.yml
topology: !include topology.yml

communication:
  storage_path: "EXPERIMENT/CarryTradeUnwind/RuleLLM/communication"
  record_messages: true
  message_timeout_ms: 5000
  max_retries: 3
