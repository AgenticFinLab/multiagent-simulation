# Streamlit server configuration optimized for multi-user production deployment.
# Placed in .streamlit/config.toml (project-level, auto-loaded by Streamlit).

[server]
headless = true
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 50
# Reduce WebSocket reconnect churn under load
enableWebsocketCompression = true
# Auto-destroy session 5 min after browser disconnect (tab close / network drop).
# This frees the Nginx connection slot so other users can connect.
disconnectedSessionTTL = 300

[browser]
gatherUsageStats = false

[runner]
# Reduce rerun overhead
fastReruns = true

[theme]
# Keep default — no overhead from custom theme loading
