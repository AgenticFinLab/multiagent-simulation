# =============================================================================
# Archetype → existing-class binding for the Customized Simulation Builder.
# =============================================================================
# Keys are the **filename stems** of the standardised handbooks under
#   examples/AGENT_POOL/ExtractedExampleInvestors/unique/
#
# For each archetype, we list one or more decision-engine variants that
# already ship with a concrete player class somewhere under examples/.
# The customized bundle re-uses those classes via the dotted ``class:``
# import path; no code under examples/<Scenario>/ is ever modified.
#
# ``remap`` translates handbook **symbols** (left) into the kwargs the
# existing class actually expects in players.yml ``extras:`` (right).
# When a handbook symbol is absent from ``remap`` it is forwarded as-is.
#
# Curated initial coverage focuses on archetypes that have a clean,
# unambiguous match in the example codebase. Archetypes without an entry
# render their parameters in read-only mode in the UI panel.
# =============================================================================

NoiseTrader:
  Rule:
    class: "examples.AnchoringEffect.Rule.players:NoiseTrader"
    remap:
      trade_probability: trade_probability
      quantity_low: min_order
      quantity_high: max_order
  LLM:
    class: "examples.AnchoringEffect.LLM.players:LLMNoiseTrader"
    sys_prompt: "examples.AnchoringEffect.LLM.prompts:LLM_NOISE_TRADER_SYS"
    user_prompt: "examples.AnchoringEffect.LLM.prompts:LLM_USER_TEMPLATE"

