# =============================================================================
# Customized Simulation Builder — Scenario Feature Manifest
#
# Step 2 of the Customized Simulation Builder uses this file ONLY to gate
# scenario picks based on the roster. It declares which non-standard market
# features each scenario broadcasts to investors. The defaults assume every
# scenario provides the standard market state (price, prev_price, fundamental,
# deviation, round) — this manifest only lists EXTRA features beyond that.
#
# An archetype's `REQUIRES_FEATURES` class attribute (declared on its
# canonical Rule class under `masim.agents.*`) is scenario-compatible iff
# the required-feature set is a subset of the scenario's `market_features`.
#
# Scenarios omitted from this file are treated as `market_features: []`
# (standard state only). All phase-1 archetypes are portable to such scenarios.
# =============================================================================

