# LLMAlgorithmicMarket Market Configuration

stock_market:
  class: "examples.PromptBase.behavior.prompt_market:LLMAlgorithmicMarket"
  config:
    entry_limit: 1000
    market_name: "Stock Market"
    llm_api:
      provider: "openai"
      model: "deepseek-chat"
      api_key: ""
      base_url: "https://api.deepseek.com"

    # Price Dynamics
    initial_price: 100.0
    price_floor: 0.01  # Minimum allowed price

    # Risk-Free Rate
    risk_free_rate: 0.03  # 3% annual

    # True Underlying Parameters (Annual)
    true_drift: 0.08  # μ: actual expected return
    true_volatility: 0.15  # σ: actual volatility

    # Time Discretization
    dt: 0.003968254  # 1/252: daily timestep in annual terms
    annual_trading_days: 252

    # Price Model
    price_model: "geometric_brownian_motion"  # dS = μS dt + σS dW

    # Market Mechanism
    clearing_mechanism: "walrasian_auction"  # or "continuous_double_auction"

    # Supply Dynamics
    total_shares_outstanding: 5000
    supply_elasticity: 0.5  # η: how supply responds to price

    # Market Maker Parameters
    has_market_maker: true
    market_maker_spread: 0.001  # 0.1% bid-ask spread
    market_maker_depth: 100  # shares at best bid/ask

    # Information Release
    dividend_yield: 0.02  # 2% annual
    dividend_frequency: "quarterly"  # or "monthly", "annual", "none"

    # Noise Traders
    noise_trader_fraction: 0.10  # 10% of volume
    noise_trader_volatility: 0.05  # order size randomness

    # Price Impact Model
    temporary_impact_coef: 0.5  # α
    temporary_impact_exponent: 0.6  # β
    permanent_impact_coef: 0.1  # γ

    # Auction Parameters
    auction_max_iterations: 50
    auction_tolerance: 0.000001  # 1e-6
    derivative_epsilon: 0.01  # for numerical derivatives
    min_price_multiplier: 0.01  # lower bound: 1% of current price
    max_price_multiplier: 10.0  # upper bound: 1000% of current price

    # History Tracking
    max_price_history: 252  # keep 1 year
    max_volume_history: 100

    # Performance
    computation_delay: 0.05  # seconds (simulation only)
    min_history_for_volatility: 20  # minimum data points for vol calculation
    decision_prompt: |
      You are the Algorithmic Market: a central clearing mechanism that executes market equilibrium based on supply and demand.

      Your role is **not** to predict, but to clear prices and generate consistent market feedback for all investors.

      ---

      - You receive investor orders (buy/sell, shares, limit prices).
      - You compute the **excess demand** function:
      $$
      ED(P) = D(P) - S(P)
      $$
      - You find the **clearing price** $P^*$ where $ED(P^*) = 0$ (Walrasian equilibrium).
      - You adjust for **price impact**:
      $$
      P_{t+1} = P^* (1 + \lambda_{perm} \cdot \frac{Q_{net}}{Q_{total}})
      $$
      - You update price history according to a **Geometric Brownian Motion**:
      $$
      dS = μSdt + σSdW
      $$

      ---

      For each clearing round, you must output:
      - Clearing price
      - Trading volume
      - Excess demand
      - Price impact (temporary & permanent)
      - Bid–ask spread (if market maker present)
      - Realized volatility

      ---

      > "Market cleared via Walrasian auction.  
      > Total demand exceeded supply by 5,000 shares at price 120.
      > The equilibrium price adjusted upward by 0.8%.  
      > Final clearing price: $121.02, Volume: 50,000 shares, Spread: $0.60."

      ---
      - Make subjective forecasts or emotional statements.
      - Mention investor behavior or psychology.
      - Refer to “beliefs” or “expectations”.

      You are a **mechanistic**, formula-driven market.

      ---
      When responding, always follow this structured format:

      **Market Clearing Summary**
      - Clearing Price: [float]
      - Trading Volume: [int]
      - Excess Demand: [float]
      - Temporary Impact: [float]
      - Permanent Impact: [float]
      - Bid–Ask Spread: [float]
      - Realized Volatility: [float]
      - Equation Notes: briefly explain ED(P), dS process, or price adjustment.

      Respond in neutral, quantitative tone only.

      End of prompt.
