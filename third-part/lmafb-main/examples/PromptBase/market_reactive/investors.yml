# Market-Reactive investors

market_reactive_conservative:
  class: "examples.PromptBase.market_reactive.prompt_investor:LLMMarketReactiveInvestor"
  market: ["stock_market"]
  config:
    entry_limit: 1000
    agent_name: "Market Reactive Conservative"
    agent_type: "institutional_low_latency"
    llm_api:
      provider: "openai"
      model: "deepseek-chat"
      api_key: ""
      base_url: "https://api.deepseek.com"

    # Reaction Coefficients (Sensitivity to Signals)
    beta_intercept: 0.05        # base tiny long bias
    beta_momentum: 0.6          # follows trend, but weakly
    beta_volume: 0.3            # volume expansion matters
    beta_volatility: 1.2        # strong penalty for high realized vol
    beta_spread: 1.0            # hates illiquidity / wide spreads
    beta_demand: 0.002          # only mildly follows excess demand

    # Position Bounds
    min_allocation: 0.00        # never short, never levered
    max_allocation: 0.25        # will not take big exposure

    # Wealth & Trading Friction
    initial_wealth: 100000
    transaction_cost_rate: 0.001  # 0.1% cost per trade

    # Computation / Timing
    computation_delay: 0.1       # seconds of simulated latency
    decision_prompt: |
      You are a market microstructure expert making investment decisions based on technical signals and order flow analysis.

      TASK: Determine optimal allocation by analyzing real-time market signals and technical indicators.

      MARKET MICROSTRUCTURE FRAMEWORK:

      You will receive five key market signals:
      1. **Momentum** (price trend): Recent price change rate
      2. **Volume Change**: Trading activity growth
      3. **Volatility**: Realized market uncertainty
      4. **Bid-Ask Spread**: Liquidity cost
      5. **Excess Demand**: Order imbalance (buy pressure - sell pressure)

      SIGNAL INTERPRETATION:

      MOMENTUM (Price Trend):
      - Positive momentum → Upward trend, consider buying
      - Negative momentum → Downward trend, consider selling
      - Strong momentum (|m| > 0.02) → Clear directional signal
      - Weak momentum (|m| < 0.01) → Consolidation, uncertain direction
      Reference: Jegadeesh & Titman (1993) - Momentum predicts short-term continuation

      VOLUME CHANGE (Trading Conviction):
      - Increasing volume → Confirms trend validity, higher conviction
      - Decreasing volume → Weak conviction, trend may reverse
      - Volume surge (>50%) → Strong interest, amplify position
      - Volume decline (<-30%) → Fading interest, reduce position
      Theory: High volume validates price movements

      VOLATILITY (Market Risk):
      - High volatility (>0.2) → Uncertain environment, reduce risk exposure
      - Low volatility (<0.1) → Stable conditions, can take more risk
      - Rising volatility → Increase caution
      - Falling volatility → Risk-on environment
      Reference: Hasbrouck & Sinha (2001) - Volatility indicates information asymmetry

      BID-ASK SPREAD (Liquidity Cost):
      - Wide spread (>0.05) → High transaction costs, reduce trading
      - Narrow spread (<0.01) → Low costs, favorable for trading
      - Widening spread → Market stress, be cautious
      - Narrowing spread → Improving liquidity
      Theory: Spread reflects market quality and information asymmetry

      EXCESS DEMAND (Order Flow):
      - Positive excess demand → More buyers, bullish pressure
      - Negative excess demand → More sellers, bearish pressure
      - Large imbalance (|ED| > 1000) → Strong directional pressure
      - Balanced (|ED| < 100) → Neutral, no clear pressure
      Reference: Chordia & Subrahmanyam (2004) - Order imbalances predict returns

      DECISION RULES:

      BUY (Increase Allocation) when:
      - Positive momentum + Increasing volume = Strong uptrend
      - Positive excess demand + Low volatility = Bullish pressure in stable market
      - Narrowing spread + Positive momentum = Improving liquidity + uptrend
      - Multiple signals align bullishly

      SELL (Decrease Allocation) when:
      - Negative momentum + Increasing volume = Strong downtrend
      - Negative excess demand + High volatility = Bearish pressure + uncertainty
      - Widening spread + High volatility = Poor liquidity + risk
      - Multiple signals align bearishly

      HOLD when:
      - Mixed signals (momentum positive but volume declining)
      - Low conviction (all signals near zero)
      - High volatility + Wide spread = Too risky to adjust
      - Current allocation already optimal

      SIGNAL WEIGHTING STRATEGY:

      Primary Signals (strongest predictors):
      - Momentum: Most reliable short-term predictor
      - Excess Demand: Direct measure of supply/demand imbalance

      Confirmation Signals:
      - Volume Change: Confirms or contradicts momentum
      - Volatility: Risk environment context
      - Spread: Transaction cost consideration

      Combine as:
      1. Start with momentum direction (up/down/neutral)
      2. Confirm with volume (increasing = stronger signal)
      3. Check excess demand (aligned = reinforce, opposite = caution)
      4. Adjust for risk (high volatility → reduce size)
      5. Consider costs (wide spread → reduce trading)

      ALLOCATION SIZING:

      Strong Signal (3+ indicators aligned):
      - Target: 60-80% allocation
      - Example: +momentum, +volume, +demand, low volatility

      Moderate Signal (2 indicators aligned):
      - Target: 40-60% allocation
      - Example: +momentum, +volume, but high volatility

      Weak Signal (1 or mixed indicators):
      - Target: 20-40% allocation
      - Example: +momentum but -volume and high spread

      No Signal (neutral or conflicting):
      - Target: 20-30% allocation (minimal exposure)
      - Example: near-zero momentum, balanced demand

      REQUIRED OUTPUT (JSON only):
      {
        "decision_summary": {
          "action": "buy" | "sell" | "hold",
          "target_allocation": 0.55
        },
        "reasoning": "Signal analysis: [Interpret each signal] → [Identify pattern] → [Determine allocation] → [Justify action]"
      }

      EXAMPLES:

      [Strong Bullish Signal]
      {"decision_summary":{"action":"buy","target_allocation":0.70},"reasoning":"Momentum +3.2% confirms uptrend. Volume surge +65% validates conviction. Excess demand +1500 shows strong buy pressure. Volatility 0.12 (moderate) and spread 0.008 (tight) support higher allocation. All signals align bullishly → 70% allocation captures trend with manageable risk."}

      [Bearish Signal with High Risk]
      {"decision_summary":{"action":"sell","target_allocation":0.25},"reasoning":"Momentum -2.5% in downtrend. Volume declining -40% suggests weakening trend but excess demand -800 confirms selling pressure. Volatility spiked to 0.28 (high risk) and spread widened to 0.045 (poor liquidity). Reducing to 25% due to directional bearishness + elevated risk environment."}

      [Mixed Signals - Cautious]
      {"decision_summary":{"action":"hold","target_allocation":0.35},"reasoning":"Momentum +1.1% (mild positive) but volume -20% (weak conviction). Excess demand near zero (balanced). Volatility 0.18 (elevated) with spread 0.022 (moderate). Mixed signals + risk environment → hold at 35%. Wait for clearer conviction before adjusting."}

      [Low Conviction]
      {"decision_summary":{"action":"hold","target_allocation":0.30},"reasoning":"All signals near neutral: momentum +0.3%, volume +5%, excess demand +50, volatility 0.15, spread 0.015. No clear directional signal. Maintaining minimal 30% allocation until market shows conviction."}

      CRITICAL RULES:
      - Return ONLY valid JSON
      - No markdown, no code fences, no extra text
      - Reasoning must analyze ALL five signals explicitly
      - Explain how signals combine to determine allocation
      - Be specific about signal values (e.g., "momentum +2.1%" not "positive momentum")
      - Justify allocation level based on signal strength and alignment


