aggressive_investor:
  class: "examples.PromptBase.rational.prompt_investor:LLMRationalInvestor"
  market: ["stock_market"]
  config:
    entry_limit: 1000
    agent_name: "Aggressive Investor"
    agent_type: "individual"
    llm_api:
      provider: "openai"
      model: "deepseek-chat"
      api_key: ""
      base_url: "https://api.deepseek.com"

    # Risk Preference
    risk_aversion_coefficient: 1.5  # A: low (but Kelly ignores this)
    loss_aversion: 1.5  # less sensitive

    # Wealth & Constraints
    initial_wealth: 200000
    min_cash_reserve: 0.05  # minimal cash
    max_position_size: 0.80  # willing to concentrate

    # Risk-Free Rate
    risk_free_rate: 0.03

    # Beliefs (Overoptimistic)
    expected_return_estimate: 0.14  # μ̂: way too high
    volatility_estimate: 0.12  # σ̂: underestimates risk
    confidence_in_estimate: 0.90  # ψ: overconfident

    # Learning
    learning_rate: 0.25  # α: reacts quickly (chasing trends)
    memory_decay: 0.85  # λ: short memory (recency bias)
    lookback_period: 10  # τ: only recent data matters

    # Costs
    transaction_cost_rate: 0.001

    # Behavioral
    overconfidence_bias: 1.2  # multiplies confidence by 1.2
    reference_point: "moving_average"

    # Balancing
    balancing_threshold: 0.10  # trades more frequently
    min_trade_size: 0.05

    # Algorithm
    decision_method: "kelly_criterion"
    decision_frequency: "daily"
    kelly_fraction: 0.5  # half-Kelly for safety

    # Performance
    max_history_length: 100
    annualization_factor: 252
    computation_delay: 0.1

    # LLM Prompt (decision brain for this investor)
    decision_prompt: |
      You are a rational algorithmic investor following classical finance theory.

      TASK: Make an investment decision based on the market data and parameters provided.

      DECISION METHODS:
      - CARA: ω* = (μ - r) / (A × σ²)
      - Kelly: ω* = kelly_fraction × (μ - r) / σ²

      CONSTRAINTS:
      - Min cash reserve: {{min_cash_reserve}}
      - Max position: {{max_position_size}}
      - Rebalancing threshold: {{rebalancing_threshold}}

      REQUIRED OUTPUT FORMAT (JSON only):
      {
        "decision_summary": {
          "target_allocation": 0.5,
          "action": "buy"
        },
        "reasoning": "Brief quantitative explanation: computed ω* = 0.5 using CARA formula with μ=0.08, r=0.02, A=3.0, σ=0.15. Current allocation is 0.3, difference exceeds threshold, so rebalancing by buying."
      }

      CRITICAL: Return ONLY valid JSON. No markdown, no code fences, no extra text.