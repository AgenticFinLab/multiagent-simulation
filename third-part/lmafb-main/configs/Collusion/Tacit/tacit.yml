#  tacit Scenario-Specific Parameters
data:
  data_name: tacit_data
  data_path: tacit_data/

environment:
  dotenv_path: .env


model:
  model_name: &model_name gpt-4o

  generation_config: &generation_config
    temperature: 0
    max_tokens: 150

  # Number of interaction rounds in each simulation
  num_rounds: 10

  agents:
    agent_1:
      model: gpt-4o
      generation_config: *generation_config
    agent_2:
      model: deepseek-chat
      generation_config: *generation_config
    agent_3:
      model: qwen-turbo-latest
      generation_config: *generation_config

  # LangGraph Agent Communication Topology
  connections:
    agent_1: agent_2&agent_3
    agent_2: agent_1&agent_3
    agent_3: agent_1&agent_2

  collusion:
    # Std threshold for convergence detection
    price_convergence_threshold: 5.0
    punishment_factor: 0.2

  price_volatility: 0.1
  initial_demand: 1000
  market_demand_trend: 0.02
  price_elasticity: -0.8
  base_price: 100

train:
  epoch: 10



logging:

  checkpoint_path: checkpoints
  result_path: results
  logging_path: loggings
  visualization_path: visualizations


evaluation:
    n_step: 10


