#  market division Scenario-Specific Parameters
data:
  data_name: market_division_data
  data_path: market_division_data/

environment:
  dotenv_path: .env


model:
  model_name: &model_name gpt-4o

  generation_config: &generation_config
    temperature: 0
    max_tokens: 150

  # Number of interaction rounds in each simulation
  num_rounds: 10

  agents:
    agent_1:
      model: gpt-4o
      generation_config: *generation_config
    agent_2:
      model: deepseek-chat
      generation_config: *generation_config
    agent_3:
      model: qwen-turbo-latest
      generation_config: *generation_config

  # LangGraph Agent Communication Topology
  connections:
    agent_1: agent_2&agent_3
    agent_2: agent_1&agent_3
    agent_3: agent_1&agent_2

  collusion:
    type: region
    # Penalty factor for region violations
    cross_penalty: 0.3

  # Division mode: region | segment
  territories:
    agent_1: North
    agent_2: South
    agent_3: West

  # Demand allocated per market region
  # Long-term regional growth rate
  # Regional economic fluctuation
  # Seasonality period (rounds)
  # Amplitude of seasonal demand swing
  base_demand_per_region: 500
  base_growth_rate: 0.02
  growth_volatility: 0.01
  demand_period: 6
  demand_volatility: 50

train:
  epoch: 10



logging:

  checkpoint_path: checkpoints
  result_path: results
  logging_path: loggings
  visualization_path: visualizations


evaluation:
    n_step: 10